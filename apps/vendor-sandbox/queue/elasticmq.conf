# ElasticMQ for the local job queue (FILM-1806). The queues, visibility
# timeouts and dead-letter redrive mirror sst.config.ts, so a message behaves
# locally as it does in production: redelivered after its visibility timeout,
# moved to the DLQ after 3 receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = 127.0.0.1
  port = 4120
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats.enabled = false

queues {
  StorybookLlmJobsDLQ {}
  StorybookLlmJobsQueue {
    defaultVisibilityTimeout = 900 seconds
    deadLettersQueue { name = "StorybookLlmJobsDLQ", maxReceiveCount = 3 }
  }
  StorybookVoiceDLQ {}
  StorybookVoiceQueue {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "StorybookVoiceDLQ", maxReceiveCount = 3 }
  }
  StorybookPublishDLQ {}
  StorybookPublishQueue {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "StorybookPublishDLQ", maxReceiveCount = 3 }
  }
}
