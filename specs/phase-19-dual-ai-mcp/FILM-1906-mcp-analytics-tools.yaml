notes: |
  ## Part A (#TBD-1906): the services

  Every function in the table below is now `xxxService(client, input)` in a
  `*-service.ts` beside its `*-actions.ts`, where `client` is the caller's
  Supabase client (`AnalyticsClient`, packages/features/content-analytics/src/server/analytics-client.ts)
  and `input` is the action's parsed schema output. The `'use server'` file
  keeps only the wrappers, because every export of such a file is a callable
  endpoint and a function taking a client must not be one. The schemas that
  used to be module-private in the actions files are exported from the
  service files, so a tool parses the same shape as the page. Each service
  has a package subpath (`@kit/content-analytics/server/<name>-service`), and
  `assertScopeAccess` is exported at `@kit/content-analytics/server/scope-access`.

  The underlying readers that built their own client
  (`aggregation-queries.ts`, `language-analytics.ts`) take it as a trailing
  parameter that defaults to the cookie session's, so their direct callers
  and tests are unchanged. `getAccountDashboardData` and `loadReachOverview`
  are plain functions the pages call; they wrap
  `getAccountDashboardDataService` and `loadReachOverviewService`.

  Not split, because no tool reaches them: `manualSyncAction`, the manual
  revenue entry and platform revenue sync, the revenue report, the report
  generator and the schedule writers, and `createTag`/`deleteTag`.

  ## Coverage (inventory of packages/features/content-analytics/src/server/, 2026-10-02; services added 2026-10-03)

  | Area (web route) | Tool | Wraps | Scope |
  |---|---|---|---|
  | Account home (/home/[account]) | get_account_overview | getAccountDashboardData | account |
  | Project dashboard overview, content, audience | get_project_analytics (view: overview, content, daily, audience) | getProjectAnalyticsAction, getContentListAction, getProjectDailyMetricsAction, getProjectAudienceDataAction | project, optional channel and platform |
  | Deep dive | get_deep_dive (view: median, rolling_views, traffic, back_catalog, cohorts, ypp_progress, returning_viewers, weekly_diagnostics, subscribers) | deep-dive-actions.ts, getWeeklyDiagnosticsAction, getSubscriberSeriesAction | project or account, optional channel |
  | Retention | get_retention_curve | getRetentionCurveAction, getEpisodeRetentionPublishAction | episode or publish |
  | Video log | get_video_log | getVideoLogAction | project or account, optional channel |
  | Language | get_language_analytics (view: performance, platform_matrix, content_type, shorts_source, geography, trend, divergence) | language-analytics.ts actions | project |
  | Episode analytics | get_episode_analytics | getEpisodeAnalyticsAction, getSyncStatusAction | episode |
  | Video funnel (FILM-1719, on the episode analytics page) | get_video_funnel | getSignalSurfaceAction | project and video, checkpoint |
  | Revenue (/studio/analytics) | get_revenue (view: summary, timeseries, top_content, projection, by_currency) | revenue-actions.ts, revenue-queries.ts, getProjectRevenueByCurrencyAction | account |
  | Reach | get_reach_overview | loadReachOverview | account, per channel |
  | Experiments | list_experiments, get_experiment | experiment-actions.ts, watched-metric-snapshot.ts | account, optional project |
  | Channel experiments | list_channel_experiments, get_channel_experiment | channel-experiment-actions.ts | account and channel |
  | Tags and segments | get_tag_performance (view: tags, median_by_tag, segments) | taxonomy-actions.ts, getSegmentPerformanceAction | project or account |
  | Genome (no page yet) | get_genome_findings | getGenomeFindingsAction | account, channel, format, stage |
  | Coverage and channels | get_data_coverage, list_channels | getCoverageMatrixAction, listChannelsAction | project or account |
  | Reports | list_reports, get_report_download | listGeneratedReportsAction, getGeneratedReportDownloadAction, getScheduledReportsAction | account |
  | Analytics settings | get_analytics_settings | getAnalyticsSettingsAction | account and channel |
  | Saved Gemini insights | get_saved_insights | analytics_insights_cache | project |
  | AI usage and cost | get_ai_usage | llm_usage_analytics, generation job costs | account |

  get_generation_history (runs, origins and validation failures for an
  episode) is FILM-1908's.

