    note: "the endpoint and the RLS-scoped principal"
summary: >
  Every analytics view a user can open in the web app gets a read tool, so an
  agent sees what the dashboards show and nothing they do not. About twenty
  tools, one per dashboard area, with a view argument where an area has
  several panels. Each tool calls the same service code as the page: the
  enhanceAction wrappers in packages/features/content-analytics/src/server/
  are split into a thin wrapper and an exported service function that takes a
  Supabase client, so authorisation (scope-access.ts and RLS) is unchanged.
  This matters because ClickHouse has no row-level security; the tools must
  never query @kit/clickhouse directly. Design: the EDD's "3a. Analytics
  exposed over MCP"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
