notes: |
  ## Part B (#TBD-1906b): the tools

  `packages/features/studio-mcp/src/server/tools/analytics/`, one file per
  area, exported as `analyticsTools` and spread into `defaultTools`. Each
  tool parses with the service's exported schema (`parseWith`, so an argument
  the page's action would refuse is VALIDATION_FAILED with the issues), proves
  the scope is the connection's team (`requireTeamScope`, the `requireOwned*`
  helpers), calls the service on `principal.supabase`, and returns
  `{ view?, data, notes }`. A service's `ActionRefusal` becomes the error
  contract with its own words (`callService`): NOT_FOUND for "not in your
  library", FORBIDDEN for "you cannot", VALIDATION_FAILED for a rule.

  No tool takes an `accountId`: the registry resolves the team from the
  connection, and a project, channel, video, episode, experiment or report of
  another team is FORBIDDEN even when the user is a member there. Lists page
  with `cursor` + `limit` (≤ 50) over the service's own stable order.

  `notes` on every scoped read is the coverage strip's answer
  (`getCoverageMatrixService` for the same scope and window), `measured`
  (whether ClickHouse was read) and the reason when it was not. With
  `CLICKHOUSE_ENABLED=false` each tool returns its page's state: null totals,
  empty series, `analytics_off` from the funnel, genome and channel
  experiments, `observed: false` from coverage — never zeros.

  The ESLint rule lives in the package's own `eslint.config.mjs`
  (`no-restricted-imports` patterns `@kit/clickhouse`, `@kit/clickhouse/*`),
  and `__tests__/boundaries.test.ts` scans for it where lint is scoped out.
  `@kit/content-analytics` gained subpath exports for the schema modules the
  tools parse with (platforms, traffic, taxonomy, diagnostics, coverage,
  publish-note) and `server/revenue-access-reader`.

  Running the live spec: `./scripts/local-env.sh up`, a dev server started
  with `deployment/config/local.env`, then
  `CLICKHOUSE_EVIDENCE=1 PLAYWRIGHT_BASE_URL=http://localhost:<port> npx playwright test mcp/analytics-tools`.
  `apps/e2e/tests/utils/mcp.ts` mints a personal access token through
  `create_mcp_personal_access_token` and calls tools over JSON-RPC.

  ## Part A (#559): the services

  Every function in the table below is now `xxxService(client, input)` in a
  `*-service.ts` beside its `*-actions.ts`, where `client` is the caller's
  Supabase client (`AnalyticsClient`, packages/features/content-analytics/src/server/analytics-client.ts)
  and `input` is the action's parsed schema output. The `'use server'` file
  keeps only the wrappers, because every export of such a file is a callable
  endpoint and a function taking a client must not be one. The schemas that
  used to be module-private in the actions files are exported from the
  service files, so a tool parses the same shape as the page. Each service
  has a package subpath (`@kit/content-analytics/server/<name>-service`), and
  `assertScopeAccess` is exported at `@kit/content-analytics/server/scope-access`.

  The underlying readers that built their own client
  (`aggregation-queries.ts`, `language-analytics.ts`) take it as a trailing
  parameter that defaults to the cookie session's, so their direct callers
  and tests are unchanged. `getAccountDashboardData` and `loadReachOverview`
  are plain functions the pages call; they wrap
  `getAccountDashboardDataService` and `loadReachOverviewService`.

  Not split, because no tool reaches them: `manualSyncAction`, the manual
  revenue entry and platform revenue sync, the revenue report, the report
  generator and the schedule writers, and `createTag`/`deleteTag`.

  ## Coverage (inventory of packages/features/content-analytics/src/server/, 2026-10-02; services added 2026-10-03)

  | Area (web route) | Tool | Wraps | Scope |
