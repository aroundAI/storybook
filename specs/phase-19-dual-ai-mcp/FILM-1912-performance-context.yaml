summary: >
  The owner's later addition: generation can lean on what worked and what did
  not in earlier episodes. Briefs gain an optional performance_context block,
  built from the analytics StoryBook already computes, so Claude and Gemini
  (through the same prepare) both see it. Because every artifact carries its
  origin from FILM-1903, analytics can also compare Gemini-written and
  Claude-written episodes. Design: the EDD's "Phase 2: past performance as
  context" (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "buildPerformanceContext(projectId, stage) in @kit/generation returns, for the same project or channel, the top and bottom episodes by retention and velocity with their hooks, scene counts, shot pacing and dialogue density, plus relevant genome findings (getGenomeFindingsAction) and concluded experiments"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "The block is capped (a few KB) and labelled with sample size and data freshness; below a minimum sample it says so instead of ranking"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "It reads through the FILM-1906 service functions under the caller's scope, never @kit/clickhouse directly"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "It is included in briefs for ideation, story and shots in both modes, behind a team setting"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Analytics can split episode performance by generation origin (Gemini vs Claude via MCP)"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
