spec_id: "FILM-1912"
title: "Performance Context: past episodes inform new briefs"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: feature
status: PARTIAL
effort: M
dependencies:
  - spec_id: "FILM-1911"
    note: "both modes stable first (owner, 2026-10-02: 'first we need to make sure this dual AI architecture can work')"
  - spec_id: "FILM-1732"
    note: "honest rate denominators before rates feed generation"
  - spec_id: "FILM-1906"
    note: "the analytics services the context reads"
summary: >
  The owner's later addition: generation can lean on what worked and what did
  not in earlier episodes. Briefs gain an optional performance_context block,
  built from the analytics StoryBook already computes, so Claude and Gemini
  (through the same prepare) both see it. Because every artifact carries its
  origin from FILM-1903, analytics can also compare Gemini-written and
  Claude-written episodes. Design: the EDD's "Phase 2: past performance as
  context" (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "buildPerformanceContext(projectId, stage) in @kit/generation returns, for the same project or channel, the top and bottom episodes by retention and velocity with their hooks, scene counts, shot pacing and dialogue density, plus relevant genome findings (getGenomeFindingsAction) and concluded experiments"
    met: true
    evidence: "Met (#TBD-FILM-1912): packages/features/generation/src/performance-context.ts:203 buildPerformanceContext(ctx, {projectId, stage}). rankVideos (:306) ranks the top and bottom 3 episodes by retention (lifetime average percentage viewed) and by velocity (views at ages 0-6 days), each within one platform and content type; episodeTraits (:501) gives each the story's opening hook, scene count, shot pacing (shots, mean seconds) and dialogue density (lines, per minute over the finished or shot runtime, null without one). Genome findings come through getGenomeFindingsService at the stage's funnel stage (ideation: hook; story, shots: attention), concluded experiments through listExperimentsService and the channel experiment services (packages/features/content-analytics/src/server/performance-reader.ts:193). Same project; a channel scope is not offered. Test: __tests__/performance-context.test.ts, a hand-computed ten-episode project; guards PC1, PC5, PC6"
  - text: "The block is capped (a few KB) and labelled with sample size and data freshness; below a minimum sample it says so instead of ranking"
    met: true
    evidence: "Met (#TBD-FILM-1912): capPerformanceContext (performance-context.ts:607) holds the serialised block under 4,096 bytes, dropping experiments and genome findings first, then shortening hooks, then one episode per end. The block carries a label with the sample size, how many recent publishes were read and each platform's latest metric day and stale flag, and caveats (a view-definition change the velocity window crosses, a truncated read). Below 8 comparable videos a ranking is { status: 'not_enough_data', sample, minimum, label } with no top or bottom. Tests: 'says \"not enough data\"', 'stays under the size cap'; guards PC2, PC4"
  - text: "It reads through the FILM-1906 service functions under the caller's scope, never @kit/clickhouse directly"
    met: true
    evidence: "Met (#TBD-FILM-1912): @kit/generation takes analytics only from ctx.performance, a PerformanceReader the caller builds with createPerformanceReader(client) over getCoverageMatrixService, getVideoLogService, getGenomeFindingsService and the experiment services on its own client. @kit/clickhouse and @kit/content-analytics imports fail generation's lint (eslint.config.mjs) and its source scan (__tests__/import-boundary.test.ts:35), both seen red with a planted import. With ClickHouse off (coverage.observed false) the block is omitted with the reason and nothing else is read (guards PC3, RD2)"
  - text: "It is included in briefs for ideation, story and shots in both modes, behind a team setting"
    met: false
    reason: "part 2 of this spec: the team setting (account_ai_settings.performance_context_enabled, default false, read by performanceContextEnabled) and the builder exist; the ideation, story and shots briefs do not carry the block yet"
  - text: "Analytics can split episode performance by generation origin (Gemini vs Claude via MCP)"
    met: true
    evidence: "Met (#TBD-FILM-1912): getPerformanceByOriginService (packages/features/content-analytics/src/server/origin-split-service.ts:71) and the MCP read tool get_performance_by_origin (packages/features/studio-mcp/src/server/tools/analytics/origin-split.ts:27) group a project's episodes by episodes.generation_origin[stage].kind (server, external, human; unrecorded when unstamped), within one platform and content type, as medians with their counts, with the coverage notes; unmeasured with its reason when ClickHouse is off. No web page shows it yet. Evidence: apps/e2e/tests/mcp/performance-by-origin.spec.ts against lane B's ClickHouse 24.8, server 50% / 275 and external 60% / 400 as hand-computed; red with the origin read from the screenplay stamp. Guards OS1-OS3"
test_plan:
  unit:
    - {text: "Context for a seeded project ranks a hand-computed top and bottom episode correctly; a thin sample produces the 'not enough data' label", met: true, evidence: "packages/features/generation/__tests__/performance-context.test.ts (#TBD-FILM-1912)"}
  integration:
    - {text: "The origin split reads seeded ClickHouse rows through the MCP endpoint and returns hand-computed medians", met: true, evidence: "apps/e2e/tests/mcp/performance-by-origin.spec.ts (CLICKHOUSE_EVIDENCE=1) (#TBD-FILM-1912)"}
    - {text: "The team setting defaults off, owners change it, members read it, strangers see nothing", met: true, evidence: "apps/web/supabase/tests/database/performance-context-setting.test.sql (#TBD-FILM-1912)"}
  e2e: []
remaining:
  - criterion: "It is included in briefs for ideation, story and shots in both modes, behind a team setting"
    reason: "the setting exists (account_ai_settings.performance_context_enabled, default false) and buildPerformanceContext is built; prepare() for ideation, story and shots does not call it yet, because those stage files are being rewritten by in-flight PRs"
    closed_by: "FILM-1912"
open_questions: []
notes: |
  With CLICKHOUSE_ENABLED=false (production's current state) the context is
  omitted with its reason, never filled with zeros.
