open_questions: []
notes: |
  With CLICKHOUSE_ENABLED=false (production's current state) the context is
  omitted with its reason, never filled with zeros.

  The block is built once per run where the run is opened (owner decision
  via the lead, 2026-10-03): web actions and MCP start_generation, on the
  caller's client. It is stored in generation_runs.input.performanceContext,
  so the worker only reads it and never loads the server-only analytics
  services, and the run row records what the model was shown. A child run
  the worker opens (a follow-on) carries no block. Server mode runs
  orchestrators rather than rendering the brief, so the block reaches their
  director prompts through the agent run context, the way verified facts
  already do.
