summary: >
  Every stage execution, in either mode, becomes a row in generation_runs with
  a mode fixed at creation, a lease, the target version it was briefed on, and
  its origin. openRun() is the only constructor: web server actions get the
  team default, MCP tools always get 'external', and the worker never opens a
  run. The SQS message shrinks to { runId }, so a worker can only run what a
  server-mode run asked for. Parts submitted by an external agent wait in
  generation_run_parts until finalize; every commit snapshots what it replaced
  into content_revisions. Database triggers refuse an LLM job without an open
  server run and a usage row for an external run, so the separation holds even
  if application code is wrong. Design: the EDD's "2. Generation runs and
  leases", "Database changes" and "6. One door to AI models"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
  Built in three parts: A, the database (#556); B, openRun, run.dispatch,
  the worker and the commits, on FILM-1901's package (#567); C, the
  NOT NULL tightening once every LLM path writes a run.
