notes: |
  ## Tables

  generation_runs: id, account_id, project_id, target_type
  ('episode','scene','asset','season','publish'), target_id, stage (the
  FILM-1901 registry keys), mode ('server','external'), status
  ('briefed','in_progress','committed','failed','cancelled','expired'),
  lease_expires_at, target_version, brief_hash, prompt_slug, prompt_version,
  origin jsonb, connection_id (FILM-1904), job_id (generation_jobs),
  parent_run_id, error jsonb, created_by, created_at, finalized_at. TEXT with
  CHECK, matching generation_jobs, not Postgres enums. finalized_at is set
  when the run reaches any terminal status (expiry sets it too, with
  error.code = 'LEASE_EXPIRED').

  generation_run_parts: run_id, part_key ('reel_scout', 'scene:4'), output
  jsonb, validation jsonb, submitted_at; pk (run_id, part_key). Resubmitting a
  part replaces it.

  content_revisions: id, account_id, target_type, target_id, stage, run_id,
  snapshot jsonb, created_at. run_id is null for a revision written by
  restore_content_revision itself (the undo of a restore).

  account_ai_settings (read by openRun; UI in FILM-1910): account_id pk,
  server_generation_enabled, external_generation_enabled, default_mode,
  created_at, updated_at. Owners write (has_role_on_account(account_id,
  'owner'), not has_permission settings.manage: the member role holds that
  permission too, 20240319163440_roles-seed.sql), members read.

  Additive columns: generation_origin jsonb on shots, dialogue_lines,
  audio_cues, assets; episodes.generation_origin jsonb keyed by stage;
  generation_jobs.run_id; llm_usage_analytics.run_id.

  ## Snapshot contract (content_revisions.snapshot)

  Written by commit (part B), read by restore_content_revision (part A):

  - episode target: {"episode": {story_data, screenplay_data, shot_list,
    metadata, status, generation_origin}, "shots": [to_jsonb(row), …],
    "dialogue_lines": […], "audio_cues": […]}
  - asset target: {"asset": {description, metadata, generation_origin}}

  Every key is optional and only present keys are restored: a present row
  array replaces the episode's rows of that table (dialogue_lines reference
  shots, so a shots snapshot should carry dialogue_lines too); a present
  episode/asset column is written, an absent one kept. The restore writes
  what it replaces as a new revision covering the same keys and returns its
  id, so a restore is itself undoable. Scene, season and publish targets
  raise feature_not_supported until a later part defines their shape.

  ## Lock sketch

  ```sql
  alter table public.generation_runs add constraint mcp_runs_are_external
    check (connection_id is null or mode = 'external');

  create function public.assert_server_run() returns trigger language plpgsql as $$
  begin
    if not exists (select 1 from public.generation_runs r
                   where r.id = new.run_id and r.mode = 'server'
                     and r.status in ('briefed','in_progress')) then
      raise exception 'refused: run % is not an open server-mode run', new.run_id;
    end if;
    return new;
  end $$;
  ```

  The trigger guards generation_jobs inserts for the LLM job types and every
  llm_usage_analytics insert. generation_jobs keeps tracking SQS work and
  costs; a server run links to its job.

  ## Staging and audit facts (2026-10-03, part A)

  - Both triggers fire `before insert or update of run_id … when (new.run_id
    is not null)`. Part A: enforced whenever a row carries a run id; a row
    with none is accepted, because every LLM job and usage row written today
    has none. Part C sets NOT NULL (generation_jobs for LLM job types,
    llm_usage_analytics for all rows) once part B writes run ids.
  - The generation_jobs trigger names the 7 LLM job types in
    generation_jobs_job_type_check (20260923025438): story, screenplay,
    shot_list, translate-dialogue, audio_cue_generation, story-refinement,
    screenplay-refinement, plus asset_creation, which KB-174 (#553) adds to
    the CHECK; the trigger lists it already, so the lock covers it the moment
    that PR merges (a BEFORE trigger fires before the CHECK, so the test
    holds either way). video, voice, music and sfx are vendor renders,
    which an external run may start (FILM-1909), so they are not locked.
    Of the 16 LlmJobType keys the worker runs
    (packages/features/prompt-engine/src/lib/llm-job-payloads.ts), 7 map to
    a job_type in the CHECK and 9 never write a generation_jobs row:
    season-analysis, season-outline, story-ideation,
    batch-translate-metadata, analytics-insights, language-insights,
    fact-extraction, asset-creation (until KB-174 / #553 merges), and
    audio-file-generation (an audio render, not a model call; so 8
    model-calling job types are outside the generation_jobs lock today, 7
    after #553). For those the only lock is
    llm_usage_analytics.run_id, which executeLLM writes; part C must add
    generation_jobs rows for them or guard the gateway instead.
  - episodes.version bumps on every update (trigger episodes_increment_version,
    20251205125737_film-studio-tables.sql:103-115), not only on commit. So
    TARGET_CHANGED fires on any edit between brief and finalize, including a
    restore_content_revision, which is the intended conservative behaviour.
  - generation_runs.connection_id has no foreign key yet: mcp_connections is
    FILM-1904's and was built in parallel. The migration comments the column
    `-- FK to mcp_connections added once FILM-1904 lands`.
  - Writes to generation_runs, generation_run_parts and content_revisions are
    the service role's, or SECURITY DEFINER functions that check write
    permission: authenticated holds select only (no write grant, no write
    policy). openRun (part B) writes through the service role or a definer
    function; restore_content_revision is the one definer function in part A.
  - Reads follow the studio rule (KB-48): has_account_access(account_id).
  - expire_generation_runs() is service_role only; the cron route calls it
    with the admin client. It does not touch mcp_tool_calls (FILM-1904).
  - Mutation guards: tooling/mutation-guards/film-1903.json, nine pgTAP
    entries (each lock, the index, expiry, the read policy, the settings
    write, the restore permission check) and two unit entries (the route's
    bearer check and its error path).

  ## Migration discipline

  Hand-written migrations only (CLAUDE.md: no supabase db diff), mirrored into
  apps/web/supabase/schemas/ where a schema file exists (75-generation-runs.sql
  is new; 30-film-studio.sql, 24-llm-usage-analytics.sql and
  60-generation-jobs.sql gained the columns; audio_cues has no schema file),
  types generated with pnpm supabase:web:typegen, and a pgTAP test for every
  policy and lock (tests/database/generation-runs.test.sql, 45 cases, seen red
  with the migration skipped: 0 ok, 69 errors).
