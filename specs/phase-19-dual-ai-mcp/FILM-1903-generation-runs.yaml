notes: |
  ## Commits in one transaction (#574, owner decision 2026-10-03)

  Every stage's commit used to write through a sequence of PostgREST
  statements, so a failure midway left partial writes. Now commit() reads
  what it needs and computes a CommitPlan (packages/features/generation/
  src/commit-plan.ts): ordered insert, upsert, update and delete writes,
  skippable groups for the writes the handlers treated as non-fatal, `$ref`
  values a later write takes from an earlier one's returned rows, and jsonb
  `merge`. Under a run, applyCommit hands it to
  `apply_generation_commit(p_run_id, p_plan, p_finalize default true)`
  (migration 20261003125108), SECURITY DEFINER with search_path '':

  - the run row locked FOR UPDATE; can_drive_generation_run as every run
    function; RUN_NOT_OPEN for a terminal run or one past its lease;
    TARGET_CHANGED with the episode row locked;
  - the whole plan checked against kit.generation_commit_allowlist() before
    anything is written: 15 tables (episodes, projects, assets, shots,
    audio_cues, audio_tracks, dialogue_lines, generation_jobs,
    verified_facts, immutable_events, character_states, narrative_threads,
    episode_summaries, world_states, state_deltas), the operations each
    allows, and the columns an insert and an update may set; the column
    that ties a row to its project is never updatable; an update or delete
    needs a filter; identifiers through format('%I'), values as parameters;
  - the content_revisions snapshot of what the plan replaces, built in the
    database before the writes: an episode run's restorable columns the
    plan updates and its shots, dialogue_lines and audio_cues when the plan
    writes them; an asset run's columns when its asset exists. The stages'
    separate `ctx.revisions.snapshot()` calls are gone;
  - every touched row checked to be in the run's project (for an episode
    run, that episode); a refusal is never skipped;
  - the run moved to committed in the same transaction, unless p_finalize
    is false: a worker job handler commits with finalize false (it works
    on after its commit, or commits once per asset) and the job boundary
    completes the run. executeServerRun and finalizeRun (FILM-1908's
    finalize) finalize in the call, and run.complete() is then a no-op.

  Outside the transaction: the follow-on child runs (opened after the
  commit), and a handler's own writes after it (the shots handler's queued
  audio job row, asset-creation's episode link). Without a run only a
  single-write plan is applied, through the caller's client.

  Tests: tests/database/apply-generation-commit.test.sql (43: rollback of a
  failed third write, snapshot, allowlist, scope, permission,
  TARGET_CHANGED, skippable groups, references, merge, finalize false,
  service role); apply-generation-commit-stages-{server,external}.test.sql
  (each writing stage's real plan, generated by
  tooling/generation/commit-plans-pgtap.py from the unit matrix); guards in
  tooling/mutation-guards/film-1903-txn.json.

  ## Part B (#567, 2026-10-03): openRun, the handle, the worker

  The handle (packages/features/generation/src/runs/run-handle.ts): `write`
  (server: the gateway's writer after a lease renewal and an open check;
  external: AWAITING_SUBMISSION with the brief), `dispatch` (server only),
  `start`, `complete`, `fail`, `cancel`, `renewLease`, `assertTargetUnchanged`,
  `snapshot` (content_revisions in the restore contract's shape) and
  `toGenerationRun` (the origin a commit stamps). `executeServerRun` runs a
  registered stage under a server run (prepare, run.write, check,
  TARGET_CHANGED, commit, follow-on children, committed); `finalizeRun` is the
  same tail for the parts an external agent submitted (FILM-1908 calls it).
  Both read the run's stage through `ALL_STAGES` (src/stages/index.ts), not
  the registry alone: `@kit/generation` is `sideEffects: false`, so a bundle
  that imports only the run layer dropped every stage module and its
  registration (0 of 14 in an esbuild bundle of `executeServerRun`, which is
  what extractCanonChangesAction loads). Pinned by
  `apps/web/lambda/llm-worker/__tests__/stage-registry-bundle.test.ts`.

  What part B found the row needed (migration 20261002205007): `input jsonb`
  (what the run was asked to do: a stage target, or the worker job for a
  handler not yet on the core, since the worker loads only a run id);
  `project_id` nullable (publish_metadata is the caller's own text); four
  more stage keys (analytics_insights, language_insights, fact_check: model
  calls with no content stage; audio_render: the ElevenLabs render job, which
  rides the same
  queue and is always server mode) and two target types (project, audio_cue);
  and the lifecycle as SECURITY DEFINER functions gated on
  can_drive_generation_run (open_generation_run, renew_generation_run_lease,
  transition_generation_run, record_content_revision), because authenticated
  has no write privilege and the MCP path never uses the service role for a
  user. A run with no project (publish_metadata used to bill the caller's
  personal account) belongs to a team the caller is in, and a personal
  account is refused by name (KB-99): the publish action now authorises the
  episode and runs on its team. pgTAP: tests/database/generation-run-lifecycle.test.sql, 33 cases,
  red with the migration skipped (0 ok, 52 errors), green with it; the
  definer inventory lists the five functions.

  Worker: the message is `{ runId }`; `openRunForJob` (packages/ai-gateway/src/jobs.ts)
  is what the 24 web call sites open, with the job's payload parsed with its
  schema (KB-33) and the target's ids stamped (KB-31) as the run's input, and
  STAGE_OF_JOB mapping each job type to its stage. The old message shape is
  accepted for one release and runs with no run, so the gateway refuses it.
  The failed-run rule: a handler that throws marks the run failed and the
  message is retried, but the retry finds a closed run and stops; a worker
  that dies mid-run leaves it in_progress and the redelivery runs it again.

  ## Tables

  generation_runs: id, account_id, project_id, target_type
  ('episode','scene','asset','season','publish'), target_id, stage (the
  FILM-1901 registry keys), mode ('server','external'), status
  ('briefed','in_progress','committed','failed','cancelled','expired'),
  lease_expires_at, target_version, brief_hash, prompt_slug, prompt_version,
  origin jsonb, connection_id (FILM-1904), job_id (generation_jobs),
  parent_run_id, error jsonb, created_by, created_at, finalized_at. TEXT with
  CHECK, matching generation_jobs, not Postgres enums. finalized_at is set
  when the run reaches any terminal status (expiry sets it too, with
  error.code = 'LEASE_EXPIRED').

  generation_run_parts: run_id, part_key ('reel_scout', 'scene:4'), output
  jsonb, validation jsonb, submitted_at; pk (run_id, part_key). Resubmitting a
  part replaces it.

  content_revisions: id, account_id, target_type, target_id, stage, run_id,
  snapshot jsonb, created_at. run_id is null for a revision written by
  restore_content_revision itself (the undo of a restore).

  account_ai_settings (read by openRun; UI in FILM-1910): account_id pk,
  server_generation_enabled, external_generation_enabled, default_mode,
  created_at, updated_at. Owners write (has_role_on_account(account_id,
  'owner'), not has_permission settings.manage: the member role holds that
  permission too, 20240319163440_roles-seed.sql), members read.

  Additive columns: generation_origin jsonb on shots, dialogue_lines,
  audio_cues, assets; episodes.generation_origin jsonb keyed by stage;
  generation_jobs.run_id; llm_usage_analytics.run_id; generation_runs.input
  (part B).

  ## Snapshot contract (content_revisions.snapshot)

  Written by commit (part B), read by restore_content_revision (part A):

  - episode target: {"episode": {story_data, screenplay_data, shot_list,
    metadata, status, generation_origin}, "shots": [to_jsonb(row), …],
    "dialogue_lines": […], "audio_cues": […]}
  - asset target: {"asset": {description, metadata, generation_origin}}

  Every key is optional and only present keys are restored: a present row
  array replaces the episode's rows of that table (dialogue_lines reference
  shots, so a shots snapshot should carry dialogue_lines too); a present
  episode/asset column is written, an absent one kept. The restore writes
  what it replaces as a new revision covering the same keys and returns its
  id, so a restore is itself undoable. Scene, season and publish targets
  raise feature_not_supported until a later part defines their shape.

  ## Lock sketch

  ```sql
  alter table public.generation_runs add constraint mcp_runs_are_external
    check (connection_id is null or mode = 'external');

  create function public.assert_server_run() returns trigger language plpgsql as $$
  begin
    if not exists (select 1 from public.generation_runs r
                   where r.id = new.run_id and r.mode = 'server'
                     and r.status in ('briefed','in_progress')) then
      raise exception 'refused: run % is not an open server-mode run', new.run_id;
    end if;
    return new;
  end $$;
  ```

  The trigger guards generation_jobs inserts for the LLM job types and every
  llm_usage_analytics insert. generation_jobs keeps tracking SQS work and
  costs; a server run links to its job.

  ## Staging and audit facts (2026-10-03, part A)

  - Both triggers fire `before insert or update of run_id … when (new.run_id
    is not null)`. Part A: enforced whenever a row carries a run id; a row
    with none is accepted, because every LLM job and usage row written today
    has none. Part C sets NOT NULL (generation_jobs for LLM job types,
    llm_usage_analytics for all rows) once part B writes run ids.
  - The generation_jobs trigger names the 8 LLM job types in
    generation_jobs_job_type_check (20260923025438, plus asset_creation from
    KB-174 / #553, 20261002201125): story, screenplay, shot_list,
    translate-dialogue, audio_cue_generation, story-refinement,
    screenplay-refinement, asset_creation. video, voice, music and sfx are
    vendor renders, which an external run may start (FILM-1909), so they
    are not locked. Of the 16 LlmJobType keys the worker runs
    (packages/features/prompt-engine/src/lib/llm-job-payloads.ts), 8 map to
    a job_type in the CHECK and 8 never write a generation_jobs row:
    season-analysis, season-outline, story-ideation,
    batch-translate-metadata, analytics-insights, language-insights,
    fact-extraction, and audio-file-generation (an audio render, not a model
    call; so 7 model-calling job types are outside the generation_jobs
    lock). For those the only lock is llm_usage_analytics.run_id, which
    executeLLM writes; part C must add generation_jobs rows for them or
    guard the gateway instead.
  - episodes.version bumps on every update (trigger episodes_increment_version,
    20251205125737_film-studio-tables.sql:103-115), not only on commit. So
    TARGET_CHANGED fires on any edit between brief and finalize, including a
    restore_content_revision, which is the intended conservative behaviour.
  - generation_runs.connection_id has no foreign key yet: mcp_connections is
    FILM-1904's and was built in parallel. The migration comments the column
    `-- FK to mcp_connections added once FILM-1904 lands`.
  - Writes to generation_runs, generation_run_parts and content_revisions are
    the service role's, or SECURITY DEFINER functions that check write
    permission: authenticated holds select only (no write grant, no write
    policy). openRun (part B) writes through the service role or a definer
    function; restore_content_revision is the one definer function in part A.
  - Reads follow the studio rule (KB-48): has_account_access(account_id).
  - KB-99: generation_runs, content_revisions and account_ai_settings carry
    kit.require_team_account (workspace tables, team accounts only), so
    team-accounts-only.test.sql now pins 25 guarded tables. The first
    merge-queue run of #556 failed that test because the triggers were
    missing: run the whole tests/database suite via pgthrow before pushing
    a migration, not only the new file.
  - expire_generation_runs() is service_role only; the cron route calls it
    with the admin client. It does not touch mcp_tool_calls (FILM-1904).
  - Mutation guards: tooling/mutation-guards/film-1903.json, nine pgTAP
    entries (each lock, the index, expiry, the read policy, the settings
    write, the restore permission check) and two unit entries (the route's
    bearer check and its error path).

  ## Migration discipline

  Hand-written migrations only (CLAUDE.md: no supabase db diff), mirrored into
  apps/web/supabase/schemas/ where a schema file exists (75-generation-runs.sql
  is new; 30-film-studio.sql, 24-llm-usage-analytics.sql and
  60-generation-jobs.sql gained the columns; audio_cues has no schema file),
  types generated with pnpm supabase:web:typegen, and a pgTAP test for every
  policy and lock (tests/database/generation-runs.test.sql, 46 cases, seen red
  with the migration skipped: 0 ok, 69 errors).
