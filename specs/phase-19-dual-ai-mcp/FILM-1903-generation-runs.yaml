spec_id: "FILM-1903"
title: "Generation Runs: leases, parts, revisions and the locks that keep Gemini out"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: feature
status: PARTIAL
effort: L
dependencies:
