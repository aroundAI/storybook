notes: |
  Decided 2026-10-02 by the owner: our own small authorization server,
  compatible with Supabase (was this spec's open question). Why our own:
  team binding and studio:* scopes on the consent page, and it keeps working
  under any AUTH_PROVIDER. Why Supabase stays first-class: Supabase Auth is
  the login and the identity store today, and RLS is how MCP calls stay
  inside a team. Supabase is the identity provider; StoryBook is the
  authorization server; the MCP endpoint is the resource server.

  Tables: mcp_oauth_clients (client_id, client_name, redirect_uris text[],
  metadata_url, created_at) and mcp_authorization_codes (code_hash, client_id,
  user_id, account_id, scopes, code_challenge, redirect_uri, resource,
  expires_at, used_at), both service role only; tokens and connections are
  FILM-1904's. #563 adds mcp_tokens.audience (the resource a token was
  issued for), the FK mcp_connections.client_id → mcp_oauth_clients, a CHECK
  that a consent connection names its client, and two triggers:
  on_mcp_connection_revoked (revoking a connection revokes its tokens) and
  on_auth_user_password_changed (a password change revokes the user's
  connections).

  Scopes: studio:read (read and analytics tools), studio:write (author,
  generation, edit and analytics write tools), studio:render (ElevenLabs
  renders, which cost money). A client that asks for no scope gets
  studio:read and studio:write offered; the user may untick scopes on the
  consent page and the token response's `scope` says what was granted.

  Threats handled here: open redirect (exact match; an unregistered URI or
  unknown client is shown on our page and never redirected to), code
  interception (PKCE S256), token replay across teams (token bound to one
  user and team, membership re-checked per call by FILM-1904), token replay
  across deployments (RFC 8707 audience stored with the token and checked
  by the verifier), refresh-token theft (rotation; reuse revokes the
  connection), client metadata document fetches (https only, public host
  names only, 64 KB, 5 s, client_id must equal the URL), registration abuse
  (per-address hourly limit).

  ## Environment (#563)

  - MCP_AUTH_SERVER=own|supabase (default own): which verifier withMcpAuth
    runs with and which authorization server the protected-resource
    metadata names.
  - MCP_RESOURCE_URL: overrides `<NEXT_PUBLIC_SITE_URL>/api/mcp` as the
    resource every token is bound to.
  - MCP_SUPABASE_OAUTH_ISSUER: with `supabase`, the JWT issuer (default
    `<NEXT_PUBLIC_SUPABASE_URL>/auth/v1`); its JWKS is read from
    `<issuer>/.well-known/jwks.json`.
  - MCP_JWT_PRIVATE_KEY (PKCS#8 PEM, `\n` escaped is fine), MCP_JWT_KID,
    MCP_JWT_ALG (ES256 default, or RS256): the imported-key signer for the
    RLS JWT. Without them SUPABASE_JWT_SECRET signs HS256, as FILM-1904.
  - MCP_OAUTH_REGISTRATIONS_PER_HOUR (default 20): /oauth/register per
    address.

  Routes: /.well-known/oauth-protected-resource (also
  /.well-known/oauth-protected-resource/api/mcp),
  /.well-known/oauth-authorization-server, POST /oauth/register,
  GET /oauth/authorize (page), POST /oauth/token, POST /oauth/revoke. The
  three POST endpoints and the discovery documents are outside the CSRF
  middleware's matcher (apps/web/middleware.ts): no browser session reaches
  them.

  ## Deploying with an imported signing key (criterion 11, the hosted step)

  1. Supabase dashboard → Project → Authentication → JWT Signing Keys →
     Import an asymmetric key (ES256 recommended). Note the key id shown.
  2. Set MCP_JWT_PRIVATE_KEY to the PKCS#8 private key, MCP_JWT_KID to that
     id (MCP_JWT_ALG=RS256 if an RSA key was imported) on the deployment;
     leave SUPABASE_JWT_SECRET for the rest of the app.
  3. Call whoami with a PAT against the deployment: a 200 under the
     asymmetric signer is the proof (the same check the integration test
     makes locally with the stack's own key).

  ## Owner steps for the open item

  Claude Desktop by URL (criterion 13):
  1. Deploy the branch to a public URL (NEXT_PUBLIC_SITE_URL set to it).
  2. In Claude: Settings → Connectors → Add custom connector → paste
     `<site>/api/mcp`. Claude reads the two discovery documents, registers
     (DCR) or presents its client metadata document, and opens
     `<site>/oauth/authorize`.
  3. Sign in with the StoryBook account (MFA if enabled), choose the team,
     untick studio:render if renders should need a token of their own,
     click Allow. Claude lands on its callback and exchanges the code.
  4. In Claude, call whoami. Screenshot: the consent page, Claude's
     connector listed as connected, the whoami answer, and Settings →
     Connected apps showing the OAuth app row. Attach to this spec's PR
     with `gh pr comment --attach`.

  ## Why some things are the way they are (#563)

  - The consent form returns the redirect and the browser navigates: a
    server action's redirect() cannot reach a custom scheme or another
    origin, and Claude's callback is another origin.
  - A refresh token presented as a bearer token is `malformed` to the
    verifier even though its hash is stored: the shape check admits
    sbk_pat_ and sbk_at_ only.
  - /oauth/revoke of an access token revokes that token; of a refresh token,
    the whole connection (RFC 7009 allows both; the grant is what a client
    gives up).
  - Refresh is sliding: a rotation issues a new 30-day refresh token.
