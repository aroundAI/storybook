open_questions: []
notes: |
  Decided 2026-10-02 by the owner: our own small authorization server,
  compatible with Supabase (was this spec's open question). Why our own:
  team binding and studio:* scopes on the consent page, and it keeps working
  under any AUTH_PROVIDER. Why Supabase stays first-class: Supabase Auth is
  the login and the identity store today, and RLS is how MCP calls stay
  inside a team. Supabase is the identity provider; StoryBook is the
  authorization server; the MCP endpoint is the resource server.

  Tables: mcp_oauth_clients (client_id, client_name, redirect_uris text[],
  metadata_url, created_at) and mcp_authorization_codes (code_hash, client_id,
  user_id, account_id, scopes, code_challenge, redirect_uri, expires_at,
  used_at), both service role only; tokens and connections are FILM-1904's.

  Scopes: studio:read (read and analytics tools), studio:write (author,
  generation, edit and analytics write tools), studio:render (ElevenLabs
  renders, which cost money).

  Threats handled here: open redirect (exact match), code interception
  (PKCE S256), token replay across teams (token bound to one user and team,
  membership re-checked per call by FILM-1904).
