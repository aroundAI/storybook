spec_id: "FILM-1907"
title: "MCP OAuth 2.1 Authorization Server, Consent and Connected Apps"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: feature
status: DRAFT
effort: L
dependencies:
  - spec_id: "FILM-1904"
    note: "mcp_connections and mcp_tokens, and withMcpAuth's token resolution"
summary: >
  Lets a user add StoryBook to Claude by URL and sign in, without copying a
  token: a minimal OAuth 2.1 authorization server (authorization code with
  PKCE) that supports Claude's three registration routes (Claude's published
  client identity via a client metadata document, Dynamic Client Registration,
  and a pre-registered client). The user signs in with the normal StoryBook
  login, whatever AUTH_PROVIDER is, picks a team and approves scopes on a
  consent page. Connections are listed and revoked from account settings.
  Owner decision (2026-10-02): we build our own small authorization server,
  and it must work with Supabase. With AUTH_PROVIDER=supabase the user signs
  in through Supabase Auth, the grant is keyed on auth.users.id, and every
  tool call runs as that user under RLS; token verification sits behind one
  interface, so Supabase Auth's own OAuth server can be swapped in later
  without changing a tool.
  Design: the EDD's "5. Authentication and tenancy"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "GET /.well-known/oauth-protected-resource names the MCP resource URL and the authorization server; GET /.well-known/oauth-authorization-server publishes the authorize, token, register and revoke endpoints, S256 as the only PKCE method, and the supported scopes"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "POST /oauth/register implements Dynamic Client Registration (RFC 7591) for public clients; a client metadata document URL is accepted as client_id; both are stored in mcp_oauth_clients"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "/oauth/authorize requires PKCE S256 and an exact redirect URI match, sends a signed-out user through the normal login and back, and shows a consent page: client name, team picker (teams the user belongs to), scopes"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Authorization codes are single-use, expire in 60 s and are stored hashed in mcp_authorization_codes"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "/oauth/token issues a 1-hour opaque access token and a 30-day rotating refresh token, audience-bound to the MCP resource URL (RFC 8707); reuse of a rotated refresh token revokes the connection"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "/oauth/revoke revokes a token; revoking from settings revokes every token of the connection"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Settings → Connected apps lists OAuth connections and personal access tokens with client name, team, scopes and last use, and revokes them"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Supabase sign-in: with AUTH_PROVIDER=supabase, /oauth/authorize reads the user from the existing Supabase session cookie (the same requireUser the web uses), and a signed-out user goes through /auth/sign-in, including MFA, and returns to the consent page with the request intact"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Supabase identity: grants, codes and connections store auth.users.id as user_id with a foreign key to auth.users (on delete cascade), so deleting a Supabase user revokes their connections"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Supabase sessions stay separate: the OAuth server never hands out a Supabase access or refresh token; MCP tokens are its own, and a Supabase sign-out or password change does not silently keep an MCP grant alive past its own revocation rules (password change revokes the user's connections)"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "RLS signing works with both Supabase key setups: FILM-1904's 5-minute JWT is signed with the legacy JWT secret or with a private key imported into the project's JWT signing keys (selected by env, with the kid set), and a pgTAP or integration test proves auth.uid() and RLS see the minted user in each"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Swappable verifier: withMcpAuth resolves tokens only through an McpTokenVerifier interface; 'own' (default, MCP_AUTH_SERVER=own) checks hashed opaque tokens in mcp_tokens, and the interface admits a 'supabase' verifier for Supabase OAuth server JWTs (issuer, audience, aud = MCP resource URL, client_id claim) mapped to the same McpPrincipal; the protected-resource metadata names whichever authorization server is configured"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Adding the connector by URL in Claude Desktop, signing in and calling whoami works end to end (recorded with screenshots)"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
