  actions: [{name: "updateAccountAiSettingsAction", file: "apps/web/app/home/[account]/settings/ai/_lib/server/actions.ts"}, {name: "cancelGenerationRunAction", file: "packages/features/generation/src/server/run-actions.ts"}, {name: "restoreRevisionAction", file: "packages/features/generation/src/server/run-actions.ts"}]
