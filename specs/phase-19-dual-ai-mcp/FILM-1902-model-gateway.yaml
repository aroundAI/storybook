notes: |
  Closed 2026-10-03 (#573): "The MCP request context wires ctx.runMode so an MCP-opened run is external" — packages/features/studio-mcp/src/server/tools/generation/service.ts:62, with the connection id making it so in the database too.

  ## Part B (#567, 2026-10-03): the gateway, the run handle and the worker

  Built together with FILM-1903 part B. `@kit/ai-gateway` (packages/ai-gateway)
  is the one package that imports `@kit/llm`: it holds `executeLLM` (from
  prompt-engine), `executeLLMForLambda` with the Lambda prompt registry (from
  the worker), the Voyage embedder, the SQS send, and the three things a run
  reaches a model through: `createServerWriter`/`resolveWriter` (what
  `run.write` calls), `agentStepWriter(run)` (what `runAgent` calls) and
  `serverEmbedder` (what the context builder calls). Every one requires a run,
  the one passed or the one in scope (`withRun`, an AsyncLocalStorage the
  worker enters before a handler runs), refuses with `LLM_NO_RUN` without one
  and with `LLM_FORBIDDEN_EXTERNAL_RUN` unless the run is an open server run
  (`assertServerRunOpen`, which renews the lease in the same round trip), and
  writes `llm_usage_analytics` with the run's account, user and id.

  Call sites: the 27 `executeLLM` importers (16 agent skills, the documentary
  fact checker and researcher, six worker handlers, the canon commit, the
  publish-page canon extraction and the sidebar asset description) now import
  it from `@kit/ai-gateway`; the three synchronous web ones open a run first
  (`canon-actions.ts` an `episode_summary` run, `asset-link-actions.ts` an
  `asset_description` run per description, and the story page's fact check
  a server-only `fact_check` run on the project, `lib/documentary/fact-checker.ts`,
  which the first rebase missed: it refused with LLM_NO_RUN until a test that
  keeps the gateway's rule caught it). The 24 `queueLlmJob` call sites
  became `openRunForJob` + `run.dispatch()` (FILM-1903). `@kit/prompt-engine`
  lost its `@kit/llm` and `@aws-sdk/client-sqs` dependencies; `/server` keeps
  `payloadForTarget` and the authorisers. The agent runner lost `@kit/llm`
  altogether: `AgentRunContext.write` or `setAgentStepWriter` supply the model.

  Why a source scan and not dependency-cruiser: the rule is one line of
  policy; the repo already enforces this kind of rule with vitest scans in the
  fast lane (sdk-base-url-guard, model-host-guard), and a second tool with its
  own config and CI step would have guarded the same imports the scan reads.

  Red runs recorded (2026-10-03): planted `import { createLLMClient } from
  '@kit/llm'` in packages/features/episodes/src: `eslint` 1 error
  (no-restricted-imports), the scan's 'no source file outside the gateway
  imports' failed; both green with the file removed. Seventeen mutation guards
  in tooling/mutation-guards/film-1902.json and film-1903.json each went red
  under their mutation (`run.py --only`), including the guard, run.write on an
  external run, the usage row's run id, the agent runner building its own
  writer and the worker running an external or committed run.

