notes: |
  ## Part A (#554, 2026-10-03): the dead call sites and the host guard

  Deleted, each re-verified by grep to have no importer outside its own
  barrel or test: `continuity-actions.ts` and `continuity-checker.tsx`;
  `news-actions.ts` with `anchor-service.ts`, `producer-service.ts`,
  `news-story-service.ts`, `entity-extractor.ts` and their tests
  (producer-rundown, producer-breaks, infer-category, and the balance-check
  case of newsapi-one-request, whose other cases guard the live NewsAPI
  provider for KB-125 —
  the last tested two pure helpers of the producer that nothing else called);
  `lib/canon/act-context-bridge.ts` and its test; `server/agent-story-generation.ts`;
  `agent/orchestrator.ts` (the ninth site, found by the re-audit; the
  `@kit/episodes/agent/orchestrator` export went with it);
  `element-prompt/llm-generator.ts` and `generate-element-prompt.ts`;
  `audio-embedding.ts`; `llm/src/transcription.ts`. Tests that named them
  were updated: `kb105-unchecked-updates` (two baseline keys),
  `vendor-sandbox/__tests__/coverage.test.ts` (no unreachable agents left,
  seven `runAgent` sites), `sdk-base-urls` and `sdk-base-url-guard` (the
  Whisper case), `tooling/mutation-guards/film-1805.json` and `kb-115.json`
  (one entry each targeted a deleted file).

  Kept on purpose: `context-aggregator.ts` (external-context-actions uses
  it), `element-prompt/cache.ts` (character.mutations uses it), the
  `news-generation/*` prompt JSONs (registered in the prompt registry and
  served by the vendor sandbox's templates), `types/act-context.ts` and
  the continuity types and schemas (type-only, exported from the lib
  barrel). The `openai` dependency stays in `@kit/llm`: the OpenAI, DeepSeek
  and local providers use it.

  `@kit/llm` dependents, measured 2026-10-03 before part A: agent,
  prompt-engine, episodes, assets, audio-generation, content-analytics
  (declared, never imported), apps/web, vendor-sandbox. After part A:
  agent, prompt-engine, content-analytics, apps/web, vendor-sandbox.

  The host guard scans source, not a grep in CI, so it runs with
  `@kit/llm`'s tests in the fast lane's Unit Tests job and the rule has a
  unit test per spelling. DeepSeek's host is guarded too: it is a model
  vendor in the resolver that the criterion's list missed.

  ## Every live path to a model today (audit 2026-10-02) and where it goes

  | # | Triggered by | Code path | After this spec |
  |---|---|---|---|
  | 1 | Season outline | worker season-outline, Season Orchestrator | stage season_outline |
  | 2 | Season analysis | worker season-analysis | stage season_analysis |
  | 3 | Ideation page | worker story-ideation, Ideation Orchestrator | stage ideation |
  | 4 | Story page, bulk actions | worker story-generation, Story Orchestrator | stage story |
  | 5 | Story canon step | apps/web/lambda/llm-worker/utils/commit-story-canon.ts:82 | facts in the story output |
  | 6 | Story refine | worker story-refinement | stage story_refinement |
  | 7 | Screenplay page | worker screenplay-conversion, Screenplay Orchestrator | stage screenplay |
  | 8 | Screenplay refine | worker screenplay-refinement | stage screenplay_refinement |
  | 9 | Visual studio | worker shot-generation, Shot Orchestrator | stage shots |
  | 10 | After shots, audio studio | worker audio-cue-generation | stage audio_cues |
  | 11 | Audio studio translate | worker translate-dialogue | stage dialogue_translation |
  | 12 | Asset creation | worker asset-creation | stage asset_description |
  | 13 | Research upload | worker fact-extraction | stage fact_extraction |
  | 14 | Publish metadata translate | worker batch-translate-metadata | stage publish_metadata |
  | 15 | Analytics insights | worker analytics-insights | server only, through the gateway |
  | 16 | Language insights | worker language-insights | server only, through the gateway |
  | 17 | Publish page episode summary | canon-actions.ts:1479 (synchronous) | stage episode_summary |
  | 18 | Sidebar extract description | asset-link-actions.ts:83 (synchronous) | stage asset_description |
  | 19 | Story/ideation context | apps/web/lambda/llm-worker/utils/voyage-embedder.ts | gateway embedder; prepare reads stored episode_embeddings only in external mode |

  ## Why build-time first

  A runtime guard is correct only while every developer remembers it. The
  import boundary means a new feature that wants a model cannot compile
  without going through the gateway, and the gateway's only input is a run;
  a run only exists for a registered stage, and registering a stage gives it
  the external path for free (FILM-1908's generic tools). Forgetting the
  external path therefore fails the matrix test instead of shipping a hole.
package:
  package_name: "@kit/ai-gateway"
  path: "packages/ai-gateway/"
  exports: ["createServerWriter", "createExternalWriter", "resolveWriter", "embedForServerRun"]
  package_dependencies: ["@kit/llm", "@kit/generation", "@kit/supabase"]
