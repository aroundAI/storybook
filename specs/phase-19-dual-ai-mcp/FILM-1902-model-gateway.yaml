spec_id: "FILM-1902"
title: "Model Gateway: one door to every AI model"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: package
status: DRAFT
effort: L
dependencies:
  - spec_id: "FILM-1901"
    note: "the stage registry is what the gateway's call sites must equal"
  - spec_id: "FILM-1903"
    note: "run.write() and run.dispatch() live on the run handle; build the two together"
summary: >
  Makes it impossible to reach a model without going through a generation run,
  and makes the run, not the caller, decide who writes. A new package,
  @kit/ai-gateway, holds the server writer and is the only package allowed to
  import @kit/llm or a model SDK; business code gets output from
  run.write(part), and the run's mode resolves the writer (Gemini in server
  mode, "wait for the agent's submission" in external mode). The owner's
  requirement, 2026-10-02: no dangling entry points, and a future developer who
  forgets the external path must not open a hole where Claude-driven work
  triggers Gemini. This spec turns that into build-time, run-time and
  database-time refusals, and deletes every model call site that has no caller.
  Design: the EDD's "6. One door to AI models"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
