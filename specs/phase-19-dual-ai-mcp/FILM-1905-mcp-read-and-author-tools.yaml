category: feature
status: PARTIAL
effort: M
dependencies:
  - spec_id: "FILM-1904"
    note: "the endpoint, withMcpAuth and the tool registry"
summary: >
  Gives the agent the same view of a project the web pages show, and lets it
  create and edit what a user writes by hand (projects, episodes, characters,
  locations), so it can drive the workflow from an empty team to a briefed
  episode. Generated content is never written through these tools; it goes
  through FILM-1908's brief and submit path. Every tool is a thin adapter over
  an existing feature service called with the principal's RLS-scoped client.
  Design: the EDD's "3. MCP tool catalogue"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
  Shipped in #564 (stacked on #558).
acceptance_criteria:
  - text: "Read tools (studio:read): list_projects, get_project, list_episodes, get_episode, get_screenplay, get_shots, get_dialogue, list_assets; each returns structuredContent plus a short text summary"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/read/index.ts:14 (the eight tools, all studio:read and readOnlyHint); every handler returns text and structuredContent, asserted per tool in packages/features/studio-mcp/__tests__/tools/read-tools.test.ts:31 and over the wire with the SDK client in packages/features/studio-mcp/__tests__/contract.test.ts:185 (#564)"
  - text: "get_episode returns the stage status the studio pages derive (draft → story → storyboard → …, episodes.status), the story, a screenplay summary, counts, and the origin of each stage (FILM-1903)"
    met: false
    reason: "in part — status, the six stages as locked/available/done (the workspace tabs' rule, packages/features/studio-mcp/src/server/tools/read/stage-status.ts:79), the story, a screenplay summary and counts of scenes, shots, dialogue lines and assets are returned (packages/features/studio-mcp/src/server/tools/read/episodes.ts:175; packages/features/studio-mcp/__tests__/contract.test.ts:475). The origin per stage is read from episodes.generation_origin when the column exists (packages/features/studio-mcp/src/server/tools/read/episodes.ts:223); FILM-1903 adds it on a parallel branch, so today every stage reports origin null with a note saying so"
  - text: "Lists and long content page with cursor and limit (max 50, scenes as the unit for screenplay, shots and dialogue), and each tool description says so"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/pagination.ts:10 (PAGE_LIMIT_MAX 50), :13 (the note every paged description carries), :77 (sceneWindow: whole scenes per page); packages/features/studio-mcp/__tests__/tools/read-tools.test.ts:59 (cursor and limit on every paged tool, 51 refused, descriptions name cursor, limit and 50); get_screenplay paged 2+2+1 over the wire in packages/features/studio-mcp/__tests__/contract.test.ts:475 (#564)"
  - text: "Author tools (studio:write): create_project, update_project, create_episode, update_episode, upsert_asset; each validated with the same Zod schema as its web form and recorded in mcp_tool_calls"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/author/index.ts:13; the input shapes are the forms' own schemas (CreateProjectSchema/UpdateProjectSchema and UpdateStudioSettingsSchema from @kit/projects, CreateEpisodeSchema/UpdateEpisodeSchema and CreateEpisodeWithContextSchema from @kit/episodes, CharacterFormSchema/CreateCharacterSchema/UpdateCharacterSchema and LocationFormSchema from @kit/assets), one refusal per form rule in packages/features/studio-mcp/__tests__/tools/author-schemas.test.ts:24; each write goes through the service function the web action calls (packages/features/projects/src/lib/server/project.service.ts, packages/features/episodes/src/server/episode.service.ts, packages/features/assets/src/lib/server/asset.service.ts, packages/features/assets/src/lib/server/character.service.ts); the registry's audit row per call is asserted in packages/features/studio-mcp/__tests__/contract.test.ts:548 (#564)"
  - text: "No author tool writes story_data, screenplay_data, shots, dialogue_lines or audio_cues"
    met: true
    evidence: "packages/features/studio-mcp/__tests__/tools/no-generated-writes.test.ts:92 (no such key in any author input schema; a recording client sees no write to shots, dialogue_lines or audio_cues and no story_data/screenplay_data/shot_list key in any episode write); the episode row read back after create_episode and update_episode has all three null in packages/features/studio-mcp/__tests__/contract.test.ts:530; mutation guard MCP-RW U1 in tooling/mutation-guards/film-1905.json goes red when create_episode seeds story_data (#564)"
  - text: "get_workflow_guide returns the stage order, what each stage needs and how brief, submit and finalize work; the same text is offered as an MCP prompt"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/workflow-guide.ts:11 (the text: stages in order with what each needs, the author tools, start_generation → submit_generation → finalize_generation, the error codes) and :52 (the tool); packages/features/studio-mcp/src/server/prompts.ts:21 (the workflow_guide prompt, same text) registered by packages/features/studio-mcp/src/server/build-server.ts:59; packages/features/studio-mcp/__tests__/tools/workflow-guide.test.ts:50 and, through the SDK client's listPrompts/getPrompt, packages/features/studio-mcp/__tests__/contract.test.ts:185 (#564)"
