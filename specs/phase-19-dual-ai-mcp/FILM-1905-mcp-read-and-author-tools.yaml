notes: |
  Studio stage data lives as JSONB on episodes (story_data, screenplay_data,
  shot_list) plus rows in shots, dialogue_lines, audio_cues and assets
  (characters and locations are assets of type 'character' / 'location').
  Read tools return that data in the shapes the stage output schemas of
  FILM-1901 use, so what the agent reads is what it would submit.

  ## What #564 did (2026-10-03)

  - Tools live in packages/features/studio-mcp/src/server/tools/{read,author}/
    and are appended to `defaultTools` (src/server/tools/index.ts), one
    spread per spec, so FILM-1906 and FILM-1908 add theirs the same way.
    `buildMcpServer` gained an optional `prompts` list (default: the
    workflow guide) and `createMcpRouteHandlers({ prompts })` passes it on.
  - The web's create/update actions for projects, episodes, locations and
    characters were split into wrapper + service (EDD 3a): the write and its
    user-facing refusals moved to project.service.ts, episode.service.ts,
    asset.service.ts and character.service.ts, each taking a Supabase client;
    the actions call them with the cookie session's client, the tools with
    the principal's. Two schemas moved to their owning package with a
    re-export left behind: the studio settings schema from
    apps/web/.../settings/_lib/schemas/ to @kit/projects/schemas/studio-settings,
    and the location editor's form schema from the component to
    @kit/assets/schemas/location.
  - Every read is scoped to the bound team (`project.account_id`) on top of
    RLS, so a row of another team the user also belongs to is NOT_FOUND.
  - Two kinds of refusal reach a client: the SDK validates inputSchema before
    the handler and answers JSON-RPC -32602 (the SDK client throws); a refusal
    the handler or the database makes (slug taken, episode number taken,
    version moved, row not in the team) is an isError result with the
    contract's code (VALIDATION_FAILED, TARGET_CHANGED, NOT_FOUND).
  - create_episode puts the logline in `description`, never in story_data;
    target duration, content style, visual tone and tone notes land where the
    wizard puts them (target_duration_seconds and metadata).
  - upsert_asset without assetId updates the live asset of the same type and
    name in the project (the database keeps that unique), else creates one.
  - KB-175 filed: episode numbers are not unique per project; the create
    code's "unique_episode_number_per_project" constraint does not exist, so a
    chosen number is refused only when the title (slug) repeats too.
  - Red runs: the four tool test files failed to load before the tools
    existed ("Cannot find module '../author/episodes'" …); the six mutation
    guards in tooling/mutation-guards/film-1905.json each went red under
    their mutation (`run.py --kind unit --file-prefix packages/features/studio-mcp/src/server/tools`).
