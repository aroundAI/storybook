summary: >
  The write API an external agent uses: generic generation tools over the
  stage registry, so registering a stage exposes it to Claude with no extra
  code. start_generation opens an external run and returns the first brief;
  submit_generation validates and stores one part, returning field errors or
  the next brief; finalize_generation runs the same commit() the worker uses,
  in one transaction. The story stage is the first proved end to end, with
  zero model calls from StoryBook. Design: the EDD's "2. Generation runs and
  leases", "3. MCP tool catalogue" and the external shot-list sequence diagram
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
