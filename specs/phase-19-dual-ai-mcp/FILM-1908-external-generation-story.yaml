open_questions:
  - "Is the agent's self-check against the quality rubric enough, or should commit refuse below a deterministic score (e.g. shots without a hook in the first 3 seconds)?"
notes: |
  The quality evaluators (idea-quality, story-quality, screenplay-quality,
  shot-quality, translation-quality prompts) score server-mode output with a
  second model call. In external mode the same prompt is rendered into the
  brief as quality_rubric and the agent is asked to self-check; commit runs
  only the deterministic checks of FILM-1901. Built that way (#573);
  the open question stays the owner's.

  ## Built (#573, 2026-10-03)

  - Tools: packages/features/studio-mcp/src/server/tools/generation/, one
    spread in tools/index.ts. Generic over the registry: a target is the
    episode's (or project's, or asset's) values plus options, parsed by the
    stage's own targetSchema, so FILM-1909's stages need no tool code.
    Target types other than episode, scene, project, season and asset are
    refused as not served over MCP.
  - A refused submission is recorded (generation_run_parts.validation.failures)
    without replacing an accepted part; finalize commits accepted parts only.
  - A closed run (committed, failed, cancelled) answers RUN_EXPIRED with its
    status: mcp_tool_calls.error_code is CHECKed against FILM-1904's code
    list, which has no RUN_NOT_OPEN.
  - A brief carries the run's accepted parts as `earlier` (KB-178, #570), so
    a shots scene brief reads the Reel Scout part.
  - The story's invented assets (`followOn`) open no child run in either
    mode: asset_description takes a name and type, not an asset id, and the
    worker does not run them either.
  - The worker's episode context loader moved to its own module
    (apps/web/lambda/llm-worker/utils/episode-context-loader.ts); the MCP route
    injects it with `semantic: false`.
