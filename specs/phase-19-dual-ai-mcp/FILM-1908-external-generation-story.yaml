    - {text: "submit with a missing field returns rejected with that path; resubmit accepted", met: false, reason: "not met — no test yet"}
  integration:
    - {text: "A scripted MCP SDK client against the local app drives start → submit → finalize for the story stage of a seeded episode", met: false, reason: "not met — no test yet"}
  e2e:
    - {text: "After the scripted run, Playwright opens the story page and reads the story and its origin badge; screenshots in the PR", met: false, reason: "not met — no test yet"}
open_questions:
  - "Is the agent's self-check against the quality rubric enough, or should commit refuse below a deterministic score (e.g. shots without a hook in the first 3 seconds)?"
notes: |
  The quality evaluators (idea-quality, story-quality, screenplay-quality,
  shot-quality, translation-quality prompts) score server-mode output with a
  second model call. In external mode the same prompt is rendered into the
  brief as quality_rubric and the agent is asked to self-check; commit runs
  only the deterministic checks of FILM-1901.
