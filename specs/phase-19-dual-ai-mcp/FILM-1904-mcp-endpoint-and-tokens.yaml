notes: |
  ## Tables

  mcp_connections: id, user_id, account_id, client_id (FILM-1907), kind
  ('oauth','pat'), name, scopes text[], last_used_at, revoked_at, created_at.
  RLS: a user reads and revokes their own.

  mcp_tokens: token_hash pk, connection_id, kind ('access','refresh','pat'),
  expires_at, rotated_from, revoked_at. Service role only (the auth wrapper
  and the FILM-1907 endpoints).

  mcp_tool_calls: id, connection_id, user_id, account_id, tool, run_id,
  status, error_code, duration_ms, created_at. Team owners read; 90-day
  retention by cron.

  ## Why the route sits outside enhanceRouteHandler

  enhanceRouteHandler (packages/next/src/routes/index.ts) authenticates with
  the cookie session only. The MCP route needs bearer tokens, so it gets its
  own wrapper that ends in the same kind of user-scoped Supabase client.

  ## Reference

  Claude custom connectors: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp
  (public internet, OAuth via Claude's published identity, automatic
  registration or a pre-registered client, or fixed request headers). The
  owner also shared https://heeki.medium.com/building-an-mcp-server-as-an-api-developer-cfc162d06a83:
  stateless Streamable HTTP on Lambda, credentials out of tool arguments,
  MCP Inspector for testing.
