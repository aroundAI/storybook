spec_id: "FILM-1904"
title: "MCP Endpoint, Personal Access Tokens and Request Auth"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: feature
status: DRAFT
effort: M
dependencies: []
summary: >
  StoryBook serves a remote MCP server at /api/mcp over Streamable HTTP, in
  stateless mode, inside the existing Next.js app, so Claude Desktop, claude.ai
  or any MCP client can connect to it as a custom connector. A new package,
  @kit/studio-mcp, holds the tool registry; each tool is a thin adapter over an
  existing service or @kit/generation. withMcpAuth resolves a bearer token to a
  connection (user, team, scopes) and mints a 5-minute Supabase JWT so every
  query runs under RLS as that user. This spec ships personal access tokens as
  the first credential (OAuth is FILM-1907), plus rate limits and an audit log.
  The existing packages/mcp-server is a stdio developer tool with SQL execution
  and is never exposed. Design: the EDD's "4. Transport and endpoint" and
  "5. Authentication and tenancy"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
