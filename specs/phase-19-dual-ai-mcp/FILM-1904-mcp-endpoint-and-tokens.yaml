notes: |
  ## Decisions made while building (#558)

  - Endpoint inside the Next.js app (README open question 5): implemented
    as recommended. The SDK 1.18.0 transport speaks Node's http types, so
    `src/server/node-adapter.ts` bridges the route's Web Request/Response;
    SSE is not enabled, which is what keeps the adapter small.
  - A token is bound to one team. The optional `account` slug every tool
    accepts is checked against that team, not against the user's other
    memberships: another team's slug is FORBIDDEN even if the user belongs to
    it. A second team means a second token.
  - Creating a token does not use the service role: `create_mcp_personal_access_token`
    (SECURITY DEFINER, inventoried) checks `has_role_on_account` and writes the
    connection and the hash together. The service role appears only in the
    auth wrapper (reading mcp_tokens, touching last_used_at) and the audit
    writer, never in a handler.
  - Argument-shape errors are the SDK's own (`isError` with its text); the
    contract's VALIDATION_FAILED is for semantic validation a handler does.
  - The user JWT is HS256 with `SUPABASE_JWT_SECRET`; `McpJwtSigner` is the
    seam for FILM-1907's imported signing key (`MCP_JWT_PRIVATE_KEY` is
    reserved and refused until then).
  - `@kit/cache` gained `incr(key, ttlSeconds)` (memory and redis); the memory
    cache counts per instance, so production rate limits need
    `CACHE_PROVIDER=redis` to be one shared count.

  ## Tables

  mcp_connections: id, user_id, account_id, client_id (FILM-1907), kind
  ('oauth','pat'), name, scopes text[], last_used_at, revoked_at, created_at.
  RLS: a user reads and revokes their own.

  mcp_tokens: token_hash pk, connection_id, kind ('access','refresh','pat'),
  expires_at, rotated_from, revoked_at. Service role only (the auth wrapper
  and the FILM-1907 endpoints).

  mcp_tool_calls: id, connection_id, user_id, account_id, tool, run_id,
  status, error_code, duration_ms, created_at. Team owners read; 90-day
  retention by cron.

  ## Why the route sits outside enhanceRouteHandler

  enhanceRouteHandler (packages/next/src/routes/index.ts) authenticates with
  the cookie session only. The MCP route needs bearer tokens, so it gets its
  own wrapper that ends in the same kind of user-scoped Supabase client.

  ## Reference

  Claude custom connectors: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp
  (public internet, OAuth via Claude's published identity, automatic
  registration or a pre-registered client, or fixed request headers). The
  owner also shared https://heeki.medium.com/building-an-mcp-server-as-an-api-developer-cfc162d06a83:
  stateless Streamable HTTP on Lambda, credentials out of tool arguments,
  MCP Inspector for testing.
