spec_id: "FILM-1901"
title: "Generation Core: prepare, commit and output schemas per stage"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: package
status: PARTIAL
effort: XL
dependencies: []
summary: >
  Splits every AI generation job into prepare (build context, render the
  prompt, name the output schema), generate (the model call) and commit
  (validate, persist, chain), and moves prepare and commit out of the 16
  llm-worker handlers into a new package, @kit/generation. Today the code that
  decides what to ask the model is fused with the code that decides what to
  save, so nothing outside the worker can save a stage correctly. After this
  spec the worker is a thin runner (prepare, orchestrator, commit) with
  unchanged behaviour, and FILM-1908 can call the very same commit for output
  Claude submits over MCP. Design: the EDD's "Low-level design, 1. Generation
  core" (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "packages/features/generation exists as @kit/generation and exports StageDefinition, Brief, CheckError, GenerationOrigin, StageKey and the stage registry; it imports nothing from @kit/llm, @kit/agent or a model SDK"
    met: true
    evidence: "packages/features/generation/package.json and src/index.ts export StageKeySchema, GenerationModeSchema, GenerationOriginSchema, Brief, PartSpec, CheckError, Ctx, GenerationRun, StageDefinition, stageRegistry, registerStage, getStage, buildBrief, checkWithSchema, runStage. The package depends on @kit/prompt-engine, which itself depends on @kit/llm, so the criterion is met by subpath: it imports only `@kit/prompt-engine/render-template` and `@kit/prompt-engine/prompts/*` (JSON data), and `__tests__/import-boundary.test.ts` scans the source and refuses @kit/llm, @kit/agent, @kit/ai-gateway, @kit/episodes, `@kit/prompt-engine/server`, the root entry, @google/genai, openai, @anthropic-ai, voyageai, server-only and next; proven red with a planted `import '@kit/llm'` (2 findings) before going green (#557)"
  - text: "Every stage in the registry table below has a StageDefinition with parts(), prepare(), outputSchema (Zod), check() and commit()"
    met: false
    reason: "6 of 14: story_refinement (src/stages/story-refinement.ts) and asset_description (src/stages/asset-description.ts), registered at load and checked by `stages.test.ts` (#557); screenplay, screenplay_refinement, dialogue_translation and publish_metadata (src/stages/{screenplay,screenplay-refinement,dialogue-translation,publish-metadata}.ts), each with parts(), prepare(), a Zod outputSchema, check() and commit(), checked by `stages-part-c.test.ts` (#560). The other 8 are the remaining slices of this spec"
  - text: "prepare() renders the stage's prompt JSON with the same renderTemplate the worker uses and returns a Brief: instructions (system layers + rendered user prompt), structured context, output JSON Schema generated from the Zod schema, example output, quality rubric from the matching quality-evaluation prompt, constraints, targetVersion, expiresAt"
    met: true
    evidence: "packages/features/generation/src/brief.ts: buildBrief renders with renderTemplate from `@kit/prompt-engine/render-template` (the worker's renderer), generates the JSON Schema with zod-to-json-schema, takes `example` from output.example_output, renders the stage's quality-evaluation prompt (story_refinement → story-quality.json) as a self-check with placeholders for the output, and sets expiresAt 30 minutes out (BRIEF_TTL_MS, FILM-1903's lease). Every stage's prepare goes through it; `__tests__/brief.test.ts` covers each field and `stages.test.ts` renders every registered stage's prompt with the context prepare builds (#557)"
  - text: "commit() owns every side effect the handler performs today: episodes JSONB columns and status, shots replacement, dialogue_lines rebuild, audio_cues, canon tables, asset auto-create, chained stages, generation_jobs bookkeeping; it runs in one transaction and snapshots what it replaces into content_revisions (FILM-1903)"
    met: false
    reason: "For the two stages moved, commit owns what the handler did: story_refinement writes story_data, metadata.previous_story_data, metadata.refinement_history, updated_at and closes the generation_jobs row (processing/failed are runStage's); asset_description upserts the assets row on (project_id, type, name) with metadata.autoCreated, and the asset-creation job moves its 'asset_creation' generation_jobs row (KB-174, #553) through processing to completed or failed, which the old handler never did. The parity fixtures prove the content rows are the ones the handlers wrote (#557). Part C: screenplay writes screenplay_data (scenes as returned, generatedBy, totals, metadata.characters/locations from the scenes), status storyboard and updated_at, rebuilds dialogue_lines (delete, then insert in scene order, speakers mapped to character_asset_id by the context builder's list) and closes the job; screenplay_refinement writes screenplay_data (scenes and metadata replaced, lastRefinedAt), metadata.previous_screenplay_data and refinement_history, rebuilds dialogue_lines and closes the job; dialogue_translation inserts the translated dialogue_lines, English for a line the writer left out, and refuses a set over half untranslated; publish_metadata writes no row, because no publish draft exists in the database (the draft is the publish screen's state and the result returns over WebSocket), and returns every item. `stage-parity.test.ts` proves the rows and the result are the ones the four handlers wrote (#560). Not met: content_revisions does not exist on main (FILM-1903 part A builds it); commit calls `ctx.revisions.snapshot()` when the capability is present and the worker passes none. One transaction needs a database function (PostgREST runs each statement on its own); the remaining 8 stages are not moved"
  - text: "check() runs the deterministic checks in both modes: schema validity, referential checks (characters and locations exist or are flagged for auto-create), count and duration bounds (SHOT_DURATION_LIMITS, calculateContentScaling), contiguous scene numbering, no empty dialogue, column length caps; errors are {path, code, message}"
    met: false
    reason: "The shape and the schema check are in: checkWithSchema turns Zod issues into {path, code, message}, runStage runs it and then the stage's check(). story_refinement's check refuses blank text, a scene count below 1 and blank key events; asset_description's schema refuses a blank description and its target caps the name at 255 (the assets.name column). Part C adds the referential and structural checks for the screenplay stages (`shared/scene-checks.ts`): a speaker or location must be the episode's or declared new (the part's `newCharacters`/`newLocations`, or the refinement prompt's metadata lists; a declared one is auto-created by asset-creation as today), no empty speaker or dialogue text, scene numbers contiguous within a part from its own scene and 1..n across the parts at commit, text caps (heading 300, location 200, description 20 000, dialogue 4 000 characters; publishes.title 500); dialogue_translation refuses a translation for a line not in the part or translated twice; publish_metadata refuses an item nobody asked for or one translated twice. Scene and dialogue counts from calculateContentScaling (now `@kit/generation/duration-scaling`) are the brief's constraints and the planned part count, not refused: today's orchestrator saves an out-of-range screenplay, and refusing one is FILM-1909's decision. SHOT_DURATION_LIMITS belongs to the shots stage (part D) (#557, #560)"
  - text: "The worker enforces outputSchema on every model reply in server mode (today the prompt's output.schema is not enforced, apps/web/lambda/llm-worker/prompt-registry.ts)"
    met: false
    reason: "Enforced for story-refinement (runStage: a reply the schema rejects throws StageOutputRejected, the generation_jobs row is marked failed with the {path, code} list, nothing is written; `stages.test.ts` 'runStage refuses') and for asset-creation (outputSchema.parse; a rejected reply falls back to the placeholder description as a failed call did before). Part C enforces it for screenplay-conversion (every orchestrator scene parsed by the part schema: the prompt's time-of-day enum, numbers, dialogue shape; unknown keys kept), screenplay-refinement, translate-dialogue (one translation per source line, no blank text) and batch-translate-metadata (a rejected reply falls back to the untranslated items, as a failed call did before, so publishing never blocks on translation). The other 10 handlers still take the extracted JSON as it comes (#557, #560)"
  - text: "Each llm-worker handler is rewritten as prepare → orchestrator (run.write, FILM-1902) → commit, with no behaviour change visible in the web app"
    met: false
    reason: "6 of 16. Part A: handlers/story-refinement.ts is runStage(storyRefinementStage, workerCtx, target, { generate: generateWithLambda }); handlers/asset-creation.ts keeps the job (names from the screenplay, skip existing, link to the episode) and runs the asset_description stage per asset. The model call is the caller-supplied `generate` seam, today `executeLLMForLambda` (utils/stage-runtime.ts); FILM-1902's run.write replaces it. No visible change: `__tests__/generation-parity.test.ts` compares the rows, filters, executor variables and the result sent over WebSocket with fixtures recorded against the old bodies (#557). Part C: handlers/screenplay-conversion.ts runs the Screenplay Orchestrator once from the brief's context and lays its scenes across the stage's per-scene parts (`splitScreenplayIntoParts`), then the advisory continuity checkpoint and quality evaluation as before; screenplay-refinement.ts is runStage with generateWithLambda; translate-dialogue.ts runs the Translation Orchestrator once over every untranslated line and serves each scene part its lines; batch-translate-metadata.ts runs the stage with executeLLM and keeps the untranslated fallback. `stage-parity.test.ts` compares rows, filters and the WebSocket result with goldens recorded against the old bodies (commit before the deletion) (#560)"
  - text: "The two synchronous model paths become stages: extractCanonChangesAction (packages/features/episodes/src/server/canon-actions.ts:1479) as episode_summary, and describeAsset (packages/features/episodes/src/lib/server/mutations/asset-link-actions.ts:72) as asset_description"
    met: false
    reason: "describeAsset is done: it is the asset_description stage's parts, prepare and outputSchema around `executeLLM`, and batchCreateUnlinked creates each asset through the stage's commit (asset-link-actions.ts, #557). extractCanonChangesAction → episode_summary is a remaining slice"
  - text: "The story stage's canon step (apps/web/lambda/llm-worker/utils/commit-story-canon.ts:424) takes canon facts from the stage output instead of a second model call when the run is external"
    met: false
    reason: "The story stage is not moved yet (remaining slice)"
