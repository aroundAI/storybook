notes: |
  ## Stage registry

  | Stage key | Target | Parts | Commit does (moved out of today's handler) |
  |---|---|---|---|
  | season_outline | project + season | 1 | create episode rows (today batch-episode-actions.ts, client-saved) |
  | season_analysis | project | 1 | store the analysis on the season |
  | ideation | episode | 1 | store ideas on episodes.metadata.ideas (today returned, not stored; FILM-1909 open question) |
  | story | episode | 1 | story_data, status 'story', canon tables, auto-created character/location assets |
  | story_refinement | episode | 1 | story_data, metadata.refinement_history |
  | screenplay | episode | 1 per scene + finalize | screenplay_data, status 'storyboard', rebuild dialogue_lines |
  | screenplay_refinement | episode or scene | 1 | screenplay_data, rebuild that scene's dialogue_lines |
  | shots | episode | reel-scout part + 1 per scene + finalize | replace shots, episodes.shot_list, clear stale audio_cues/audio_tracks, chain audio_cues |
  | audio_cues | episode | 1 per scene | insert audio_cues |
  | dialogue_translation | episode + language | 1 per scene | insert translated dialogue_lines |
  | asset_description | asset | 1 | update assets.description / metadata |
  | fact_extraction | project + research upload | 1 | insert verified_facts |
  | episode_summary | episode | 1 | returns the SCORE fields and canon changes for review, as extractCanonChangesAction does today; commitCanonChangesAction writes them once the user approves, and external-mode persistence (finalize → the commit_canon_changes RPC, gated on the user's review or an explicit tool) is FILM-1909's call |
  | publish_metadata | publish draft | 1 | return titles and descriptions per language to the publish draft (no draft row exists; tags are not translated today) |

  analytics-insights and language-insights are not stages: in external mode
  the agent analyses the data itself through FILM-1906's tools; the web
  buttons stay server mode.

  ## Today's paths this replaces (audit 2026-10-02)

  Worker job types (router: processJob, apps/web/lambda/llm-worker/index.ts):
  season-outline, season-analysis, story-ideation, story-generation,
  story-refinement, screenplay-conversion, screenplay-refinement,
  shot-generation, audio-cue-generation, translate-dialogue, asset-creation,
  fact-extraction, batch-translate-metadata, analytics-insights,
  language-insights; audio-file-generation is ElevenLabs only. Orchestrators in
  packages/features/episodes/src/agent/*-orchestrator.ts keep their director
  and evaluator skills; only their inputs and outputs move behind the core.

  ## Order of work

  One stage per PR, smallest first (story_refinement, asset_description),
  each behind its parity test, then the orchestrated stages. The old handler
  body is deleted in the same PR that proves parity.

  ## Part A (#557): the package and the two smallest stages

  What part A settled, and where it corrects the draft:

  - `@kit/prompt-engine` depends on `@kit/llm`, so "imports nothing from
    @kit/llm" cannot be a package-graph fact. It is a source fact: the core
    imports only the pure subpaths `@kit/prompt-engine/render-template` and
    `@kit/prompt-engine/prompts/*` (a new exports entry for the JSON files),
    and `__tests__/import-boundary.test.ts` refuses everything else named
    above. FILM-1902 adds the lint and CI rule for the rest of the repo.
  - The prompt sanitiser (`sanitizeForPrompt`, `sanitizeStrings`, KB-101)
    moved to `@kit/shared/prompt-sanitiser`; `@kit/episodes/lib` re-exports
    it. The core needs it, and `@kit/episodes` now depends on the core
    (describeAsset), which would have been a cycle in turbo's graph.
  - `Brief.prompt = { slug, version, variables }` is in the brief next to
    `instructions`: today's executors render the prompt themselves, so the
    server writer takes the slug and variables and the external agent takes
    the rendered text. Same `renderTemplate`, so the two are the same text.
  - `Brief.targetVersion` is `number | null`: `assets` has no version column.
    `episodes.version` is used for episode targets.
  - The stage output schemas are written from the prompt's `output.schema`
    and the handler's use: story_refinement keeps every story field optional
    but typed, because the handler fell back field by field to the stored
    value and the stored stories carry roles outside the prompt's enum; a
    present field of the wrong type is now refused, where before it was
    written. `sentimentScore` above 1 is divided by 10 as the prompt's
    definition says, where the handler stored it raw.
  - `runStage(stage, ctx, target, { generate })` is the server runner the
    handlers call: parts → prepare → generate → outputSchema → check →
    commit, with the generation_jobs bookkeeping (processing before,
    failed on any throw, completed by commit). `markJob*` moved into the
    core (`src/jobs.ts`); the worker's utils/job-tracking.ts re-exports.
  - asset_description's target is the asset by (project, type, name) plus
    the text to read it from; the asset may not exist yet, since both of
    today's callers describe before they create. Preparing without a
    project is allowed (the sidebar's extract-only action); committing is
    not.
  - The asset-creation job's generation_jobs row ('asset_creation', the
    value KB-174's migration allows) is marked processing, completed (with
    created/linked counts) or failed by the handler, not by the per-asset
    stage: the row is one per episode and job. The parity test holds the
    content writes to the old fixture and asserts the job writes on their
    own, since they are new on purpose.
  - `@kit/generation/testing` exports the recording Supabase stand-in the
    parity and stage tests use (recordingClient, tableResponder, writesOf,
    flattenRows).

  ## Part B (#562): story, ideation and the season stages

  Output schemas: `StoryStageOutputSchema` (the prompt's StorySchema with its
  sentiment normalisation, plus `newCharacters`, `newLocations`, the optional
  `canonFacts` and the server `evaluation`), `IdeationStageOutputSchema`
  (StoryIdeaSchema plus `conflict`, `qualityScore`, `viralPotential`),
  `SeasonOutlineStageOutputSchema` (the prompt's outline with `fact_ids` and
  the arc `evaluation`), `SeasonAnalysisOutputSchema` (written from
  season-generation's output.schema; the lists an analysis may omit default
  to empty). Each stage exports a `*BriefContextSchema` and an
  `*OrchestratorInput(brief)` reader: the brief's `context.orchestrator` is
  the orchestrator's input, so the handler passes it on and the orchestrators
  are untouched.

  Decisions and what they change:

  - **Canon facts (criterion 9).** The block is `canonFacts` (camelCase, like
    every other key of the output). In server mode the handler's generate
    step extracts it with canon-extraction after the orchestrator; commit
    stores it and never calls a model. The extraction now runs before the
    story row is written instead of after it; the rows are the same.
  - **Ideation** stores `episodes.metadata.ideas` and `ideas_generated_at`
    for both modes (lead decision, 2026-10-03, README question 3) and still
    returns the ideas to the client. The write bumps `episodes.version`
    through the existing trigger, as every episode update does.
  - **Season outline** creates the episode rows at commit, so both modes get
    them. The handler returns each outline with its row's `id`
    (`EpisodeOutlineSchema.id`, optional); `batchCreateEpisodesAction`
    updates a row by id with the preview's edits and still inserts an
    outline without one; both build the row through
    `episodeRowFromOutline` (`@kit/generation/episode-rows`). The regenerate
    action now passes `seasonId`, and the commit replaces the generated draft
    already at that number; a row a person made at that number is never
    touched, the outline takes the next free number. Rows are created at
    commit and removed if the user cancels, so the user sees the same result
    as before: removing an outline in the preview, or cancelling it, calls
    `discardGeneratedEpisodesAction`, which soft-deletes (the app's way of
    deleting episodes) the generated drafts of the project the user did not
    keep, checked with requireAffectedRows (KB-61); reordering and editing
    discard nothing, and Create updates the rows. `useGeneratedOutlines`
    holds that wiring (lead decision, 2026-10-03). The audit log and
    revalidatePath stay in the actions (server-only imports the core cannot
    make).
  - **Season analysis** is stored on `projects.metadata.latestSeasonAnalysis`
    (generatedAt, mode, analysis): no season row exists until
    `generateSeasonEpisodesAction` creates one from the approved analysis.
    The EDD's "store it on the season" is corrected to say so.
  - **Referential check scope.** story.characters are checked against the
    project's character assets (not only the tagged ones), skipped when the
    project has none; `newCharacters` flags an invented one for auto-create.
    Outlines' `characterFocus` and the analysis's `character_names` are not
    checked: the season dialog treats a new name as a character to create.
  - **Rejections are the intended change.** A story the schema or check
    refuses now fails the job (StageOutputRejected) where it was written
    before; a short set of ideas or outlines likewise.
  - **Helpers moved out of `@kit/episodes`** so prepare and commit need
    none of it: calculateContentScaling to `@kit/shared/duration-scaling`
    (t1901d's move, shared with the shots stage); into the core, the slug helpers,
    resolveProjectType and FACT_DRIVEN_PROJECT_TYPES (held together with the
    canon configs' `requiresFacts` by
    packages/features/episodes/__tests__/fact-driven-types.test.ts),
    formatRecurringElementsForPrompt, formatNeighbouringEpisodes,
    premiseDepthInstructions, memory-rows and storeEpisodeMemory. The
    episodes package and the worker re-export them from their old paths.
    `EpisodeContextSnapshot` gained optional fields (premise, genre,
    audience, style, project type, names, formatted facts and recurring
    elements) that the worker's loader fills.
  - **Pre-existing, unchanged:** `renderTemplate` ignores a layer's
    `conditional`, so the factual-constraints layer renders with an empty
    `{{verified_facts}}` in the brief as it does in the executor.

  ## Part C (#560): screenplay, its refinement, dialogue translation, publish metadata

  - **screenplay parts.** The story has no scenes yet, so the parts are the
    planned ones: `story_data.estimatedSceneCount` held to the duration's
    `calculateContentScaling` range (the midpoint when absent). A part's
    output is `{ scenes, newCharacters?, newLocations? }`: one scene for an
    external writer, while the server orchestrator, which writes the whole
    screenplay in one pass, is laid across the parts (one scene each, the
    remainder in the last, `splitScreenplayIntoParts`). Commit flattens the
    parts in order and refuses a sequence that is not 1..n.
  - **Unknown speakers are declared, not refused.** Today every speaker and
    location the model invents is saved and auto-created by the
    asset-creation job from `screenplay_data.metadata`. The check keeps that
    path explicit: a name must be the episode's or declared in the part's
    `newCharacters`/`newLocations` (the refinement prompt's own
    `metadata.characters`/`metadata.locations`); the server writer declares
    whatever the orchestrator used, an external writer must say so.
  - **Scene schemas are `passthrough`.** The handlers stored scenes as the
    model returned them (`action`, `audioCues`, anything else); the prompt's
    `output.schema` is enforced (time-of-day enum, numbers, dialogue shape)
    and the extra keys are kept.
  - **Targets are slim**, as part A's: `{ episodeId, contentStyle?,
    dialogueStyle? }`, `{ episodeId, feedback }`, `{ episodeId,
    targetLanguage, preserveTiming }`, `{ items }`. The user and account are
    `ctx`'s; the refinement history records `ctx.userId`, the same value the
    payload carried. A scene-scoped `screenplay_refinement` target is
    FILM-1909's: today's job refines the whole screenplay.
  - **dialogue_translation output is keyed by `sourceDialogueId`**, one part
    per scene with untranslated lines. The `dialogue-translation` prompt
    returns numbered text; the worker's writer strips the numbering and
    quotes and drops blank lines, and commit stores English for a line left
    out and refuses a set over half untranslated, as the handler did. The
    orchestrator still runs once over every line (one model pass, not one
    per scene). No generation_jobs row, as today. The language names, codes
    and style guides moved from the Translation skill into the stage; the
    skill imports them.
  - **publish_metadata writes nothing.** There is no publish-draft row: the
    draft is `publish-screen.tsx` state and the result reaches it over the
    WebSocket. Commit returns every requested item, an untranslated one with
    its own text. The handler keeps today's fallback (originals for every
    item) on a failed or rejected reply.
  - **One copy each:** `calculateContentScaling` is read from
    `@kit/shared/duration-scaling` (moved there in #561; the worker util and
    `@kit/episodes/lib` re-export it); `mergeCharacterArcs` (the worker's
    context builder re-exports it) and the screenplay-conversion prompt's
    enrichment blocks (`screenplayPromptVariables`, which the Screenplay
    Director skill now renders with) moved into the core.
    `EpisodeContextSnapshot`'s optional `characterList`, `locationList` and
    `recurringElements` (#561) let commit map speakers with the ids the
    context builder resolved (the "All Characters" wildcard included).

  ## Part D (#561): shots, audio_cues, fact_extraction, episode_summary

  What part D settled, and where it corrects the draft:

  - A multi-part stage has one `outputSchema` for the runner and one schema
    per part for the brief. shots' is a discriminated union on `kind`
    (`reel_scout` | `scene`), and a scene part carries its `sceneNumber`, so
    a resubmitted part names its scene and check() refuses one filed under
    the wrong part. `Brief.outputSchema` is the part's own schema.
  - The orchestrators are the server writer, not a per-part model call: the
    Shot Orchestrator and the Audio Cue Orchestrator run once, on the first
    brief `runStage` asks for, and the worker splits the result by part
    (`partOutputsFrom`, `cuesByPart`). Every part then passes the schema and
    check() before commit, so the orchestrators' outputs are enforced without
    rewriting them. The Shot Director now returns each scene's summary and
    viral score, which it used to drop, so a scene part is the prompt's
    whole declared output.
  - A commit can name follow-on stages (`CommitResult.followOns`); shots names
    audio_cues, which FILM-1903 opens as a child run in the parent's mode
    (#567). The story stage's `followOn` asset ids are not runnable targets
    yet and stay with its handler (FILM-1908).
  - `GenerateResult.diagnostics` carries what the server writer reports about
    itself (orchestrator steps, coverage) into `GenerationRun.diagnostics`,
    which a tracked stage's commit records on the job's output_data, as the
    audio-cue handler did.
  - episode_summary's commit persists nothing. The draft said "as
    extractCanonChangesAction writes today", and that action writes nothing:
    it returns the extraction for the user's review, and
    commitCanonChangesAction (the commit_canon_changes RPC) writes the canon
    tables on "Save to Canon". Writing from the stage would bypass the
    review step. The registry table above and the EDD row now say so; an
    external run's finalize is routed through the same approval (FILM-1909).
  - `calculateContentScaling` moved to `@kit/shared/duration-scaling` and
    `wholeShotSeconds` (KB-130) to `@kit/prompt-engine/llm-job-payloads`,
    because the core cannot import `@kit/episodes` (which depends on it); the
    old modules re-export. The worker's copy of duration-scaling re-exports
    too.
  - Multi-part stages memoise their loaded rows per Ctx (`stages/memo.ts`),
    so parts(), each prepare() and commit() read the episode or the shot
    list once per run. A Ctx lives for one worker job or one MCP request.
  - Two deliberate behaviour changes in the shots job, both in the direction
    of the checks: the deleted-episode guard runs before any write (it ran
    after the insert, and still queued the audio pass), and a scene the Shot
    Director lost fails the job (it used to save a shot list without that
    scene and mark the job completed).
  - The audio_cues stage reads the shot list paged (`fetchAllRows`); the
    handler read it with the 1000-row cap.
