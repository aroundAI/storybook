    - {text: "Each check() rejects a planted bad output with the expected {path, code}", met: true, evidence: "packages/features/generation/__tests__/stages.test.ts: story_refinement check → story.fullText/empty, story.estimatedSceneCount/too_small, story.keyEvents.1/empty; outputSchema → story.fullText/invalid_type; asset_description → description/invalid_type|too_small. Proven red by disabling check() (expected [] to equal 3 errors) and by loosening the schema (#557)"}
    - {text: "Every prompt JSON referenced by a stage renders with the context prepare() builds (no missing variable)", met: true, evidence: "stages.test.ts 'every registered stage renders its prompt with the context prepare() builds' iterates registeredStageKeys() and asserts no `{{placeholder}}` survives; renderTemplate throws on an unfilled or undeclared one (#557)"}
