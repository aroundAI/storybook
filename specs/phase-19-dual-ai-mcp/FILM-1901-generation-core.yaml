spec_id: "FILM-1901"
title: "Generation Core: prepare, commit and output schemas per stage"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: package
status: PARTIAL
effort: XL
dependencies: []
summary: >
  Splits every AI generation job into prepare (build context, render the
  prompt, name the output schema), generate (the model call) and commit
  (validate, persist, chain), and moves prepare and commit out of the 16
  llm-worker handlers into a new package, @kit/generation. Today the code that
  decides what to ask the model is fused with the code that decides what to
  save, so nothing outside the worker can save a stage correctly. After this
  spec the worker is a thin runner (prepare, orchestrator, commit) with
  unchanged behaviour, and FILM-1908 can call the very same commit for output
  Claude submits over MCP. Design: the EDD's "Low-level design, 1. Generation
  core" (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "packages/features/generation exists as @kit/generation and exports StageDefinition, Brief, CheckError, GenerationOrigin, StageKey and the stage registry; it imports nothing from @kit/llm, @kit/agent or a model SDK"
