    evidence: "packages/features/generation/package.json and src/index.ts export StageKeySchema, GenerationModeSchema, GenerationOriginSchema, Brief, PartSpec, CheckError, Ctx, GenerationRun, StageDefinition, stageRegistry, registerStage, getStage, buildBrief, checkWithSchema, runStage. The package depends on @kit/prompt-engine, which itself depends on @kit/llm, so the criterion is met by subpath: it imports only `@kit/prompt-engine/render-template` and `@kit/prompt-engine/prompts/*` (JSON data), and `__tests__/import-boundary.test.ts` scans the source and refuses @kit/llm, @kit/agent, @kit/ai-gateway, @kit/episodes, `@kit/prompt-engine/server`, the root entry, @google/genai, openai, @anthropic-ai, voyageai, server-only and next; proven red with a planted `import '@kit/llm'` (2 findings) before going green (#557)"
  - text: "Every stage in the registry table below has a StageDefinition with parts(), prepare(), outputSchema (Zod), check() and commit()"
    met: false
    evidence: "14 of 14: story_refinement (src/stages/story-refinement.ts) and asset_description (src/stages/asset-description.ts), registered at load and checked by `stages.test.ts` (#557); story (src/stages/story.ts), ideation (src/stages/ideation.ts), season_outline (src/stages/season-outline.ts) and season_analysis (src/stages/season-analysis.ts) from part B (#562), each registered at load, listed by `stages.test.ts` and covered by its own test under `__tests__/stages/`; screenplay, screenplay_refinement, dialogue_translation and publish_metadata (src/stages/{screenplay,screenplay-refinement,dialogue-translation,publish-metadata}.ts), each with parts(), prepare(), a Zod outputSchema, check() and commit(), checked by `stages-part-c.test.ts` (#560); shots (src/stages/shots.ts: a reel_scout part, then scene:N per screenplay scene, the stage schema a `kind` union with each brief carrying its own part's schema), audio_cues (src/stages/audio-cues.ts: one part per scene of the shot list, sceneless shots their own part), fact_extraction (src/stages/fact-extraction.ts) and episode_summary (src/stages/episode-summary.ts), registered at load and checked by `stages.test.ts` and `stages-part-d.test.ts` (#561). Every stage of the registry table is in"
  - text: "prepare() renders the stage's prompt JSON with the same renderTemplate the worker uses and returns a Brief: instructions (system layers + rendered user prompt), structured context, output JSON Schema generated from the Zod schema, example output, quality rubric from the matching quality-evaluation prompt, constraints, targetVersion, expiresAt"
    met: true
    evidence: "packages/features/generation/src/brief.ts: buildBrief renders with renderTemplate from `@kit/prompt-engine/render-template` (the worker's renderer), generates the JSON Schema with zod-to-json-schema, takes `example` from output.example_output, renders the stage's quality-evaluation prompt (story_refinement → story-quality.json) as a self-check with placeholders for the output, and sets expiresAt 30 minutes out (BRIEF_TTL_MS, FILM-1903's lease). Every stage's prepare goes through it; `__tests__/brief.test.ts` covers each field and `stages.test.ts` renders every registered stage's prompt with the context prepare builds (#557)"
  - text: "commit() owns every side effect the handler performs today: episodes JSONB columns and status, shots replacement, dialogue_lines rebuild, audio_cues, canon tables, asset auto-create, chained stages, generation_jobs bookkeeping; it runs in one transaction and snapshots what it replaces into content_revisions (FILM-1903)"
    met: false
    reason: "For the two stages moved, commit owns what the handler did: story_refinement writes story_data, metadata.previous_story_data, metadata.refinement_history, updated_at and closes the generation_jobs row (processing/failed are runStage's); asset_description upserts the assets row on (project_id, type, name) with metadata.autoCreated, and the asset-creation job moves its 'asset_creation' generation_jobs row (KB-174, #553) through processing to completed or failed, which the old handler never did. The parity fixtures prove the content rows are the ones the handlers wrote (#557). Part B (#562): story's commit writes story_data, status 'story' and target_duration_seconds, closes the generation_jobs row (server runs only), writes the canon tables through `src/canon/story-canon.ts` (cleanup of the last generation's canon, immutable_events, character_states, themes, narrative_threads and the episode memory from the canon facts it is given) and upserts the characters and locations the story invented, returning their ids as `followOn` asset_description targets for FILM-1903 to open as child runs (not queued here); ideation's commit writes episodes.metadata.ideas; season_outline's commit creates the episode rows that `batchCreateEpisodesAction` inserted from the client (through one shared `episodeRowFromOutline`), replacing the generated draft at the same number when one episode is regenerated; season_analysis's commit writes projects.metadata.latestSeasonAnalysis. `apps/web/lambda/llm-worker/__tests__/stage-parity-story-season.test.ts` compares every write with fixtures recorded against the old handler bodies (commit 9dbaba396). Part C: screenplay writes screenplay_data (scenes as returned, generatedBy, totals, metadata.characters/locations from the scenes), status storyboard and updated_at, rebuilds dialogue_lines (delete, then insert in scene order, speakers mapped to character_asset_id by the context builder's list) and closes the job; screenplay_refinement writes screenplay_data (scenes and metadata replaced, lastRefinedAt), metadata.previous_screenplay_data and refinement_history, rebuilds dialogue_lines and closes the job; dialogue_translation inserts the translated dialogue_lines, English for a line the writer left out, and refuses a set over half untranslated; publish_metadata writes no row, because no publish draft exists in the database (the draft is the publish screen's state and the result returns over WebSocket), and returns every item. `stage-parity.test.ts` proves the rows and the result are the ones the four handlers wrote (#560). Part D: shots' commit replaces the episode's shots (numbered across scenes in screenplay order, sequence_number continuing from the episode's highest), clears audio_cues and audio_tracks, writes episodes.shot_list, closes the shot_list job and returns audio_cues as a `followOns` child-run target (FILM-1903 opens it in the run's mode: the worker's shots handler as a server child running the audio-cue job, finalizeRun as an external child, #567); audio_cues' commit inserts the cue rows and closes its job with the orchestrator's diagnostics; fact_extraction's inserts verified_facts; episode_summary's maps the extraction for review and writes nothing, because extractCanonChangesAction never wrote: commitCanonChangesAction does after the user approves. `stages-part-d.test.ts` and the worker's handler tests compare every write with fixtures recorded against the old bodies, red with a per-scene numbering bug, a disabled scene check and a made-up scene 0 planted (#561). Not met: content_revisions does not exist on main (FILM-1903 part A builds it); commit calls `ctx.revisions.snapshot()` when the capability is present and the worker passes none. One transaction needs a database function (PostgREST runs each statement on its own)"
  - text: "check() runs the deterministic checks in both modes: schema validity, referential checks (characters and locations exist or are flagged for auto-create), count and duration bounds (SHOT_DURATION_LIMITS, calculateContentScaling), contiguous scene numbering, no empty dialogue, column length caps; errors are {path, code, message}"
    met: true
    evidence: "The shape and the schema check are in: checkWithSchema turns Zod issues into {path, code, message}, runStage runs it and then the stage's check(). story_refinement's check refuses blank text, a scene count below 1 and blank key events; asset_description's schema refuses a blank description and its target caps the name at 255 (the assets.name column). Part B (#562): story's check refuses a character that is not one of the project's unless newCharacters flags it for auto-create (`unknown_character`) and a story under half the word count calculateContentScaling gave the brief (`too_short`); its schema refuses an empty text, a role outside the prompt's enum, a sentiment outside 0-1 after the prompt's /10 normalisation and an asset name over the 255-character column; ideation refuses a set of the wrong size (`count_mismatch`); season_outline refuses the wrong count, a repeated number, a title over 255 and a premise or mainPlot outside the prompt's bounds; season_analysis refuses a missing premise, no episodes and a repeated number. Part C adds the referential and structural checks for the screenplay stages (`shared/scene-checks.ts`): a speaker or location must be the episode's or declared new (the part's `newCharacters`/`newLocations`, or the refinement prompt's metadata lists; a declared one is auto-created by asset-creation as today), no empty speaker or dialogue text, scene numbers contiguous within a part from its own scene and 1..n across the parts at commit, text caps (heading 300, location 200, description 20 000, dialogue 4 000 characters; publishes.title 500); dialogue_translation refuses a translation for a line not in the part or translated twice; publish_metadata refuses an item nobody asked for or one translated twice. Scene and dialogue counts from calculateContentScaling (now `@kit/shared/duration-scaling`, moved by t1901d in #561) are the brief's constraints and the planned part count, not refused: today's orchestrator saves an out-of-range