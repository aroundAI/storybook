spec_id: "FILM-1901"
title: "Generation Core: prepare, commit and output schemas per stage"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: package
status: PARTIAL
effort: XL
dependencies: []
summary: >
  Splits every AI generation job into prepare (build context, render the
  prompt, name the output schema), generate (the model call) and commit
  (validate, persist, chain), and moves prepare and commit out of the 16
  llm-worker handlers into a new package, @kit/generation. Today the code that
  decides what to ask the model is fused with the code that decides what to
  save, so nothing outside the worker can save a stage correctly. After this
  spec the worker is a thin runner (prepare, orchestrator, commit) with
  unchanged behaviour, and FILM-1908 can call the very same commit for output
  Claude submits over MCP. Design: the EDD's "Low-level design, 1. Generation
  core" (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "packages/features/generation exists as @kit/generation and exports StageDefinition, Brief, CheckError, GenerationOrigin, StageKey and the stage registry; it imports nothing from @kit/llm, @kit/agent or a model SDK"
    met: true
    evidence: "packages/features/generation/package.json and src/index.ts export StageKeySchema, GenerationModeSchema, GenerationOriginSchema, Brief, PartSpec, CheckError, Ctx, GenerationRun, StageDefinition, stageRegistry, registerStage, getStage, buildBrief, checkWithSchema, runStage. The package depends on @kit/prompt-engine, which itself depends on @kit/llm, so the criterion is met by subpath: it imports only `@kit/prompt-engine/render-template` and `@kit/prompt-engine/prompts/*` (JSON data), and `__tests__/import-boundary.test.ts` scans the source and refuses @kit/llm, @kit/agent, @kit/ai-gateway, @kit/episodes, `@kit/prompt-engine/server`, the root entry, @google/genai, openai, @anthropic-ai, voyageai, server-only and next; proven red with a planted `import '@kit/llm'` (2 findings) before going green (#557)"
  - text: "Every stage in the registry table below has a StageDefinition with parts(), prepare(), outputSchema (Zod), check() and commit()"
    met: false
    reason: "2 of 14: story_refinement (src/stages/story-refinement.ts) and asset_description (src/stages/asset-description.ts), registered at load and checked by `stages.test.ts` (#557). The other 12 are the remaining slices of this spec"
  - text: "prepare() renders the stage's prompt JSON with the same renderTemplate the worker uses and returns a Brief: instructions (system layers + rendered user prompt), structured context, output JSON Schema generated from the Zod schema, example output, quality rubric from the matching quality-evaluation prompt, constraints, targetVersion, expiresAt"
    met: true
    evidence: "packages/features/generation/src/brief.ts: buildBrief renders with renderTemplate from `@kit/prompt-engine/render-template` (the worker's renderer), generates the JSON Schema with zod-to-json-schema, takes `example` from output.example_output, renders the stage's quality-evaluation prompt (story_refinement → story-quality.json) as a self-check with placeholders for the output, and sets expiresAt 30 minutes out (BRIEF_TTL_MS, FILM-1903's lease). Every stage's prepare goes through it; `__tests__/brief.test.ts` covers each field and `stages.test.ts` renders every registered stage's prompt with the context prepare builds (#557)"
  - text: "commit() owns every side effect the handler performs today: episodes JSONB columns and status, shots replacement, dialogue_lines rebuild, audio_cues, canon tables, asset auto-create, chained stages, generation_jobs bookkeeping; it runs in one transaction and snapshots what it replaces into content_revisions (FILM-1903)"
    met: false
    reason: "For the two stages moved, commit owns what the handler did: story_refinement writes story_data, metadata.previous_story_data, metadata.refinement_history, updated_at and closes the generation_jobs row (processing/failed are runStage's); asset_description upserts the assets row on (project_id, type, name) with metadata.autoCreated, and the asset-creation job moves its 'asset_creation' generation_jobs row (KB-174, #553) through processing to completed or failed, which the old handler never did. The parity fixtures prove the content rows are the ones the handlers wrote (#557). Not met: content_revisions does not exist on main (FILM-1903 part A builds it); commit calls `ctx.revisions.snapshot()` when the capability is present and the worker passes none. One transaction needs a database function (PostgREST runs each statement on its own); the remaining 12 stages are not moved"
  - text: "check() runs the deterministic checks in both modes: schema validity, referential checks (characters and locations exist or are flagged for auto-create), count and duration bounds (SHOT_DURATION_LIMITS, calculateContentScaling), contiguous scene numbering, no empty dialogue, column length caps; errors are {path, code, message}"
    met: false
    reason: "The shape and the schema check are in: checkWithSchema turns Zod issues into {path, code, message}, runStage runs it and then the stage's check(). story_refinement's check refuses blank text, a scene count below 1 and blank key events; asset_description's schema refuses a blank description and its target caps the name at 255 (the assets.name column). The referential, count, duration and scene-numbering checks belong to the story, screenplay and shots stages, not yet moved (#557)"
  - text: "The worker enforces outputSchema on every model reply in server mode (today the prompt's output.schema is not enforced, apps/web/lambda/llm-worker/prompt-registry.ts)"
    met: false
    reason: "Enforced for story-refinement (runStage: a reply the schema rejects throws StageOutputRejected, the generation_jobs row is marked failed with the {path, code} list, nothing is written; `stages.test.ts` 'runStage refuses') and for asset-creation (outputSchema.parse; a rejected reply falls back to the placeholder description as a failed call did before). The other 14 handlers still take the extracted JSON as it comes (#557)"
  - text: "Each llm-worker handler is rewritten as prepare → orchestrator (run.write, FILM-1902) → commit, with no behaviour change visible in the web app"
    met: false
    reason: "2 of 16: handlers/story-refinement.ts is runStage(storyRefinementStage, workerCtx, target, { generate: generateWithLambda }); handlers/asset-creation.ts keeps the job (names from the screenplay, skip existing, link to the episode) and runs the asset_description stage per asset. The model call is the caller-supplied `generate` seam, today `executeLLMForLambda` (utils/stage-runtime.ts); FILM-1902's run.write replaces it. No visible change: `__tests__/generation-parity.test.ts` compares the rows, filters, executor variables and the result sent over WebSocket with fixtures recorded against the old bodies (#557)"
  - text: "The two synchronous model paths become stages: extractCanonChangesAction (packages/features/episodes/src/server/canon-actions.ts:1479) as episode_summary, and describeAsset (packages/features/episodes/src/lib/server/mutations/asset-link-actions.ts:72) as asset_description"
    met: false
    reason: "describeAsset is done: it is the asset_description stage's parts, prepare and outputSchema around `executeLLM`, and batchCreateUnlinked creates each asset through the stage's commit (asset-link-actions.ts, #557). extractCanonChangesAction → episode_summary is a remaining slice"
  - text: "The story stage's canon step (apps/web/lambda/llm-worker/utils/commit-story-canon.ts:424) takes canon facts from the stage output instead of a second model call when the run is external"
    met: false
    reason: "The story stage is not moved yet (remaining slice)"
