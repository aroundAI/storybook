  e2e:
    - {text: "FILM-1804's studio flow (ideation → story → screenplay → shots → audio) still passes against the AI sandbox after the worker moves onto the core", met: false, reason: "not met — the orchestrated stages are not moved; part A changes two handlers the flow does not drive"}
remaining:
  - criterion: "StageDefinitions for season_outline, season_analysis, ideation, story, screenplay, screenplay_refinement, shots, audio_cues, dialogue_translation, fact_extraction, episode_summary and publish_metadata, each handler rewritten behind its parity test, and the story stage's canon step taking facts from the output"
    reason: "Part A moved the two smallest stages (story_refinement, asset_description) and built the package they run on; the orchestrated stages come one per PR as the notes' order of work says"
    closed_by: "FILM-1901"
  - criterion: "commit snapshots what it replaces into content_revisions, stamps generation_origin, and runs in one transaction"
    reason: "content_revisions and the origin columns are FILM-1903's migration (part A, in parallel). Ctx carries the seams: `revisions.snapshot()` is called when present, `originColumnsAvailable` gates the stamp; the worker passes neither. One transaction needs a database function the same spec adds"
    closed_by: "FILM-1903"
  - criterion: "The model call between prepare and commit is run.write()"
    reason: "Until the gateway exists the caller supplies `generate: (brief) => Promise<{output, usage}>`; the worker passes executeLLMForLambda (apps/web/lambda/llm-worker/utils/stage-runtime.ts) and the episodes actions pass executeLLM"
    closed_by: "FILM-1902"
  - criterion: "The episode context loader is reachable from the Next.js app"
    reason: "story_refinement's prepare takes `ctx.episodeContext`, which the worker builds from its utils/context-builder.ts (it reaches the Voyage embedder, so the core does not import it). The MCP route (FILM-1908) needs the same loader built where it can import it"
    closed_by: "FILM-1908"
