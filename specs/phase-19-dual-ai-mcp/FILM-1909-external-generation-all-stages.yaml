open_questions: []
notes: |
  Order: the single-part stages first (story_refinement, screenplay_refinement,
  asset_description, episode_summary, fact_extraction, publish_metadata,
  season_analysis), then the multi-part ones (screenplay, shots, audio_cues,
  dialogue_translation), then season_outline, whose commit creates episodes.
  Publishing stays a web action in this phase.

  Ideation storage, decided 2026-10-03 (lead): ideas are stored on
  episodes.metadata.ideas in both modes; the ideation stage's commit writes
  them (packages/features/generation/src/stages/ideation.ts:210, FILM-1901
  part B). The open question is closed.

  ## Part 1 (on main, 2026-10-03)

  - Render tools (studio:render): start_voice_render, start_audio_render,
    get_render_status; get_veo_manifest (studio:read). The web's render
    starts moved into packages/features/audio-generation/src/server/render-starts.ts
    so the actions and the tools run the same lines; getProjectTTSModel takes
    the caller's client.
  - Edit tools: built against an injected writer and not in defaultTools
    until the run layer is on main (#567, #574). Phase 2 adds the writer and
    extends kit.generation_commit_allowlist() with the update columns an edit
    writes on shots and dialogue_lines.
  - A scene edit that changes its line count rebuilds the episode's dialogue
    rows as the screenplay commit does, dropping their voice renders and
    translations; the tool says how many.
