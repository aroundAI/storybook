open_questions: []
notes: |
  Order: the single-part stages first (story_refinement, screenplay_refinement,
  asset_description, episode_summary, fact_extraction, publish_metadata,
  season_analysis), then the multi-part ones (screenplay, shots, audio_cues,
  dialogue_translation), then season_outline, whose commit creates episodes.
  Publishing stays a web action in this phase.

  Ideation storage, decided 2026-10-03 (lead): ideas are stored on
  episodes.metadata.ideas in both modes; the ideation stage's commit writes
  them (packages/features/generation/src/stages/ideation.ts:210, FILM-1901
  part B). The open question is closed.

  Decided here, as FILM-1901 part D left it to this spec: the external-mode
  persistence of the episode summary. An external episode_summary run commits as server mode
  does, a review stage that writes nothing; the extraction comes back in the
  finalize reply for the agent to show, and canon changes are written only
  when the user approves them on the web (commitCanonChangesAction).

  A whole episode is more writes than a connection's default minute (20):
  the scripted client waits out RATE_LIMITED with retry_after_s, as an
  agent should.

  The EDD's get_render_status is served as get_render_progress:
  render_status was a column of the retired Edit Suite, and FILM-607's scan
  (apps/web/test/film-607-edit-suite-retired.test.ts) keeps that name out of
  the code.

  ## Part 1 (on main, 2026-10-03)

  - Render tools (studio:render): start_voice_render, start_audio_render,
    get_render_progress; get_veo_manifest (studio:read). The web's render
    starts moved into packages/features/audio-generation/src/server/render-starts.ts
    so the actions and the tools run the same lines; getProjectTTSModel takes
    the caller's client.
  - Edit tools: built against an injected writer, then served once the run
    layer landed (#567, #574) with runLayerEditWriter and the allowlist's
    update columns on shots and dialogue_lines.
  - A scene edit that changes its line count rebuilds the episode's dialogue
    rows as the screenplay commit does, dropping their voice renders and
    translations; the tool says how many.
