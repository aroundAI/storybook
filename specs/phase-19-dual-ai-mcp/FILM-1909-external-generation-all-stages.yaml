spec_id: "FILM-1909"
title: "External Generation for Every Stage, Targeted Edits and Renders"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: feature
status: DONE
effort: L
dependencies:
  - spec_id: "FILM-1908"
    note: "the generic generation tools, proved on story"
summary: >
  Extends FILM-1908 from story to every registered stage, so Claude can run
  the whole workflow: season outline and analysis, ideation, story
  refinement, screenplay (per scene) and its refinement, shots (reel scout plus
  one part per scene), audio cues, dialogue translation, asset descriptions,
  fact extraction, the episode summary and publish metadata. Adds targeted
  edits (one scene, one shot, one dialogue line) and the vendor renders the
  agent can start (ElevenLabs voice, music and SFX) plus the VEO prompt
  manifest for external video tools. Design: the EDD's stage catalogue and
  "3. MCP tool catalogue"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "Every stage in FILM-1901's registry completes over MCP in external mode against a seeded episode, with the web page showing the result and its origin"
    met: true
    evidence: "the scripted SDK client (packages/features/studio-mcp/__tests__/helpers/all-stages-script.ts) drives all fourteen registered stages through FILM-1908's tools against a seeded episode, and every run is external and committed (packages/features/studio-mcp/__tests__/generation-all-stages.contract.test.ts:177, :290; ALL_STAGES compared). The results are where the web reads them (packages/features/studio-mcp/__tests__/generation-all-stages.contract.test.ts:316), and the studio pages show ideation, story, screenplay, shots and audio cues before and after a reload (apps/e2e/tests/mcp/external-all-stages.spec.ts:107, screenshots in the PR). Two gaps found on the way and fixed here: publish_metadata could not be started (its 'publish' target now locks the item's episode, as the web's run does, packages/features/studio-mcp/src/server/tools/generation/target.ts:96; packages/features/studio-mcp/__tests__/tools/publish-target.test.ts; red without it, guard P1), and the ideation page never showed stored ideas (apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/ideation/_components/ideation-screen.tsx:71; the e2e spec red without it, guard X1). The pages show the origin as FILM-1910's \"Claude via MCP\" badge on the story, the screenplay and every shot card (apps/e2e/tests/mcp/external-all-stages.spec.ts:107). An existing cast cannot be linked over MCP (KB-183, filed); the tests link it through the API as the web header does (#584)"
  - text: "Shots: part 'reel_scout' first, then one part per scene ('scene:N'), then finalize; shots are numbered in order across scenes as the Shot Orchestrator numbers them; chained audio_cues opens as an external child run, never a queued job"
    met: true
    evidence: "packages/features/studio-mcp/__tests__/generation-all-stages.contract.test.ts:234: the run's parts are reel_scout then scene:1..N, shot_number runs 1..n across scenes in scene order (buildShotRows, packages/features/generation/src/stages/shots.ts:504), the Reel Scout's flagged scene is the shorts candidate; packages/features/studio-mcp/__tests__/generation-all-stages.contract.test.ts:264: the commit opened an audio_cues run with parent_run_id the shots run, mode external, committed by the client's submissions, and no generation_jobs row exists for the episode (#584)"
  - text: "Screenplay: one part per scene, then finalize; dialogue_lines rebuilt as screenplay-conversion rebuilds them"
    met: true
    evidence: "packages/features/studio-mcp/__tests__/generation-all-stages.contract.test.ts:177 (parts scene-1..N, one scene each, finalize) and :217: the English dialogue_lines are the screenplay's lines in scene order, numbered from 1, speakers mapped to their assets (the commit's rebuild, packages/features/generation/src/stages/screenplay.ts:651) (#584)"
  - text: "Edit tools (studio:write): edit_scene, edit_shot, edit_dialogue_line; each validated with the stage's schema and check(), versioned (target_version) and snapshotted, origin 'external'"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/edit/tools.ts:296, :504, :386 validate the merged scene, shot or line with the stage's own output schema and check(); packages/features/studio-mcp/src/server/tools/edit/writer.ts:38 opens an external run for the stage at the caller's version and applies the plan through apply_generation_commit (one transaction, version re-checked under a lock, content_revisions snapshot). The allowlist gains an update on a shot's and a line's content columns only (apps/web/supabase/migrations/20261003163615_film-1909-edit-commit-allowlist.sql; apps/web/supabase/tests/database/apply-generation-commit-edits.test.sql, 18 assertions, red without the migration). Live: the three edits commit as external runs with a snapshot, and a stale version is TARGET_CHANGED (packages/features/studio-mcp/__tests__/generation-all-stages.contract.test.ts:370); unit: packages/features/studio-mcp/__tests__/tools/edit-tools.test.ts:247-752, every plan allowlisted (:752); guards E1-E7, A1 (#584)"
  - text: "Render tools (studio:render): start_voice_render (queueVoiceJob[s]), start_audio_render (audio-file-generation), get_render_progress; the existing budget and BYOK checks apply; no model call"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/render/starts.ts:130 (start_voice_render), :242 (start_audio_render), status.ts:80 (get_render_progress); the starts are the web's own, moved out of the actions into packages/features/audio-generation/src/server/render-starts.ts:114, :284, :466 and called by the actions and the tools alike with the caller's client (packages/features/studio-mcp/__tests__/tools/render-tools.test.ts:110 pins the identity). The checks are the web's: authorizeEpisodeTarget (KB-31, KB-46, KB-47; guards V3 and V4 re-pointed and red), voice assignment, the estimated cost recorded on batch_generation_jobs, and the account's own ElevenLabs key read by the worker that renders (apps/web/lambda/voice-worker/voice-generation.ts:100, apps/web/lambda/llm-worker/handlers/audio-file-generation.ts:100). The web has no spend budget on these paths today, so none applies over MCP either. No model is called: against a local Supabase and ElasticMQ the SDK client's voice render queues the messages the web queues and the cue render opens and dispatches the same server run, with no llm_usage_analytics row (packages/features/studio-mcp/__tests__/render.contract.test.ts:294, :335, :397); a token without studio:render is FORBIDDEN (:380, red with the scope lowered) (#584)"
  - text: "get_veo_manifest (studio:read) returns the VEO prompts and frame descriptions the openclaw manifest builds today (packages/features/episodes/src/lib/openclaw-manifest.ts)"
    met: true
    evidence: "packages/features/studio-mcp/src/server/tools/render/veo-manifest.ts:38 builds the manifest with buildOpenClawManifest from the shot mapping the episode workspace uses, now one function (packages/features/episodes/src/lib/shot-row.ts:70, which the layout calls); paged by scene, summary over every shot. Equal to the web's manifest for the same rows (packages/features/studio-mcp/__tests__/tools/render-tools.test.ts:448, guard R4); live through the SDK client with VEO prompts, frame descriptions, transitions and reference images (packages/features/studio-mcp/__tests__/render.contract.test.ts:253) (#584)"
  - text: "The FILM-1902 matrix test covers every stage in both modes and passes"
    met: true
    evidence: "packages/features/generation/__tests__/stage-matrix.test.ts:89 and :122: every registered stage, fourteen, runs in server mode through the stubbed writer and in external mode from a submitted fixture, the writer never reached and no llm_usage_analytics write; a stage without a fixture fails the suite. 75 tests pass with the allowlist test, which now reads the newest definition of the allowlist (packages/features/generation/__tests__/commit-allowlist.test.ts) (#584)"
