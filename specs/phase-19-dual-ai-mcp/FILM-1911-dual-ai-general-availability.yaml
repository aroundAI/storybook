spec_id: "FILM-1911"
title: "Dual AI General Availability: docs, dashboards, alerts, no-LLM boot"
phase: 19
phase_name: "Dual AI (Gemini in the app, Claude over MCP)"
category: feature
status: DRAFT
effort: S
