summary: >
  The last step before the connector is offered to users: a docs page with
  the connector URL and a walkthrough, monitoring for the MCP surface, an
  alert that fires if an external run ever records a model call, and proof
  that a deployment with no LLM env vars still serves external mode fully.
  Design: the EDD's "Security, observability and rollout"
  (https://claude.ai/code/artifact/ecf5b05b-019e-4512-abfc-9d6523f0a242).
acceptance_criteria:
  - text: "A user docs page (apps/web/content/documentation) explains adding the connector in Claude, signing in, the scopes, the workflow and revoking access, with screenshots taken from a real run"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Monitoring panels: calls per tool, error rate by code, p95 by tool, runs by mode and status, expired leases per day"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "An alert fires if llm_usage_analytics ever has a row whose run is external (the FILM-1903 trigger should make this impossible; the alert proves it stays so)"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "Boot test: the app with no LLM_* / GEMINI_* / GOOGLE_* model variables starts, serves every MCP tool, and refuses server-mode generation with a clear message"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
  - text: "The MCP connector feature flag is removed; team AI settings (FILM-1910) are the control"
    met: false
    reason: "not met — drafted 2026-10-02, no code yet"
