notes: |
  Decided 2026-10-04 by the owner: ChatGPT's connector support is in scope
  for GA; both ChatGPT and Claude must be able to connect (was this spec's
  open question, "Claude first and other clients as they come?"). Nothing
  client-specific is built: both use the same URL, the same OAuth server
  and the same tools (#599).

  ## Claude and ChatGPT compatibility (checked 2026-10-04)

  Sources, read 2026-10-04: developers.openai.com/apps-sdk/build/auth,
  developers.openai.com/api/docs/guides/developer-mode,
  developers.openai.com/api/docs/mcp, developers.openai.com/plugins/deploy/connect-chatgpt,
  claude.com/docs/connectors/custom/remote-mcp,
  claude.com/docs/connectors/building/authentication, and the two client
  documents themselves.

  | Requirement | Claude | ChatGPT | Our server | Gap |
  |---|---|---|---|---|
  | Transport | Streamable HTTP (SSE deprecated) | Streamable HTTP or SSE | Stateless Streamable HTTP, JSON responses, GET 405 | none |
  | Client registration | CIMD when AS advertises it with `none`, else DCR | CIMD preferred, DCR, or a predefined client | Both | Both clients' real documents were refused; fixed |
  | Client auth | Public (`none`) | `none` or `private_key_jwt`; document prefers the key | `none` only | Accept a client that lists `none`; no key or secret accepted |
  | PKCE | S256 on every request | S256 required in metadata | S256 only | none |
  | Redirect URI | https://claude.ai/api/mcp/auth_callback | https://chatgpt.com/connector_platform_oauth_redirect with RFC 9207, else https://chatgpt.com/connector/oauth/{id} | https anywhere, exact match | none |
  | RFC 9207 iss | not required | Stable redirect only when advertised and returned | absent | Added |
  | resource (RFC 8707) | PRM resource must equal the entered URL | Sent on authorize and token | Checked, token audience-bound | none |
  | Scopes | WWW-Authenticate scope, else PRM scopes_supported; offline_access only if listed | OIDC scopes only if listed; else not documented | studio:* in PRM and AS | none |
  | Refresh tokens | Rotated; invalid_grant on expiry | Expected (document's grant_types) | Rotated, reuse revokes | none |
  | 401 with resource_metadata | Required | Required | Sent | none |
  | Tools | Any | Developer mode: any, writes confirmed; search/fetch only for deep research and company knowledge | Full tool set, no search/fetch | search/fetch not built: deep research over StoryBook is not a use the owner named |
  | Annotations | title + hints decide auto-permission | No readOnlyHint = write, confirmed; openWorldHint expected for apps | Three hints, openWorldHint missing (MCP reads that as true) | Added openWorldHint |
  | Origin / CORS | Calls from Anthropic's cloud | Calls from OpenAI's servers (mTLS client cert offered) | CORS only for allowed origins | Default origins now claude.ai and chatgpt.com |
  | Plans | Free (one connector), Pro, Max, Team, Enterprise | Plus, Pro, Business, Enterprise, Edu, developer mode on the web | n/a | ChatGPT Free cannot connect |
  | Public URL | Required | Required (or OpenAI's tunnel) | n/a | the owner's deployment |

  Claude Code's own document (https://claude.ai/oauth/claude-code-client-metadata)
  registers http://localhost/callback without a port and relies on
  RFC 8252's any-port loopback match, which /oauth/authorize does not do;
  Claude Code was not in scope here, and it can use DCR instead.

  ## Owner steps for the ChatGPT check

  1. Deploy to a public HTTPS URL (NEXT_PUBLIC_SITE_URL set to it).
  2. In ChatGPT on the web (Plus, Pro, Business, Enterprise or Edu; on a
     workspace plan an admin may first have to allow developer mode):
     Settings → Security and login → Developer mode on.
  3. Apps (ChatGPT Plugins in OpenAI's docs) → + → a remote MCP server:
     name StoryBook, the URL `<site>/api/mcp`, authentication OAuth.
  4. ChatGPT opens `<site>/oauth/authorize`: sign in, check the page reads
     "ChatGPT wants to connect to StoryBook", pick the team, Allow. ChatGPT
     lists the tools.
  5. New chat → + → Developer mode → StoryBook; ask it to call whoami.
     Screenshots for apps/web/content/documentation/ai-connector.mdoc's
     three placeholders: the create dialog, the consent page, the whoami
     answer.

  Rollout, each step reversible by its flag: core refactor dark (FILM-1901,
  FILM-1902, FILM-1903); read-only connector with PATs for the owner's team
  (FILM-1904 to FILM-1906); OAuth (FILM-1907); external generation stage by
  stage (FILM-1908, FILM-1909); this spec.
