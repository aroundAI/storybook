  3. **Templates**
     - Save episode as template
     - Load from template
     - Share templates with team

  4. **Keyboard Shortcuts**
     - Ctrl+1/2/3/4 for tab switching
     - Ctrl+S to save draft
     - Ctrl+G to generate

  5. **Export Options**
     - Export screenplay as PDF
     - Export shot list as CSV
     - Export story as Markdown

