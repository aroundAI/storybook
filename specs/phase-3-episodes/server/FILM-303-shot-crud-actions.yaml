notes: |
  ## Source header

  **Status**: 🟡 PARTIAL (audit 2026-09-23; was ✅ DONE)
  **Phase**: 3
  **Priority**: P0
  **Effort**: M (3-5 days)
  **Dependencies**: FILM-101c (shots table), FILM-301 (episode-crud-actions)
  **Blocks**: FILM-307, FILM-311, Phase 4 (Video Generation)

  ## Context

  The system must support creating individual shots, batch creating shots from a shot list, and reordering shots via drag-and-drop. Shots track their generation status, video URLs, and metadata including camera directions, prompts, and character appearances. The system must coordinate with the generation_jobs table for video generation tracking.

  ## Requirements

  ### Functional Requirements

  1. **Create Shot**
     - Accept shot data (episode_id, scene_number, shot_number, description, prompt, duration, metadata)
     - Validate user has write access to project
     - Auto-assign sequence_number based on existing shots
     - Initialize shot in 'pending' status
     - Return created shot with all fields

  2. **Batch Create Shots**
     - Accept array of shot definitions from shot list generation
     - Validate user has write access to project
     - Create all shots in a single transaction
     - Auto-assign sequence_numbers sequentially
     - Return all created shots
     - Roll back all shots if any creation fails

  3. **Reorder Shots**
     - Accept array of shot IDs in new order
     - Validate all shots belong to same episode
     - Update sequence_numbers atomically
     - Prevent gaps in sequence (1, 2, 3, 4...)
     - Return updated shots

  4. **Get Episode Shots**
     - Fetch all shots for an episode
     - Order by sequence_number
     - Include generation job status if present
     - Filter by status (pending, generating, completed, failed)
     - Support pagination

  5. **Update Shot**
     - Accept partial shot updates
     - Update description, prompt, metadata, camera_direction
     - Update video_url and thumbnail_url after generation
     - Validate user has write access
     - Return updated shot

  6. **Delete Shot**
     - Soft delete (set deleted_at timestamp)
     - Validate user has write access
     - Reorder remaining shots to close gap
     - Cancel related generation job if in progress
     - Return success confirmation

  ### Non-Functional Requirements

  - All actions must complete within 3 seconds (except batch operations)
  - Batch create must be atomic (all or nothing)
  - Actions must be idempotent where possible
  - Must enforce RLS policies via Supabase client
  - Must log errors with context for debugging
  - Must validate all inputs with Zod schemas

  ## Interface

  ### TypeScript Types

  ```typescript
  // Zod Schemas
  import { z } from 'zod';

  export const ShotStatusSchema = z.enum([
    'pending',
    'generating',
    'completed',
    'failed'
  ]);

  export const CameraDirectionSchema = z.enum([
    'static',
    'pan_left',
    'pan_right',
    'tilt_up',
    'tilt_down',
    'zoom_in',
    'zoom_out',
    'dolly_in',
    'dolly_out',
    'tracking',
    'crane_up',
    'crane_down'
  ]);

  export const CreateShotSchema = z.object({
    episodeId: z.string().uuid(),
    sceneNumber: z.number().int().positive(),
    shotNumber: z.number().int().positive(),
    description: z.string().min(1).max(1000),
    prompt: z.string().min(1).max(2000),
    durationSeconds: z.number().positive().max(10),
    cameraDirection: CameraDirectionSchema.optional(),
    metadata: z.object({
      characters: z.array(z.string()).optional(),
      location: z.string().optional(),
      timeOfDay: z.enum(['day', 'night', 'dawn', 'dusk']).optional(),
      weather: z.string().optional(),
      mood: z.string().optional(),
    }).optional(),
  });

  export const BatchCreateShotsSchema = z.object({
    episodeId: z.string().uuid(),
    shots: z.array(z.object({
      sceneNumber: z.number().int().positive(),
      shotNumber: z.number().int().positive(),
      description: z.string().min(1).max(1000),
      prompt: z.string().min(1).max(2000),
      durationSeconds: z.number().positive().max(10),
      cameraDirection: CameraDirectionSchema.optional(),
      characters: z.array(z.string()).optional(),
    })),
  });

  export const ReorderShotsSchema = z.object({
    episodeId: z.string().uuid(),
    shotIds: z.array(z.string().uuid()).min(1),
  });

  export const GetEpisodeShotsSchema = z.object({
    episodeId: z.string().uuid(),
    status: ShotStatusSchema.optional(),
    limit: z.number().int().min(1).max(100).default(50),
    offset: z.number().int().min(0).default(0),
  });

  export const UpdateShotSchema = z.object({
    shotId: z.string().uuid(),
    description: z.string().min(1).max(1000).optional(),
    prompt: z.string().min(1).max(2000).optional(),
    durationSeconds: z.number().positive().max(10).optional(),
    cameraDirection: CameraDirectionSchema.optional(),
    status: ShotStatusSchema.optional(),
    videoUrl: z.string().url().optional(),
    thumbnailUrl: z.string().url().optional(),
    metadata: z.record(z.unknown()).optional(),
  });

  export const DeleteShotSchema = z.object({
    shotId: z.string().uuid(),
  });

  // Return Types
  export interface Shot {
    id: string;
    episodeId: string;
    sceneNumber: number;
    shotNumber: number;
    sequenceNumber: number;
    description: string;
    prompt: string;
    durationSeconds: number;
    status: 'pending' | 'generating' | 'completed' | 'failed';
    cameraDirection: string | null;
    videoUrl: string | null;
    thumbnailUrl: string | null;
    generationJobId: string | null;
    metadata: Record<string, unknown>;
    createdAt: string;
    updatedAt: string;
    deletedAt: string | null;
  }

  export interface ShotWithJobStatus extends Shot {
    generationJob: {
      id: string;
      status: string;
      provider: string;
      progress: number;
      errorMessage: string | null;
    } | null;
  }

  export interface GetEpisodeShotsResponse {
    shots: ShotWithJobStatus[];
    total: number;
    hasMore: boolean;
  }

  export interface BatchCreateShotsResponse {
    shots: Shot[];
    count: number;
  }

  export interface ReorderShotsResponse {
    shots: Shot[];
    count: number;
  }

  export interface DeleteShotResponse {
    success: boolean;
    shotId: string;
  }
  ```

  ### Server Actions

  ```typescript
  'use server';

  import { enhanceAction } from '@kit/next/actions';
  import { getSupabaseServerClient } from '@kit/supabase/server-client';
  import {
    CreateShotSchema,
    BatchCreateShotsSchema,
    ReorderShotsSchema,
    GetEpisodeShotsSchema,
    UpdateShotSchema,
    DeleteShotSchema,
  } from '../schemas/shot.schema';

  /**
   * Creates a new shot for an episode
   * @throws {Error} If user lacks project access or validation fails
   */
  export const createShotAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Get next sequence number
      const { data: existingShots } = await client
        .from('shots')
        .select('sequence_number')
        .eq('episode_id', data.episodeId)
        .is('deleted_at', null)
        .order('sequence_number', { ascending: false })
        .limit(1);

      const nextSequenceNumber = (existingShots?.[0]?.sequence_number ?? 0) + 1;

      // Insert shot
      const { data: shot, error } = await client
        .from('shots')
        .insert({
          episode_id: data.episodeId,
          scene_number: data.sceneNumber,
          shot_number: data.shotNumber,
          sequence_number: nextSequenceNumber,
          description: data.description,
          prompt: data.prompt,
          duration_seconds: data.durationSeconds,
          camera_direction: data.cameraDirection ?? null,
          status: 'pending',
          metadata: data.metadata ?? {},
        })
        .select()
        .single();

      if (error) throw error;
      return shot;
    },
    { schema: CreateShotSchema, auth: true }
  );

  /**
   * Creates multiple shots from a shot list in a single transaction
   * @throws {Error} If user lacks access or any shot creation fails
   */
  export const batchCreateShotsAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Verify user has access to episode (RLS will handle this)
      const { data: episode } = await client
        .from('episodes')
        .select('id, project_id')
        .eq('id', data.episodeId)
        .is('deleted_at', null)
        .single();

      if (!episode) {
        throw new Error('Episode not found');
      }

      // Get next sequence number
      const { data: existingShots } = await client
        .from('shots')
        .select('sequence_number')
        .eq('episode_id', data.episodeId)
        .is('deleted_at', null)
        .order('sequence_number', { ascending: false })
        .limit(1);

      let nextSequenceNumber = (existingShots?.[0]?.sequence_number ?? 0) + 1;

      // Prepare batch insert
      const shotsToInsert = data.shots.map((shot, index) => ({
        episode_id: data.episodeId,
        scene_number: shot.sceneNumber,
        shot_number: shot.shotNumber,
        sequence_number: nextSequenceNumber + index,
        description: shot.description,
        prompt: shot.prompt,
        duration_seconds: shot.durationSeconds,
        camera_direction: shot.cameraDirection ?? null,
        status: 'pending',
        metadata: {
          characters: shot.characters ?? [],
        },
      }));

      // Insert all shots atomically
      const { data: shots, error } = await client
        .from('shots')
        .insert(shotsToInsert)
        .select();

      if (error) throw error;

      return {
        shots: shots ?? [],
        count: shots?.length ?? 0,
      };
    },
    { schema: BatchCreateShotsSchema, auth: true }
  );

  /**
   * Reorders shots by updating sequence_numbers
   * @throws {Error} If user lacks access or shots don't belong to same episode
   */
  export const reorderShotsAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Verify all shots belong to the same episode
      const { data: shots, error: fetchError } = await client
        .from('shots')
        .select('id, episode_id')
        .in('id', data.shotIds)
        .is('deleted_at', null);

      if (fetchError) throw fetchError;

      if (!shots || shots.length !== data.shotIds.length) {
        throw new Error('Some shots not found');
      }

      const episodeIds = [...new Set(shots.map(s => s.episode_id))];
      if (episodeIds.length > 1 || episodeIds[0] !== data.episodeId) {
        throw new Error('All shots must belong to the same episode');
      }

      // Update sequence numbers
      const updates = data.shotIds.map((shotId, index) => ({
        id: shotId,
        sequence_number: index + 1,
        updated_at: new Date().toISOString(),
      }));

      // Update each shot (Supabase doesn't support batch updates directly)
      const updatedShots = [];
      for (const update of updates) {
        const { data: shot, error } = await client
          .from('shots')
          .update({
            sequence_number: update.sequence_number,
            updated_at: update.updated_at,
          })
          .eq('id', update.id)
          .select()
          .single();

        if (error) throw error;
        updatedShots.push(shot);
      }

      return {
        shots: updatedShots,
        count: updatedShots.length,
      };
    },
    { schema: ReorderShotsSchema, auth: true }
  );

  /**
   * Fetches all shots for an episode with optional filtering
   * @throws {Error} If user lacks project access
   */
  export const getEpisodeShotsAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Build query
      let query = client
        .from('shots')
        .select(`
          *,
          generation_job:generation_jobs(
            id,
            status,
            provider,
            progress,
            error_message
          )
        `, { count: 'exact' })
        .eq('episode_id', data.episodeId)
        .is('deleted_at', null)
        .order('sequence_number', { ascending: true })
        .range(data.offset, data.offset + data.limit - 1);

      // Apply status filter if provided
      if (data.status) {
        query = query.eq('status', data.status);
      }

      const { data: shots, error, count } = await query;

      if (error) throw error;

      return {
        shots: shots ?? [],
        total: count ?? 0,
        hasMore: (count ?? 0) > data.offset + data.limit,
      };
    },
    { schema: GetEpisodeShotsSchema, auth: true }
  );

  /**
   * Updates an existing shot
   * @throws {Error} If user lacks access or shot not found
   */
  export const updateShotAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Build update object (only include provided fields)
      const updates: Record<string, unknown> = {
        updated_at: new Date().toISOString(),
      };

      if (data.description !== undefined) updates.description = data.description;
      if (data.prompt !== undefined) updates.prompt = data.prompt;
      if (data.durationSeconds !== undefined) {
        updates.duration_seconds = data.durationSeconds;
      }
      if (data.cameraDirection !== undefined) {
        updates.camera_direction = data.cameraDirection;
      }
      if (data.status !== undefined) updates.status = data.status;
      if (data.videoUrl !== undefined) updates.video_url = data.videoUrl;
      if (data.thumbnailUrl !== undefined) {
        updates.thumbnail_url = data.thumbnailUrl;
      }
      if (data.metadata !== undefined) updates.metadata = data.metadata;

      const { data: shot, error } = await client
        .from('shots')
        .update(updates)
        .eq('id', data.shotId)
        .is('deleted_at', null)
        .select()
        .single();

      if (error) throw error;
      if (!shot) throw new Error('Shot not found');

      return shot;
    },
    { schema: UpdateShotSchema, auth: true }
  );

  /**
   * Soft deletes a shot and reorders remaining shots
   * @throws {Error} If user lacks access or shot not found
   */
  export const deleteShotAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Get shot to find its episode and sequence
      const { data: shot, error: fetchError } = await client
        .from('shots')
        .select('episode_id, sequence_number, generation_job_id')
        .eq('id', data.shotId)
        .is('deleted_at', null)
        .single();

      if (fetchError) throw fetchError;
      if (!shot) throw new Error('Shot not found');

      // Cancel generation job if exists and in progress
      if (shot.generation_job_id) {
        const { data: job } = await client
          .from('generation_jobs')
          .select('status')
          .eq('id', shot.generation_job_id)
          .single();

        if (job && ['pending', 'processing'].includes(job.status)) {
          await client
            .from('generation_jobs')
            .update({ status: 'cancelled' })
            .eq('id', shot.generation_job_id);
        }
      }

      // Soft delete shot
      const now = new Date().toISOString();
      const { error: deleteError } = await client
        .from('shots')
        .update({ deleted_at: now })
        .eq('id', data.shotId);

      if (deleteError) throw deleteError;

      // Reorder remaining shots to close gap
      const { data: remainingShots } = await client
        .from('shots')
        .select('id, sequence_number')
        .eq('episode_id', shot.episode_id)
        .gt('sequence_number', shot.sequence_number)
        .is('deleted_at', null)
        .order('sequence_number', { ascending: true });

      if (remainingShots && remainingShots.length > 0) {
        for (const remainingShot of remainingShots) {
          await client
            .from('shots')
            .update({
              sequence_number: remainingShot.sequence_number - 1,
              updated_at: now,
            })
            .eq('id', remainingShot.id);
        }
      }

      return {
        success: true,
        shotId: data.shotId,
      };
    },
    { schema: DeleteShotSchema, auth: true }
  );
  ```

  ## Implementation Details

  ### File Structure

