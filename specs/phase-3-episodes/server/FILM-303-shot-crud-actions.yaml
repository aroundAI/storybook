  ### Sequence Number Management

  Shots are ordered by `sequence_number` (1, 2, 3, 4...):

  1. **Create**: Auto-assign next sequence number
  2. **Batch Create**: Assign sequential numbers starting from next available
  3. **Reorder**: Update all sequence numbers based on new order
  4. **Delete**: Close gap by decrementing all subsequent shots

  ### Camera Directions

  Supported camera directions:
  - `static` - No camera movement
  - `pan_left`, `pan_right` - Horizontal camera rotation
  - `tilt_up`, `tilt_down` - Vertical camera rotation
  - `zoom_in`, `zoom_out` - Change focal length
  - `dolly_in`, `dolly_out` - Physical camera movement forward/backward
  - `tracking` - Follow subject movement
  - `crane_up`, `crane_down` - Vertical camera movement

  ### Shot Status Workflow

  ```
  pending → generating → completed
                      → failed
  ```

  Status transitions:
  - `pending`: Initial state, awaiting generation
  - `generating`: Video generation in progress
  - `completed`: Video generated successfully
  - `failed`: Video generation failed

  ### Error Handling

  | Error Condition | Error Code | User Message | HTTP Status |
  |----------------|------------|--------------|-------------|
  | Invalid UUID | VALIDATION_ERROR | "Invalid shot ID format" | 400 |
  | Shot not found | NOT_FOUND | "Shot not found" | 404 |
  | No project access | FORBIDDEN | "You don't have access to this project" | 403 |
  | Invalid sequence | CONFLICT | "Invalid shot sequence" | 409 |
  | Batch insert failed | TRANSACTION_ERROR | "Failed to create shots" | 500 |
  | Database error | INTERNAL_ERROR | "Failed to perform operation" | 500 |

  ### Validation Rules

  - **description**: 1-1000 characters, required
  - **prompt**: 1-2000 characters, required
  - **durationSeconds**: 0.5-10 seconds (Kling max: 10s)
  - **sceneNumber**: Positive integer, required
  - **shotNumber**: Positive integer, required
  - **episodeId**: Valid UUID, required
  - **cameraDirection**: Valid enum value, optional

