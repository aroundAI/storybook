summary: >
  The Shot Management system provides server-side actions to handle individual video shots within episodes. Shots are the atomic units of content generation - each shot represents a single video clip that will be generated using AI video providers (Kling, Runway, Luma). Shots are ordered by sequence_number and belong to scenes within episodes.
