  ## Security Considerations

  ### Authentication

  - All actions require authenticated user via `auth: true`
  - User identity retrieved from session token
  - No direct user ID parameters accepted

  ### Authorization

  - RLS policies enforce project-level access control
  - Shots inherit access from episodes
  - Write operations require explicit write access

  ### Input Validation

  - All inputs validated with Zod schemas
  - UUID format validated for IDs
  - Prompt length limited to prevent abuse
  - Duration limited to provider maximums

  ### SQL Injection Prevention

  - Supabase client uses parameterized queries
  - No raw SQL string concatenation
  - All inputs properly escaped

  ### Rate Limiting

  Consider adding rate limiting in future iteration:
  - Max 1000 shot creations per hour per user
  - Max 10000 reads per hour per user

  ## Performance Considerations

  ### Database Indexes

  Verify the following indexes exist (from FILM-101c):

  ```sql
  CREATE INDEX idx_shots_episode_sequence ON shots(episode_id, sequence_number)
    WHERE deleted_at IS NULL;

  CREATE INDEX idx_shots_status ON shots(status)
    WHERE deleted_at IS NULL;
  ```

  ### Query Optimization

  - Use batch operations for multiple shots
  - Implement cursor-based pagination for large shot lists
  - Cache shot counts with React Query

  ### Batch Operation Performance

  - Batch create: ~100 shots in <2 seconds
  - Reorder: ~100 shots in <1 second
  - Consider chunking for 500+ shots

  ### Caching Strategy

  ```typescript
  // Client-side React Query cache
  const queryClient = useQueryClient();

  // Cache shots for 30 seconds (frequently updated)
  const { data } = useQuery({
    queryKey: ['shots', episodeId, status],
    queryFn: () => getEpisodeShotsAction({ episodeId, status }),
    staleTime: 30 * 1000,
    refetchInterval: 30 * 1000, // Poll for generation status updates
  });

  // Invalidate cache after mutations
  await createShotAction(data);
  queryClient.invalidateQueries({ queryKey: ['shots', episodeId] });
  ```

