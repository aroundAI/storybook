  ## Security Considerations

  ### Authentication

  - All actions require authenticated user via `auth: true`
  - User identity retrieved from session token
  - No direct user ID parameters accepted

  ### Authorization

  - RLS policies enforce project-level access control
  - Helper functions verify team membership
  - Write operations require explicit write access

  ### Input Validation

  - All inputs validated with Zod schemas
  - UUID format validated for IDs
  - Season number validated as positive integer

  ### SQL Injection Prevention

  - Supabase client uses parameterized queries
  - No raw SQL string concatenation
  - All inputs properly escaped

  ### Rate Limiting

  Consider adding rate limiting in future iteration:
  - Max 50 season creations per hour per user
  - Max 500 reads per hour per user

  ## Performance Considerations

  ### Database Indexes

  Verify the following indexes exist (from FILM-101a):

  ```sql
  CREATE INDEX idx_seasons_project_number ON seasons(project_id, number)
    WHERE deleted_at IS NULL;

  CREATE INDEX idx_seasons_project_id ON seasons(project_id);
  ```

  ### Query Optimization

  - Use aggregation for episode counts
  - Implement caching for season lists
  - Use partial indexes for active seasons only

  ### Caching Strategy

  ```typescript
  // Client-side React Query cache
  const queryClient = useQueryClient();

  // Cache seasons for 5 minutes
  const { data } = useQuery({
    queryKey: ['seasons', projectId],
    queryFn: () => getProjectSeasonsAction({ projectId }),
    staleTime: 5 * 60 * 1000,
  });

  // Invalidate cache after mutations
  await createSeasonAction(data);
  queryClient.invalidateQueries({ queryKey: ['seasons', projectId] });
  ```

