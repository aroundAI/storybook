notes: |
  ## Source header

  **Phase**: 3
  **Priority**: P0
  **Effort**: S (1-2 days)
  **Status**: ✅ Complete
  **Completed**: 2025-12-09
  **Dependencies**: FILM-101a (seasons table), FILM-301 (episode-crud-actions)
  **Blocks**: FILM-308, FILM-312

  ## Context

  Seasons belong to projects and have a simple structure with name, number, and description. The system must support soft deletes to preserve historical data and maintain referential integrity with episodes.

  > **Implementation Note**: The spec originally used `title` but the implementation uses `name` to match the existing database schema.

  ## Requirements

  ### Functional Requirements

  1. **Create Season**
     - Accept season data (project_id, title, number, description)
     - Validate user has write access to project
     - Auto-assign season number if not provided
     - Prevent duplicate season numbers within same project
     - Return created season with all fields

  2. **Get Project Seasons**
     - Fetch all seasons for a project
     - Order by season number
     - Include episode count for each season
     - Include soft delete filtering (exclude deleted_at IS NOT NULL)
     - Return seasons with metadata

  3. **Update Season**
     - Accept partial season updates
     - Validate user has write access
     - Update only provided fields
     - Update updated_at timestamp
     - Return updated season

  4. **Delete Season**
     - Soft delete (set deleted_at timestamp)
     - Validate user has write access
     - Set season_id to NULL for all episodes in season (ON DELETE SET NULL)
     - Return success confirmation

  ### Non-Functional Requirements

  - All actions must complete within 2 seconds
  - Actions must be idempotent where possible
  - Must enforce RLS policies via Supabase client
  - Must log errors with context for debugging
  - Must validate all inputs with Zod schemas

  ## Interface

  ### TypeScript Types

  ```typescript
  // Zod Schemas
  import { z } from 'zod';

  export const CreateSeasonSchema = z.object({
    projectId: z.string().uuid(),
    number: z.number().int().positive().optional(),
    title: z.string().min(1).max(255),
    description: z.string().max(1000).optional(),
  });

  export const GetProjectSeasonsSchema = z.object({
    projectId: z.string().uuid(),
  });

  export const UpdateSeasonSchema = z.object({
    seasonId: z.string().uuid(),
    title: z.string().min(1).max(255).optional(),
    description: z.string().max(1000).optional(),
  });

  export const DeleteSeasonSchema = z.object({
    seasonId: z.string().uuid(),
  });

  // Return Types
  export interface Season {
    id: string;
    projectId: string;
    number: number;
    title: string;
    description: string | null;
    metadata: Record<string, unknown>;
    createdAt: string;
    updatedAt: string;
    deletedAt: string | null;
  }

  export interface SeasonWithEpisodeCount extends Season {
    episodeCount: number;
  }

  export interface GetProjectSeasonsResponse {
    seasons: SeasonWithEpisodeCount[];
  }

  export interface DeleteSeasonResponse {
    success: boolean;
    seasonId: string;
  }
  ```

  ### Server Actions

  ```typescript
  'use server';

  import { enhanceAction } from '@kit/next/actions';
  import { getSupabaseServerClient } from '@kit/supabase/server-client';
  import {
    CreateSeasonSchema,
    GetProjectSeasonsSchema,
    UpdateSeasonSchema,
    DeleteSeasonSchema,
  } from '../schemas/season.schema';

  /**
   * Creates a new season for a project
   * @throws {Error} If user lacks project access or validation fails
   */
  export const createSeasonAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Auto-assign season number if not provided
      let seasonNumber = data.number;
      if (!seasonNumber) {
        const { data: existingSeasons } = await client
          .from('seasons')
          .select('number')
          .eq('project_id', data.projectId)
          .is('deleted_at', null)
          .order('number', { ascending: false })
          .limit(1);

        seasonNumber = (existingSeasons?.[0]?.number ?? 0) + 1;
      }

      // Check for duplicate season number
      const { data: duplicate } = await client
        .from('seasons')
        .select('id')
        .eq('project_id', data.projectId)
        .eq('number', seasonNumber)
        .is('deleted_at', null)
        .single();

      if (duplicate) {
        throw new Error(
          `Season ${seasonNumber} already exists for this project`
        );
      }

      // Insert season
      const { data: season, error } = await client
        .from('seasons')
        .insert({
          project_id: data.projectId,
          number: seasonNumber,
          title: data.title,
          description: data.description ?? null,
          metadata: {},
        })
        .select()
        .single();

      if (error) throw error;
      return season;
    },
    { schema: CreateSeasonSchema, auth: true }
  );

  /**
   * Fetches all seasons for a project with episode counts
   * @throws {Error} If user lacks project access
   */
  export const getProjectSeasonsAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Fetch seasons with episode counts
      const { data: seasons, error } = await client
        .from('seasons')
        .select(`
          *,
          episodes:episodes(count)
        `)
        .eq('project_id', data.projectId)
        .is('deleted_at', null)
        .order('number', { ascending: true });

      if (error) throw error;

      // Transform response to include episode count
      const seasonsWithCount = (seasons ?? []).map((season) => ({
        ...season,
        episodeCount: season.episodes?.[0]?.count ?? 0,
        episodes: undefined, // Remove nested episodes array
      }));

      return {
        seasons: seasonsWithCount,
      };
    },
    { schema: GetProjectSeasonsSchema, auth: true }
  );

  /**
   * Updates an existing season
   * @throws {Error} If user lacks project access or season not found
   */
  export const updateSeasonAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Build update object (only include provided fields)
      const updates: Record<string, unknown> = {
        updated_at: new Date().toISOString(),
      };

      if (data.title !== undefined) updates.title = data.title;
      if (data.description !== undefined) updates.description = data.description;

      const { data: season, error } = await client
        .from('seasons')
        .update(updates)
        .eq('id', data.seasonId)
        .is('deleted_at', null)
        .select()
        .single();

      if (error) throw error;
      if (!season) throw new Error('Season not found');

      return season;
    },
    { schema: UpdateSeasonSchema, auth: true }
  );

  /**
   * Soft deletes a season (episodes' season_id set to NULL via ON DELETE SET NULL)
   * @throws {Error} If user lacks access or season not found
   */
  export const deleteSeasonAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();

      // Soft delete season
      const { error } = await client
        .from('seasons')
        .update({ deleted_at: new Date().toISOString() })
        .eq('id', data.seasonId)
        .is('deleted_at', null);

      if (error) throw error;

      // Note: Episodes' season_id will be set to NULL automatically via
      // ON DELETE SET NULL foreign key constraint (when season is hard deleted)
      // For soft delete, we manually update episodes
      const { error: episodesError } = await client
        .from('episodes')
        .update({ season_id: null })
        .eq('season_id', data.seasonId)
        .is('deleted_at', null);

      if (episodesError) throw episodesError;

      return {
        success: true,
        seasonId: data.seasonId,
      };
    },
    { schema: DeleteSeasonSchema, auth: true }
  );
  ```

  ## Implementation Details

  ### File Structure

  ```
  packages/features/episodes/src/
  ├── lib/
  │   ├── schemas/
  │   │   └── season.schema.ts          # Zod schemas (CREATE THIS)
  │   └── server/
  │       ├── mutations/
  │       │   └── season-actions.ts      # CRUD actions (CREATE THIS)
  │       └── queries/
  │           └── season-queries.ts      # Read-only queries (CREATE THIS)
  └── types/
      └── season.types.ts                # TypeScript interfaces (CREATE THIS)
  ```

  ### Database Queries

  **Create Season**:
  ```sql
  -- Check for duplicate
  SELECT id FROM seasons
  WHERE project_id = $1 AND number = $2 AND deleted_at IS NULL;

  -- Insert season
  INSERT INTO seasons (project_id, number, title, description, metadata)
  VALUES ($1, $2, $3, $4, '{}')
  RETURNING *;
  ```

  **Get Project Seasons**:
  ```sql
  SELECT
    s.*,
    COUNT(e.id) FILTER (WHERE e.deleted_at IS NULL) as episode_count
  FROM seasons s
  LEFT JOIN episodes e ON s.id = e.season_id
  WHERE s.project_id = $1 AND s.deleted_at IS NULL
  GROUP BY s.id
  ORDER BY s.number ASC;
  ```

  **Update Season**:
  ```sql
  UPDATE seasons
  SET
    title = COALESCE($2, title),
    description = COALESCE($3, description),
    updated_at = NOW()
  WHERE id = $1 AND deleted_at IS NULL
  RETURNING *;
  ```

  **Delete Season** (Soft Delete):
  ```sql
  -- Soft delete season
  UPDATE seasons
  SET deleted_at = NOW()
  WHERE id = $1 AND deleted_at IS NULL;

  -- Set episodes' season_id to NULL
  UPDATE episodes
  SET season_id = NULL
  WHERE season_id = $1 AND deleted_at IS NULL;
  ```

  ### RLS Policy Verification

  The following RLS policies must exist on the `seasons` table (from FILM-101a):

  ```sql
  -- Users can view seasons for projects they have access to
  CREATE POLICY "Users can view project seasons"
  ON seasons FOR SELECT
  TO authenticated
  USING (user_has_project_access(project_id));

  -- Users can create seasons for projects they have write access
  CREATE POLICY "Users can create project seasons"
  ON seasons FOR INSERT
  TO authenticated
  WITH CHECK (user_has_project_write_access(project_id));

  -- Users can update seasons for projects they have write access
  CREATE POLICY "Users can update project seasons"
  ON seasons FOR UPDATE
  TO authenticated
  USING (user_has_project_write_access(project_id));

  -- Users can delete seasons for projects they have write access
  CREATE POLICY "Users can delete project seasons"
  ON seasons FOR DELETE
  TO authenticated
  USING (user_has_project_write_access(project_id));
  ```

  ### Error Handling

  | Error Condition | Error Code | User Message | HTTP Status |
  |----------------|------------|--------------|-------------|
  | Invalid UUID | VALIDATION_ERROR | "Invalid season ID format" | 400 |
  | Season not found | NOT_FOUND | "Season not found" | 404 |
  | No project access | FORBIDDEN | "You don't have access to this project" | 403 |
  | Duplicate season number | CONFLICT | "Season number already exists" | 409 |
  | Database error | INTERNAL_ERROR | "Failed to perform operation" | 500 |

  ### Validation Rules

  - **title**: 1-255 characters, required
  - **description**: Max 1000 characters, optional
  - **number**: Positive integer, auto-assigned if not provided
  - **projectId**: Valid UUID, required

