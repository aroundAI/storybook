notes: |
  Delivered in #262 (the surfaces, and the getSubscriberSeriesAction
  cross-account scoping fix it needed first).

  ## 1. Overview

  FILM-1607 built the absolute subscriber series — daily snapshots into
  `channel_subscribers`, the anchor and delta queries, the pure
  `reconstructSeries` reconstruction, and `getSubscriberSeriesAction`. It
  deliberately shipped with **no surface**, deferring every presentation
  decision to this spec (FILM-1607 §7) and leaving one acceptance criterion
  unchecked (`FILM-1607:423`).

  So three things are true at once today:

  - A correct, dated, per-channel subscriber curve is computed and shown to
    nobody.
  - `YppProgressCard` renders `netSubscribers` under the label
    **"Subscribers"** — a 365-day *net movement*, not a subscriber count. The
    action's own comment flags it — *"Net movement, not an absolute count —
    the absolute figure needs the channel snapshot introduced in FILM-1607"*
    (`deep-dive-actions.ts:306-307`).
    A channel with 40,000 subscribers that grew by 900 this year reads as
    900.
  - The Publish Hub follower badge reads
    `platform_connections.metadata.followers_count`
    (`connection-actions.ts:320`) — a value written **only** by the Meta
    callback (`api/platforms/callback/meta/route.ts:253`). PR #241 fixed the
    key from singular to plural, which made it work for Instagram and changed
    nothing for YouTube or TikTok, where nothing writes it at all. The badge's
    `!= null && > 0` guard hides the absence silently.

  This spec gives the series a surface and re-points both misleading numbers
  at it.

  ## 2. Never Sum Without a Level for Every Channel

  `getSubscriberSeriesAction` returns one series **per connection** and does
  not sum them (`subscriber-series-actions.ts:103-106`). That is not an
  oversight to correct here; it is a constraint to honour.

  Connections are made at different times, so their first anchors land on
  different dates. A naive sum steps up by an entire channel's level on the
  day that channel's first snapshot arrives — indistinguishable from real
  growth — and reads as a crash on every day before it, where one channel's
  series has not started.

  A summed view is permitted, and only under one rule: **emit a summed day
  only where every in-scope connection has a level for that day.** The summed
  series therefore starts at the latest first-anchor across the selection and
  must say so on screen, rather than drawing a shorter line without
  explanation. Where the selection is a single channel, this collapses to
  that channel's own series and the rule costs nothing.

  ### 2.1 Settled in review: a total per platform, over active channels

  A channel is one `platform_connections` row — a YouTube channel, a TikTok
  account, an Instagram account, with per-language channels as separate rows.
  The first implementation summed all of them, so a YouTube subscriber and a
  TikTok follower were added together and one person on both was counted
  twice. The Total view now shows **one line per platform**, over that
  platform's **active** channels:

  - A disconnected channel is never snapshotted again. With no level it
    blocked the total for good; with an old one it added a figure nothing
    measures. It is left out, and the note names it. Its own line stays in the
    per-channel view.
  - Every series ends at its newest anchor or delta. `reconstructSeries`
    carries a level forward over days with no delta, so a line read to today
    ran flat past its data — for a disconnected channel, flat for months,
    labelled as reconstructed from movement nobody measured.
  - Where a platform sums more than one channel, the note says a person
    subscribed to several is counted once for each.
  - The card waits for the channel list, which names its lines and groups its
    totals. A failed list shows the card's error state, not unnamed lines and
    an empty total.
  - Channels that all have data but share no day — capture for one ended
    before another's began — say exactly that, rather than that no channel
    publishes here.

  ## 3. Disclose the Seed, Not Just the Curve

  Each point carries a `SubscriberSource` (`lib/subscriber-series.ts:31`):
  `snapshot`, `interpolated`, `constrained` or `clamped`. These are not
  debugging fields — they are the difference between a measured level and a
  reconstructed one, and the UI must distinguish them:

  - `snapshot`, `constrained` and `clamped` days are **measured**: each has a
    snapshot that day. `constrained` and `clamped` are rounded snapshots — the
    first kept at the delta-derived figure inside the platform's band, the
    second held to the band's edge — which is every YouTube snapshot above
    1,000.
  - `interpolated` days are **reconstructed** from deltas alone, with no
    snapshot that day. They are the least measured of the four, and a total
    containing one is reconstructed too (`weakestSource`).

  > **Corrected in review.** This list first called `constrained` days
  > reconstructed and `clamped` the least trustworthy. That misreads
  > `reconstructSeries`, which sets both only on days with an anchor; the
  > ranking built on the misreading drew capture gaps in totals as measured.
  > The definition now lives once, as `isMeasuredSource`.

  > **Corrected in review: the error runs both ways.** The seed pins to the
  > band floor, so the first stretch can only read low — but a later anchor can
  > clamp a level to the band's top, or leave it anywhere inside, and then it
  > reads high. Every surface says "off by up to N either way", and a total's
  > bound is the sum of its channels'.

  > **Every reader seeds from the same snapshot.** `reconstructSeries` seeds
  > from the earliest anchor it is given, and the readers once fetched
  > different windows — the curve reached a year further back than the YPP card
  > and the follower chip — so a rounded channel was seeded at different points
  > in its band and the figures disagreed. Every read now seeds from the
  > channel's earliest snapshot ever recorded, so the three agree and none
  > shifts overnight as old snapshots age out. The delta read spans the whole
  > capture history as a result; a stored level per connection is the remedy
  > if that grows costly, not a shorter window.

  ### 3.1 Marking sources when snapshots are daily

  The capture cron runs daily, so almost every day has an anchor. A marker
  per measured day — the first design — put up to 365 on each line and buried
  it. Only the exceptions are marked now: the line is **solid** through
  measured days and **dashed** where a day was reconstructed from movement
  alone (a capture gap), and a **square** marks a day held to the edge of the
  platform's rounded band. The tooltip still names each day's source.

  A channel whose data ended before the window has no points in it but is
  not "no count yet": each series carries its `lastDataDate`, and the card
  and the total note say "no data since {date}" for it.

  **The rounded-seed bias must be disclosed wherever the number is shown** —
  this is FILM-1607's one unchecked acceptance criterion, deferred here
  because this spec owns every surface that shows the number. The YouTube
  Data API rounds `subscriberCount` to three significant figures above 1,000
  (exact below), which `roundingStep` records per anchor. A curve seeded from
  a rounded anchor carries that rounding as a constant offset through every
  reconstructed day: a channel reported as 40,000 may be anywhere in a
  500-wide band, and the *shape* of the curve is right while its *height* is
  approximate.

  Two related caveats already recorded in FILM-1607 belong on screen for the
  same reason: the series cannot predate the first snapshot for days with no
  deltas, and a hidden subscriber count yields no level at all.

  > **Corrected during implementation.** This section said a hidden count
  > "returns 0 by design". It does not: `captureSubscriberSnapshots` skips a
  > hidden count (`subscriber-snapshot.ts:152`) and writes no anchor, so the
  > series comes back empty. The data therefore cannot tell *hidden* from *not
  > captured yet*, and every surface says both.

  ### 3.2 States and surfaces — the regression guard

  Seven review rounds found issues one channel state at a time, and one fix
  broke a state its bug report never mentioned. Every state below now runs
  through every surface in three scenario matrices, from one fixture set
  (`@kit/clickhouse/testing`) and the same pure builders the readers use:
  `packages/clickhouse/__tests__/subscriber-scenarios.test.ts`,
  `packages/features/content-analytics/__tests__/subscriber-scenarios.test.tsx`
  and `packages/features/publishing/__tests__/follower-scenarios.test.ts`.
  A change to any surface must keep every row.

  | State | Curve | Channel without a line | Total | YPP row | Follower chip |
  |---|---|---|---|---|---|
  | Never measured | none | "No subscriber count yet…" | blocks, named | Unavailable | hidden |
  | Hidden count (movement, no snapshot) | none | "No subscriber count yet…" | blocks, named | Unavailable | hidden |
  | Untracked platform (Facebook, X, LinkedIn) | none | "…aren't tracked for Facebook, X or LinkedIn channels: {names}." | not offered | — | hidden |
  | One snapshot, yesterday | a dot | — | from that day | as of, measured | plain |
  | Healthy, rounded | solid | — | counted; ± summed | as of, rounded, ± | plain, ± in tooltip |
  | Healthy, exact | solid | — | counted | as of, measured | plain |
  | Capture gap | solid, dashed across the gap | — | counted | as of | plain |
  | Active, capture stopped in window | ends at last data | — | ends early, "It ends … the last day {name} has data" | "No newer data since…" | dated, dimmed |
  | Active, stopped before window | none | "No data since … — its capture may have stopped." | blocks, named with the date | "No newer data since…" | dated, dimmed |
  | Disconnected, history in window | its own line | — | left out, named | — | dated, dimmed |
  | Disconnected, history before window | none | "No data since…" | left out, named | — | dated, dimmed |
  | Disconnected, never measured | none | "No subscriber count yet…" | left out, named | — | hidden |

  Invariants checked for every state: no count is ever shown as 0; the curve's
  last point equals the latest level; nothing is drawn after the newest
  measurement; every line with points is visible; each source is described by
  one label (`SUBSCRIBER_SOURCE_LABEL` in `@kit/clickhouse`) on every surface;
  one freshness rule (`isLevelOutdated`) serves the YPP row and the chip; a
  failed level read costs the YPP card only its subscriber row.

  **Shared definitions and their consumers.** Each rule below is written
  once, in `@kit/clickhouse`'s `lib/subscriber-vocabulary.ts`.
  `subscriber-single-definitions.test.ts` fails the build on a local copy of
  the first three. **When a definition changes, re-check every consumer
  listed, and add any new consumer to this table.** Round eight's bug was a
  fourth copy of "measured" that a redefinition updated three of four times.

  | Definition | Consumers |
  |---|---|
  | `isMeasuredSource` | chart solid/dashed and isolated marks (`subscriber-chart-data.ts`), follower source (`follower-counts.ts`) |
  | `weakestSource` | a total's day (`subscriber-series-sum.ts`) |
  | `roundingErrorOf` | card and total notes, YPP row (`subscriber-disclosure.ts`), follower tooltip (`follower-count.ts`), total error (`subscriber-series-sum.ts`) |
  | `SUBSCRIBER_SOURCE_LABEL` | chart tooltip, YPP row, follower tooltip |
  | `isLevelOutdated` | YPP row, follower chip |
  | `isSubscriberTracked` / `SUBSCRIBER_TRACKED_PLATFORMS` | snapshot capture, `channelStatus`, `sumByPlatform` |
  | `channelStatus` | empty state, channel list, total note |
  | earliest-anchor seed | `readInputs` for both readers (`subscriber-levels.ts`) |

  `subscriber-total-pairs.test.ts` runs every pair of the twelve states
  through the total, because the total's bugs live in combinations. And
  `packages/clickhouse/__tests__/subscriber-vocabulary.test.ts` checks the
  rules themselves exhaustively — all four sources, all sixteen pairs —
  because fixtures cannot reach every combination: a ranking that put
  `clamped` below `interpolated` passed all 78 fixture pairs.

  **Known limit, by design:** an active channel with no level — never
  measured, a hidden count, or a capture that stopped before the window —
  blocks its platform's total, and the note names it. Leaving it out instead
  would let the total jump by its level the day its first snapshot lands,
  which §2 exists to prevent. A hidden-count channel therefore blocks the
  YouTube total for as long as it is connected; whether to offer a partial
  total, labelled as such, is a product decision for a follow-up.

  ## 4. Implementation Map

  | File | Change |
  |------|--------|
  | `packages/features/content-analytics/src/server/subscriber-series-actions.ts` | **Fix a live scoping bug — worse than first described.** The connection query ran on the **admin** client and filtered only on `is_active` plus whatever `accountId`/`connectionId` the caller sent. A `{ projectId }` scope therefore returned every active connection **in every account**, and `{ projectId: mine, accountId: theirs }` passed `assertScopeAccess` (which resolves the project and ignores the extra id) and then read the other account's channels. Nothing called the action before this spec, so it was latent. Now: project scopes resolve through `listProjectChannels`, account scopes filter on the account `assertScopeAccess` *returns*, and the action requires auth. |
  | `packages/features/content-analytics/src/components/deep-dive/subscriber-series-card.tsx` | New. Renders one line per connection by default, with an optional summed view under the §2 rule. Point sources are visually distinguished per §3, and the rounded-seed band is stated, not implied. |
  | `packages/features/content-analytics/src/components/deep-dive/deep-dive-tab.tsx` | Mount the card, using the channel filter FILM-1611 adds — the selection that filters the other cards must filter this one, or the tab shows two different channel scopes at once. |
  | `packages/features/content-analytics/src/server/deep-dive-actions.ts` | `getYppProgressAction` gains an absolute `subscribers` alongside the existing `netSubscribers`, sourced from the latest series level for that connection, plus `subscribersSource` so the card can mark a reconstructed figure. `netSubscribers` stays — it is the correct input to the growth reading and only its *label* was wrong. Delete the stale comment at `:306-307` once it is true. |
  | `packages/features/content-analytics/src/components/deep-dive/ypp-progress-card.tsx` | `YppChannelProgress` gains `subscribers` and `subscribersSource`. The "Subscribers" label moves onto the absolute figure; the net movement is relabelled as movement over the window. |
  | `packages/features/publishing/src/server/connection-actions.ts` | `getConnectedPlatformsAction` (`:273`) and `getConnectionsAction` (`:87-92`) resolve `followerCount` from the latest subscriber level where one exists, falling back to `metadata.followers_count`. Keep the fallback: it is the only figure for any connection without a snapshot, and dropping it would darken the one platform whose badge currently works. (This row originally said Instagram has no `channel_subscribers` row; `captureSubscriberSnapshots` does capture Instagram — the fallback matters for connections not yet snapshotted.) |
  | `packages/features/publishing/src/lib/types.ts` | `followerCount` gains a companion source field (`:52`, `:80`) so the badge can render "as of connection date" for a stale metadata value rather than presenting it as current. |

  ### 4.1 Where the badge actually lives

  The "Publish Hub badge" in this spec is rendered by `PlatformSelector`
  inside `PublishHub` — **a component nothing mounts**. No screen in
  `apps/web` showed a follower count. The dated count is therefore surfaced
  on the real episode publish screen, in `ChannelBadge`
  (`apps/web/.../publish/_components/platform-ui.tsx`): inline on the
  sidebar and upload-dialog chips, and in every chip's tooltip. The wording is
  shared with `PlatformSelector` through `@kit/publishing/lib/follower-count`,
  so the two cannot drift. Deleting the unmounted `PublishHub` is left as a
  follow-up.

  The chip's tooltip carries the rounding disclosure, like every other
  surface showing a count. A rounded snapshot day — `constrained` or
  `clamped`, which is every YouTube snapshot above 1,000 — counts as
  measured; only `interpolated` is labelled reconstructed. The Deep Dive
  total discloses the *sum* of its channels' rounding errors, since each
  channel's level can be off by its own, either way.

  The level read is capped at 2 seconds. It spans each channel's whole
  capture history — every reader seeds from the earliest snapshot, so the
  chip, the YPP card and the curve agree — and joins per-video metrics, so it
  grows with history and the cap will be reached more often over time. These
  pages are about publishing: a slow read takes the same fallback as a failed
  one, the stored count. A stored level per connection is the remedy if the
  cap starts to bite; a shorter window would bring the disagreement back.

  A measured count older than 7 days is marked and dated like a stored one,
  with "no newer data since" in its tooltip: a disconnected channel, or one
  whose capture broke, keeps its last level indefinitely, and its source
  alone does not say it is still true.

  A stored count is dated by the connection's `created_at`. A reconnect
  refreshes the stored count without moving that date, so the label can
  understate freshness but never overstate it — `updated_at` would, because
  every token refresh bumps it.

  ## 5. Why Not Just Write `followers_count` at Snapshot Time

  The smaller change is to have `captureSubscriberSnapshots` also update
  `platform_connections.metadata.followers_count`, leaving the badge's read
  path untouched. It is rejected:

  - `metadata` is a shared jsonb written by six OAuth callbacks. A read-
    modify-write from the snapshot cron races a token refresh or a reconnect
    and can drop `thumbnail_url`, `linked_page_id` or a token expiry — the
    same hazard FILM-1610 §4 avoids for publish notes.
  - It would store a value with no date beside it, recreating exactly the
    "captured once, at a date nobody records, then left to rot" problem
    FILM-1607 §1 exists to end.
  - The badge would show a number with no way to say whether it is measured
    or reconstructed.

  ## 6. Out of Scope

  - **Backfilling history before the first snapshot** — the Data API returns
    current only and the Reporting API gained/lost only. FILM-1607 §1 covers
    what is and is not reconstructible.
  - **Subscriber figures for TikTok and Instagram beyond what already exists**
    — `captureSubscriberSnapshots` covers the three platforms it covers.
  - **Any change to `reconstructSeries`** — it is pure, tested, and correct.
  - **Fixing the short deltas that feed it** — FILM-1618, which this spec
    depends on: surfacing a curve built from systematically short deltas
    publishes a number that drifts from its own anchors.

  ## 7. Acceptance Criteria

  (Moved to the `acceptance_criteria:` key of this file.)

  ## 8. Verification

  ```bash
  pnpm --filter @kit/content-analytics test
  pnpm --filter @kit/clickhouse test
  pnpm --filter @kit/publishing test
  pnpm typecheck && pnpm lint
  ```

  The scoping fix in §4 is Postgres-only and **fully testable now** — assert
  that a project-scoped call returns only that project's connections. Do this
  one first; it is a live tenant-scoping defect and the rest of the spec is
  cosmetic beside it.

  Everything else is gated. `CLICKHOUSE_ENABLED=false`, so
  `querySubscriberAnchors` and `querySubscriberDeltas` return empty,
  `reconstructSeries` produces no points, the card renders its empty state,
  and both badges fall through to the metadata value. A green suite proves
  the fallbacks and the summing rule, not a single subscriber figure.

  ## 9. Risk

  This spec changes a number that is already on screen: the Publish Hub badge
  and the YPP card's "Subscribers". Both are currently wrong — one absent,
  one mislabelled — so the change is a correction, but it will look like a
  regression to anyone who had learned to read the old figure. Say so in the
  PR description rather than letting it be discovered.

  ## 10. Found During Implementation — Not Fixed Here

  - **YPP net movement omits the channel residual.** `netSubscribers` sums
    `video_daily_stats` only, while the subscriber curve's deltas include the
    `channel_daily` residual (FILM-1618). On a channel whose movement is mostly
    residual, the card can show a growing count beside a net movement near 0.
    The progress bar still reads the net figure, by decision, so this is
    worth its own spec.
  - **`PublishHub` is unmounted.** It and its `PlatformSelector` are dead code
    kept type-correct by this spec (§4.1); deleting them is a separate change.
  - **`revenue-chart.tsx` colours with `hsl(var(--chart-1))`**, but `--chart-1`
    is an `oklch(…)` colour under Tailwind 4, which makes that value invalid
    CSS. The subscriber card uses `var(--chart-N)` directly. Not verified in a
    browser here.

  Fixed here because it blocked verification: two `'use server'` modules in
  `@kit/episodes` re-exported types (`export type { … }`), which Turbopack
  rejects ("Only async functions are allowed to be exported"). Every episode
  page, publish included, failed to build under `pnpm dev`. This spec's own
  first draft made the same mistake in `subscriber-series-actions.ts`, where it
  compiled but threw `ReferenceError` on every action call — invisible to
  typecheck and the unit suite, caught only by the browser suite.
