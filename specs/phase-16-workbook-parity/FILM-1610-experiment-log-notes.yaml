summary: >
  FILM-1509 shipped an experiment log that records *what was changed* and
  *what happened overall*. The workbook's Experiment Log asks two further
  questions it cannot answer. **Renamed in review round 5: this is the Change
  log.** It compares the same videos before and after a start date, which
  measures a change made to videos already published (a thumbnail, a title),
  not anything baked into a video. "Experiments", in the sense of styles
  compared across new videos, is FILM-1724. Tables, actions and the route keep
  their `experiment` names; only what a user reads changed.
