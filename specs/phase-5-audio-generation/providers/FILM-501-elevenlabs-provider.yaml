    let provider: ElevenLabsProvider;

    beforeEach(() => {
      vi.clearAllMocks();
      provider = new ElevenLabsProvider({
        apiKey: 'test-api-key',
      });
    });

    describe('generateVoice', () => {
      it('should generate voice audio with valid input', async () => {
        const mockAudioBuffer = Buffer.from('mock-audio-data');
        (global.fetch as any).mockResolvedValueOnce({
          ok: true,
          arrayBuffer: async () => mockAudioBuffer,
        });

        const result = await provider.generateVoice({
          text: 'Hello world',
          voiceId: 'voice-123',
        });

        expect(result.audioBuffer).toBeInstanceOf(Buffer);
        expect(result.characterCount).toBe(11);
        expect(result.format).toBe('mp3_44100_128');
      });

      it('should apply custom voice settings', async () => {
        const mockAudioBuffer = Buffer.from('mock-audio-data');
        (global.fetch as any).mockResolvedValueOnce({
          ok: true,
          arrayBuffer: async () => mockAudioBuffer,
        });

        await provider.generateVoice({
          text: 'Hello',
          voiceId: 'voice-123',
          settings: {
            stability: 0.8,
            similarityBoost: 0.9,
            style: 0.5,
            speed: 1.2,
          },
        });

        const fetchCall = (global.fetch as any).mock.calls[0];
        const body = JSON.parse(fetchCall[1].body);
        expect(body.voice_settings.stability).toBe(0.8);
        expect(body.voice_settings.similarity_boost).toBe(0.9);
      });

      it('should reject text exceeding 5000 characters', async () => {
        const longText = 'a'.repeat(5001);

        await expect(
          provider.generateVoice({
            text: longText,
            voiceId: 'voice-123',
          })
        ).rejects.toThrow('Text exceeds maximum length');
      });

      it('should reject empty text', async () => {
        await expect(
          provider.generateVoice({
            text: '',
            voiceId: 'voice-123',
          })
        ).rejects.toThrow('Text is required');
      });

      it('should calculate cost correctly', async () => {
        const mockAudioBuffer = Buffer.from('mock-audio-data');
        (global.fetch as any).mockResolvedValueOnce({
          ok: true,
          arrayBuffer: async () => mockAudioBuffer,
        });

        const result = await provider.generateVoice({
          text: 'a'.repeat(1500), // 1500 characters
          voiceId: 'voice-123',
        });

        expect(result.cost).toBe(45); // $0.30 * 1.5 = 45 cents
      });

      it('should retry on network failure', async () => {
        (global.fetch as any)
          .mockRejectedValueOnce(new Error('Network error'))
          .mockResolvedValueOnce({
            ok: true,
            arrayBuffer: async () => Buffer.from('mock-audio-data'),
          });

        const result = await provider.generateVoice({
          text: 'Hello',
          voiceId: 'voice-123',
        });

        expect(result).toBeDefined();
        expect((global.fetch as any).mock.calls.length).toBe(2);
      });

      it('should throw after max retries', async () => {
        (global.fetch as any).mockRejectedValue(new Error('Network error'));

        await expect(
          provider.generateVoice({
            text: 'Hello',
            voiceId: 'voice-123',
          })
        ).rejects.toThrow('Network error');

        expect((global.fetch as any).mock.calls.length).toBe(5);
      });
    });

    describe('listVoices', () => {
      it('should return all voices', async () => {
        const mockVoices = {
          voices: [
            {
              voice_id: 'v1',
              name: 'Rachel',
              category: 'premade',
              labels: { gender: 'female', age: 'young', accent: 'american' },
              preview_url: 'https://example.com/preview.mp3',
              available_for_tiers: ['free', 'starter'],
            },
            {
              voice_id: 'v2',
              name: 'Josh',
              category: 'premade',
              labels: { gender: 'male', age: 'middle-aged', accent: 'american' },
              preview_url: 'https://example.com/preview2.mp3',
              available_for_tiers: ['free', 'starter'],
            },
          ],
        };

        (global.fetch as any).mockResolvedValueOnce({
          ok: true,
          json: async () => mockVoices,
        });

        const result = await provider.listVoices();

        expect(result.voices).toHaveLength(2);
        expect(result.total).toBe(2);
        expect(result.voices[0].name).toBe('Rachel');
      });

      it('should filter voices by gender', async () => {
        const mockVoices = {
          voices: [
            {
              voice_id: 'v1',
              name: 'Rachel',
              category: 'premade',
              labels: { gender: 'female' },
              available_for_tiers: [],
            },
            {
              voice_id: 'v2',
              name: 'Josh',
              category: 'premade',
              labels: { gender: 'male' },
              available_for_tiers: [],
            },
          ],
        };

        (global.fetch as any).mockResolvedValueOnce({
          ok: true,
          json: async () => mockVoices,
        });

        const result = await provider.listVoices({ gender: 'female' });

        expect(result.voices).toHaveLength(1);
        expect(result.voices[0].name).toBe('Rachel');
      });
    });

    describe('cloneVoice', () => {
      it('should clone voice with valid audio samples', async () => {
        (global.fetch as any).mockResolvedValueOnce({
          ok: true,
          json: async () => ({ voice_id: 'cloned-123', name: 'My Voice' }),
        });

        const result = await provider.cloneVoice({
          name: 'My Voice',
          audioFiles: [Buffer.from('audio-data')],
        });

        expect(result.voiceId).toBe('cloned-123');
        expect(result.name).toBe('My Voice');
        expect(result.status).toBe('ready');
      });

      it('should reject more than 25 audio files', async () => {
        const audioFiles = Array(26).fill(Buffer.from('audio'));

        await expect(
          provider.cloneVoice({
            name: 'My Voice',
            audioFiles,
          })
        ).rejects.toThrow('Maximum 25 audio files allowed');
      });

      it('should reject empty name', async () => {
        await expect(
          provider.cloneVoice({
            name: '',
            audioFiles: [Buffer.from('audio-data')],
          })
        ).rejects.toThrow('Voice name is required');
      });
    });
  });
