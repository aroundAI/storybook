  ---

  ## Context

  The ElevenLabs provider implements the VoiceGenerationProvider interface to enable text-to-speech synthesis with high-quality, natural-sounding voices. ElevenLabs offers advanced voice cloning, multi-language support, and fine-grained control over voice characteristics through stability, similarity_boost, style, and speed settings.

  This provider serves as the primary voice generation backend for the Film Studio, converting dialogue lines into audio files. It must handle API authentication, rate limiting, error recovery, and cost tracking. The provider should support both pre-made voices and custom voice cloning for character-specific voices.

  ---

  ## Requirements

  ### Functional Requirements

  1. **Voice Generation**
     - Accept text (up to 5000 characters)
     - Accept voice ID from ElevenLabs voice library
     - Apply voice settings (stability, similarity_boost, style, speed)
     - Return audio buffer (MP3, WAV, or PCM format)
     - Track generation cost and duration

  2. **Voice Management**
     - List available voices from ElevenLabs library
     - Filter voices by language, gender, age, accent
     - Support voice preview playback
     - Cache voice list for performance

  3. **Voice Cloning**
     - Accept audio file for voice cloning
     - Create custom voice profile
     - Validate audio quality and duration
     - Return cloned voice ID

  4. **Error Handling**
     - Handle rate limit errors with exponential backoff
     - Retry transient failures (max 5 retries)
     - Validate API key before requests
     - Log all errors with context

  5. **Cost Tracking**
     - Calculate cost based on character count
     - Track monthly usage per account
     - Warn when approaching budget limits
     - Block requests when budget exceeded

  ### Non-Functional Requirements

  - API requests must complete within 30 seconds
  - Support concurrent requests (up to 10 parallel)
  - Must use encrypted API keys from database
  - Must be idempotent (same input = same output)
  - Must log all API calls for debugging

  ---

  ## Interface

  ### TypeScript Types

