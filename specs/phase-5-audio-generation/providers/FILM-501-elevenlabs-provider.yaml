  ### API Integration

  **Base URL**: `https://api.elevenlabs.io/v1`

  **Authentication**: API key via `xi-api-key` header

  **Key Endpoints**:
  - `POST /text-to-speech/{voice_id}` - Generate voice audio
  - `GET /voices` - List available voices
  - `POST /voices/add` - Clone voice from samples
  - `GET /user/subscription` - Get usage stats

  ### Voice Settings Explanation

  | Setting | Range | Default | Effect |
  |---------|-------|---------|--------|
  | **stability** | 0-1 | 0.5 | Higher = more consistent, Lower = more variable |
  | **similarity_boost** | 0-1 | 0.75 | Higher = closer to original voice |
  | **style** | 0-1 | 0 | Exaggeration of speaking style |
  | **speed** | 0.5-2.0 | 1.0 | Playback speed multiplier |
  | **use_speaker_boost** | boolean | true | Enhance clarity |

  ### Output Formats

  | Format | Sample Rate | Bitrate | Use Case |
  |--------|-------------|---------|----------|
  | mp3_44100_128 | 44.1 kHz | 128 kbps | Default, good quality |
  | mp3_44100_192 | 44.1 kHz | 192 kbps | High quality |
  | pcm_16000 | 16 kHz | - | Low bandwidth |
  | pcm_22050 | 22.05 kHz | - | Phone quality |
  | pcm_24000 | 24 kHz | - | Standard quality |
  | pcm_44100 | 44.1 kHz | - | Uncompressed HD |

  ### Error Handling

  | Error Type | Retry | User Message |
  |------------|-------|--------------|
  | Invalid API key | No | "API key is invalid or expired" |
  | Rate limit | Yes (5x) | "Too many requests, please wait" |
  | Quota exceeded | No | "Monthly quota exceeded" |
  | Invalid voice ID | No | "Voice not found" |
  | Text too long | No | "Text exceeds 5000 character limit" |
  | Network timeout | Yes (5x) | "Request timed out, retrying..." |
  | Server error (500) | Yes (5x) | "Service temporarily unavailable" |

  ### Cost Calculation

  ```typescript
  // ElevenLabs pricing tiers
  const COST_PER_1000_CHARS = {
    free: 0,        // 10,000 chars/month
    starter: 30,    // $0.30 per 1000 chars
    creator: 24,    // $0.24 per 1000 chars (bulk discount)
    pro: 18,        // $0.18 per 1000 chars (bulk discount)
  };

  function calculateCost(characterCount: number, tier: string = 'starter'): number {
    const costPer1000 = COST_PER_1000_CHARS[tier];
    return Math.ceil((characterCount / 1000) * costPer1000);
  }
  ```

