  ## Security Considerations

  ### API Key Management

  - API keys stored encrypted in `external_api_keys` table
  - Keys decrypted only in server context
  - Never expose keys in client-side code or logs
  - Rotate keys periodically

  ### Input Validation

  - Sanitize text input to prevent injection attacks
  - Validate voice IDs match UUID format
  - Limit file sizes for voice cloning (max 10MB per file)
  - Validate audio file formats (MP3, WAV only)

  ### Rate Limiting

  - Track requests per account per hour
  - Implement exponential backoff for retries
  - Respect ElevenLabs rate limits:
    - Free tier: 10 requests/minute
    - Paid tiers: Higher limits based on plan

  ### Cost Protection

  - Estimate cost before generation
  - Block if exceeds account budget
  - Alert at 80% budget threshold
  - Log all costs for auditing

