  // Provider Configuration
  export interface ElevenLabsConfig {
    apiKey: string;
    baseUrl?: string;
    timeout?: number;
    maxRetries?: number;
  }

  // Voice Generation
  export interface GenerateVoiceParams {
    text: string;
    voiceId: string;
    settings?: VoiceSettings;
    modelId?: string;
    outputFormat?: 'mp3_44100_128' | 'pcm_16000' | 'pcm_22050' | 'pcm_24000' | 'pcm_44100';
  }

  export interface VoiceSettings {
    stability: number;          // 0-1, default 0.5
    similarityBoost: number;    // 0-1, default 0.75
    style?: number;             // 0-1, default 0
    speed?: number;             // 0.5-2.0, default 1.0
    useSpeakerBoost?: boolean;  // default true
  }

  export interface GenerateVoiceResult {
    audioBuffer: Buffer;
    format: string;
    duration: number;
    size: number;
    cost: number;
    characterCount: number;
    metadata: {
      voiceId: string;
      modelId: string;
      settings: VoiceSettings;
      requestId: string;
    };
  }

  // Voice Library
  export interface ElevenLabsVoice {
    voiceId: string;
    name: string;
    category: 'premade' | 'cloned' | 'professional';
    description?: string;
    labels: {
      accent?: string;
      age?: string;
      gender?: string;
      useCase?: string;
    };
    previewUrl?: string;
    availableForTiers: string[];
    settings?: VoiceSettings;
  }

  export interface ListVoicesParams {
    language?: string;
    gender?: string;
    age?: string;
    accent?: string;
  }

  export interface ListVoicesResult {
    voices: ElevenLabsVoice[];
    total: number;
  }

  // Voice Cloning
  export interface CloneVoiceParams {
    name: string;
    description?: string;
    audioFiles: Buffer[];
    labels?: Record<string, string>;
  }

  export interface CloneVoiceResult {
    voiceId: string;
    name: string;
    status: 'processing' | 'ready' | 'failed';
  }

  // API Response Types
  interface ElevenLabsVoiceResponse {
    voice_id: string;
    name: string;
    category: string;
    description?: string;
    labels: Record<string, string>;
    preview_url?: string;
    available_for_tiers: string[];
    settings?: {
      stability: number;
      similarity_boost: number;
      style?: number;
      use_speaker_boost?: boolean;
    };
  }

  interface ElevenLabsErrorResponse {
    detail: {
      status: string;
      message: string;
    };
  }
