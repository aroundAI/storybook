  ### Provider Implementation

  ```typescript
  'use server';

  import { BaseVoiceGenerationProvider } from '@kit/audio-generation/providers';
  import type {
    GenerateVoiceParams,
    GenerateVoiceResult,
    ListVoicesParams,
    ListVoicesResult,
    CloneVoiceParams,
    CloneVoiceResult,
    ElevenLabsConfig,
    VoiceSettings,
    ElevenLabsVoice,
  } from './types';

  export class ElevenLabsProvider extends BaseVoiceGenerationProvider {
    readonly name = 'elevenlabs';
    readonly supportedLanguages = [
      'en', 'es', 'fr', 'de', 'it', 'pt', 'pl', 'hi', 'ja', 'ko', 'zh',
      'nl', 'tr', 'sv', 'id', 'ms', 'ru', 'ar', 'cs', 'da', 'fi',
    ];

    private readonly config: ElevenLabsConfig;
    private readonly baseUrl: string;
    private readonly defaultSettings: VoiceSettings;

    constructor(config: ElevenLabsConfig) {
      super();
      this.config = config;
      this.baseUrl = config.baseUrl ?? 'https://api.elevenlabs.io/v1';
      this.defaultSettings = {
        stability: 0.5,
        similarityBoost: 0.75,
        style: 0,
        speed: 1.0,
        useSpeakerBoost: true,
      };
    }

    /**
     * Generate voice audio from text
     * @throws {Error} If API request fails or validation fails
     */
    async generateVoice(params: GenerateVoiceParams): Promise<GenerateVoiceResult> {
      this.validateRequest(params);

      const settings = { ...this.defaultSettings, ...params.settings };
      const startTime = Date.now();

      try {
        const response = await this.makeRequest<ArrayBuffer>(
          `/text-to-speech/${params.voiceId}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'xi-api-key': this.config.apiKey,
            },
            body: JSON.stringify({
              text: params.text,
              model_id: params.modelId ?? 'eleven_monolingual_v1',
              voice_settings: {
                stability: settings.stability,
                similarity_boost: settings.similarityBoost,
                style: settings.style,
                use_speaker_boost: settings.useSpeakerBoost,
              },
              output_format: params.outputFormat ?? 'mp3_44100_128',
            }),
          },
          true // binary response
        );

        const audioBuffer = Buffer.from(response);
        const duration = await this.getAudioDuration(audioBuffer);
        const cost = this.calculateCost(params.text.length);

        return {
          audioBuffer,
          format: params.outputFormat ?? 'mp3_44100_128',
          duration,
          size: audioBuffer.length,
          cost,
          characterCount: params.text.length,
          metadata: {
            voiceId: params.voiceId,
            modelId: params.modelId ?? 'eleven_monolingual_v1',
            settings,
            requestId: `el_${Date.now()}`,
          },
        };
      } catch (error) {
        throw this.handleError(error, 'generateVoice');
      }
    }

    /**
     * List available voices from ElevenLabs
     * @throws {Error} If API request fails
     */
    async listVoices(params?: ListVoicesParams): Promise<ListVoicesResult> {
      try {
        const response = await this.makeRequest<{ voices: ElevenLabsVoiceResponse[] }>(
          '/voices',
          {
            method: 'GET',
            headers: {
              'xi-api-key': this.config.apiKey,
            },
          }
        );

        let voices = response.voices.map(this.mapVoice);

        // Apply filters
        if (params?.language) {
          voices = voices.filter(v => v.labels.accent?.includes(params.language!));
        }
        if (params?.gender) {
          voices = voices.filter(v => v.labels.gender === params.gender);
        }
        if (params?.age) {
          voices = voices.filter(v => v.labels.age === params.age);
        }
        if (params?.accent) {
          voices = voices.filter(v => v.labels.accent === params.accent);
        }

        return {
          voices,
          total: voices.length,
        };
      } catch (error) {
        throw this.handleError(error, 'listVoices');
      }
    }

    /**
     * Clone a voice from audio samples
     * @throws {Error} If API request fails or validation fails
     */
    async cloneVoice(params: CloneVoiceParams): Promise<CloneVoiceResult> {
      this.validateCloneRequest(params);

      try {
        const formData = new FormData();
        formData.append('name', params.name);
        if (params.description) {
          formData.append('description', params.description);
        }
        if (params.labels) {
          formData.append('labels', JSON.stringify(params.labels));
        }

        // Add audio files
        params.audioFiles.forEach((buffer, index) => {
          formData.append('files', new Blob([buffer]), `sample_${index}.mp3`);
        });

        const response = await this.makeRequest<{ voice_id: string; name: string }>(
          '/voices/add',
          {
            method: 'POST',
            headers: {
              'xi-api-key': this.config.apiKey,
            },
            body: formData,
          }
        );

        return {
          voiceId: response.voice_id,
          name: response.name,
          status: 'ready',
        };
      } catch (error) {
        throw this.handleError(error, 'cloneVoice');
      }
    }

    /**
     * Make HTTP request to ElevenLabs API with retry logic
     */
    private async makeRequest<T>(
      endpoint: string,
      options: RequestInit,
      binary: boolean = false
    ): Promise<T> {
      const url = `${this.baseUrl}${endpoint}`;
      const maxRetries = this.config.maxRetries ?? 5;
      let lastError: Error;

      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const response = await fetch(url, {
            ...options,
            signal: AbortSignal.timeout(this.config.timeout ?? 30000),
          });

          if (!response.ok) {
            const errorData = await response.json() as ElevenLabsErrorResponse;
            throw new Error(
              `ElevenLabs API error: ${errorData.detail?.message ?? response.statusText}`
            );
          }

          if (binary) {
            return (await response.arrayBuffer()) as T;
          }

          return (await response.json()) as T;
        } catch (error) {
          lastError = error as Error;

          // Don't retry on validation errors
          if (error instanceof Error && error.message.includes('validation')) {
            throw error;
          }

          // Exponential backoff
          if (attempt < maxRetries - 1) {
            const delay = Math.min(1000 * Math.pow(2, attempt), 10000);
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
      }

      throw lastError!;
    }

    /**
     * Validate voice generation request
     */
    private validateRequest(params: GenerateVoiceParams): void {
      if (!params.text || params.text.trim().length === 0) {
        throw new Error('Text is required');
      }

      if (params.text.length > 5000) {
        throw new Error('Text exceeds maximum length of 5000 characters');
      }

      if (!params.voiceId) {
        throw new Error('Voice ID is required');
      }

      if (params.settings) {
        if (params.settings.stability < 0 || params.settings.stability > 1) {
          throw new Error('Stability must be between 0 and 1');
        }
        if (params.settings.similarityBoost < 0 || params.settings.similarityBoost > 1) {
          throw new Error('Similarity boost must be between 0 and 1');
        }
        if (params.settings.style !== undefined && (params.settings.style < 0 || params.settings.style > 1)) {
          throw new Error('Style must be between 0 and 1');
        }
        if (params.settings.speed !== undefined && (params.settings.speed < 0.5 || params.settings.speed > 2.0)) {
          throw new Error('Speed must be between 0.5 and 2.0');
        }
      }
    }

    /**
     * Validate voice cloning request
     */
    private validateCloneRequest(params: CloneVoiceParams): void {
      if (!params.name || params.name.trim().length === 0) {
        throw new Error('Voice name is required');
      }

      if (!params.audioFiles || params.audioFiles.length === 0) {
        throw new Error('At least one audio file is required');
      }

      if (params.audioFiles.length > 25) {
        throw new Error('Maximum 25 audio files allowed');
      }
    }

    /**
     * Map ElevenLabs API response to our Voice type
     */
    private mapVoice(voice: ElevenLabsVoiceResponse): ElevenLabsVoice {
      return {
        voiceId: voice.voice_id,
        name: voice.name,
        category: voice.category as 'premade' | 'cloned' | 'professional',
        description: voice.description,
        labels: {
          accent: voice.labels.accent,
          age: voice.labels.age,
          gender: voice.labels.gender,
          useCase: voice.labels['use case'],
        },
        previewUrl: voice.preview_url,
        availableForTiers: voice.available_for_tiers,
        settings: voice.settings ? {
          stability: voice.settings.stability,
          similarityBoost: voice.settings.similarity_boost,
          style: voice.settings.style,
          useSpeakerBoost: voice.settings.use_speaker_boost,
        } : undefined,
      };
    }

    /**
     * Calculate cost based on character count
     * ElevenLabs pricing: $0.30 per 1000 characters
     */
    private calculateCost(characterCount: number): number {
      return Math.ceil((characterCount / 1000) * 30); // cost in cents
    }

    /**
     * Get audio duration from buffer (simplified)
     */
    private async getAudioDuration(buffer: Buffer): Promise<number> {
      // This is a simplified implementation
      // In production, use a library like 'music-metadata' to parse audio files
      // For now, estimate based on file size and format
      const estimatedDuration = Math.ceil(buffer.length / 16000); // rough estimate
      return estimatedDuration;
    }

    /**
     * Handle and format errors
     */
    private handleError(error: unknown, operation: string): Error {
      if (error instanceof Error) {
        return new Error(`ElevenLabs ${operation} failed: ${error.message}`);
      }
      return new Error(`ElevenLabs ${operation} failed: Unknown error`);
    }
  }
  ```

