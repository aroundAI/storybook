  ### Manual Testing

  1. **Voice Generation**
     - Add ElevenLabs API key via Settings > API Keys
     - Configure project audio settings with TTS model
     - Verify audio file is generated
     - Play audio to verify quality

  2. **Voice List**
     - Call `listVoices()` with no filters
     - Verify all voices returned
     - Apply gender filter, verify results
     - Check preview URLs are valid

  3. **Voice Settings**
     - Generate audio with stability=0.2 (variable)
     - Generate audio with stability=0.9 (consistent)
     - Compare consistency of output
     - Test speed settings (0.5x, 1.0x, 2.0x)

  4. **Error Handling**
     - Use invalid API key, verify error message
     - Use invalid voice ID, verify error
     - Exceed character limit, verify rejection
     - Test network timeout handling

