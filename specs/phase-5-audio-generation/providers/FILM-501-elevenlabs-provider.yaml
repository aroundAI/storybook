  ## Performance Considerations

  ### Caching

  ```typescript
  // Cache voice list for 1 hour
  const voiceCache = new Map<string, { voices: Voice[]; timestamp: number }>();

  async function getCachedVoices(): Promise<Voice[]> {
    const cached = voiceCache.get('all');
    if (cached && Date.now() - cached.timestamp < 3600000) {
      return cached.voices;
    }

    const result = await provider.listVoices();
    voiceCache.set('all', { voices: result.voices, timestamp: Date.now() });
    return result.voices;
  }
  ```

  ### Concurrent Requests

  ```typescript
  // Process multiple dialogue lines in parallel (max 10 concurrent)
  async function generateBatch(lines: DialogueLine[]): Promise<GenerateVoiceResult[]> {
    const concurrency = 10;
    const results: GenerateVoiceResult[] = [];

    for (let i = 0; i < lines.length; i += concurrency) {
      const batch = lines.slice(i, i + concurrency);
      const promises = batch.map(line => provider.generateVoice({
        text: line.text,
        voiceId: line.voiceId,
      }));

      const batchResults = await Promise.all(promises);
      results.push(...batchResults);
    }

    return results;
  }
  ```

