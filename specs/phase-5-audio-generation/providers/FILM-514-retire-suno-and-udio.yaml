spec_id: "FILM-514"
title: "Retire Suno and Udio"
phase: 5
phase_name: "Audio Generation"
category: feature
status: DONE
audited: "2026-09-25"
effort: M
dependencies: []
summary: >
  The owner decided on 2026-09-25 to remove Suno from the product ("We don't use it in
  our product right now. If we need it then we would do it from scratch later.") and then
  Udio with it. Music generation stays: ElevenLabs makes every music track the product
  keeps (music cues through the audio worker, the episode's bulk generate and the audio
  library), and none of that touched either vendor. Suno sat behind the Music timeline's
  "Generate for Scene" and "Add Cue" buttons and its Regenerate for non-cue tracks, all of
  which failed on the deployed app because SUNO_API_KEY is in no deployment configuration.
  Udio was registered in the music provider registry and reached by nothing but tests.
  This spec deletes both vendors, the buttons and actions that reached Suno, the API-key
  card, the enums that named them, the empty music half of the provider registry, and
  their mentions in the legal pages and docs, and adds a repo-scan test that fails if
  either name returns. No table or column changed and no data was deleted: production held
  no Suno data (owner, 2026-09-25).
