notes: |
  ## What music generation is now

  | Path | Where |
  |---|---|
  | Music cues from the shot list, generated and regenerated | `generateAudioForCueAction` in `packages/features/audio-generation/src/server/audio-cue-actions.ts`, then the audio worker and the project's ElevenLabs key |
  | Episode bulk generate | `generateMusicElevenLabsAction` from `packages/features/audio-generation/src/server/episode-audio-actions.ts` |
  | Audio library | `generateMusicAssetAction` in `packages/features/audio-generation/src/server/audio-asset-actions.ts` |

  A finished music track has no Regenerate: `generateMusicElevenLabsAction` answers a
  repeated prompt from the asset library, so pointing Regenerate at it would return the
  same audio. A real regenerate needs a force-new option there, which is new work.

  ## Records

  - KB-110 (Regenerate on a finished ElevenLabs track called Suno and added a failed track) is fixed here.
  - The spec-audit lead "The live Suno dialogs need `SUNO_API_KEY`" is closed by this spec.
  - KB-97 (music and SFX budget) no longer covers `music-actions.ts` or `actions.ts`; the ElevenLabs paths remain in it.
  - FILM-1803 and the phase-18 README still list Suno and Udio as sandbox stand-ins; ai-sandbox owns those files.
