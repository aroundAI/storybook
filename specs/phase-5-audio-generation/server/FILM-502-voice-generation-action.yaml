notes: |
  ## Checklist structure in the source (added in the YAML conversion)

  The source grouped its checklist items under these headings; item numbers count from 1 within each YAML list.

  - acceptance_criteria: "Functional" — items 1–23; "Non-Functional" — items 24–30

  **Phase**: 5
  **Priority**: P0
  **Effort**: M (3-5 days)
  **Status**: 🟡 PARTIAL (audit 2026-09-23; was ✅ DONE)
  **Dependencies**: FILM-501 (ElevenLabs provider), FILM-502b (Audio provider factory - deferred)
  **Blocks**: FILM-503, FILM-505, FILM-506

  ## Implementation

  **Completed**: 2024-12-11

  ### Files Created

  | File | Description |
  |------|-------------|
  | `packages/features/audio-generation/src/lib/schemas/voice-action.schema.ts` | Zod schemas and TypeScript interfaces for voice actions |
  | `packages/features/audio-generation/src/lib/schemas/index.ts` | Barrel export for schemas directory |
  | `packages/features/audio-generation/src/server/voice-actions.ts` | Server actions (`generateDialogueVoiceAction`, `generateVoiceFromTextAction`) |
  | `packages/features/audio-generation/src/server/voice-queries.ts` | Helper queries (`getVoiceIdForCharacter`, `getVoiceSettings`, `estimateVoiceCost`) |

  ### Files Modified

  | File | Changes |
  |------|---------|
  | `packages/features/audio-generation/src/lib/index.ts` | Added barrel export for `./schemas/index` |
  | `packages/features/audio-generation/src/server/index.ts` | Added exports for voice-actions and voice-queries |

  ### Actions Implemented

  #### `generateDialogueVoiceAction`

  Generates voice audio for an existing dialogue line with full workflow:

  1. Validates user authentication via `requireUser`
  2. Fetches dialogue line with episode/project/account context
  3. Checks if audio already exists (respects `overwriteExisting` flag)
  4. Gets voice ID from params or character's voice profile via `getVoiceIdForCharacter`
  5. Gets voice settings from profile or defaults via `getVoiceSettings`
  6. Estimates cost via `estimateVoiceCost`
  7. Checks account budget via `checkAccountBudget` RPC, throws if over budget
  8. Updates dialogue status to 'generating'
  9. Creates `generation_jobs` record for tracking
  10. If job creation fails, reverts status to 'pending' and throws
  11. Calls `ElevenLabsProvider.generateVoice()`
  12. Validates `audioBuffer` exists before upload
  13. Uploads to Supabase Storage: `dialogue/{episode_id}/{dialogue_line_id}.mp3`
  14. Updates `dialogue_lines` with `audio_url`, `status`, `generation_metadata`
  15. Updates `generation_jobs` as completed with actual cost
  16. Increments account usage via `incrementAccountUsage` RPC
  17. Returns `GenerateDialogueVoiceResult`

  **Error Handling**: On failure, updates both `dialogue_lines.status` to 'failed' with error in metadata, and `generation_jobs.status` to 'failed'. Returns failure result instead of throwing (allows UI to handle gracefully).

  #### `generateVoiceFromTextAction`

  Generates voice audio from raw text for previews (not linked to dialogue line):

  1. Validates user authentication
  2. Fetches episode to get account context
  3. Estimates cost via `estimateVoiceCost`
  4. Checks account budget via `checkAccountBudget` RPC, throws if over budget
  5. Creates `generation_jobs` record for tracking
  6. Calls `ElevenLabsProvider.generateVoice()`
  7. Validates `audioBuffer` exists before upload
  8. Uploads to temp storage: `temp/{user_id}/{timestamp}.mp3`
  9. Updates `generation_jobs` as completed
  10. Increments account usage via `incrementAccountUsage` RPC
  11. Returns `GenerateVoiceFromTextResult`

  **Error Handling**: Throws errors (no persistent state to update). Updates job status to 'failed' before throwing.

  ### Schemas Implemented

  ```typescript
  // GenerateDialogueVoiceSchema
  {
    dialogueLineId: z.string().uuid(),
    voiceId: z.string().optional(),
    provider: VoiceProviderNameSchema.optional(),
    settings: VoiceSettingsSchema.optional(),
    overwriteExisting: z.boolean().optional(),  // Defaults to false in action
  }

  // GenerateVoiceFromTextSchema
  {
    episodeId: z.string().uuid(),
    text: z.string().min(1).max(5000),
    voiceId: z.string().min(1),
    provider: VoiceProviderNameSchema.optional(),
    settings: VoiceSettingsSchema.optional(),
  }
  ```

  ### Helper Functions

  | Function | Description |
  |----------|-------------|
  | `getVoiceIdForCharacter(client, characterAssetId)` | Queries `character_details` → `voice_profiles` to get provider voice ID |
  | `getVoiceSettings(client, characterAssetId)` | Returns voice settings from profile or defaults |
  | `estimateVoiceCost(textLength)` | Returns cost in cents: `Math.ceil((textLength / 1000) * 30)` |
  | `checkAccountBudget(client, accountId, estimatedCostCents)` | Calls `check_account_budget` RPC, returns true if budget available |
  | `incrementAccountUsage(client, accountId, amountCents)` | Calls `increment_account_usage` RPC to track costs |

  ### Default Voice Settings

  ```typescript
  {
    stability: 0.5,
    similarityBoost: 0.75,
    style: 0,
    speed: 1.0,
    useSpeakerBoost: true
  }
  ```

  ### Deferred Features

  | Feature | Reason | Future Ticket |
  |---------|--------|---------------|
  | Provider factory | FILM-502b still in DRAFT status | FILM-502b |
  | BYOK support | Depends on provider factory for key selection | FILM-502b |

  ### Database Migration Added

  Migration `20251211090557_add-account-budget-tracking.sql` adds:
  - `monthly_budget_cents` column to `accounts` (nullable, NULL = unlimited)
  - `current_usage_cents` column to `accounts` (default 0)
  - `check_account_budget(p_account_id, p_estimated_cost_cents)` RPC function
  - `increment_account_usage(p_account_id, p_amount_cents)` RPC function
  - `reset_monthly_usage()` RPC function for cron-based monthly resets

  ### Cost Tracking

  Cost is tracked via:
  1. **`generation_jobs` table**:
     - `estimated_cost_cents`: Set when job created
     - `cost_cents`: Updated when job completed with actual cost from provider
  2. **`accounts` table**:
     - `current_usage_cents`: Incremented after each successful generation
     - `monthly_budget_cents`: Optional budget limit (NULL = unlimited)

  ---

  ## Context

  The voice generation server action provides the primary interface for generating voice audio from dialogue text. It orchestrates the complete workflow: validating inputs, calling the voice provider via the factory (FILM-502b), uploading audio to storage, updating database records, and tracking costs.

  This action serves as the bridge between the UI components and the voice generation providers. It uses the **audio provider factory** (FILM-502b) to support multiple providers (ElevenLabs, PlayHT, Azure TTS, Google Cloud TTS) without code changes. It must handle authentication, budget validation, storage management, and graceful error handling. The action should support both individual dialogue line generation and provide the foundation for batch processing.

  **Provider Selection**: The factory automatically selects the appropriate provider based on:
  1. User preference (if specified)
  2. BYOK (Bring Your Own Key) availability
  3. Platform key availability
  4. Default provider (ElevenLabs)

  ---

  ## Requirements

  ### Functional Requirements

  1. **Voice Generation**
     - Accept dialogue line ID or raw text input
     - Retrieve voice settings from character or voice profile
     - Call ElevenLabs provider with proper parameters
     - Upload generated audio to Supabase Storage
     - Update dialogue_lines.audio_url with storage URL
     - Update dialogue_lines.status (pending → generating → completed/failed)

  2. **Storage Management**
     - Upload audio files to Supabase Storage bucket: `audio/dialogue`
     - Use consistent file naming: `{episode_id}/{dialogue_line_id}.mp3`
     - Generate signed URL for audio playback
     - Set appropriate content-type headers
     - Handle upload failures and retries

  3. **Cost Tracking**
     - Estimate cost before generation
     - Check account budget before proceeding via `check_account_budget` RPC
     - Record actual cost in generation_metadata
     - Update account usage statistics via `increment_account_usage` RPC
     - Block if budget exceeded (returns error message)

  4. **Error Handling**
     - Retry transient failures (max 3 retries)
     - Rollback on failure (delete uploaded audio, reset status)
     - Log errors with full context
     - Return user-friendly error messages

  5. **Status Management**
     - Update status to 'generating' before API call
     - Update status to 'completed' on success
     - Update status to 'failed' on error
     - Store error message in generation_metadata

  ### Non-Functional Requirements

  - Complete generation within 60 seconds
  - Support concurrent generations (up to 5 per account)
  - Atomic transactions (all-or-nothing updates)
  - Idempotent (safe to retry)
  - Comprehensive logging for debugging

  ---

  ## Interface

  ### TypeScript Types

  ```typescript
