    text: z.string().min(1).max(5000),
    voiceId: z.string(),
    provider: z.enum(['elevenlabs', 'playht', 'azure', 'google']).optional(), // Via FILM-502b factory
    settings: z.object({
      stability: z.number().min(0).max(1).optional(),
      similarityBoost: z.number().min(0).max(1).optional(),
