summary: >
  Multi-table operations in the Film Studio require atomic transactions to maintain data
  integrity. For example, creating a character involves inserting into both `assets` and
  `character_details` tables - if either fails, both should rollback. PostgreSQL
  functions with `SECURITY DEFINER` provide this atomicity while maintaining RLS
  security.
