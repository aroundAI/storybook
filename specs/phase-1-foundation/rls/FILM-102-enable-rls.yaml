summary: >
  Row Level Security (RLS) must be enabled on all 14 tables created in FILM-101 to
  prevent unauthorized access to tenant data. This is the foundation of our multi-tenant
  security model. Without RLS enabled, PostgreSQL policies will not be enforced, and all
  data would be accessible to any authenticated user.
