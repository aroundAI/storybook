summary: >
  The @kit/audio-generation package provides the abstraction layer for audio generation
  services including ElevenLabs for voice synthesis and Suno for music generation. It
  handles API integration, voice management, music generation, and audio processing.
  This package enables dialogue, voiceovers, and background music for the Film Studio.
