  #### src/lib/types.ts
  ```typescript
  // Asset types
  export type AssetType = 'character' | 'location' | 'prop';

  export interface Asset {
    id: string;
    projectId: string;
    type: AssetType;
    name: string;
    description: string | null;
    imageUrl: string | null;
    metadata: Record<string, unknown> | null;
    createdAt: string;
    updatedAt: string;
  }

  export interface Character extends Asset {
    type: 'character';
    metadata: {
      physicalAttributes?: {
        age?: string;
        gender?: string;
        height?: string;
        build?: string;
        hairColor?: string;
        eyeColor?: string;
        distinctiveFeatures?: string;
      };
      personality?: string;
      backstory?: string;
      voiceSettings?: {
        voiceId?: string;
        provider?: 'elevenlabs' | 'suno';
        stability?: number;
        similarityBoost?: number;
      };
    };
  }

  export interface Location extends Asset {
    type: 'location';
    metadata: {
      setting?: string;
      timeOfDay?: string;
      weather?: string;
      atmosphere?: string;
    };
  }
  ```

  #### src/lib/schemas.ts
  ```typescript
  import { z } from 'zod';

  // Zod schemas for validation
  export const AssetTypeSchema = z.enum(['character', 'location', 'prop']);

  export const PhysicalAttributesSchema = z.object({
    age: z.string().optional(),
    gender: z.string().optional(),
    height: z.string().optional(),
    build: z.string().optional(),
    hairColor: z.string().optional(),
    eyeColor: z.string().optional(),
    distinctiveFeatures: z.string().optional(),
  });

  export const VoiceSettingsSchema = z.object({
    voiceId: z.string().optional(),
    provider: z.enum(['elevenlabs', 'suno']).optional(),
    stability: z.number().min(0).max(1).optional(),
    similarityBoost: z.number().min(0).max(1).optional(),
  });

  export const CreateAssetSchema = z.object({
    projectId: z.string().uuid(),
    type: AssetTypeSchema,
    name: z.string().min(1).max(255),
    description: z.string().optional(),
    imageUrl: z.string().url().optional(),
    metadata: z.record(z.unknown()).optional(),
  });

  export const UpdateAssetSchema = CreateAssetSchema.partial().extend({
    id: z.string().uuid(),
  });
  ```

