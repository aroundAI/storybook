notes: |
  ## Metadata not held in typed fields
  - **Priority:** P0
  - **Blocks:** Phase 2 (Project creation flow)

  ## About the `package` block (conversion note)
  This spec extends project creation rather than defining a package. The one package it changes is
  `@kit/projects`: its File Changes update `packages/features/projects/src/lib/types.ts`, and its server
  action imports `createProject` from `@kit/projects/server`. The settings types and validation schema
  come from `@kit/film-studio-schemas/project`. The spec names no package exports.

  ## Specification
  ### Database Schema Extension

  The `projects` table will use the existing `settings` JSONB column to store Film Studio settings:

  ```sql
  -- No migration needed - using existing settings column
  -- Structure of settings JSONB for Film Studio projects:
  {
    "projectType": "short-film" | "series" | "documentary" | "ad" | "educational",
    "targetPlatforms": ["youtube", "tiktok", "instagram", ...],
    "videoStyle": "realistic" | "animated" | "cartoon" | "anime" | "cinematic" | ...,
    "defaultAspectRatio": "16:9",
    "defaultDuration": 5,
    "defaultProvider": "kling" | "runway" | "luma",
    "audioProvider": "elevenlabs" | "suno",
    "targetAudience": "string",
    "contentRating": "G" | "PG" | "PG-13" | "R" | "NR",
    "language": "en",
    "subtitlesEnabled": false
  }
  ```

  ### TypeScript Types

  #### StudioProjectSettings Interface

  ```typescript
  // From @kit/film-studio-schemas/project
  export interface StudioProjectSettings {
    // Project Classification
    projectType: 'short-film' | 'series' | 'documentary' | 'ad' | 'educational';
    targetPlatforms: Array<'youtube' | 'tiktok' | 'instagram' | 'facebook' | 'twitter' | 'linkedin' | 'custom'>;
    videoStyle: 'realistic' | 'animated' | 'cartoon' | 'anime' | 'cinematic' | 'documentary' | 'vlog' | 'commercial';

    // Default Generation Settings
    defaultAspectRatio: string; // e.g., "16:9", "9:16", "1:1"
    defaultDuration: number; // in seconds
    defaultProvider: 'kling' | 'runway' | 'luma';
    audioProvider?: 'elevenlabs' | 'suno';

    // Content Settings
    targetAudience?: string;
    contentRating?: 'G' | 'PG' | 'PG-13' | 'R' | 'NR';
    language: string; // ISO language code
    subtitlesEnabled: boolean;
  }

  // Extended Project Type
  export interface FilmStudioProject extends Project {
    settings: StudioProjectSettings;
  }
  ```

