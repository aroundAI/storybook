summary: >
  This task extends the existing project creation functionality to support Film
  Studio-specific settings. The project form will be enhanced to capture project type,
  target platforms, video style, and other production settings. These settings will be
  stored in the projects table and used to configure default values throughout the film
  production pipeline.
