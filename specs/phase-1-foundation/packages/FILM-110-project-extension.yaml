  │   ├── project-type-selector.tsx
  │   ├── platform-selector.tsx
  │   ├── video-style-selector.tsx
  │   ├── generation-settings.tsx
  │   └── content-settings.tsx
  ```

  ### Server Action

  Update the create project server action:

  ```typescript
  'use server';

  import { createProject } from '@kit/projects/server';
  import { filmStudioProjectSchema } from '@kit/film-studio-schemas/project';

  export async function createFilmStudioProject(data: unknown) {
    // Validate input
    const validated = filmStudioProjectSchema.parse(data);

    // Create project with Film Studio settings
    const project = await createProject({
      name: validated.name,
      description: validated.description,
      settings: validated.settings,
    });

    return { data: project, error: null };
  }
  ```

