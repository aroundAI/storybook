  ### Validation Schema

  Use the schema from @kit/film-studio-schemas:

  ```typescript
  import { CreateProjectSchema, StudioProjectSettingsSchema } from '@kit/film-studio-schemas/project';

  const filmStudioProjectSchema = CreateProjectSchema.extend({
    settings: StudioProjectSettingsSchema,
  });
  ```

  ### Smart Defaults

  Implement intelligent defaults based on platform selection:

  ```typescript
  function getDefaultsForPlatforms(platforms: string[]): Partial<StudioProjectSettings> {
    const defaults: Partial<StudioProjectSettings> = {};

    // Aspect ratio based on primary platform
    if (platforms.includes('tiktok') || platforms.includes('instagram')) {
      defaults.defaultAspectRatio = platforms.includes('tiktok') ? '9:16' : '1:1';
    } else if (platforms.includes('youtube')) {
      defaults.defaultAspectRatio = '16:9';
    }

    // Duration based on platform
    if (platforms.includes('tiktok')) {
      defaults.defaultDuration = 3; // Shorter clips for TikTok
    } else if (platforms.includes('youtube')) {
      defaults.defaultDuration = 5; // Standard for YouTube
    }

    return defaults;
  }
  ```

