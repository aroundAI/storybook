      description: "Main exports (re-exports from all modules)"
    - path: "./components"
      description: "UI components for studio orchestration"
    - path: "./server"
      description: "Server actions for studio operations"
    - path: "./lib"
      description: "Shared utilities, types, and constants"
    - path: "./types"
      description: "TypeScript type definitions"
  package_dependencies:
    - name: "@kit/supabase"
      purpose: "Database access and Supabase client"
