      purpose: "Shared utilities and helpers"
    - name: "@kit/ui"
      purpose: "UI components library"
    - name: "zod"
      purpose: "Schema validation"
    - name: "react"
      purpose: "React framework"
    - name: "next"
      purpose: "Next.js framework"
