summary: >
  The `episodes` table is the core content unit in the film studio. Each episode goes through a
  workflow: draft → story → storyboard → generating → editing → ready → published. Episodes include
  soft delete for safety and optimistic locking (version column) to prevent concurrent edit
  conflicts.
