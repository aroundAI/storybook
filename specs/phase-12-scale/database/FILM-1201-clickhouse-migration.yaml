  ## 7. Security & Access Control

  - **Network**: ClickHouse runs in a private subnet or is secured via TLS + password authentication.
  - **Access**: Only the API server (Next.js backend/server actions) has credentials. Client-side code NEVER accesses ClickHouse.
  - **Multi-tenancy**: Every query enforces `project_id` scoping via `assertScopedFilters()` which throws if neither `projectId` nor `videoIds` is provided.
  - **Import path enforcement**: `@kit/clickhouse/server` is the only entry point for client access — ensures server-only usage.

