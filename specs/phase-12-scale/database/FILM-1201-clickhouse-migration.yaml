notes: |
  ## 1. Overview

  > [!IMPORTANT]
  > This spec maps every implementation detail to concrete codebase paths, so AI agents can navigate, extend, or debug the ClickHouse analytics layer without additional context.

  ## 2. Architecture Overview

  ### Before (Supabase/Postgres)
  - **Ingestion**: `analytics-sync-cron.ts` upserted into `content_analytics` table in Postgres.
  - **Querying**: `aggregation-queries.ts` performed `SUM()` operations directly on Postgres.
  - **Problem**: Millions of rows → slow aggregation, resource contention with transactional workloads.

  ### After (Pure ClickHouse)
  - **Ingestion**: `analytics-sync-cron.ts` inserts immutable logs into ClickHouse `video_metrics`.
  - **Storage**: Columnar storage with `SummingMergeTree` materialized view for pre-aggregation.
  - **Querying**: Application fetches metadata from Supabase, then queries ClickHouse for metrics.
  - **Result**: Sub-second queries on billions of rows; zero impact on transactional DB.

  ## 3. Database Schema (ClickHouse)

  ### 3.1 Raw Metrics Table (`video_metrics`)

  Immutable log of all data points received from API providers.

  ```sql
  CREATE TABLE video_metrics (
      project_id UUID,
      video_id String,
      platform Enum('youtube' = 1, 'tiktok' = 2, 'instagram' = 3),
      metric_date Date,
      metric_timestamp DateTime DEFAULT now(),
      views UInt64,
      likes UInt32,
      comments UInt32,
      shares UInt32,
      saves UInt32,
      watch_time_seconds UInt64,
      revenue_cents Int64,
      subscribers_gained Int32,
      extra_metrics String DEFAULT '{}'
  ) ENGINE = MergeTree()
  PARTITION BY toYYYYMM(metric_date)
  ORDER BY (project_id, platform, video_id, metric_timestamp)
  SETTINGS index_granularity = 8192
  ```

  ### 3.2 Aggregated Materialized View (`video_daily_stats`)

  Pre-calculates daily totals. Primary read target for all analytics queries.

  ```sql
  CREATE MATERIALIZED VIEW video_daily_stats
  ENGINE = SummingMergeTree()
  PARTITION BY toYYYYMM(metric_date)
  ORDER BY (project_id, platform, video_id, metric_date)
  AS SELECT
      project_id, video_id, platform, metric_date,
      sum(views) AS views,
      sum(likes) AS likes,
      sum(comments) AS comments,
      sum(shares) AS shares,
      sum(saves) AS saves,
      sum(watch_time_seconds) AS watch_time_seconds,
      sum(revenue_cents) AS revenue_cents,
      sum(subscribers_gained) AS subscribers_gained
  FROM video_metrics
  GROUP BY project_id, video_id, platform, metric_date
  ```

  ## 4. Implementation Map

  ### 4.1 Package: `@kit/clickhouse`

  The ClickHouse client package is at `packages/clickhouse/`.

  | File | Purpose |
  |------|---------|
  | `src/client.ts` | Singleton ClickHouse client. Reads `CLICKHOUSE_HOST`, `CLICKHOUSE_USER`, `CLICKHOUSE_PASSWORD`, `CLICKHOUSE_DB` from env. Provides `getClickHouseClient()`, `closeClickHouseClient()`, `pingClickHouse()`, `isClickHouseEnabled()`. |
  | `src/queries.ts` | 10+ typed query functions: `insertVideoMetrics()`, `queryTotals()`, `queryDailyTimeSeries()`, `queryPlatformBreakdown()`, `queryPerVideoStats()`, etc. All enforce scoped filters via `assertScopedFilters()`. |
  | `src/types.ts` | TypeScript types: `VideoMetric`, `DailyStats`, `AggregatedTotals`, `DailyDataPoint`, `PlatformBreakdown`, `PlatformEngagement`, `QueryFilters`, `AnalyticsPlatform`. |
  | `src/utils.ts` | `formatDateStr(date: Date): string` — formats Date to `YYYY-MM-DD` for ClickHouse queries. |
  | `src/index.ts` | Public API — exports types + `formatDateStr`. Client import via `@kit/clickhouse/server`. |
  | `src/migrations/001_create_tables.ts` | DDL script — creates `video_metrics` table + `video_daily_stats` materialized view. Run: `npx tsx packages/clickhouse/src/migrations/001_create_tables.ts` |
  | `__tests__/clickhouse.test.ts` | Unit tests for the ClickHouse package. |
  | `package.json` | Package config — exports `./server` for server-side client access. |

  #### Environment Variables

  ```bash
  CLICKHOUSE_HOST=https://your-instance.clickhouse.cloud:8443
  CLICKHOUSE_USER=default
  CLICKHOUSE_PASSWORD=your-password
  CLICKHOUSE_DB=storybook
  ```

  #### Client Usage Pattern

  ```typescript
  import { getClickHouseClient } from '@kit/clickhouse/server';
  import { insertVideoMetrics, queryTotals } from '@kit/clickhouse/server';
  import type { VideoMetric, QueryFilters } from '@kit/clickhouse';

  // Insert metrics
  await insertVideoMetrics(metricsArray);

  // Query aggregated totals
  const totals = await queryTotals({
    projectId: 'uuid',
    dateFrom: '2024-01-01',
    dateTo: '2024-12-31',
  });
  ```

  ### 4.2 Ingestion: Analytics Sync Cron

  The sync cron fetches data from platform APIs and writes to ClickHouse.

  | File | Path |
  |------|------|
  | Sync cron | `packages/features/content-analytics/src/server/analytics-sync-cron.ts` |

  **Data flow:**
  ```
  Platform APIs (YouTube, TikTok, IG) → analytics-sync-cron.ts → insertVideoMetrics() → ClickHouse video_metrics
  ```

  **Key function:** Calls `insertVideoMetrics()` with batches of `VideoMetric[]` objects. The `video_id` field maps to the `publish_id` (UUID) stored in Supabase for clean joins.

  ### 4.3 Query Layer: Refactored Files

  All analytics queries now flow through ClickHouse. The pattern is:
  1. Fetch metadata from Supabase (project IDs, episode IDs, etc.)
  2. Query ClickHouse with those IDs for aggregated metrics
  3. Return combined results

  | Refactored File | Purpose | ClickHouse Functions Used |
  |-----------------|---------|--------------------------|
  | `content-analytics/src/server/aggregation-queries.ts` | Project, Season, Episode stats | `queryTotals()`, `queryDailyTimeSeries()` |
  | `content-analytics/src/server/language-analytics.ts` | Per-language breakdown | `queryPlatformBreakdown()` |
  | `content-analytics/src/server/revenue-actions.ts` | Revenue summaries | `queryTotals()`, revenue filters |
  | `content-analytics/src/server/report-actions.ts` | Scheduled/export reports | `queryTotals()`, `queryDailyTimeSeries()` |
  | `content-analytics/src/server/account-dashboard-actions.ts` | Account-level aggregations | `queryTotals()` |

  **Base path:** `packages/features/content-analytics/src/server/`

  ### 4.4 Data Types Reference

  ```typescript
  type AnalyticsPlatform = 'youtube' | 'tiktok' | 'instagram';

  interface VideoMetric {
      project_id: string;
      video_id: string;
      platform: AnalyticsPlatform;
      metric_date: string;       // YYYY-MM-DD
      views: number;
      likes: number;
      comments: number;
      shares: number;
      saves: number;
      watch_time_seconds: number;
      revenue_cents: number;
      subscribers_gained: number;
      extra_metrics: string;     // JSON string for platform-specific data
  }

  interface QueryFilters {
      projectId?: string;
      videoIds?: string[];
      platform?: AnalyticsPlatform;
      dateFrom?: string;         // YYYY-MM-DD
      dateTo?: string;           // YYYY-MM-DD
  }

  interface AggregatedTotals {
      views: number;
      likes: number;
      comments: number;
      shares: number;
      saves: number;
      watch_time_seconds: number;
      revenue_cents: number;
      subscribers_gained: number;
  }
  ```

  ### 4.5 Query Functions Reference

  All functions are in `packages/clickhouse/src/queries.ts`:

  | Function | Input | Output | Description |
  |----------|-------|--------|-------------|
  | `insertVideoMetrics(metrics)` | `VideoMetric[]` | `void` | Batch insert raw metrics |
  | `queryTotals(filters)` | `QueryFilters` | `AggregatedTotals` | Sum all metrics for filter range |
  | `queryDailyTimeSeries(filters)` | `QueryFilters` | `DailyDataPoint[]` | Daily breakdown sorted by date |
  | `queryPlatformBreakdown(filters)` | `QueryFilters` | `PlatformBreakdown[]` | Group by platform |
  | `queryPerVideoStats(filters)` | `QueryFilters` | per-video rows | Per-video metrics |
  | `assertScopedFilters(filters)` | `QueryFilters` | throws if invalid | Ensures projectId or videoIds present |

  ## 5. How-To: Common Operations

  ### 5.1 Add a New Metric Column

  1. **Update ClickHouse schema**: Add column to `CREATE_VIDEO_METRICS` and `CREATE_VIDEO_DAILY_STATS` in `packages/clickhouse/src/migrations/001_create_tables.ts`
  2. **Update types**: Add field to `VideoMetric` and `DailyStats` in `packages/clickhouse/src/types.ts`
  3. **Update queries**: Add column to `SELECT` lists and `SUM()` calls in `packages/clickhouse/src/queries.ts`
  4. **Update ingestion**: Map new field in `analytics-sync-cron.ts`
  5. **Run migration**: `npx tsx packages/clickhouse/src/migrations/001_create_tables.ts` (uses `IF NOT EXISTS` — safe to re-run, but for ALTER, write a new migration file)

  ### 5.2 Add a New Platform

  1. **Extend `AnalyticsPlatform` type**: `packages/clickhouse/src/types.ts`
  2. **Extend ClickHouse Enum**: Add value to `platform Enum(...)` in `001_create_tables.ts`
  3. **Add provider**: Create provider in `packages/features/content-analytics/src/providers/`
  4. **Update sync cron**: Add platform fetch logic in `analytics-sync-cron.ts`

  ### 5.3 Query ClickHouse from a New Feature

  ```typescript
  // 1. Import from server path (never from client-side code)
  import { queryTotals, queryDailyTimeSeries } from '@kit/clickhouse/server';
  import type { QueryFilters } from '@kit/clickhouse';

  // 2. Build scoped filter (MUST include projectId or videoIds)
  const filters: QueryFilters = {
    projectId: params.projectId,
    dateFrom: '2024-01-01',
    dateTo: '2024-12-31',
  };

  // 3. Query
  const totals = await queryTotals(filters);
  const timeSeries = await queryDailyTimeSeries(filters);
  ```

  ### 5.4 Debug ClickHouse Connection

  ```typescript
  import { pingClickHouse, isClickHouseEnabled } from '@kit/clickhouse/server';

  // Check if enabled
  if (isClickHouseEnabled()) {
    const ok = await pingClickHouse(); // returns boolean
    console.log('ClickHouse reachable:', ok);
  }
  ```

