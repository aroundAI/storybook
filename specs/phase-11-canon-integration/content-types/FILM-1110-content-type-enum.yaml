  - FILM-1102: Memory Context Injection

  ## Implementation Status

  **✅ DONE** (FILM-1110 EDD, `specs/plans/FILM-1110-edd.md`; was PARTIAL at the
  2026-09-23 audit, first implemented in PR #176 — merged 2026-02-09)

  What changed from the design above, and why:

  - **One allocation table.** `ContentTypeConfig.allocations` was removed;
    token allocation lives only in FILM-1111's `MEMORY_ALLOCATIONS`. The two
    tables disagreed for every type and neither was read by anything live.
  - **The type is resolved inside the builder**, from `projects.metadata`,
    validated against `ProjectTypeSchema` (fallback `series`) — no caller
    has to pass it. `getProjectContentType` was replaced by the pure
    `resolveProjectType(metadata)`, importable from client code.
  - **The client is injected**: `buildMemoryContext(client, input)`. The
    builder imported the Next.js cookie client, whose `server-only` guard
    throws in the LLM Lambda bundle, so every generation-time build failed
    silently.
  - **Two column fixes**: characters are read by `assets.type` and summaries
    windowed on `episodes.number`; both reads returned HTTP 400 before.
  - **Horizon precedence** (`memory-horizon.ts`): explicit argument → the
    user's Canon settings choice → the content type → 10. The Canon
    settings slider now shows the horizon in effect and stores a number
    only when moved; a stored 10 saved before this change reads as
    automatic.
