remaining:
  - criterion: "LLM extracts facts with entities"
    reason: >
      `documentary/fact-extraction.json` asks for claim, category, confidence
      and source context, and `ExtractedFactSchema` has only those
      (`packages/features/prompt-engine/src/schemas/fact-extraction-schemas.ts:23`); no
      people/places/dates/organizations are extracted or stored
    closed_by: "unassigned"
  - criterion: "Progress shown during extraction"
    reason: >
      Content over 500 characters is queued to the LLM worker
      (`packages/features/episodes/src/server/source-upload-actions.ts:245`);
      the dialog then shows "complete" and toasts "Extracted 0 fact(s)"
      (`apps/web/app/home/[account]/studio/[projectSlug]/research/_components/upload-source-dialog.tsx:247`).
      The progress banner
      (`settings/facts/_components/extraction-status-banner.tsx`) is rendered
      nowhere, and `createExtractionJobAction` has no caller, so
      `fact_extraction_jobs` stays empty
    closed_by: "unassigned"
  - criterion: "Error handling for failed uploads/extractions"
    reason: >
      Upload and queueing errors are caught and toasted
      (`upload-source-dialog.tsx:253`), but a job that fails in the worker
      leaves no trace the user can see; SQS jobs are not recorded anywhere
      (`packages/ai-gateway/src/dispatch.ts:51`: the queue message is the run id, and the run row is the record)
    closed_by: "unassigned"
