summary: >
  Create a new "Research" section in the Studio sidebar where users can manage
  fact sources, external APIs, and verified facts for fact-based content types
  (documentary, educational, news).
acceptance_criteria:
  - text: "`/research` route accessible from sidebar"
    met: true
    evidence: null
  - text: "Sources list shows all project sources with CRUD"
    met: false
    reason: "no longer true — no edit in the hub (`updateExternalSourceAction` has no caller); sources are global, not per project"
  - text: "Facts list shows extracted facts with verification toggle"
    met: false
    reason: "no longer true — the Facts tab only links out (`apps/web/app/home/[account]/studio/[projectSlug]/research/_components/research-hub-page.tsx:298`) to the Fact Library, where verifying now works (KB-18, #314) — but the hub itself lists no facts and has no toggle"
  - text: "Empty state guides user based on content type"
    met: false
    reason: "no longer true — one generic empty state (`apps/web/app/home/[account]/studio/[projectSlug]/research/_components/research-hub-page.tsx:206`); content type never read"
  - text: "Source counts show in sidebar nav item"
    met: false
    reason: "no longer true — the sources half filters `external_content` by `project_id`, a column it lacks (`apps/web/app/home/[account]/studio/[projectSlug]/layout.tsx:84`)"
  - text: "Proper loading and error states"
    met: false
    reason: "no longer true — shows \"No sources configured\" until the client fetch returns (`apps/web/app/home/[account]/studio/[projectSlug]/research/_components/research-hub-page.tsx:202`)"
  - text: "Mobile responsive layout"
    met: false
    reason: "unverified — responsive classes present (`apps/web/app/home/[account]/studio/[projectSlug]/research/_components/research-hub-page.tsx:148`); needs a phone-width screenshot"
remaining:
  - criterion: "Sources list shows all project sources with CRUD"
    reason: >
      The hub lists and soft-deletes sources and adds them via
      `AddSourceDialog`, but offers no edit: there is no update action
      (KB-37, #398, removed `updateExternalSourceAction`, which had no
      caller). Sources are no longer global: since #398 each is a built-in,
      a team source or a project source
      (`packages/features/episodes/src/server/external-context-actions.ts:318`),
      so "project sources" now exist, and editing them is the missing part
    closed_by: "unassigned"
  - criterion: "Facts list shows extracted facts with verification toggle"
    reason: >
      The hub's Facts tab is a card linking to the Facts Library
      (`research-hub-page.tsx:274`). Verifying works in the Library since
      KB-18 (#314); the hub still shows no facts list or toggle of its own
    closed_by: "unassigned"
  - criterion: "Empty state guides user based on content type"
    reason: >
      `page.tsx` selects `metadata` but never passes a content type; the empty
      state is fixed text (`research-hub-page.tsx:193`)
    closed_by: "unassigned"
  - criterion: "Source counts show in sidebar nav item"
    reason: >
      The count is `researchSources + researchFacts`
      (`apps/web/app/home/[account]/studio/[projectSlug]/_components/studio-sidebar.tsx:494`);
      `researchSources` queries `external_content.project_id`
      (`layout.tsx:84`), which no migration or generated type defines, so that
      request errors and only facts are counted
    closed_by: "unassigned"
  - criterion: "Proper loading and error states"
    reason: >
      `sources` starts as `[]` (`research-hub-page.tsx:88`) and the empty
      state renders whenever it is empty (`:189`), so every load first shows
      "No sources configured"; `loadData` catches nothing
    closed_by: "unassigned"
open_questions: []
