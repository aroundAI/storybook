  ## TypeScript Types

  ### File: `packages/features/episodes/src/types/verified-facts.ts`

  ```typescript
  /**
   * Source types for verified facts
   */
  export type SourceType =
    | 'research_paper'
    | 'textbook'
    | 'encyclopedia'
    | 'expert_interview'
    | 'official_document'
    | 'historical_record'
    | 'news_article'
    | 'other';

  /**
   * Verification status
   */
  export type VerificationStatus =
    | 'unverified'
    | 'pending_review'
    | 'verified'
    | 'disputed'
    | 'retracted';

  /**
   * A verified fact with citation
   */
  export interface VerifiedFact {
    id: string;
    projectId: string;

    // The claim
    claim: string;
    simplifiedClaim?: string;

    // Categorization
    category?: string;
    subcategory?: string;
    tags: string[];

    // Source
    sourceType: SourceType;
    sourceUrl?: string;
    sourceCitation: string;           // Full citation
    sourceTitle?: string;
    sourceAuthors?: string[];
    sourcePublicationDate?: Date;
    sourceDoi?: string;
    sourceMetadata?: Record<string, unknown>;

    // Verification
    verificationStatus: VerificationStatus;
    verifiedBy?: string;
    verifiedAt?: Date;
    verificationNotes?: string;

    // Confidence
    confidenceScore?: number;

    // Usage
    timesUsed: number;
    lastUsedAt?: Date;
    episodesUsedIn: string[];

    // Audit
    createdAt: Date;
    createdBy?: string;
    updatedAt: Date;
  }

  /**
   * Input for creating a verified fact
   */
  export interface CreateVerifiedFactInput {
    projectId: string;
    claim: string;
    category?: string;
    subcategory?: string;
    tags?: string[];
    sourceType: SourceType;
    sourceUrl?: string;
    sourceCitation: string;
    sourceTitle?: string;
    sourceAuthors?: string[];
    sourcePublicationDate?: string;
    sourceDoi?: string;
    confidenceScore?: number;
  }

  /**
   * Search result for facts
   */
  export interface FactSearchResult {
    fact: VerifiedFact;
    relevanceScore: number;
    matchedTerms: string[];
  }

  /**
   * Generate APA citation from source data
   */
  export function generateAPACitation(
    authors: string[],
    year: number,
    title: string,
    source: string,
    url?: string,
    doi?: string
  ): string {
    // Format authors: Last, F. M., & Last, F. M.
    const formattedAuthors = authors.length > 0
      ? authors.join(', ')
      : 'Unknown Author';

    let citation = `${formattedAuthors} (${year}). ${title}. ${source}.`;

    if (doi) {
      citation += ` https://doi.org/${doi}`;
    } else if (url) {
      citation += ` Retrieved from ${url}`;
    }

    return citation;
  }
  ```

