remaining:
  - criterion: "RLS policies protect project-level access"
    reason: >
      Tenant isolation is asserted in pgTAP (KB-48, #344). Reads are scoped
      to the account, as they are for episodes and shots, so a member of the
      account who is not on a project still reads its facts. Whether facts
      should be project-private is a product decision, not a defect: the
      criterion's wording and the sibling tables disagree
    closed_by: "owner"
  - criterion: "Full-text search index works for claim matching"
    reason: >
      The index is on `to_tsvector('english', claim || ' ' ||
      COALESCE(simplified_claim, ''))`
      (`apps/web/supabase/migrations/20260211100000_create_verified_facts.sql:92`);
      the fact library searches `textSearch('claim', …)`
      (`packages/features/episodes/src/server/fact-actions.ts:295`), a
      different expression, so the index is never used. `external_content` had
      the same defect and was fixed with a generated `fts` column
      (`20260211200001_fix_external_content_fts_and_trigger.sql`)
    closed_by: "unassigned"
  - criterion: "`generateAPACitation` produces valid APA format"
    reason: >
      Authors are joined with `, ` and no `&`, and a missing author becomes
      "Unknown Author"
      (`packages/features/episodes/src/types/verified-facts.ts:126`); the unit
      test pins that output
      (`packages/features/episodes/src/lib/__tests__/verified-facts.test.ts:95`)
    closed_by: "unassigned"
