  ## Testing

  ### Unit Test

  ```typescript
  describe('Fact-Checker Role', () => {
    it('should pass content with verified facts', async () => {
      // Add verified fact
      await addVerifiedFactAction({
        projectId,
        claim: 'Water boils at 100°C at sea level',
        sourceCitation: 'IUPAC Gold Book',
        verificationStatus: 'verified',
      });

      const content = 'Water boils at 100°C at sea level. This is a fundamental property.';

      const result = await runFactCheck(projectId, content, undefined, supabase);

      expect(result.overallVerdict).toBe('pass');
      expect(result.verifiedClaims).toBeGreaterThan(0);
    });

    it('should flag inaccurate claims', async () => {
      await addVerifiedFactAction({
        projectId,
        claim: 'The speed of light is 299,792,458 m/s',
        sourceCitation: 'NIST',
        verificationStatus: 'verified',
      });

      const content = 'The speed of light is 300,000,000 m/s.';

      const result = await runFactCheck(projectId, content, undefined, supabase);

      expect(result.overallVerdict).not.toBe('pass');
      expect(result.issues.some(i => i.issueType === 'inaccurate')).toBe(true);
    });

    it('should block on critical issues', () => {
      const result: FactCheckResult = {
        overallVerdict: 'fail',
        accuracyScore: 0.5,
        issues: [{ severity: 'critical', issueType: 'inaccurate', /* ... */ }],
        // ...
      };

      expect(shouldBlockContent(result)).toBe(true);
    });
  });
  ```

