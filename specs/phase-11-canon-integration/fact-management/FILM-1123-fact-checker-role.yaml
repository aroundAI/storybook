  ## Integration

  ### Fact-Checker Service Function

  ```typescript
  // File: packages/features/episodes/src/lib/documentary/fact-checker.ts

  import { executeLLM } from '@kit/prompt-engine/server';

  export interface FactCheckIssue {
    severity: 'critical' | 'warning' | 'minor' | 'info';
    claimInContent: string;
    issueType: 'inaccurate' | 'unsourced' | 'misrepresented' | 'citation_error' | 'missing_claim';
    explanation: string;
    verifiedFact?: string;
    suggestion: string;
  }

  export interface FactCheckResult {
    overallVerdict: 'pass' | 'fail' | 'warnings';
    accuracyScore: number;
    totalClaimsFound: number;
    verifiedClaims: number;
    issues: FactCheckIssue[];
    missingRequiredClaims: string[];
    citationsValid: boolean;
    summary: string;
  }

  /**
   * Run fact-check on content
   */
  export async function runFactCheck(
    projectId: string,
    content: string,
    requiredClaims?: string[],
    supabase: SupabaseClient
  ): Promise<FactCheckResult> {

    // Get all verified facts for this project
    const { data: facts } = await supabase
      .from('verified_facts')
      .select('*')
      .eq('project_id', projectId)
      .eq('verification_status', 'verified');

    if (!facts || facts.length === 0) {
      throw new Error('No verified facts found. Add facts before fact-checking.');
    }

    // Format facts for prompt
    const verifiedFactsText = facts.map(f =>
      `FACT [${f.id}]: ${f.claim}\n  Source: ${f.source_citation}\n  Category: ${f.category}`
    ).join('\n\n');

    // Run fact-checker LLM
    const result = await executeLLM<{
      fact_check: {
        overall_verdict: string;
        accuracy_score: number;
        total_claims_found: number;
        verified_claims: number;
        issues: Array<{
          severity: string;
          claim_in_content: string;
          issue_type: string;
          explanation: string;
          verified_fact?: string;
          suggestion: string;
        }>;
        missing_required_claims: string[];
        citations_valid: boolean;
        summary: string;
      };
    }>({
      templateSlug: 'fact-checker-role',
      variables: {
        content,
        verified_facts: verifiedFactsText,
        required_claims: requiredClaims?.join('\n') ?? '',
      },
      context: { name: 'fact-checker-role', projectId },
      supabaseClient: supabase,
    });

    const check = result.data.fact_check;

    return {
      overallVerdict: check.overall_verdict as FactCheckResult['overallVerdict'],
      accuracyScore: check.accuracy_score,
      totalClaimsFound: check.total_claims_found,
      verifiedClaims: check.verified_claims,
      issues: check.issues.map(i => ({
        severity: i.severity as FactCheckIssue['severity'],
        claimInContent: i.claim_in_content,
        issueType: i.issue_type as FactCheckIssue['issueType'],
        explanation: i.explanation,
        verifiedFact: i.verified_fact,
        suggestion: i.suggestion,
      })),
      missingRequiredClaims: check.missing_required_claims,
      citationsValid: check.citations_valid,
      summary: check.summary,
    };
  }

  /**
   * Block content if fact-check fails
   */
  export function shouldBlockContent(result: FactCheckResult): boolean {
    // Block on any critical issues
    if (result.issues.some(i => i.severity === 'critical')) {
      return true;
    }

    // Block if too many warnings
    const warningCount = result.issues.filter(i => i.severity === 'warning').length;
    if (warningCount >= 3) {
      return true;
    }

    // Block if accuracy too low
    if (result.accuracyScore < 0.8) {
      return true;
    }

    return false;
  }
  ```

  ### UI Component: Fact-Check Results

  ```tsx
  // File: packages/features/episodes/src/components/facts/FactCheckResults.tsx

  export function FactCheckResults({ result }: { result: FactCheckResult }) {
    const verdictColors = {
      pass: 'bg-green-100 text-green-800 border-green-300',
      warnings: 'bg-yellow-100 text-yellow-800 border-yellow-300',
      fail: 'bg-red-100 text-red-800 border-red-300',
    };

    const severityColors = {
      critical: 'text-red-600',
      warning: 'text-yellow-600',
      minor: 'text-blue-600',
      info: 'text-gray-600',
    };

    return (
      <div className="space-y-6">
        {/* Overall Verdict */}
        <Card className={`p-4 border-2 ${verdictColors[result.overallVerdict]}`}>
          <div className="flex justify-between items-center">
            <div>
              <h3 className="text-lg font-bold uppercase">
                {result.overallVerdict}
              </h3>
              <p className="text-sm">{result.summary}</p>
            </div>
            <div className="text-3xl font-bold">
              {Math.round(result.accuracyScore * 100)}%
            </div>
          </div>
        </Card>

        {/* Stats */}
        <div className="grid grid-cols-3 gap-4">
          <Card className="p-3 text-center">
            <div className="text-2xl font-bold">{result.totalClaimsFound}</div>
            <div className="text-sm text-muted-foreground">Claims Found</div>
          </Card>
          <Card className="p-3 text-center">
            <div className="text-2xl font-bold text-green-600">
              {result.verifiedClaims}
            </div>
            <div className="text-sm text-muted-foreground">Verified</div>
          </Card>
          <Card className="p-3 text-center">
            <div className="text-2xl font-bold text-red-600">
              {result.issues.length}
            </div>
            <div className="text-sm text-muted-foreground">Issues</div>
          </Card>
        </div>

        {/* Issues List */}
        {result.issues.length > 0 && (
          <div className="space-y-3">
            <h4 className="font-medium">Issues Found</h4>
            {result.issues.map((issue, i) => (
              <Card key={i} className="p-4">
                <div className="flex items-start gap-3">
                  <Badge className={severityColors[issue.severity]}>
                    {issue.severity}
                  </Badge>
                  <div className="flex-1">
                    <p className="font-medium">{issue.issueType}</p>
                    <p className="text-sm text-muted-foreground mt-1">
                      "{issue.claimInContent}"
                    </p>
                    <p className="text-sm mt-2">{issue.explanation}</p>
                    {issue.suggestion && (
                      <p className="text-sm text-blue-600 mt-2">
                        💡 {issue.suggestion}
                      </p>
                    )}
                  </div>
                </div>
              </Card>
            ))}
          </div>
        )}

        {/* Missing Claims */}
        {result.missingRequiredClaims.length > 0 && (
          <Alert variant="warning">
            <AlertTitle>Missing Required Claims</AlertTitle>
            <ul className="list-disc pl-4 mt-2">
              {result.missingRequiredClaims.map((claim, i) => (
                <li key={i}>{claim}</li>
              ))}
            </ul>
          </Alert>
        )}
      </div>
    );
  }
  ```

