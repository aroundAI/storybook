notes: |
  Source metadata:
  - priority: medium

  ## Problem Statement

  After the Researcher identifies claims:
  - Need to verify matched facts are used correctly
  - Need to validate citation formatting
  - Need to ensure no unsourced claims slip through
  - Need to check facts aren't misrepresented

  ## Solution

  Create a Fact-Checker role that:
  1. Reviews content against verified facts
  2. Validates claim accuracy
  3. Checks citation formatting
  4. Flags misrepresentations or errors

  ---

  ## Role Description

  ```
  ┌─────────────────────────────────────────────────────────────────────────────┐
  │                         FACT-CHECKER ROLE                                    │
  ├─────────────────────────────────────────────────────────────────────────────┤
  │                                                                             │
  │  INPUT:                                                                     │
  │  ───────                                                                    │
  │  • Generated content (draft)                                                │
  │  • Verified facts database entries                                          │
  │  • Required claims from researcher                                          │
  │                                                                             │
  │  OUTPUT:                                                                    │
  │  ────────                                                                   │
  │  • Validation result (pass/fail)                                            │
  │  • List of issues found                                                     │
  │  • Suggested corrections                                                    │
  │  • Citation accuracy check                                                  │
  │                                                                             │
  │  VALIDATES:                                                                 │
  │  ───────────                                                                │
  │  • Claims match verified facts exactly                                      │
  │  • Numbers/statistics are accurate                                          │
  │  • Citations are properly formatted                                         │
  │  • No unsourced claims present                                              │
  │  • Context doesn't misrepresent facts                                       │
  │                                                                             │
  └─────────────────────────────────────────────────────────────────────────────┘
  ```

