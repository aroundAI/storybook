  - H1 heading: FILM-1130: External Source Registry

  ## This Spec's Focus

  This spec covers:
  1. **Seeding default news sources** into `external_sources`
  2. **News-specific source types** and categorization
  3. **Credibility and bias tracking** for journalistic sources

  ---

