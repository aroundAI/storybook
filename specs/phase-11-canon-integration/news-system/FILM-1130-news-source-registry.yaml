  ---

  ## News-Specific Types

  These types extend the base `ExternalContextProvider` types from FILM-1135:

  ```typescript
  // packages/features/episodes/src/types/news-sources.ts

  import type { SourceCategory } from './external-context';

  /**
   * Bias label for political leaning (news-specific)
   */
  export type BiasLabel =
    | 'left'
    | 'center_left'
    | 'center'
    | 'center_right'
    | 'right'
    | 'unknown';

  /**
   * News source type (subcategory)
   */
  export type NewsSourceType =
    | 'wire_service'    // AP, Reuters, AFP
    | 'broadcaster'     // BBC, CNN, Al Jazeera
    | 'newspaper'       // NYT, WSJ, Guardian
    | 'magazine'        // Economist, Time
    | 'government'      // Official government sources
    | 'organization';   // WHO, UN, etc.

  /**
   * Bias label descriptions for UI
   */
  export const BIAS_LABEL_DESCRIPTIONS: Record<BiasLabel, string> = {
    left: 'Leans progressive/liberal',
    center_left: 'Slightly progressive',
    center: 'Generally neutral',
    center_right: 'Slightly conservative',
    right: 'Leans conservative',
    unknown: 'Bias not evaluated',
  };

  /**
   * Filter sources for balanced coverage
   * Returns sources with opposing biases for fair representation
   */
  export function getBalancedSources(
    sources: Array<{ biasLabel?: BiasLabel }>
  ): { left: typeof sources; center: typeof sources; right: typeof sources } {
    return {
      left: sources.filter(s => s.biasLabel === 'left' || s.biasLabel === 'center_left'),
      center: sources.filter(s => s.biasLabel === 'center' || s.biasLabel === 'unknown'),
      right: sources.filter(s => s.biasLabel === 'right' || s.biasLabel === 'center_right'),
    };
  }
  ```

  ---

  ## Integration with FILM-1135

  The `external_sources` table from FILM-1135 already handles:
  - ✅ Source registration with name, slug, website
  - ✅ Category field (set to `'news'` for news sources)
  - ✅ Provider type (newsapi, rss, etc.)
  - ✅ Credibility tier (tier_1, tier_2, tier_3)
  - ✅ Bias label (political leaning)
  - ✅ Rate limiting configuration
  - ✅ Cache TTL settings
  - ✅ Active/inactive status

  This spec only adds:
  - Seed data for default news sources
  - News-specific utility types and functions

