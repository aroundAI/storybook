summary: >
  /home/[account]/studio/competitors lists tracked channels with their state
  (Importing, Ready, Unavailable, Quota-limited) and an Add channel dialog.
  /home/[account]/studio/competitors/[competitorId] has the tabs Overview,
  What's working, Timing, Takeoff and Videos (with CSV export and the content
  breakdown drawer). An /admin/competitors panel shows quota, lag and Gemini
  spend. Every card has empty, collecting, quota-limited, unavailable and
  error states and a provenance chip, including the new `public` access chip.
  Design: PRD-EDD.md section 19, R-50 to R-52, R-54, R-56.
acceptance_criteria:
  - text: "Both routes exist, exported with withI18n, with page metadata, gated by the flag (404 when off), data fetched in RSC through the competitor services"
    met: false
    reason: "not met — not built"
  - text: "Add channel dialog uses react-hook-form and @kit/ui/form with the action's schema; every refusal reason renders its own message; the second submission after a refusal is asserted"
    met: false
    reason: "not met — not built"
  - text: "What's working shows top and bottom 10 by outlierScore at 7 d (toggle 24 h, 30 d) with band, lift, n, confidence and the estimated badge where public_curve_estimated"
    met: false
    reason: "not met — not built"
  - text: "Subscribers show 'rounded by YouTube'; hidden subscriber counts show 'hidden', never 0"
    met: false
    reason: "not met — not built"
  - text: "/admin/competitors (super admin at aal2) shows units per vendor per day, tracked channels, hot-window lag p95 and weekly Gemini analyses"
    met: false
    reason: "not met — not built"
  - text: "data-test on every interactive element; evidence spec screenshots every tab and state with DOM-read figures in the PR"
    met: false
    reason: "not met — not built"
