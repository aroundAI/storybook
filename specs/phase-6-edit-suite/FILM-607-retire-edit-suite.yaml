notes: |
  The inventory, the owner decisions and the ordered plan are in the
  engineering design document, `specs/plans/FILM-607-edd.md`. In short:

  | Step | PR | What |
  |---|---|---|
  | 1 | A (stop-gap) | Revoke EXECUTE on the five functions; remove the tab and the route |
  | 2 | B | Delete the package, the render worker, the queues and the WebSocket cases; drop the functions; tables read-only |
  | 3 | B | Records: FILM-601/602 RETIRED, PHASE-14 retired, KB entries resolved by removal |

  Nothing a user sees changes except the missing tab. What was measured:

  | Claim | Evidence |
  |---|---|
  | No edit is ever saved | KB-62's reproduction: `batch_save_edit_project` is not granted, and three further defects follow it |
  | No server render ever finished | KB-32: the worker's first query selects columns that don't exist (42703) |
  | No Browser Export was ever uploaded | `export-dialog.tsx:91-92` builds `projects/<edit project id>/…`; the presign route looks that id up in `projects` and returns 403 |
  | No other feature reads the Edit Suite | `git grep` for the package, tables, functions, route and queue outside the package: only the tab, the page, `apps/web/package.json`, the render worker and the migrations |
