summary: >
  The owner decided on 2026-09-23 to sunset the whole Edit Suite: it is barely used,
  a dedicated editor does the job better, and any future editor will be redesigned from
  scratch rather than restored. This spec removes everything Edit-Suite-specific — the
  episode tab and route, `@kit/edit-suite`, the render worker and its SQS queues, the
  collaborative-editing WebSocket messages and the five Edit Suite database functions —
  and closes the live cross-tenant write in `batch_assemble_edit_project` (KB-40) first,
  in a small stop-gap PR. The edit tables and their rows are kept, read-only, under the
  owner's keep-until-asked rule unless the owner decides otherwise. Exploration found the
  feature has never persisted a user's edit (KB-62), never rendered a video (KB-32) and
  never uploaded a Browser Export (the upload path names the edit project, which the
  presign route refuses), so nothing a user made in it exists outside the edit tables.
