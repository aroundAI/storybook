  - text: "CSV parsers handle fixture files for all four report types, including header-only (empty) reports"
    met: true
    evidence: "Google's documented headers for all five shapes the ingest reads (`channel_basic_a3`, `channel_combined_a3`, `channel_traffic_source_a3`, `channel_reach_basic_a1`, `channel_reach_combined_a1`) in `packages/features/content-analytics/__tests__/fixtures/youtube-reporting/`; `packages/features/content-analytics/__tests__/csv-parsers.test.ts:170`, header-only and empty `:318`"
  - text: "Matched rows land in `video_metrics` / `video_reach_daily` / `video_traffic_sources`; re-delivery does not duplicate"
    met: true
    evidence: "fake vendor, real ClickHouse (owner decision D6): `packages/features/content-analytics/__tests__/report-ingest.local-stack.test.ts:311` (one row per video/day after four deliveries), `:294`"
  - text: "Unmatched channel videos aggregate into `channel_daily` (counted + logged, never dropped silently)"
    met: true
    evidence: "core residual in `channel_daily`, reach residual in its own `channel_reach_daily` (migration `packages/clickhouse/src/migrations/011_channel_reach_residual.ts`), so neither report erases the other: `packages/features/content-analytics/__tests__/report-ingest.local-stack.test.ts:257`, `:276`, CI `packages/clickhouse/scripts/verify-queries.ts:572`; logged per report `packages/features/content-analytics/__tests__/report-ingest-run.test.ts:485`. Unmatched traffic-source rows are counted, not stored: no residual table has a source column"
  - text: "Watermark (`last_report_created_after`) advances; already-ingested reports are skipped"
    met: true
    evidence: "saved per report, never inside a run of equal createTimes, held while ClickHouse is off or a report is refused: `packages/features/content-analytics/__tests__/report-ingest-run.test.ts:392`, `:415`, `:365`, `:463`. The skip is YouTube's documented `createdAfter` filter (developers.google.com/youtube/reporting/v1/reports); the production-bundle run's second pass sent it and downloaded nothing, against a fake that applies it"
