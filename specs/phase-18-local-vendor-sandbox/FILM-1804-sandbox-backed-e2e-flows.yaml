summary: >
  Playwright specs, driven against the FILM-1802/1803 sandboxes instead of
  seeded rows, for the product surfaces that have no E2E coverage today:
  platform connect/refresh/disconnect, publishing an episode or social
  posts, project creation and every studio stage, and analytics for a
  channel the app synced itself rather than one seeded into ClickHouse.
  Because the sandbox is random per run, no test writes a number in
  advance — every figure is asserted against the sandbox's ledger, via a
  helper wrapping its control API. Must include the two regression flows
  for #278 (Instagram Reels) and #279 (TikTok success envelope), each
  proven to fail against the code before its fix.
