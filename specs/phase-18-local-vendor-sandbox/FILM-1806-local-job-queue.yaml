notes: |
  ## 1. Why this exists

  FILM-1803 made every AI vendor the app calls answerable locally, and found
  that it is not enough to run the studio: each stage is enqueued, not called
  (FILM-1803 §4). queueLlmJob (packages/features/prompt-engine/src/lib/server/sqs-helper.ts)
  throws "LLM_JOBS_QUEUE_URL not configured" without a queue; queueVoiceJob
  and queueVoiceJobs (packages/features/audio-generation/src/server/voice-queue-helper.ts)
  do the same for dialogue voice. So a laptop cannot generate a single story,
  screenplay or shot list, and cannot produce the full runs the user guides
  are to be written from.

  FILM-1803 made the workers' side ready: every prompt and the seven
  orchestrators the llm-worker runs are answered by the sandbox and proved
  through the real executors and agent runner. What is missing is the
  delivery: a queue the app can send to locally, and something that runs the
  handlers.

  ## 2. Locked decisions (proposed 2026-09-25; confirmed by the owner, 2026-09-27)

  - An emulator, not an in-process runner: ElasticMQ
    (softwaremill/elasticmq-native:1.6.12) on 127.0.0.1:4120, with every
    queue and dead-letter queue of sst.config.ts (visibility 900 s for LLM
    jobs, 300 s for voice and publish; maxReceiveCount 3). A small runner
    (apps/vendor-sandbox/src/queue/main.ts) long-polls each queue and invokes
    the real handlers with SQS-shaped events. It deletes what a handler
    finishes and leaves a failure for redelivery, then for the dead-letter
    queue.
  - The endpoint is explicit, from resolver entries (`VENDOR_URL_SQS`,
    `VENDOR_URL_DYNAMODB`, `VENDOR_URL_APIGATEWAY`), read only under
    vendorSandboxEnabled() through `awsClientOptions()`. It never comes from
    the SDK's own `AWS_ENDPOINT_URL*`, which is read in any environment.
    Queue URLs go through `queueUrlFromEnv()`, which drops a local-host URL
    outside the sandbox, because SDK v3 treats a queue URL's host as the
    endpoint.
  - A queue alone shows nothing: results reach the page over the API Gateway
    WebSocket, from connections kept in DynamoDB. So a local gateway
    (127.0.0.1:4121) runs apps/web/websocket's own $connect, $default and
    $disconnect handlers and answers the Management API's
    `POST /@connections/{id}`. dynamodb-local (amazon/dynamodb-local:2.5.3)
    on 127.0.0.1:4122 holds the connections table as sst.config.ts declares
    it. Only the AWS transport is stubbed.
  - The runner is bundled with esbuild, as SST bundles the Lambdas, and runs
    under node with the egress guard preloaded. Any non-loopback connection
    is refused and logged to .sandbox/workers-egress-blocked.log.
  - The publish queue is in scope (FILM-1802 Q5): the runner feeds
    StorybookPublishQueue to publish-worker and runs scheduled-publish every
    5 minutes, as the cron does. LinkedIn's registerUpload and ugcPosts
    calls are made by publish-worker's own handler, so they reach the
    social sandbox only through FILM-1802's resolver entries.

  ## 2a. The original shape

  - local-env.sh up starts an SQS-compatible emulator (ElasticMQ) on a local
    port with two queues named as sst.config.ts names them, and a small
    runner process that long-polls both and invokes
    apps/web/lambda/llm-worker/index.ts and apps/web/lambda/voice-worker/index.ts
    with SQS-shaped events, deleting a message on success and leaving it for
    redelivery (then the dead-letter queue) on failure.
  - The queue helpers resolve their URL as today (SST Resource, then the
    environment), and additionally, only under vendorSandboxEnabled(), the
    local emulator's queue URLs; the SQS client gets the emulator endpoint
    explicitly from a resolver entry. Outside the gate, nothing changes.
  - The runner's environment is local.env: the worker handlers reach the AI
    sandbox through FILM-1801's resolver like the app does, and local
    Supabase for rows and storage.

  ## 3. Out of scope

  - The other Lambdas (analytics sync, token refresh, email, reports): their
    local runs belong with FILM-1802's social sandbox. Publish was in this
    list, and moved into scope (see §2).
  - Scale, ordering guarantees beyond what SQS itself gives, and cost.

  ## 4. Verification

  - A unit test per helper: under production settings, with any override set,
    the message goes nowhere local (red first, as FILM-1801 and FILM-1805 did).
  - A FILM-1804 flow through every enqueued stage, with the pages read back
    against the AI sandbox's ledger.
  - The failure path: an injected sandbox failure makes a stage fail visibly in
    the app, and the message ends in the dead-letter queue.
