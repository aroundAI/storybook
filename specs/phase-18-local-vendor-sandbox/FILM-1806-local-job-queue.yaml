spec_id: "FILM-1806"
title: "Local Job Queue"
phase: 18
phase_name: "Local Vendor Sandbox"
category: feature
status: PARTIAL
effort: M
dependencies:
  - spec_id: "FILM-1801"
    note: "the same development-only gate, vendorSandboxEnabled()"
  - spec_id: "FILM-1803"
    note: "the AI sandbox answers every prompt and orchestrator the workers call"
summary: >
  Runs the llm-worker and voice-worker locally, so every studio stage -
  ideation, story, screenplay, shot list, audio cues, dialogue voice and
  translation - works end to end on a laptop against the FILM-1803 AI
  sandbox. The motivation is the owner's: generating the user guides from
  full local runs of the product. Today every one of those stages is
  enqueued to SQS and runs only in a Lambda, so on a laptop each throws
  "LLM_JOBS_QUEUE_URL not configured" before any work starts. A local queue,
  started by local-env.sh, takes the same messages and runs the same
  handlers, under FILM-1801's development-only gate so production can never
  send to it.
