notes: |
  ## 1. Overview

  Local stand-ins for the AI vendors the app still calls, so every AI action a
  user can trigger inline runs on a laptop - without API spend, without keys,
  and with outputs that are random but always consumable by the next stage. It
  runs in the same process as FILM-1802 (apps/vendor-sandbox, built here
  first), on its own ports:

  | Port | Serves | How the app reaches it |
  |---|---|---|
  | 4100 | Control API, ledger and status page (FILM-1802 §6) | — |
  | 4110 | OpenAI: GET /v1/models only, the settings page's key check | VENDOR_URL_OPENAI |
  | 4112 | Gemini: generateContent, streamGenerateContent, models list | VENDOR_URL_GEMINI (FILM-1805 Half A, #360) |
  | 4113 | ElevenLabs: text to speech (plain and streamed), voices, account, models, music (`POST /v1/music`), sound effects | VENDOR_URL_ELEVENLABS |

  Every address is reached through FILM-1801's gate (NODE_ENV development or
  test, VENDOR_SANDBOX=1, not a Lambda, a local address). No SDK's own
  base-URL variable is used: FILM-1805 Half A closed them.

  ## 2. The hard part: LLM output the app will accept

  The pipeline parses what the LLM returns, so random output must be the right
  shape for the prompt that asked. Measured across the 29 prompt files in
  packages/features/prompt-engine/src/prompts/:

  | Output declared as | Prompts | How the sandbox generates |
  |---|---|---|
  | schema: { type: 'zod', definition } | 16 | Compile the definition exactly as llm-executor.ts does, generate from the compiled schema, and check the result against it before sending |
  | A JSON Schema object | 4 | Generate from the JSON Schema |
  | Only schema_for_llm (a human-readable string) | 7 | Hand-written per-prompt template: a Zod schema of what the caller reads |
  | Nothing | 2 | Hand-written per-prompt template |

  Shape from the schema, values from the corpus. The schema decides the
  shape and the shared corpus (apps/vendor-sandbox/src/corpus) fills the
  values, matched by field name: a title gets a show title, a character a
  name from that response's cast, dialogue a line of dialogue, an enum one of
  its members. A string field no rule places is reported, and the corpus test
  fails on it, so the rules grow with the schemas.

  Identifying the prompt. A request carries the rendered prompt, not its
  slug. The sandbox recognises each prompt by the literal text between its
  {{variables}}, one group per system-prompt part: the package loader sorts
  parts by `order` and the llm-worker's renderer does not, so groups may come
  in any order. Every prompt is recognised as itself and nothing else, as each
  executor renders it (identify.test.ts). A request that matches nothing gets
  '{}', a ledger flag and a loud warning.

  Two registries. `@kit/prompt-engine` registers 27 prompts; the llm-worker
  Lambda has its own registry with two more (story-refinement,
  screenplay-refinement). The sandbox reads every prompt file on disk, and
  every-prompt.test.ts runs each prompt through the executor that uses it.

  What building it found (reproduced, filed):
  - KB-106: eight prompt files use a bare `system_prompt` string, and the
    package loader reads only `system_prompts[]`, so those eight throw before
    any LLM call - canon validation, the news services, the documentary roles
    and the act-context bridge. Fixed: the files now use `system_prompts[]`,
    and prompt-format.test.ts renders every prompt through the real loader.
  - KB-107: behind it, four wrapper_key prompts are unwrapped by executeLLM
    only when the value is an array, while every caller reads an object. Fixed: the four prompts ask for the
    wrapper their callers read, and no longer set wrapper_key.

  Driving the orchestrators. The studio stages run as agents
  (packages/agent/src/runner.ts): the model answers each turn with a tool call
  or a final answer, and tool results come back as user turns. The sandbox
  recognises each of the seven orchestrators the llm-worker runs by the first
  line of its system prompt and plays it from a short script
  (apps/vendor-sandbox/src/llm/agents/scripts.ts): the tools in the order its
  prompt prescribes, with parameters taken from its user prompt and earlier
  results, which the runner validates against each tool's own schema. Each tool
  then calls executeLLM, which the prompt generators answer. A tool that fails
  inside a run is recorded and shown on the status page.

  What driving them found (reproduced, filed):
  - KB-115: the season outliner reads `.episodes` from the array executeLLM
    has already unwrapped, so its step always fails, and season outlines come
    from the director's unvalidated final answer. Fixed: the outliner reads the
    array, a failed outliner fails the run, and prompt-format.test.ts checks
    that every caller reads the shape its prompt returns.
  - KB-116: the season-arc evaluator and the translation verifier call
    story-quality without the variables it requires.

  ## 3. Vendors: what the app still calls (2026-09-25)

  Each vendor the first draft listed was checked against what a mounted page
  or a worker can reach:

  | Vendor | Reachable? | Here |
  |---|---|---|
  | Gemini | Yes: all 29 prompts pin gemini / gemini-3.5-flash; the agent runner defaults to it; settings key check | Built (4112) |
  | ElevenLabs | Yes: dialogue TTS (voice-worker), audio-library music and sound effects, voices, account and model checks | Stand-in on 4113 |
  | OpenAI | Only settings' key check (GET /v1/models). Chat is reached only through loadConfigFromEnv, whose two users (ContinuityChecker, the element-prompt module) nothing mounts or imports | /v1/models only (4110) |
  | Anthropic, DeepSeek | No prompt, agent or call site selects them | None |
  | Voyage, OpenAI embeddings, Whisper | Their exports have no callers | None |
  | PlayHT, Udio | Registry only; PlayHT is shown "Coming Soon", disabled | None |
  | Voice cloning | VoiceCloningEditor is mounted nowhere | None |
  | Sync Labs | Retired by FILM-513 | None |
  | Suno | Being removed from the product (owner, 2026-09-25) | None |

  Audio. Every response is a valid MP3 (silent MPEG-1 Layer III frames) of
  the length the request implies: speech at about 150 words a minute, music
  and sound effects at the requested duration. Only paths ElevenLabs' API
  reference documents are served. The app's music provider calls
  `/v1/music/compose`, which the reference does not list, so it gets the
  vendor's 404 here. That is a lead, not a KB, until a real call settles it.

  ## 4. Inline or enqueued, per studio stage

  Only an inline call can reach the sandbox from a local app today. Every
  enqueued one throws "LLM_JOBS_QUEUE_URL not configured"
  (prompt-engine/src/lib/server/sqs-helper.ts) or its voice-queue equivalent
  before any vendor is called. FILM-1804 drives only the inline rows until a
  local queue exists.

  | Stage | UI action | Path | Vendor | Local today |
  |---|---|---|---|---|
  | Ideation | generateStoryIdeasAction | queueLlmJob('story-ideation') → llm-worker story-ideation → runIdeationOrchestrator | Gemini | Enqueued |
  | Story | generateFullStoryAction | queueLlmJob('story-generation') → runStoryOrchestrator | Gemini | Enqueued |
  | Story | refineStoryAction | queueLlmJob → story-refinement handler | Gemini | Enqueued |
  | Story | validateContentInlineAction | executeLLM('canon-extraction') | Gemini | Inline |
  | Screenplay | convertToScreenplayAction | queueLlmJob → runScreenplayOrchestrator | Gemini | Enqueued |
  | Shot list | generateShotListAction | queueLlmJob → runShotOrchestrator | Gemini | Enqueued |
  | Audio cues | generateAudioCuesAction, generateAudioForCueAction | queueLlmJob → audio-cue-generation / audio-file-generation | Gemini, ElevenLabs | Enqueued |
  | Dialogue voice | generateDialogueVoiceAsyncAction, batchGenerateDialogueAction | queueVoiceJob(s) → voice-worker | ElevenLabs | Enqueued |
  | Translation | translateDialogueToLanguageAction | queueLlmJob → runTranslationOrchestrator | Gemini | Enqueued |
  | Audio library | generateMusicAssetAction, generateSfxAssetAction | ElevenLabs music and sound-effects providers | ElevenLabs | Inline |
  | Season and bulk | analyzeSeasonRoadmapAction, batchGenerate*, batchConvertScreenplaysAction, batchCreateAssetsAction | queueLlmJob | Gemini | Enqueued |
  | Episode create | createEpisodeWithContextAction | queueLlmJob, on one branch | Gemini | Enqueued branch only |
  | Asset sidebar | extractDescriptionAction | executeLLM('story-generation/extract-asset-description') | Gemini | Inline |
  | Social posts | variant generation (social-post-actions.ts) | executeLLM('linkedin-post-generation') | Gemini | Inline |
  | Settings | API-key validation | fetch to each vendor's key-check endpoint | ElevenLabs, OpenAI, Gemini | Inline |

  The music cue actions in the audio studio (Suno) are left out: Suno is being
  removed.

  ## 5. What this cannot reach

  - The studio stages, until a local queue runs the llm-worker and
    voice-worker handlers (a separate spec). What this spec delivers for them
    is readiness: every prompt and every orchestrator is answered and tested.
  - Video generation: retired; there is no client.
  - Quality. Nothing here says whether a real model would produce good output.
    The sandbox exercises the pipeline, not the prompts. For real model output
    locally, FILM-1805 Half B (Ollama) is the path.

  ## 6. Out of scope

  - Social platforms — FILM-1802.
  - Research APIs (Brave, NewsAPI, Semantic Scholar, archive.org, Crossref).
  - Evaluating prompt quality or model choice.

  ## 7. Verification

  - every-prompt.test.ts: every prompt through the executor that uses it, over
    HTTP to the sandbox, with nothing mocked but a usage-log write, and any
    request leaving the machine refused and recorded.
  - gemini-wire.test.ts: the real @google/genai SDK against the stand-in,
    plain and streamed, with the vendor's key and quota errors.
  - tooling/mutation-guards/film-1803.json: every guard seen red.
  - Later: drive the inline flows in §4 in the local app with local.env
    loaded and an egress guard, and show the ledger and the pages.

  ## 8. Risk

  Schema drift. For the 16 Zod prompts it cannot happen: the sandbox compiles
  the definition the executor validates with. The other 13 are guarded by the
  every-prompt test.

  Shared trust boundary. The sandbox evaluates schema definitions the way the
  executor does. They are checked-in files, so this is the same trust the app
  already extends to them; nothing from a request is evaluated.
