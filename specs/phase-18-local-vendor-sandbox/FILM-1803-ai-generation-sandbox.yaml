summary: >
  Local stand-ins for the AI vendors the app still calls - Gemini (every
  prompt and every agent), ElevenLabs (voice, sound effects and music) and the
  API-key checks in settings - so every AI action a user can trigger inline
  runs on a laptop without keys or spend, with output that is random but
  always the shape the next stage reads. The studio stages themselves
  (ideation, story, screenplay, shot list, audio cues, dialogue voice,
  translation) are all enqueued to SQS and run only in the llm-worker and
  voice-worker Lambdas, so this spec makes them ready for a local queue - every
  prompt and orchestrator answered and tested - and a separate spec runs them.
  The hard part is LLM output: each prompt's reply is generated from that
  prompt's own schema (16 Zod, 4 JSON Schema) or a hand-written template (9),
  with values from a shared corpus matched by field name.
