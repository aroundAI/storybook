summary: >
  A local stand-in for YouTube, TikTok, Meta (Facebook and Instagram), X and
  LinkedIn that the app talks to exactly as it talks to the real vendors —
  OAuth consent and token exchange, refresh and revoke, publishing, and
  analytics — holding state that grows while it runs, with randomized but
  internally-consistent data, so connect/publish/sync flows that seeding
  cannot reach can be driven end to end on a laptop against the vendor as
  documented, not as our code assumes. Two real defects (#278 Instagram
  media_type never REELS, #279 TikTok's success envelope carrying error)
  passed every unit test because each mocked our own assumptions; both fail
  on the first sync against this sandbox.
