open_questions: []
notes: |
  ## 1. Why this exists

  FILM-1801 made every vendor host overridable for the local sandbox and,
  because an override redirects the API key that travels with the request, made
  it fail closed: honoured only when NODE_ENV is development or test by name,
  VENDOR_SANDBOX=1, the process is not a Lambda, and the target is a local
  address.

  It then found four variables that redirect LLM traffic with none of that,
  reported them, and left them alone (FILM-CC-04 KB-21):

  | Variable | Read by | Where |
  |---|---|---|
  | OPENAI_BASE_URL | the openai SDK itself | openai@4.104.0 index.js:72 — constructor({ baseURL = Core.readEnv('OPENAI_BASE_URL'), … }) |
  | ANTHROPIC_BASE_URL | @anthropic-ai/sdk itself | @anthropic-ai/sdk@0.38.0 index.js:56, same shape |
  | GOOGLE_GEMINI_BASE_URL (and GOOGLE_VERTEX_BASE_URL) | @google/genai itself | @google/genai@1.34.0 dist/node/index.mjs:19523 via getBaseUrl(options.httpOptions, …, getEnv('GOOGLE_GEMINI_BASE_URL')) |
  | LOCAL_API_URL | our code | packages/llm/src/factory.ts:79 — the local provider's base URL |

  The owner's decisions (2026-09-22):

  - None of the four is set in any environment. No proxy depends on them.
    (The first guess, that they existed for Bedrock, is wrong: Bedrock is a
    separate client, @anthropic-ai/bedrock-sdk; these are the SDKs' generic
    "point me somewhere else" hooks.)
  - The three SDK variables: close them. (§3)
  - LOCAL_API_URL stays — the owner wants to test against local models.
    The local provider is the Ollama path, it just does not know it yet;
    and it must be dev/test only. (§4)

  The two halves share one mechanism: FILM-1801's vendorUrl() and
  vendorSandboxEnabled(). Nothing new is invented here.

  ## 2. What the exploration established

  - Every LLM SDK client is constructed in packages/llm/src and nowhere else:
    providers/openai.ts:40-42, providers/anthropic.ts:41-43,
    providers/gemini.ts:59-62 (Vertex) and :65 (developer API),
    providers/deepseek.ts:41-44, providers/local.ts:50-55,
    transcription.ts:92-95 (Whisper). The lambdas call createLLMClient from
    @kit/llm (apps/web/lambda/llm-worker/llm-utils.ts:270-277).
  - Precedence in all three SDKs: an explicit constructor base URL wins; the
    env var is only the fallback when none is passed; then the hard-coded
    default. Our OpenAI, Anthropic, Gemini and Whisper clients pass none, so
    the env vars are live. DeepSeek passes one and is already closed (FILM-1801
    moved it onto vendorUrl('deepseek')).
  - The local provider is the openai SDK with baseURL
    (local.ts:50-55), defaulting to http://127.0.0.1:8000/v1 (local.ts:29)
    and to the model claude-sonnet-4-5 (factory.ts:126) — the remains of a
    "Claude Code API" assumption in local.ts:4-10, packages/llm/CLAUDE.md:36-39,
    README.md:133-142. Ollama serves exactly this protocol at
    http://localhost:11434/v1, so the provider fits it with no new code.
  - LOCAL_API_URL is read only by loadConfigFromEnv(), which only two call
    sites use (assets/src/lib/element-prompt/llm-generator.ts:36,
    episodes/src/server/continuity-actions.ts:132). The real path — the prompt
    executor, prompt-engine/src/lib/server/llm-executor.ts:342-352 — takes
    provider and model from each prompt file, all 29 of which pin
    gemini / gemini-3.5-flash, and builds the client with an explicit
    config that never carries baseUrl. So a prompt that said local would
    today ignore LOCAL_API_URL entirely. The Lambda copy
    (llm-utils.ts:274-291) has the same shape. The agent runner
    (packages/agent/src/runner.ts:364-380) defaults to gemini separately.
  - VENDORS in packages/shared/src/vendors/resolver.ts has openai,
    gemini, deepseek, voyage — and no anthropic.
  - Nothing in the repository mentions Ollama.

  ## 3. Half A — the SDKs stop reading the environment

  ### 3.1 Change

  1. Add anthropic: 'https://api.anthropic.com' to VENDORS. Entries stay
     origins; version and path belong to the caller.
  2. Pass the base URL explicitly at every construction site:

     | Site | Becomes |
     |---|---|
     | providers/openai.ts:40 | new OpenAI({ apiKey, baseURL: `${vendorUrl('openai')}/v1` }) |
     | transcription.ts:92 | same as openai |
     | providers/anthropic.ts:41 | new Anthropic({ apiKey, baseURL: vendorUrl('anthropic') }) |
     | providers/gemini.ts:65 | new GoogleGenAI({ apiKey, httpOptions: { baseUrl: vendorUrl('gemini') } }) |
     | providers/gemini.ts:59 (Vertex, GEMINI_VERTEXAI=true) | see §3.2 |

  3. ignoredVendorOverrides() (FILM-1801, logged at server start) also names
     OPENAI_BASE_URL, ANTHROPIC_BASE_URL, GOOGLE_GEMINI_BASE_URL,
     GOOGLE_VERTEX_BASE_URL if any is set — by name, never value — so a stray
     one in a deployment is visible rather than silently inert.

  ### 3.2 The Vertex path — decide, do not drift

  GOOGLE_VERTEX_BASE_URL is the same class of variable and today equally
  live on the Vertex branch. Pass it explicitly too: a vertex entry whose
  value is the regional template Google documents
  (https://{location}-aiplatform.googleapis.com), resolved with the
  GOOGLE_CLOUD_LOCATION the code already reads. If the template does not fit
  VENDORS' origin-only shape cleanly, the spec's fallback is to construct
  httpOptions.baseUrl from the SDK's own documented default inside
  gemini.ts and say so — the requirement is that the env var no longer
  decides the host, not that it goes through VENDORS.

  ### 3.3 Proof — no production anything

  Per SDK, a unit test that (a) sets the SDK's env var to a local
  listener, (b) runs under production settings (NODE_ENV=production, no
  VENDOR_SANDBOX, no AWS_LAMBDA_FUNCTION_NAME needed — the point is the
  constructor option, not the gate), (c) constructs the client through our
  provider and issues one request with the real SDK, and (d) asserts zero
  requests reach the listener and the request went to the vendor host
  pattern (intercept at the fetch layer; do not call the vendor). This is the
  method FILM-1801 used for YouTube's rootUrl. Then the positive case:
  sandbox on, VENDOR_URL_OPENAI set → the request arrives at the listener.
  That positive case is what FILM-1803 will rely on instead of
  OPENAI_BASE_URL (§6).

  ### 3.4 Guard

  Extend packages/shared/__tests__/vendor-api-versions.test.ts (or a sibling
  in packages/llm): fail on new OpenAI(, new Anthropic(, new GoogleGenAI(
  without an explicit base URL option, and on any process.env.<X>_BASE_URL
  read for a vendor host outside the resolver. Seen red on main (it names the
  four sites), then green. tooling/mutation-guards/film-1805.json.

  ## 4. Half B — local becomes the Ollama path, and only in dev/test

  ### 4.1 Retarget the defaults

  - local.ts:29 DEFAULT_LOCAL_BASE_URL → http://localhost:11434/v1.
  - factory.ts:126 default model → an Ollama tag. The spec proposes
    llama3.1; this is a placeholder for the owner to confirm, not a
    measurement. The name must be one the owner has actually pulled.
  - Rewrite the "Claude Code API / claude-sonnet-4-5" wording in local.ts:4-10,
    packages/llm/CLAUDE.md:36-39 and AGENTS.md, README.md:133-142 (the
    "Local (Development — FREE!)" block and the pricing row) to describe Ollama:
    install, ollama pull <model>, the env, one command.
  - llm-executor.ts:342-343 and llm-utils.ts default provider || 'local',
    model || 'claude-sonnet-4-5' when a prompt file omits them: change the
    model fallback to the same Ollama default, or better, make a prompt file
    without a provider a validation error — 29 of 29 set it, so nothing relies
    on the fallback. Spec's choice: validation error, one fewer place a
    stale model name can hide.

  ### 4.2 Gate it — fail closed like every other override

  - createLLMClient({ provider: 'local' }) constructs only when
    vendorSandboxEnabled() (FILM-1801's function, reused, not copied) is true.
    Otherwise it throws a named error whose message says exactly which
    conditions were not met — including VENDOR_SANDBOX=1, which is the one a
    developer will have forgotten.
  - LOCAL_API_URL keeps its name (README, CLAUDE.md and
    packages/llm/__tests__/factory.test.ts:26,207,357,429-434 reference it)
    but is validated with the resolver's parseOverride rules: http(s), a
    local address, no credentials, query or fragment. A bad value throws;
    it never falls back to the default, because a typo silently sending
    prompts to the default port is the failure this phase exists to remove.
  - In production, therefore: LLM_PROVIDER=local throws at construction,
    LOCAL_API_URL is never read. That closes KB-21's sixth variable while
    keeping the capability.

  ### 4.3 Route the real path through it

  Today, setting LLM_PROVIDER=local changes two minor call sites and leaves
  every prompt on Gemini. To use Ollama for the app:

  - A dev-only LLM_FORCE_PROVIDER=local (name to confirm), honoured in
    llm-executor.ts:342-352 and in the Lambda copy llm-utils.ts:274-291
    only when vendorSandboxEnabled() — outside the gate it is ignored
    and logged by name, like any other override. When set, the executor
    ignores the prompt file's provider and model and uses local with
    LLM_MODEL. One model for all 29 prompts; a per-prompt mapping is out of
    scope and stays so until someone needs it.
  - Plumb baseUrl through the executor's explicit config so the local
    client actually receives LOCAL_API_URL. Today it does not
    (createLLMClient({provider, model, apiKey, …}) at llm-executor.ts:344
    never passes baseUrl, so local from a prompt would hit the default
    port regardless). This is a latent bug independent of Ollama; note it in
    the PR as such.
  - The agent runner (runner.ts:364-380) honours the same override, or the
    spec records why not. Recommendation: it does — the owner's "test against
    local models" means the agent too.
  - Structured output: the executor compiles each prompt's Zod definition
    and expects JSON. Ollama's OpenAI-compatible endpoint supports
    response_format: { type: 'json_object' } / JSON schema for models that
    support it; the local client must send whatever the executor sends the
    other providers, and the E2E in §5 is what proves a real model's output
    parses. If a small model cannot satisfy a schema, that is a result to
    record, not a reason to loosen validation.

  ### 4.4 One command

  The deliverable a developer reads:

  ```bash
  ollama pull llama3.1
  VENDOR_SANDBOX=1 LLM_FORCE_PROVIDER=local LLM_MODEL=llama3.1 pnpm --filter web dev
  ```

  In README.md and packages/llm/CLAUDE.md, replacing the Claude Code API
  block. Zero vendor cost, no API keys, every prompt in the app.

  ## 5. Verification

  - Gate: unit tests — production settings → createLLMClient({provider:'local'})
    throws the named error; dev + VENDOR_SANDBOX=1 → constructs;
    LOCAL_API_URL=https://evil.example/ (non-local), http://localhost:11434/v1?x=1
    (query), http://u:p@localhost:11434/ (credentials) → throw with the
    offending rule named. Red before green: on main the first case
    constructs happily.
  - Override: unit test — a prompt pinned to gemini runs on local when
    LLM_FORCE_PROVIDER=local and the gate is on; runs on gemini when the
    gate is off with the override set (and the override is logged as ignored).
  - Half A: §3.3 per SDK, plus the §3.4 guard red on main.
  - A real prompt against a real model: one CLI or Playwright run of a
    prompt with a Zod definition (story ideation is the natural one) through
    LLM_FORCE_PROVIDER=local against a running Ollama with a small model,
    output validated by the prompt's own schema, the request captured (host
    localhost:11434, model name, response_format) and shown in the PR. If
    the implementing machine has no Ollama, the teammate runs the same test
    against a local OpenAI-compatible stub asserting the request shape, states
    that plainly, and the live Ollama run is recorded as the owner's step —
    never claimed.
  - No production credentials, config or values are used or asked for at
    any point (standing owner rule). Every listener is local.
  - pnpm typecheck, lint:fix, @kit/llm / @kit/shared /
    @kit/prompt-engine tests, format:fix.

  ## 6. Documents that change

  | File | Change |
  |---|---|
  | FILM-1803-ai-generation-sandbox.md port table rows 4110–4112 | "How the app reaches it": OPENAI_BASE_URL / ANTHROPIC_BASE_URL / GOOGLE_GEMINI_BASE_URL → VENDOR_URL_OPENAI / VENDOR_URL_ANTHROPIC / VENDOR_URL_GEMINI (FILM-1801's scheme). Its DeepSeek note becomes moot — all four LLM vendors go through vendorUrl() |
  | FILM-1801-vendor-base-url-resolver.md §9 | strike the three SDK variables and LOCAL_API_URL from "Left alone, deliberately" |
  | specs/phase-18-local-vendor-sandbox/README.md:17-18 | "Overridable today" no longer lists the LLM SDKs |
  | specs/cross-cutting/FILM-CC-04-known-bugs.md KB-21 | the four variables → "closed by FILM-1805"; entry moves to Fixed when this and FILM-513 land |
  | README.md, packages/llm/CLAUDE.md, AGENTS.md | Ollama instead of "Claude Code API"; §4.4's command |
  | specs/INDEX.md, phase-18 README table | rows |

  ## 7. What this is not

  - Not FILM-1803. That spec is a fake sandbox — structurally valid random
    output, no model, for fast deterministic E2E. This is a real local model
    mode, for judging prompt quality offline and for the owner's zero-cost
    testing. They are complementary; neither replaces the other, and the two
    should not be merged into one "local" concept.
  - Not a per-prompt model mapping, a model registry, or Ollama-specific
    API use (its native /api/* endpoints). The local provider stays a plain
    OpenAI-compatible client; anything else that speaks that protocol (LM
    Studio, vLLM, llama.cpp's server) works the same way with a different
    LOCAL_API_URL.
  - Not BYOK. external_api_keys stores vendor keys for voice providers;
    LLM keys stay in the process environment. Unchanged.

  ## 9. Risk

  Half A: low. Every change is "pass the value the SDK would have defaulted
  to anyway"; behaviour changes only if one of the env vars was set, and the
  owner has confirmed none is. The Vertex branch is the one to test with care,
  because the regional URL is built rather than constant.

  Half B: low, one sharp edge. A developer who today runs
  LLM_PROVIDER=local without VENDOR_SANDBOX=1 will get a throw where they
  used to get a client. That is the intended fail-closed behaviour; the error
  message carries the fix. The other edge is quality: a small local model may
  not satisfy a prompt's schema. That is information — the point of having a
  real-model mode — and must not be "fixed" by relaxing the executor's
  validation for local.
  ## 10. Half A as shipped (2026-09-25)

  Half A shipped on its own, ahead of Half B, because FILM-1803's sandbox
  needs the Gemini client to follow VENDOR_URL_GEMINI.

  - VENDORS gains anthropic (https://api.anthropic.com) and gemini-vertex
    (https://aiplatform.googleapis.com). §3.2 is decided by the SDK itself:
    our Vertex branch always passes an API key (Express mode), and
    @google/genai then clears project and location, so the regional
    template never applies. The host is a constant origin and fits VENDORS.
  - Every construction passes a base URL from vendorUrl(): OpenAI chat and
    Whisper (`${vendorUrl('openai')}/v1`), Anthropic (vendorUrl('anthropic')),
    Gemini developer API and Vertex (httpOptions.baseUrl).
  - SDK_BASE_URL_VARIABLES (ANTHROPIC_BASE_URL, GOOGLE_GEMINI_BASE_URL,
    GOOGLE_VERTEX_BASE_URL, OPENAI_BASE_URL) are reported by
    ignoredVendorOverrides() in every environment, and logged at server start
    by name on a line of their own.
  - The guard also fails on any process.env read of a *_BASE_URL name outside
    the resolver. SYNCLABS_BASE_URL is tolerated by name until FILM-513
    deletes lip-sync. LOCAL_API_URL is not a *_BASE_URL name and belongs to
    Half B.
  - Not covered: @google/genai also reads GEMINI_NEXT_GEN_API_BASE_URL, but
    only for its Interactions client, which nothing here constructs.
