summary: >
  FILM-1801 made every vendor host overridable and fail-closed, but found
  four LLM-related variables that redirect traffic with none of that
  protection (FILM-CC-04 KB-21): OPENAI_BASE_URL, ANTHROPIC_BASE_URL and
  GOOGLE_GEMINI_BASE_URL are read directly by their SDKs, and LOCAL_API_URL
  is our own `local` provider's base URL. The owner's decision: close the
  three SDK variables by passing the resolver's URL explicitly at every
  construction site (Half A), and keep LOCAL_API_URL but retarget the
  `local` provider to Ollama's OpenAI-compatible endpoint, gated to
  dev/test via FILM-1801's vendorSandboxEnabled(), with a
  LLM_FORCE_PROVIDER=local switch that routes all 29 prompts through it for
  zero-cost local testing (Half B).
