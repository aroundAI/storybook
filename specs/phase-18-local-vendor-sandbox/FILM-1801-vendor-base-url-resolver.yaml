spec_id: "FILM-1801"
title: "Vendor Base-URL Resolver"
phase: 18
phase_name: "Local Vendor Sandbox"
category: feature
status: DONE
audited: "2026-09-23"
effort: L
dependencies:
  - spec_id: "FILM-1723"
    note: "not a hard dependency — do with or after it; both edit the same host constant files, so doing them apart edits the same lines twice"
summary: >
  Every social platform and most AI vendors were reached through hardcoded
  https:// literals, often the same host written in several files, so a
  local sandbox could not be pointed at from the app without editing code.
  This spec builds one function, vendorUrl(vendor), through which every
  vendor host in the codebase resolves, with an environment override
  honoured only in local development — and, as shipped, only under a
  stricter multi-condition gate than originally sketched: an allow-listed
  NODE_ENV, VENDOR_SANDBOX=1, no Lambda runtime, and a validated local
  address. A repo-scan guard fails on any host literal outside the
  resolver. Shipped as 29 named vendors, with production behaviour
  unchanged and verified byte-identical against the pre-refactor URLs.
acceptance_criteria:
