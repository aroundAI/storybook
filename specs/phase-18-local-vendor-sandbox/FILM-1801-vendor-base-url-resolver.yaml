open_questions: []
notes: |
  ## 1. Why this exists

  A local sandbox is useless if the app cannot be pointed at it. Today it cannot.
  Every social platform and most AI vendors are reached through https:// literals,
  and the same host is often written in several places:

  | Vendor | Where the host is written today |
  |---|---|
  | Meta Graph (Facebook, Instagram) | publishing/src/oauth/meta/config.ts:7-9, publishing/src/providers/facebook/types.ts:90-91, publishing/src/providers/instagram/instagram-provider.ts:10, content-analytics/src/providers/instagram/instagram-insights.ts:15, publishing/src/lib/token-refresh.ts:432,475, apps/web/lambda/publish-worker/handlers/{facebook,instagram}.ts, apps/web/app/api/platforms/callback/meta/route.ts |
  | TikTok | publishing/src/oauth/tiktok/config.ts, publishing/src/providers/tiktok/tiktok-provider.ts:12, content-analytics/src/providers/tiktok/tiktok-analytics.ts, publishing/src/lib/token-refresh.ts:379, publishing/src/oauth/tiktok/refresh.ts, apps/web/lambda/publish-worker/handlers/tiktok.ts |
  | X | publishing/src/oauth/twitter/config.ts, publishing/src/providers/twitter/twitter-provider.ts:12-13, apps/web/lambda/publish-worker/handlers/twitter.ts |
  | LinkedIn | publishing/src/oauth/linkedin/config.ts, publishing/src/providers/linkedin/linkedin-provider.ts, publishing/src/lib/token-refresh.ts:527, apps/web/lambda/publish-worker/handlers/linkedin.ts, apps/web/lambda/publish-worker/index.ts |
  | Google OAuth | publishing/src/oauth/youtube/config.ts, publishing/src/lib/token-refresh.ts:336, apps/web/app/api/platforms/callback/youtube/route.ts |
  | YouTube Data / Analytics / Reporting | SDK defaults in googleapis and @googleapis/youtube — never given rootUrl |
  | ElevenLabs, PlayHT, Suno, Udio | audio-generation/src/lib/constants.ts and providers accept a baseUrl option that config-loader.ts never fills; ElevenLabs is also hardcoded in apps/web/lambda/voice-worker, apps/web/lambda/llm-worker and server actions |
  | DeepSeek | packages/llm/src/providers/deepseek.ts passes a hardcoded baseURL, which beats OPENAI_BASE_URL |
  | Voyage, OpenAI embeddings (raw) | apps/web/lambda/llm-worker/utils/voyage-embedder.ts, audio-generation/src/lib/audio-embedding.ts |

  This spec makes every one of them resolvable through one function, overridable in
  local development only.

  It is the same edit FILM-1723 makes for API versions — one pinned version per
  vendor, currently v18.0, v19.0 and v23.0 for Graph alone. Doing the two separately
  rewrites the same lines twice.

  ## 2. The shape

  ```ts
  // packages/shared/src/vendors/index.ts — pure, no server-only imports
  export const VENDORS = {
    'meta-graph':       'https://graph.facebook.com',
    'meta-oauth':       'https://www.facebook.com',
    'tiktok':           'https://open.tiktokapis.com',
    'tiktok-oauth':     'https://www.tiktok.com',
    'x-api':            'https://api.twitter.com', // FILM-1723 moves X to api.x.com
    'x-upload':         'https://upload.twitter.com',
    'x-oauth':          'https://twitter.com',
    'linkedin-api':     'https://api.linkedin.com',
    'linkedin-oauth':   'https://www.linkedin.com',
    'google-oauth':     'https://accounts.google.com',
    'google-token':     'https://oauth2.googleapis.com',
    'google-apis':      'https://www.googleapis.com',   // googleapis rootUrl
    'elevenlabs':       'https://api.elevenlabs.io',
    // …one entry per host in §1
  } as const;

  export type Vendor = keyof typeof VENDORS;

  export function vendorUrl(vendor: Vendor): string;
  ```

  - Override: VENDOR_URL_<NAME> (e.g. VENDOR_URL_META_GRAPH), honoured only
    under §3's conditions.
  - Versions stay separate. vendorUrl('meta-graph') returns a host;
    ${vendorUrl('meta-graph')}/${GRAPH_VERSION} composes it with FILM-1723's pinned
    version. The sandbox then serves every version path, which is itself a check that
    nothing pins a stray one.
  - SDKs: googleapis and @googleapis/youtube each get rootUrl from the
    resolver (they ship separate copies of googleapis-common, so a global option on
    one does not reach the other). DeepSeek's hardcoded baseURL is replaced. The
    audio providers' existing baseUrl option is finally wired.
  - Browser-facing URLs. OAuth authorize URLs are followed by the user's
    browser, so the override for those must be reachable from the browser —
    http://localhost:4101, not a container hostname.

  ## 3. It must not reach production

  An override is honoured only when both hold:

  1. process.env.NODE_ENV !== 'production', and
  2. process.env.VENDOR_SANDBOX === '1'.

  Otherwise vendorUrl returns the real host and ignores VENDOR_URL_* entirely. On
  top of that, at server start in production, any VENDOR_URL_* present in the
  environment is logged as an error and ignored — a misconfigured deploy
  degrades to the real vendor, never to a dead loopback address.

  The lambdas under apps/web/lambda/* are production-only and never local; they use
  the resolver so the literal disappears, but they will never see the override.

  (See "§3 as shipped" below — the shipped rule is stricter than this sketch.)

  ## 4. The guard

  A repo-scan test in the shape of
  packages/features/content-analytics/__tests__/platform-field-names.test.ts:

  - No vendor host literal outside the resolver. Every host in VENDORS is
    searched for across packages/ and apps/, excluding tests and the resolver
    itself. A match fails with the file and line and names the vendorUrl() call to
    use.
  - The host list is read from the resolver, not restated, so adding a vendor
    there extends the guard automatically.
  - Production fails closed. A unit test sets NODE_ENV=production,
    VENDOR_SANDBOX=1 and VENDOR_URL_TIKTOK=http://localhost:4102, and asserts the
    real host comes back.

  Both get entries in tooling/mutation-guards/film-1801.json: re-add a literal host
  in a provider (must go red), and make the resolver honour an override in
  production (must go red).

  ## 5. Out of scope

  - The sandbox itself — FILM-1802, FILM-1803.
  - Choosing which API version each vendor pins — FILM-1723.
  - Stripe, Lemon Squeezy, S3/R2/B2, SES, SQS, Sentry: already avoided locally
    (apps/web/next.config.mjs aliases Stripe and Sentry in development; storage is
    Supabase; mail goes to Inbucket) or env-overridable by their SDKs.

  ## 7. Verification

  - pnpm --filter @kit/shared test and the guard test.
  - A before/after table of every call site's resolved URL with no override set —
    they must be byte-identical. This is the check that the refactor changed nothing
    in production.
  - With VENDOR_SANDBOX=1 and one override, one real request per vendor lands on a
    local listener (nc -l is enough before FILM-1802 exists).
  - pnpm --filter web build:test and a production next build both pass.

  ## 8. Risk

  A refactor of every outbound call is the kind of change that breaks production
  quietly. The before/after URL table in §7 is the mitigation, and it must be
  produced, not assumed.

  The override becoming a production foot-gun is what §3's double condition and
  fail-closed logging exist for. The mutation guard proves the condition is load-bearing.

  ## 9. What was found and done (2026-09-22)

  Landed on main as #304: the first PR, #291, merged into FILM-1723's branch
  after that branch had already merged, so none of it reached main until the
  re-land.

  Stacked on FILM-1723 (#284), which had already put Meta, X and LinkedIn's version
  in packages/shared/src/vendors/ with each host in a private *_HOST constant. This
  spec swapped those constants for the resolver and swept everything #284 left.

  Shipped names. @kit/shared/vendors now exports VENDORS, Vendor,
  vendorUrl(vendor, env?), vendorUrlEnvName(vendor), vendorSandboxEnabled(env?)
  and ignoredVendorOverrides(env?), from resolver.ts. The override for a vendor
  is VENDOR_URL_ + its name upper-cased with - as _. The 26 names
  (29 shipped; FILM-513 removed synclabs with lip-sync, FILM-514 removed suno and udio):

  meta-graph, meta-graph-video, meta-oauth, tiktok, tiktok-oauth, x-api,
  x-oauth, linkedin-api, linkedin-oauth, google-oauth, google-token,
  youtube-data, youtube-analytics, youtube-reporting, gemini, openai,
  deepseek, voyage, elevenlabs, playht, piapi,
  brave-search, semantic-scholar, newsapi, archive-org, crossref.

  Four places where §2's sketch was wrong, and what shipped instead.

  | §2 said | Found | Shipped |
  |---|---|---|
  | 'google-apis': 'https://www.googleapis.com' as the googleapis rootUrl | Neither SDK calls that host. Both default to https://youtube.googleapis.com/; Analytics and Reporting have hosts of their own. www.googleapis.com appears here only inside OAuth scope identifiers, which are names, not requests, and must never follow an override | youtube-data, youtube-analytics, youtube-reporting, each the SDK's own default, so production is unchanged. FILM-1802's port table is updated to these names |
  | x-upload, upload.twitter.com | FILM-1723 retired it; the upload is /2/media/upload on api.x.com | No x-upload. x-api covers it |
  | An instance rootUrl redirects an SDK client | googleapis-common rewrites options.url from the client's rootUrl but not mediaUrl, so videos.insert and thumbnails.set - the two calls that carry the video - kept going to the real host | rootUrl is also passed per call on both uploads, in the provider and in the publish lambda. Found by running the real SDK against a listener, which is now youtube-root-url.test.ts in @kit/publishing and @kit/content-analytics (the two SDKs bundle separate copies of googleapis-common, so each has its own) |
  | Honour an override when NODE_ENV !== 'production' | The worker lambdas in sst.config.ts set no NODE_ENV - only the web function does. Under that rule a production publish worker with VENDOR_SANDBOX=1 and a VENDOR_URL_* would have sent OAuth tokens wherever it named | §3 as amended below |

  §3 as shipped - stricter than written, never looser. An override is honoured
  only when all of these hold; anything unrecognised refuses:

  1. NODE_ENV is development or test, by name - an allow-list, so unset,
     staging and Production all refuse.
  2. VENDOR_SANDBOX is exactly 1.
  3. AWS_LAMBDA_FUNCTION_NAME is unset. The Lambda runtime reserves it, so no
     deploy configuration can clear it.
  4. The value is an http(s) URL on a local address - localhost,
     *.localhost, 127.0.0.0/8, [::1], host.docker.internal, or a dotless
     container name - with no credentials, query or fragment. A sandbox is never
     anywhere else, and a public address is exactly what an exfiltration needs.

  With the sandbox on, a value failing (4) throws, naming the variable, rather
  than falling back: a typo in local.env must not send a development session to
  the real vendor unnoticed. With it off the variable is never read, so
  production cannot throw on it. apps/web/instrumentation.ts logs every ignored
  VENDOR_URL_* as an error at server start - by name, never by value.

  NODE_ENV is read from process.env at run time, deliberately not written as
  process.env.NODE_ENV: next build inlines that expression as production even
  under build:test, and NODE_ENV=test next start is the server FILM-1804's flows
  run against. A production deploy still refuses, because its run-time NODE_ENV is
  production.

  The guard is one scanner, not two. vendor-api-versions.test.ts (FILM-1723)
  now also derives one host rule per entry in VENDORS; the FILM-1723 version rules
  are unchanged and its mutation guards all still go red (one was repointed from
  x.ts to resolver.ts, where the X host now lives). Host rules skip test files;
  version rules still scan them.

  Public pages are allowed, by path. www.facebook.com, www.tiktok.com,
  www.linkedin.com, x.com and archive.org serve an OAuth dialog or an API
  and pages a person opens: permalinks, share intents, embeds, a footer link. No
  credential rides on those and no sandbox should serve them, so the guard strips a
  short list of public-page paths from a line before searching it. Anything else
  on those hosts fails - a mutation guard writes a LinkedIn token URL beside a
  permalink in the same file and must go red. The permalinks themselves were left
  as literals on purpose: they are not requests.

  Left alone, deliberately.

  - (No longer left alone.) OPENAI_BASE_URL, ANTHROPIC_BASE_URL,
    GOOGLE_GEMINI_BASE_URL and LOCAL_API_URL were on this list, honoured in
    production with none of §3's conditions. FILM-1805 closed them: every
    LLM SDK client is built with a base URL from vendorUrl(), so the SDK
    variables are never read (Half A, #360), and LOCAL_API_URL is read only
    under vendorSandboxEnabled() and held to the resolver's rules (Half B,
    #482). FILM-1803 reaches the LLM vendors through VENDOR_URL_* instead.
    SYNCLABS_BASE_URL and WAV2LIP_API_URL were also on this list; FILM-513
    deleted lip-sync and both variables with it (#371).
  - Resend (packages/mailers/resend, the email-worker lambda): §5 - local mail goes
    to Inbucket.
  - LinkedIn has no revoke call anywhere, so there was nothing to route.
  - The audio providers' baseUrl constructor option still exists and
    config-loader.ts still does not fill it; the default each falls back to now
    comes from the resolver, which is what makes them redirectable.

  Verification, with results.

  - Before/after, no override set: 50 URL literals across 28 files compared
    mechanically from git diff - 0 differ. 9 SDK-built URLs (Data, upload,
    Analytics, Reporting, report download) compared by capturing the final URL
    with a gaxios adapter, with and without rootUrl - 0 differ.
  - End to end on a throwaway listener (localhost:3117), each run a fresh process
    with all 29 VENDOR_URL_* set: NODE_ENV=development VENDOR_SANDBOX=1 - 36
    requests arrived, one per vendor plus real call sites (TikTok, LinkedIn and
    Google token URLs, Graph /v23.0/me/accounts, X /2/media/upload/initialize,
    Brave search, a DeepSeek chat completion through the OpenAI SDK).
    NODE_ENV=production VENDOR_SANDBOX=1, NODE_ENV unset, development inside a
    Lambda runtime, and development without VENDOR_SANDBOX - every vendor
    resolved to its real host, all 29 variables reported as ignored, 0 requests
    arrived.
  - Mutation guards: python3 tooling/mutation-guards/run.py --kind unit - every
    guard red under its mutation, including all 14 of FILM-1723's and the 21 added
    in film-1801.json.
  - Lambdas: no tsconfig covers apps/web/lambda, so all 11 were bundled with
    esbuild as SST does. All bundle; the three that call a vendor carry the
    resolver.
  - Builds: pnpm --filter web build:test passed, and its server bundle shows the rule compiled as a run-time read ("development"===a.NODE_ENV||"test"===a.NODE_ENV), not inlined. Production next build passed once given an https NEXT_PUBLIC_SITE_URL, which the local .env.production lacks - unrelated to this change. next start on that build with two VENDOR_URL_* set logged one level: error line naming both and neither value.
