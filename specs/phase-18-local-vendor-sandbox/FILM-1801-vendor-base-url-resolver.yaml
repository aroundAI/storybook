    met: true
    evidence: "packages/shared/src/vendors/resolver.ts; vendor-api-versions.test.ts derives one host rule per VENDORS entry"
  - text: "googleapis and @googleapis/youtube both take rootUrl from the resolver"
    met: true
    evidence: "youtube-data/youtube-analytics/youtube-reporting VENDORS entries; rootUrl also passed per call on both uploads (mediaUrl is not rewritten by rootUrl alone) — youtube-root-url.test.ts in @kit/publishing and @kit/content-analytics"
  - text: "DeepSeek's hardcoded baseURL and the audio providers' unwired baseUrl are replaced by the resolver"
    met: true
    evidence: "VENDORS entries for deepseek, elevenlabs, playht in packages/shared/src/vendors/resolver.ts (suno and udio were removed with their providers, FILM-514)"
  - text: "OAuth authorize, token, refresh and revoke URLs all resolve through it, for all five social platforms"
    met: true
    evidence: null
  - text: "An override is honoured only with NODE_ENV !== 'production' and VENDOR_SANDBOX=1"
    met: true
    evidence: "Shipped stricter than sketched: NODE_ENV is development or test by exact name (an allow-list, not a negation), VENDOR_SANDBOX==='1', AWS_LAMBDA_FUNCTION_NAME unset, and the value must be a validated local-address URL with no credentials/query/fragment"
  - text: "In production a VENDOR_URL_* is logged as an error and ignored, never used"
    met: true
