notes: >
  Why additive and not a new format: Velorn's stores, exporter and MCP
  snapshot all read project.comfystudio; a parallel format would fork the
  whole app. The op log is the durable truth for 'what did the AI change';
  Velorn's undo stack (timeline history plus projectHistory, max 25) stays
  for fast interactive undo. Snapshots make restore O(1) so a version is as
  cheap to return to as to create.

  Slice A (aroundAI/storybookstudio#5, fork main dc20b56) recorded and the
  pin bumped in #621. Decisions: the fork's
  src/studio/contracts/explain-why-report.schema.js is a copy written from
  FILM-2003's field list because FILM-2003 had not landed; the sync script
  replaces it. Registration points touched: electron/main.js (require and
  register), electron/preload.js (studioEdits block) and
  src/services/mcpActions.js (runMcpAction and the import). The op log uses
  its own <project>/edits/** bridge (electron/studio/editsFiles.js) because
  AC5 needs append and fsync; checkpoints (FILM-2010) use fs:writeFile, and
  both live under edits/. zod is a renderer dependency, the same major as
  StoryBook. Hand edits made through a component's direct setState are not
  logged. Restore returns the timeline to the version's snapshot (taken at
  creation); its op range is the ops after that point.
