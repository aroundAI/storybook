summary: >
  The Studio's project format is Velorn's project.comfystudio plus four
  additive fields (asset.role, asset.semantic, asset.analysis,
  clip.metadata.semantic/origin, timeline.studio, project.studio), an
  append-only operation log and named versions. Stock Velorn opens a Studio
  project and ignores the extra fields; the Studio opens any Velorn project.
  The project builder is a pure function from (edit package, probed assets,
  brand, policy) to project JSON that assembles the rough cut: shots on
  video-1 at their planned times, dialogue per language, music/SFX/ambience
  on their buses, captions on a captions track, one marker per scene, Veo
  shot audio ducked under dialogue. Every applied MCP action and every hand
  edit appends to edits/oplog.jsonl with who, what, why and the inverse; a
  version is a snapshot plus the op range since; the explain-why report is
  derived from the log. Design: PRD-EDD.md Part 2 "Project format: EditGraph
  v1" and Part 1 R-13, R-22, R-24, R-31, R-32.
