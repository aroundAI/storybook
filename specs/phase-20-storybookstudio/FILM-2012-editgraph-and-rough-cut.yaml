notes: >
  Why additive and not a new format: the upstream editor's stores, exporter and MCP
  snapshot all read project.storybookstudio; a parallel format would fork the
  whole app. The op log is the durable truth for 'what did the AI change';
  the upstream editor's undo stack (timeline history plus projectHistory, max 25) stays
  for fast interactive undo. Snapshots make restore O(1) so a version is as
  cheap to return to as to create.

  Slice A (aroundAI/storybookstudio#5, fork main dc20b56) recorded and the
  pin bumped in #621. Decisions: the fork's
  src/studio/contracts/explain-why-report.schema.js is a copy written from
  FILM-2003's field list because FILM-2003 had not landed; the sync script
  replaces it. Registration points touched: electron/main.js (require and
  register), electron/preload.js (studioEdits block) and
  src/services/mcpActions.js (runMcpAction and the import). The op log uses
  its own <project>/edits/** bridge (electron/studio/editsFiles.js) because
  AC5 needs append and fsync; checkpoints (FILM-2010) use fs:writeFile, and
  both live under edits/. zod is a renderer dependency, the same major as
  StoryBook. Hand edits made through a component's direct setState are not
  logged. Restore returns the timeline to the version's snapshot (taken at
  creation); its op range is the ops after that point.

  Slice B (aroundAI/storybookstudio#6, squash 4e3c581) recorded and the pin
  bumped in #622; every criterion is met. The explain-why report schema,
  qa-result, delivery-package, edit-events and render-presets are now
  generated .mjs copies of StoryBook's contracts and replace slice A's
  hand-written report schema; report.js emits style {shotCount, hookType:
  null} (report.js:222); docs/AI_EDITOR_CONTRACT.md IN1, IN4 and L3 follow;
  ci.yml and nightly.yml fetch upstream fdd8255 by SHA. Entry point for
  FILM-2011: openStudioProjectFromPackage(pkg, probedAssets, {projectPath,
  brand?, policy?, options?}) (editLogRuntime.js:172) returns {projectPath,
  project, version, warnings, written}; probedAssets is keyed by media key
  {path, duration, fps, width, height, codecs, hasAudio}, and a missing key
  becomes an offline asset. Warning codes: media_offline, shot_packed,
  shot_overlap, clip_shortened, dialogue_start_from_shot,
  dialogue_without_duration, audio_without_duration, dub_without_line,
  overlap_lane, captions_empty, scene_without_shots. Caveats: render-presets.ts
  is not a *.schema.ts, so scripts/sync-studio-contracts.mjs does not copy it
  although delivery-package.schema.ts imports it (the fork rendered it with
  the script's own function; the script should include it, a FILM-2001/2003
  follow-up, or StoryBook's --check misses that file); the upstream editor's
  placeLiveCaptions removes every other captions clip when it regenerates, so
  FILM-2016 and FILM-2019 must handle a second language before calling it.
  Bug found by the builder tests: volumeToGainDb(0) returned 0 dB instead of
  the -24 dB floor (fixed).
