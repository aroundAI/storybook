spec_id: "FILM-2019"
title: "Localization Lanes: One Master Edit, Many Language Renders"
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: PARTIAL
effort: L
dependencies:
  - spec_id: "FILM-2007"
    note: "localize_episode produces the dubbed lines the lanes import"
  - spec_id: "FILM-2016"
    note: "stems and per-language dialogue buses"
  - spec_id: "FILM-2017"
    note: "per-language delivery renders"
summary: >
  One master timeline, many languages, no per-language timelines. The owner
  lifted this spec's v2 deferral on 2026-10-05; aroundAI/storybookstudio#31
  (part A) builds the lanes, the render selection, the language variant and
  the language check, and not the graphics refit (notes).
  Dialogue and caption tracks carry a language; every element has
  languageDependency (none, language, locale); a render selects a language,
  including tracks that match it or are language-independent and muting the
  rest. Composition props with languageDependency language take localized
  strings from the package's dubbed block and refit (Remotion measures text
  and adjusts font size, wrapping and duration within tolerance, FILM-2018).
  studio_create_variant {kind: language} imports the dubbed lines StoryBook
  produced (FILM-2007), places them by timelineStart, re-runs captions for
  that language, renders per preset and QA-checks language mismatch (whisper
  language detection on the mix). Design: PRD-EDD.md Part 2 "Audio, captions,
  compositions and localization" (localization); Part 4 flow 5; Part 1 R-51.
acceptance_criteria:
  - text: "Tracks carry language (BCP-47) and elements carry languageDependency; the builder (FILM-2012) sets none on video, music, sfx, ambience and shot audio, language on dialogue and captions"
    met: true
    evidence: "aroundAI/storybookstudio#31 (merged as 6b65641, at storybookstudio@418e8a8 src/studio/projectBuilder.js:48 LANGUAGE_DEPENDENT_ROLES (dialogue, caption), :49 languageDependencyForRole, :173 on every imported asset, :227 on every clip's metadata, :548 a dialogue track carries its language, :577 a captions track carries its language; tests/studio/language-lanes.test.mjs:35 the built fixture has Captions (en), Captions (hi), Dialogue (en), Dialogue (hi) with their languages, language on dialogue and caption clips, none on video, shot audio, music, sfx and ambience)"
  - text: "Render selection: export_timeline and export_delivery_batch take a language; tracks whose language matches or is none are included, others muted; captions burned or sidecar in that language"
    met: true
    evidence: "aroundAI/storybookstudio#31 (at storybookstudio@418e8a8 src/studio/localization/selection.js:19 elementLanguage, :35 trackForLanguage, :45 selectLanguage: one rule, and the language's own lane plays in its render though the editor mutes it; read by src/studio/delivery/exportFilter.js:15, which src/services/exporter.js:1142 applies for export_timeline and export_delivery_batch (electron/mcpServer.js:10611 languages, one file per preset and language), by src/studio/review/renderPlan.js:209, :221 and :261 for the delivery and preview renders, and by the interim renderer electron/studio/deliveryRender.js:300; captions burned through libass (deliveryRender.js:332) or written as the sidecar; tests/studio/language-lanes.test.mjs:54 a Hindi render hears the Hindi lane and shows its Devanagari captions, an English render is unchanged, export_timeline's filter selects the same way, and captions the policy turned off stay off; tests/studio/language-delivery.test.mjs:83 the 16:9 sidecar carries the Hindi cues). deliveryRender.js:67 keeps its own inLanguage helper with the same rule beside selection.js"
  - text: "studio_create_variant {kind: language, language} pulls the dubbed block via re-sync (FILM-2011), creates a Dialogue:<lang> track from dubbed_dialogue_lines at timelineStart, runs studio_add_captions for the language, and re-renders compositions with localized strings (FILM-2018)"
    met: false
    reason: "Built except the composition step. aroundAI/storybookstudio#31 (at storybookstudio@418e8a8 electron/studio/deliver.js:62 kind language and its presets, :634, :668 createLanguageVariant, :670 reads the dubbed block from the pulled package, :710 applies through the renderer action studio_apply_language_lane (src/studio/delivery/rendererActions.js:45, one undo step at :69; src/services/mcpActions.js:8961) or, with no window, :715 writes the project file; src/studio/localization/lanes.js:52 buildLanguageLane puts a Dialogue (<lang>) lane on the master placed by the builder's own code (:64), and a Captions (<lang>) track (:109) whose cues come from the dubbed text where each dub plays (:40 laneCaptionCues), styled and placed by studio_add_captions' placement step (:103) rather than transcribed; applied, each preset renders into renders/<version>/languages/ (deliver.js:726) and is QA-checked; tests/studio/language-lanes.test.mjs:113 the Hindi lane on a master pulled before the dub, a re-run replaces it, :153 no dub says to localize_episode and re-sync; tests/studio/language-lane-editor.test.mjs:78 the lane lands on the open master as one undo step and survives a save). Not built: re-rendering compositions with localized strings, which needs the refit (criterion 4). Deviations: the variant reads the dubbed block the last re-sync pulled and does not run one itself (lanes.js:58 names studio_check_updates and studio_apply_updates); the track is named Dialogue (<lang>), not Dialogue:<lang>. The variant card still says compositions are not in this build (deliver.js:692), which has been stale since #32 merged them"
  - text: "Localized graphics refit: text measured per language; font size reduced to a floor, then wrapping, then duration extended within 20%; a string that still does not fit is a QA issue 'localized text exceeds container' with the element id"
