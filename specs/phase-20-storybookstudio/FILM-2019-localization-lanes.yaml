  - spec_id: "FILM-2017"
    note: "per-language delivery renders"
summary: >
  One master timeline, many languages, no per-language timelines. The owner
  lifted this spec's v2 deferral on 2026-10-05; aroundAI/storybookstudio#31
  (part A) builds the lanes, the render selection, the language variant and
  the language check, and #38 (part B) the graphics: each language's words
  on the master's graphics, refit to fit and rendered per language (notes).
  Dialogue and caption tracks carry a language; every element has
  languageDependency (none, language, locale); a render selects a language,
  including tracks that match it or are language-independent and muting the
  rest. Composition props with languageDependency language take localized
  strings from the package's dubbed block and refit (Remotion measures text
  and adjusts font size, wrapping and duration within tolerance, FILM-2018).
  studio_create_variant {kind: language} imports the dubbed lines StoryBook
  produced (FILM-2007), places them by timelineStart, re-runs captions for
  that language, renders per preset and QA-checks language mismatch (whisper
  language detection on the mix). Design: PRD-EDD.md Part 2 "Audio, captions,
  compositions and localization" (localization); Part 4 flow 5; Part 1 R-51.
