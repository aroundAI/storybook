notes: >
  Separating language-independent from language-dependent content is what
  makes localization a compilation step rather than six edits; the stems from
  FILM-2016 are what make the mix cheap to rebuild per language.

  Owner decision, 2026-10-05: the v2 deferral is lifted. Built in
  aroundAI/storybookstudio#31 (merged as 6b65641, at storybookstudio@418e8a8,
  part A): criteria 1, 2, 5 and 6, and criterion 3 except the composition
  re-render. The graphics refit (criterion 4) is not built.

  The open question (a dubbed line longer than the original shot) was
  answered with the lead default, speed-fit with a 0.9 floor
  (src/studio/localization/fit.js:16 DUB_SPEED_FLOOR, :23 fitDubbedLine): a
  dub plays at the speed StoryBook fitted it with, never slower than 0.9; one
  that still runs past its slot is sped up to fit, up to 1.25; one that
  still overruns is never trimmed and the picture is never extended, so it
  is placed whole and reported as dub_overruns_slot
  (src/studio/projectBuilder.js:435). Tested at
  tests/studio/language-lanes.test.mjs:86.

  Fixed on the way, in the same PR: placeLiveCaptions replaced every
  language's captions and now regenerates one language's clip only
  (src/stores/timelineStore.js:1376, src/services/mcpCaptions.js:339;
  tests/studio/language-lanes.test.mjs:174); Devanagari and other complex
  scripts are burned through libass with shaping=complex
  (electron/studio/deliveryRender.js:332, electron/studio/previewRender.js:257);
  a cue placed for another aspect is placed again for the render's
  (previewRender.js:247); Devanagari emphasis matching keeps vowel signs
  (src/studio/captions/layout.js:45; language-lanes.test.mjs:161); the
  caption canvas falls back to named Devanagari fonts
  (src/utils/kineticCaptionRenderer.js:466).

  Real whisper.cpp run, recorded in the fork PR: whisper-cli v1.9.1 built by
  whisper-mac-engine.yml run 37312513952 (publish=false) with ggml-base.bin.
  The Hindi render was detected as hi, p = 0.961, a pass; English dialogue
  in the Hindi lane was detected as en, p = 0.986, a fail. The test is
  tests/studio/language-delivery.test.mjs:219, which skips without
  STUDIO_WHISPER_CLI, STUDIO_WHISPER_MODEL and macOS's Lekha voice, so CI
  does not run it.
