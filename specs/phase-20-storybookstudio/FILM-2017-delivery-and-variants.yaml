open_questions:
  - "Burn captions into 9:16 renders by default (platform norms) or sidecar only? Recommended: burn for shorts/tiktok/reels, sidecar for youtube_16x9 and master."
notes: >
  Confirmation is enforced in the tool, not only in the UI: studio_deliver
  with confirm:true but without the renderer's one-time confirmation token is
  refused, so an external MCP client cannot upload without the user seeing
  the summary. This is the outward-facing step the PRD singles out.

  Built in aroundAI/storybookstudio#10 (pinned at storybookstudio@69426c2 by
  #627). Lead defaults taken for the open question: captions are burned on
  shorts_9x16, tiktok_9x16, reels_9x16 and square_1x1 and sidecar VTT on
  youtube_16x9 and master; renders run one at a time inside the delivery job;
  the variants are main-process tools that return FILM-2013's plan-card shape
  and are not registered intent compilers. One confirmation-token store only
  (studioMain.deliver.issueConfirmationToken, bound to the summary hash, one
  use, 10 minutes), which FILM-2015's Deliver screen delegates to. Stand-ins
  until FILM-2014: the interim renderer (top picture clip with transforms,
  language audio at linear gain with a -3 dBFS limiter, captions burned or
  sidecar; no transitions, effects, text or shape clips) and the inline QA
  (ffprobe, ebur128, a 500 MB cap, reframe warnings as reframe_no_subject at
  severity 0.3). M3 exit check met 2026-10-05: pull, Short, two renders,
  deliver_edit (TARGET_CHANGED, then retry), episode ready, the publish page
  lists the renders, 59.4 s. Resolved: src/studio/intents/variants.js:15 imports
  lineImportance from ./common.js (storybookstudio@e1f0b0b), so the weights
  live once.

  Fix in aroundAI/storybookstudio#15 (merged as f041b9f, pinned at
  storybookstudio@31127e4 by #630), found in the packaged-app run of FILM-2015:
  the delivery summary hash included timeline.modified, so the confirmation
  token never matched after a save; it now ignores that field. A delivery
  summary also no longer journals a save as an 'ai save_project' op. FILM-2014
  (aroundAI/storybookstudio#12) replaced the interim renderer and inline QA
  with the media-preparation queue and qa.js. The Deliver screen e2e was run in
  FILM-2015's packaged-app Re-runs 2 and 3 (see that record).
