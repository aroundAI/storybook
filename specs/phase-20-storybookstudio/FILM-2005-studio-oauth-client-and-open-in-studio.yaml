spec_id: "FILM-2005"
title: "The StorybookStudio OAuth Client and \"Open in Studio\""
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: PARTIAL
effort: M
dependencies:
  - spec_id: "FILM-1907"
    note: "the OAuth 2.1 authorization server, mcp_oauth_clients, consent page"
  - spec_id: "FILM-2002"
    note: "the editing badge reads the open session"
summary: >
  Lets a creator go from an episode page to the desktop app in one click, and
  sign in without copying a token. StorybookStudio is registered as a
  pre-registered public OAuth client (client_id storybookstudio) in
  mcp_oauth_clients with redirect URIs storybookstudio://auth/callback and
  http://127.0.0.1/callback (any port, the loopback fallback); the Studio runs
  FILM-1907's authorization-code flow with PKCE S256 and receives the same
  sbk_at_/sbk_rt_ tokens any MCP client gets. The episode page gains an "Open
  in Studio" button that launches storybookstudio://open?api=<origin>&episode=<id>, and
  when no handler answers, a sheet with download links and the "create a
  token" alternative. Design: PRD-EDD.md Part 3 "Auth" (corrected: reuse
  FILM-1907) and "Web UI changes".
acceptance_criteria:
  - text: "A seed migration inserts the storybookstudio client into mcp_oauth_clients as a public client (no secret, PKCE required) with redirect_uris ['storybookstudio://auth/callback'] and a loopback rule: redirect_uri matching ^http://127\\.0\\.0\\.1:\\d+/callback$ is accepted for this client only (RFC 8252 §7.3); the exact-match rule stays for every other client"
    met: true
    evidence: "#619: seed apps/web/supabase/migrations/20261004191159_film-2005-storybookstudio-client-and-desktop-flag.sql:25 (public client, no secret column exists, on conflict do nothing; PKCE S256 is required of every client by token.ts); loopback rule packages/features/studio-mcp/src/server/oauth/authorize.ts:179-196 (isRegisteredRedirectUri, keyed on client_id storybookstudio only), used at authorize.ts:93; 21 host/path/port variants in packages/features/studio-mcp/__tests__/oauth/storybookstudio-client.test.ts:99-153"
  - text: "The consent page names the client 'StorybookStudio' with its icon, shows the team picker and the requested scopes (studio:read, studio:write, studio:render), and on approval redirects to the custom scheme; the browser's 'open app?' prompt is the OS's and is documented with a screenshot"
    met: false
    reason: "#619 builds the page: apps/web/app/oauth/authorize/_components/consent-form.tsx:127-139 shows the StorybookStudio icon and name, :162-207 the team picker (teams with the Studio off are disabled), the three scopes are checked (e2e apps/e2e/tests/mcp/oauth-storybookstudio.spec.ts:174-198), and approval redirects to the registered URI (storybookstudio://auth/callback, or the loopback the spec drives at :224-232). Not met: the OS 'open app?' prompt cannot be captured until the Studio registers the storybookstudio handler (FILM-2011's protocol.js); without a handler Chrome shows no prompt"
  - text: "Connected apps settings lists a Studio connection with its device name (sent as client_name on registration or token exchange, e.g. 'Shaurya's MacBook'); revoking it logs that device out within one call (FILM-1907's revocation semantics)"
    met: true
    evidence: "#619: client_name on the token request names the connection (packages/features/studio-mcp/src/server/oauth/token.ts:151, sanitised at :252), falling back to the client record; the list labels it apps/web/app/home/[account]/settings/connected-apps/_components/mcp-connections-list.tsx:120; e2e apps/e2e/tests/mcp/oauth-storybookstudio.spec.ts:283-309 lists the device, revokes it in the UI, and the next whoami is 401 and the refresh token invalid_grant (FILM-1907's revocation)"
  - text: "Episode header and Visual Studio show 'Open in Studio' when the episode is in storyboard, generating, ready or published; the button sets location to storybookstudio://open?api=<encoded origin>&episode=<id> and, if the page is still visible after 2 s, opens a sheet with macOS and Windows download links (config), the token alternative, and 'Learn more'"
    met: true
    evidence: "#619: apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/_components/open-in-studio-button.tsx (status gate canOpenInStudio, packages/features/desktop-integration/src/open-in-studio.ts:8-19; location.assign at :68, sheet after NO_HANDLER_TIMEOUT_MS 2 s at :77), mounted in episode-workspace-header.tsx:94 and visual-studio-screen.tsx:795; studio-download-sheet.tsx with download links from apps/web/config/studio-download.config.ts:18 (NEXT_PUBLIC_STUDIO_DOWNLOAD_MACOS_URL / _WINDOWS_URL / _LEARN_MORE_URL), the token link to Connected apps and Learn more; e2e apps/e2e/tests/desktop-integration/open-in-studio.spec.ts:117"
  - text: "The deep link carries no token and no session: the Studio must sign in itself; the api parameter is the app origin only (the Studio allowlists hosts)"
    met: true
    evidence: "#619: studioOpenLink packages/features/desktop-integration/src/open-in-studio.ts:38-43 reduces the origin to scheme+host+port and requires a UUID episode id (tests __tests__/open-in-studio.test.ts); e2e asserts the link has only api and episode and no token (apps/e2e/tests/desktop-integration/open-in-studio.spec.ts:140-145)"
  - text: "A team setting account_ai_settings.desktop_integration_enabled (default off) gates the button and consent to the storybookstudio client; FILM-2006's rollout flips it (corrected 2026-10-04 by lead decision 4, .local-ci/TEAM_BRIEF_v5.md: mcp_oauth_clients has no active column, and per-team settings live in account_ai_settings)"
    met: true
    evidence: "#619: column apps/web/supabase/migrations/20261004191159_film-2005-storybookstudio-client-and-desktop-flag.sql:29-30, mirrored in apps/web/supabase/schemas/75-generation-runs.sql; owner toggle apps/web/app/home/[account]/settings/ai/_components/ai-settings-form.tsx:253; button gate via the episode layout (apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/layout.tsx:249); consent gate apps/web/app/oauth/authorize/page.tsx:102-120 (no team on: a refusal page, desktop-integration-off.tsx) and the approve action consent-actions.ts:63-68 (refused as a value); pgTAP apps/web/supabase/tests/database/film-2005-storybookstudio-client.test.sql (14 assertions)"
test_plan:
  unit:
    - {text: "Redirect URI matcher: loopback accepted only for storybookstudio and only on 127.0.0.1 with a port; a path or host variant refused", met: true, evidence: "#619 packages/features/studio-mcp/__tests__/oauth/storybookstudio-client.test.ts:99-153 (red before the rule: 3 loopback accepts failed)"}
  integration:
    - {text: "SDK OAuth flow test: authorize with PKCE for client storybookstudio, code exchange, whoami; a code reused is refused (FILM-1907's guard)", met: true, evidence: "#619 apps/e2e/tests/mcp/oauth-storybookstudio.spec.ts:143 (MCP SDK auth() with the pre-registered client, a real 127.0.0.1 listener, client_name via addClientAuthentication, whoami through StreamableHTTPClientTransport, reused code invalid_grant); grant logic also unit-tested in storybookstudio-client.test.ts:214-330"}
  e2e:
    - {text: "Playwright: the button is present with the flag on, absent with it off; clicking with no handler shows the download sheet", met: true, evidence: "#619 apps/e2e/tests/desktop-integration/open-in-studio.spec.ts:68 (toggle on and off through AI settings, second save asserted), :117 (sheet after a click, twice), :178 (draft episode)"}
remaining:
  - criterion: "The browser's 'open app?' prompt is documented with a screenshot"
    reason: "Chrome shows that prompt only once an app has registered the storybookstudio scheme with the OS, which the Studio's protocol.js does (FILM-2011). The Studio registers it, but agents have no screen-capture permission: the owner captures it from the packaged Studio and attaches it to this spec's record"
    closed_by: "owner"
open_questions:
  - "Client name per device: pass as client_name on the token request (non-standard) or register one DCR client per install? Recommended: one pre-registered client, device name as a token-request extension parameter stored on mcp_connections.name."
notes: >
  No new OAuth code paths: everything is FILM-1907's server with one more
  client and one relaxed redirect rule for loopback. The Studio side of the
  flow (opening the browser, catching the callback, storing tokens) is
  FILM-2011.

  Open question answered with its recommendation (lead default, 2026-10-04,
  TEAM_BRIEF_v5 lead decision 4): one pre-registered client; the device name
  is the client_name extension parameter of the authorization_code token
  request, stored on mcp_connections.name (control and format characters
  become spaces, cut to 100 characters), falling back to the client record's
  name when absent or blank. It is read for any client, not only the Studio.

  Corrections to the draft, from lead decision 4: no pre-registered-client
  mechanism existed, so a migration seeds the row (resolveClient reads the
  table, and a row with no metadata_url is never refetched); the loopback
  rule lives in oauth/authorize.ts keyed on the client id; and the flag is a
  column on account_ai_settings, not an active flag on the client row. Owners
  change it, as for every account_ai_settings column (the table's RLS).

  For FILM-2011, the interface: client_id storybookstudio, public, PKCE S256;
  redirect_uri storybookstudio://auth/callback or http://127.0.0.1:<port>/callback
  (port 1-65535, no query); scopes studio:read studio:write studio:render;
  client_name=<device> on the code exchange (the MCP SDK sends it from
  addClientAuthentication, which must then also set client_id); deep link
  storybookstudio://open?api=<encodeURIComponent(origin)>&episode=<uuid>. The
  consent refuses a team whose desktop_integration_enabled is false.

  Download links default to the fork's GitHub releases and README; set
  NEXT_PUBLIC_STUDIO_DOWNLOAD_MACOS_URL, _WINDOWS_URL and
  NEXT_PUBLIC_STUDIO_LEARN_MORE_URL per deployment once installers ship.
feature:
  database: {tables: [], columns_added: ["account_ai_settings.desktop_integration_enabled"]}
  queries: []
  actions: []
  ui: [{component: "OpenInStudioButton", file: "apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/_components/open-in-studio-button.tsx"}, {component: "StudioDownloadSheet", file: "apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/_components/studio-download-sheet.tsx"}]
  provider_integration: null
  oauth_client: {client_id: "storybookstudio", redirect_uris: ["storybookstudio://auth/callback", "http://127.0.0.1:<port>/callback"], scopes: ["studio:read", "studio:write", "studio:render"]}
