    - {text: "pgTAP: a viewer-role project member can call the tool (read); an outsider cannot", met: true, evidence: "#618: apps/web/supabase/tests/database/edit-package-reads.test.sql:124, :136 — 4/4 via pgthrow; red without the viewer's team membership"}
  e2e: []
remaining:
  - criterion: "sha256 is computed once and stored on first request for media StoryBook has not hashed"
    reason: "Hash media where it is written (shot upload route, voice and audio workers, dubbing), into a checksum StoryBook owns, so the package carries one for every file without a read tool writing anything"
    closed_by: "KB-189"
open_questions:
  - "Should the package include proxies (a 540p transcode) for very large shots so the Studio can play before the full download lands? Deferred: the Studio builds proxies locally."
notes: >
  The package is deliberately a superset of the OpenClaw manifest
  (packages/features/episodes/src/lib/openclaw-manifest.ts) and of the Visual
  Studio ZIP export; both can be rebuilt from it later. Public R2 read URLs stay
  for the web app until the bucket is made private (a separate hardening task);
  the desktop never relies on them. The schema file is the one artifact shared
  with the fork: packages/features/desktop-integration/src/edit-package.schema.ts
  is copied into storybookstudio/src/studio/contracts/edit-package.schema.ts by
  a script, and a test in each repo fails if the copies differ.

  Corrections, 2026-10-04 (#618). The original AC4 is split in two: the
  signed-URL half is met, the hash-on-first-request half is remaining. Lead decision 2 (TEAM_BRIEF_v5): AC6
  originally read content_analytics.retention_data, which FILM-1201 dropped;
  the hints come from ClickHouse video_retention_curves through a
  content-analytics service (studio-mcp may not import @kit/clickhouse).
  Three corrections from the code, approved by the lead as lead decisions
  (2026-10-04) together with the retention reasons: (1) the
  etag hashes content, because dialogue_lines and audio_tracks have no
  updated_at and a hard delete moves no timestamp (so it does not depend on
  projects.updated_at either); (2) the storage interface takes (bucket,
  path) everywhere, so the method is getSignedReadUrl(bucket, path, ttl),
  with stat() for size and type; (3) sha256 is only as available as
  assets.file_hash; recording it at write time is KB-189 (see remaining),
  and every media entry carries `key` as its stable identity meanwhile. dubbed_dialogue_lines.timing_adjustment is
  a 0.5-2 speed factor, so the package names it timingAdjustment, not a time.
  For FILM-2011: an expired URL is 403 on R2 and MinIO but 400 ExpiredToken on
  the local Supabase S3 sandbox; treat any 4xx on a media GET as "fetch the
  package again". A key is stable while the file is, so diff media by key
  when sha256 is null.
feature:
  database: {tables: [], columns_added: []}
  queries: [{name: "buildEditPackage", purpose: "assemble the package from the feature services with fetchAllRows", file: "packages/features/desktop-integration/src/build-edit-package.ts"}]
  actions: []
  ui: []
  provider_integration: {vendor: "Cloudflare R2", endpoints: ["getSignedReadUrl via @aws-sdk/s3-request-presigner on the S3-compatible API"]}
  package: {name: "@kit/desktop-integration", path: "packages/features/desktop-integration/"}
  mcp_tools: ["get_edit_package"]
  schemas: ["EditPackageSchema (storybook-edit-package/1)"]
