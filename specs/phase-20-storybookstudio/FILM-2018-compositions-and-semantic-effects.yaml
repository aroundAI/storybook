notes: >
  Owner decisions, 2026-10-05. Content type (README open question 1) is all:
  generative and programmatic. Remotion licence: the owner's company is a
  company of 1 on Remotion's Free License, and StorybookStudio is an internal
  tool used only by the owner and never distributed, paid or free, so the
  GPL-3.0 conveyance terms are not triggered. Installers that contain Remotion
  must not be published; publishing one needs this decision revisited first.
  This records the licence status acceptance criterion 7 asks for.
  aroundAI/storybookstudio#35 (merged as 36aa762) enforces the rule: the
  release preflight refuses while @remotion/* ships in the app's
  dependencies (storybookstudio/scripts/check-release-licences.mjs:17
  releaseLicenceCheck, run by storybookstudio/.github/workflows/release.yml:43
  before any installer is built; tests/studio/release-licences.test.mjs:27).
  Publishing one needs this decision revisited, then the repository variable
  REMOTION_RELEASE_APPROVED set to true.

  Built in aroundAI/storybookstudio#30 (pinned at storybookstudio@0cd8c53,
  part A): the five semantic effects as studio_edit intents and
  studio_choose_visual_representation. The composition clips, the renderer
  and the graphics primitives are not built.

  Built in aroundAI/storybookstudio#32 (merged as 418e8a8, part B): the
  composition clip type and its export, the Remotion renderer with its cache,
  and the Counter primitive (criteria 1 and 2, and the start of 3). Package
  size, measured in the fork PR: +264,424 KB (+258 MB, +49 %), of which
  Chrome Headless Shell is 207,908 KB, the compositor 19,732 KB, the bundle
  14,300 KB and the app.asar growth 22,484 KB. Licence: renderMedia is
  called without a licence key, so no usage event goes to remotion.pro
  (electron/studio/compositionEngines/remotion.js:6); the rule above that
  installers containing Remotion must not be published stands. The
  renderer's header comment still says the only engine is a test card
  (electron/studio/compositionRenderer.js:24), and the language variant's
  card still says compositions are not in this build (FILM-2019); both are
  stale. Both comments were corrected in #37 (9c2a582).

  Built in aroundAI/storybookstudio#37 (merged as 1fb55a5, at
  storybookstudio@496a554, part C): the other nine primitives with their
  Remotion components, the catalogue in studio_get_context, studio_add_graphic
  with placement inside the safe area and clear of captions, the pop SFX for
  a counter or callout, and the graphic_caption_overlap QA check (criteria 3
  and 4). Deviations, as the criteria record: no SFX style field in the brand
  contract, so the pop is the project library's pop, else a built-in one; no
  separate graphic safe-area QA check, because placement is proven by unit
  test across anchors and aspects and QA checks the caption overlap; the ids
  lower-third and progress-bar; the extra props, previewOnly and planId
  arguments; render key version 2; compact catalogue props for the in-app
  agent's 18,000-character result cap. Real-render timing, recorded in the
  fork PR: a 4 s 1080p30 Counter took 8.0 s cold in headless Chromium on
  Linux, under the 10 s target.

  Render-to-asset keeps one live renderer in the preview and makes
  localization (FILM-2019) a matter of re-rendering compositions whose
  languageDependency is language with new strings. SPIKE-06's puppet
  prototype, if it pays off, becomes another composition primitive here.
