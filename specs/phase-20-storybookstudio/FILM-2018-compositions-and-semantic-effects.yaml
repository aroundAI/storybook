summary: >
  v2. Graphics by instruction instead of keyframes: a new composition clip
  type {engine: remotion, compositionId, props, languageDependency} rendered in
  the main process by @remotion/renderer to an alpha WebM keyed by
  sha256(compositionId + props), cached under compositions/, and played
  through the upstream editor's existing overlay path. Remotion is not a live renderer in
  the preview; a placeholder shows until the render lands. A graphics
  primitives package (text, counter, callout, arrow, highlight, lower third,
  chart, map, timeline, progress bar) reads brand tokens. Semantic effects
  (punch_in, ken_burns, speed_ramp, freeze_frame, color_grade) are compilers to
  existing primitives (set_clip_keyframes, set_clip_speed, split_clip,
  add_glsl_effect) with no new render code. choose_visual_representation lets
  the agent pick a graphic over footage where a geographic or numeric point is
  clearer drawn. The semantic effects and choose_visual_representation are
  built (aroundAI/storybookstudio#30); the composition clips wait on the
  Remotion work in progress. README open question 1 (content type) and
  Remotion's licence were answered by the owner on 2026-10-05 (notes). Design: PRD-EDD.md
  Part 2 "Audio, captions, compositions and localization"; Part 1 R-43, R-45.
acceptance_criteria:
  - text: "timelineStore accepts clip type composition with {engine, compositionId, props, propsHash, renderPath, languageDependency}; the exporter composites renderPath as an alpha overlay; the preview shows a placeholder frame until renderPath exists"
    met: false
    reason: "composition clips are in progress (not yet merged or pinned); no composition clip type exists at storybookstudio@0cd8c53"
  - text: "electron/studio/compositionRenderer.js renders a composition to compositions/<compositionId>-<propsHash>.webm with @remotion/renderer (bundled Chromium), queued one at a time, cached by hash, invalidated when props or brand change; a 4 s counter renders in under 10 s on the reference machine"
    met: false
    reason: "composition clips are in progress (not yet merged or pinned); no composition clip type exists at storybookstudio@0cd8c53"
  - text: "src/studio/compositions/: Text, Counter, Callout, Arrow, Highlight, LowerThird, Chart, Map, Timeline, ProgressBar, each a Remotion component taking brand tokens and a props schema; a catalogue the agent can read via studio_get_context"
    met: false
    reason: "composition clips are in progress (not yet merged or pinned); no composition clip type exists at storybookstudio@0cd8c53"
  - text: "studio_add_graphic {kind, text, at, duration, anchor?} creates a composition clip with props validated by the primitive's schema, places it inside the aspect's safe area, and adds a pop SFX from the brand's SFX style when kind is counter or callout; QA checks overlap with captions"
    met: false
    reason: "composition clips are in progress (not yet merged or pinned); no composition clip type exists at storybookstudio@0cd8c53"
  - text: "Semantic effects punch_in, ken_burns, speed_ramp, freeze_frame, color_grade compile to action plans over set_clip_keyframes, set_clip_speed, split_clip and add_glsl_effect with reasons; exposed as studio_edit intents"
    met: true
    evidence: "aroundAI/storybookstudio#30 (merged as b266c45, pinned at storybookstudio@0cd8c53 src/studio/intents/effects.js:122 punchIn, :161 kenBurns, :204 speedRamp, :250 freezeFrame, :285 colorGrade, :311 EFFECT_COMPILERS; src/studio/compile.js:24 imports them and :31 registers them as owner FILM-2018, :34 STUDIO_EDIT_INTENTS includes them; electron/studio/mcpCapabilities.js:24 STUDIO_EDIT_INTENTS lists the five, so studio_edit offers them; tests/studio/effects.test.mjs:25 the five are studio_edit intents and every tool they emit is plan-writable (add_glsl_effect added), :32 punch_in, :51 ken_burns, :69 speed_ramp, :97 freeze_frame, :120 color_grade, :142 a hand-edited shot is left alone with a note, :155 every effect previews to cards and a draft report with a reason per step; tests/studio/effects-integration.test.mjs:57 freeze_frame over MCP applies split and speed keyframes with one logged line per step, :81 color_grade, punch_in, speed_ramp and ken_burns over MCP). Dev app, freeze_frame on S3.2: the shot split at 47.5 s, the version 'AI: freeze on S3.2 for a second' was created, and the burned timecode held at 1.708 while the captions advanced. Deviations from the criterion's wording: (1) no step uses set_clip_speed, because it changes the clip's length (src/studio/intents/effects.js:11); speed_ramp and freeze_frame use set_clip_keyframes on the speed property plus split_clip, which keep the length, and split the shot where the ramp or hold ends so the rest is back on its sound. (2) freeze_frame holds at the ramp floor of 0.05x (effects.js:22 MIN_RAMP_SPEED, about 1.2 source frames per second of hold), not a true still, because the editor has no hold-frame primitive. (3) speed_ramp is slow motion only, 0.05 to 0.99x (effects.js:209; a faster ramp would need picture past the shot's out point)"
  - text: "choose_visual_representation {sceneOrPoint} returns a ranked list from generated_video, stock_video, archival_image, chart, map, diagram, timeline, text_graphic with a one-line reason each; the agent decides"
    met: true
    evidence: "aroundAI/storybookstudio#30 (merged as b266c45, pinned at storybookstudio@0cd8c53 src/studio/visualRepresentation.js:64 chooseVisualRepresentation, :13 VISUAL_KINDS; electron/studio/mcpCapabilities.js:144 the tool, named studio_choose_visual_representation because every agent tool is studio_*, and :744 its case; src/services/agentTools.js:76 the in-app agent has it, so the agent profile lists 19 tools, not 18 (tests/studio/mcp-profiles.test.mjs:46); tests/studio/visual-representation.test.mjs:13 every kind is ranked once with a one-line reason and nothing is changed, :28 a geographic point ranks map first and each graphic kind hands off to studio_add_graphic, :55 a line, a time or a scene can be the point, :67 library b-roll that matches ranks stock_video and names the add_broll edit; tests/studio/effects-integration.test.mjs:100 over MCP it ranks the eight kinds and changes nothing). Deviation: the tool name is studio_choose_visual_representation, not choose_visual_representation"
  - text: "Remotion company license status recorded in notes before any @remotion/* dependency lands"
    met: true
    evidence: "recorded in this spec's notes (Owner decisions, 2026-10-05) by the PR that bumps the pin to storybookstudio@0cd8c53 (#649), ahead of any @remotion/* dependency: package.json at storybookstudio@0cd8c53 has none"
