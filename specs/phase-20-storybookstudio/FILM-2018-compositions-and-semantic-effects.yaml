notes: >
  Owner decisions, 2026-10-05. Content type (README open question 1) is all:
  generative and programmatic. Remotion licence: the owner's company is a
  company of 1 on Remotion's Free License, and StorybookStudio is an internal
  tool used only by the owner and never distributed, paid or free, so the
  GPL-3.0 conveyance terms are not triggered. Installers that contain Remotion
  must not be published; publishing one needs this decision revisited first.
  This records the licence status acceptance criterion 7 asks for.

  Built in aroundAI/storybookstudio#30 (pinned at storybookstudio@0cd8c53,
  part A): the five semantic effects as studio_edit intents and
  studio_choose_visual_representation. The composition clips, the renderer
  and the graphics primitives are not built.

  Render-to-asset keeps one live renderer in the preview and makes
  localization (FILM-2019) a matter of re-rendering compositions whose
  languageDependency is language with new strings. SPIKE-06's puppet
  prototype, if it pays off, becomes another composition primitive here.
