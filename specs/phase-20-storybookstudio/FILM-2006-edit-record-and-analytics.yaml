notes: >
  The page is read-only by design; editing happens in the Studio. The fact
  table is the only new ClickHouse object in the phase, and it is additive to
  the content genome (FILM-17xx) rather than a new analysis.
  Corrections as built (#PRNUM): the derivation lives in
  @kit/content-analytics (lib/edit-style.ts), not beside the report schema,
  because @kit/desktop-integration depends on @kit/content-analytics
  (FILM-2001's retention hints); it reads the report through a narrow schema
  of the fields it uses. The rollup is in runAnalyticsSyncJob (the lambda
  calls the sync route), not in the lambda. The genome reads edit style
  through queryEditStyleForVideos, beside querySegmentVideoMeasures, so the
  shared segment SQL is unchanged. Open question (FILM-2002) "may an admin
  force-close from the web?": the recommended yes, as built.
  Rollout plan (PRD Part 4), each step the owner's, recorded here when its
  exit metric passes: 1. internal: desktop_integration on for one workspace,
  PAT only; exit at 10 episodes delivered end to end. 2. beta: OAuth and the
  deep link, opt-in from Settings, AI (the same flag); exit when the PRD's
  success metrics reach 80% of target. 3. general: the flag on by default
  and the Edit record visible to all (it already shows to every project
  member).
