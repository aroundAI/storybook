    evidence: "apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/edit/page.tsx:50 (withI18n, metadata :18); loader apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/edit/_lib/server/edit-record.loader.ts:96 (RLS reads, signed GET :227 via FILM-2001's getSignedReadUrl, 15 min); view apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/edit/_components/edit-record-view.tsx:131 (summary, versions), :222 (per-scene changes), :281 (renders, QA badge :364); tab _components/episode-workspace-tabs.tsx:76; Playwright apps/e2e/tests/mcp/edit-record.spec.ts (the signed download returns the uploaded bytes)"
    reason: "Target is the report's explain.targetDuration, else episodes.target_duration_seconds. Every render of the episode is listed, newest first, with its status, so a superseded or failed one is visible too (#PRNUM)."
  - text: "An open session shows the editor, device and start time; project admins can force-close it (close_edit_session's logic via a server action), which restores the previous status"
    met: true
    evidence: "apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/edit/_components/edit-record-view.tsx:86; device through public.edit_session_device apps/web/supabase/migrations/20261004173430_film-2006-edit-record.sql:24 (mcp_connections is readable by its own user only); forceCloseEditSessionAction apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/edit/_lib/server/actions.ts:28 (closeEditSession reason 'admin' :32, refusals returned as values); pgTAP apps/web/supabase/tests/database/edit-record.test.sql D1-D6, F1-F6; Playwright: the project owner force-closes a teammate's session twice and the episode is published again"
    reason: "The editor is edit_state.editedBy.name (FILM-2002). The owner/admin check is close_edit_session's own; a member, even the session's user, is FORBIDDEN as admin (F3) (#PRNUM)."
  - text: "'Re-open in Studio' launches the deep link (FILM-2005) and the next session's open_edit_session records previousStatus = published when applicable"
    met: true
    evidence: "FILM-2005's OpenInStudioButton is in the episode header on every episode page, /edit included (asserted on /edit in apps/e2e/tests/mcp/edit-record.spec.ts); previousStatus = published: apps/web/supabase/tests/database/edit-record.test.sql R1-R3 and the Playwright re-open over MCP"
    reason: "Corrected: the page does not draw a second button; the header's (flag-gated by FILM-2005) is on it. open_edit_session needed no change: it records the episode's status at open, and a delivered-then-published episode is published (#PRNUM)."
  - text: "ClickHouse migration adds edit_sessions_fact (episode_id, project_id, account_id, session_id, delivered_at, final_duration, target_duration, ai_ops, user_ops, plans_proposed, plans_approved, cut_count, avg_shot_length, hook_type, languages, presets); analytics-sync upserts it hourly from delivered sessions"
    met: true
    evidence: "packages/clickhouse/src/migrations/024_edit_sessions_fact.ts:27 (ReplacingMergeTree on synced_at, ORDER BY project_id, episode_id, session_id; registered run.ts:60); writer and reader packages/clickhouse/src/queries-edit.ts:68, :92; rollup packages/features/content-analytics/src/server/edit-sessions-fact-sync.ts:78, called first in runAnalyticsSyncJob analytics-sync-cron.ts:140; verify-queries.ts editStyleSteps :6746 against ClickHouse 24.8; packages/features/content-analytics/__tests__/edit-sessions-fact.local-stack.test.ts"
    reason: "The fact also stores cuts_per_minute and ai_share as deriveEditStyle computed them, so the card, the fact and the genome share one rule. Hourly it resends the last 48 hours, and every delivered session once a day at 02 UTC; resending is idempotent. NULL is 'not recorded', never 0 (#PRNUM)."
  - text: "Episode analytics page shows an Edit style card (cut density, average shot length, hook type, AI share) beside retention when a delivered session exists; the content genome query gains these as optional dimensions"
    met: true
    evidence: "packages/features/content-analytics/src/components/edit-style-card.tsx:15; derivation packages/features/content-analytics/src/lib/edit-style.ts:81; analytics page section apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/analytics/page.tsx:186; genome packages/clickhouse/src/lib/genome-attributes.ts:400 (editStyleAttributes), :429 (withEditStyle), read in packages/features/content-analytics/src/server/genome-service.ts:178 through queryEditStyleForVideos packages/clickhouse/src/queries-edit.ts:205"
    reason: "Derived from ExplainWhyReport.style (lead decision 22:50, added by FILM-2003): cut_count = shotCount − 1, avg_shot_length = finalDuration / shotCount, cut density = cuts per minute, AI share = aiOps / (aiOps + userOps). The card reads the delivered session from Postgres, so it shows with ClickHouse off. In the genome, measured cut density uses the existing cuts_per_minute bands and replaces a hand band; avg_shot_length and ai_share are derived dimensions (never tags); the hook joins only when the account has not tagged one (#PRNUM)."
  - text: "Request logs on /api/mcp already carry tool and duration (FILM-1904); a dashboard panel counts get_edit_package, deliver_edit, TARGET_CHANGED refusals and uploading renders older than 24 h, with an alert on the last two"
