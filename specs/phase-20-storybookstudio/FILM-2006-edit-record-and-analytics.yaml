    evidence: "public.admin_studio_delivery_stats apps/web/supabase/migrations/20261004173430_film-2006-edit-record.sql:45 (super admin at aal2 via admin_mcp_check_window); panel apps/web/app/admin/mcp/page.tsx:190; alerts apps/web/app/api/cron/expire-generation-runs/studio-delivery-alerts.ts:40, run after FILM-2003's sweep route.ts:145; pgTAP edit-record.test.sql P1-P6; Playwright apps/e2e/tests/admin/studio-deliveries.spec.ts"
    reason: "Built on FILM-1911's /admin/mcp page. The alerts are FILM-1911's form (a log line tagged studio.alert.stale_render_uploads / studio.alert.target_changed and a monitoring capture) but do not fail the cron, so they raise no CloudWatch/SNS alarm; any TARGET_CHANGED in the last hour alerts (#PRNUM)."
  - text: "Rollout: desktop_integration flag on for one internal workspace (PAT only); then opt-in from workspace settings with OAuth; then default on. Each step's exit metric from the PRD (10 episodes delivered; metrics at 80% of target) is recorded in this spec's notes when passed"
    met: false
    reason: "The plan is recorded in notes; no step has run. The flag exists (FILM-2005, account_ai_settings.desktop_integration_enabled, default off) and step 2's opt-in is that setting. Each step is the owner's."
