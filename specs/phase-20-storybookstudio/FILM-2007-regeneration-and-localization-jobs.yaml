    evidence: "#623: jobs.ts:131 (cap, also a repeat), :173 (generating → RUN_IN_PROGRESS before any run or write); the stage target holds the same cap (shots.ts:73, SHOT_REGENERATION_MAX :64). __tests__/tools/studio-jobs.test.ts:146 and :174; the contract test gets both refusals through the SDK. Mutation guards R1, R2, R3 red"
  - text: "localize_episode({episodeId, languages[]}) requires studio:render; for each language queues a dub-episode job on StorybookVoiceQueue carrying its source (the episode's dialogue_lines: the Studio's FILM-2003 delivery carries captions but no dialogue stems); the voice worker voices each translated line with per-line TTS (README open question 6, lead default), writes dubbed_versions and dubbed_dialogue_lines with timeline_start_seconds, and increments episodes.version"
