open_questions:
  - "Dubbing API (one call, timing preserved) vs per-line TTS (reuses voices and existing pipeline)? See README open question 6."
notes: >
  Lead decision 6 (TEAM_BRIEF_v5, 2026-10-04) settles both blockers:
  regenerate_shots is a re-plan (a shots run scoped to the listed shots,
  status queued, video_url cleared, episodes.version bumped at finalize; no
  media rendered), and localize_episode is per-line TTS over the existing
  voice pipeline. README open question 6 stays the owner's: per-line TTS is
  the lead default, and the owner may switch to ElevenLabs Dubbing later
  (dubbed_versions.metadata.localization.method records which made a dub, and
  the message's source block is where a stems source would go).


  Lead decisions (2026-10-04, approving t2007's design; TEAM_BRIEF_v5
  decision 6 and its follow-up): the shots stage is reused with an optional
  regenerate target; runs opened over MCP are always external; a shot's
  status and video_url are set through the caller's RLS client, not the
  commit allowlist; one translate-dialogue run carries additionalLanguages;
  the voice worker re-queues itself to wait and to continue; the new
  nullable dubbed_dialogue_lines.timeline_start_seconds column; and the edit
  package's dubbed lines carry it as timelineStartSeconds.


  Corrections to the draft, from the code: (1) a stage commit may not write a
  shot's status or media (kit.generation_commit_allowlist, FILM-1909), so the
  tool queues the shots and clears their video as the caller when it opens
  the run, and the commit writes only the plan; the allowlist is unchanged.
  (2) The shots stage key is reused with an optional regenerate target rather
  than a new stage key, which would have rippled through the stage matrix,
  the sandbox matrix and the generation_runs stage CHECK. A full shots run and
  a re-plan share the episode's shots lock, so one waits for the other
  (RUN_IN_PROGRESS). (3) generation_runs_one_open allows one translation run
  per episode, so a localization into several languages is one run with
  additionalLanguages, translated in turn; a dub job waits for its own
  language (a delayed re-queue, up to 30 minutes) and fails its version if
  the run ends without it. (4) dubbed_dialogue_lines had no
  timeline_start_seconds; the migration adds it. (5) Languages are the BCP-47
  primary subtags both the translation stage names and multilingual TTS
  speaks: ar, de, es, fr, hi, ja, ko, pt, zh; bn is translated but not voiced
  by eleven_multilingual_v2, so it is refused; an English-only project TTS
  model is replaced with eleven_multilingual_v2 for a dub. (6) Re-running a
  localization re-voices only lines without a voiced dub, and retries lines
  that failed in an earlier request.


  For FILM-2019's language lanes: get_edit_package's dubbed[] has one entry
  per language with lines ordered as the source dialogue; each line's
  timelineStartSeconds is where the dub starts (its source line's start
  when it was voiced; null when that line had none, in which case the
  source line's dialogue[].timelineStartSeconds via dialogueId is the
  fallback); timingAdjustment (0.5 to 2) is the dub's length over the source
  line's, the speed that fits it; audio is a media entry like the source
  line's, keyed by its stored key. A language is complete when its dubbed
  version's status is ready (get_render_progress localization[]).


  Locally the app's R2 adapter has no local endpoint, and the dev server runs
  the Supabase provider, so audio the workers write to R2 (dialogue and dubs
  alike) reads not_in_storage in a local package; the signing rule itself is
  unit-tested.
feature:
  database:
    tables: []
    columns_added: ["dubbed_dialogue_lines.timeline_start_seconds (decimal(10,2), CHECK >= 0)"]
  queries: []
  actions: []
  ui: []
  provider_integration: {vendor: "ElevenLabs", endpoints: ["POST /v1/text-to-speech/{voice_id} (per line, the account's own key)"]}
  mcp_tools: ["regenerate_shots", "localize_episode"]
  workers: ["apps/web/lambda/llm-worker (translate-dialogue over several languages)", "apps/web/lambda/voice-worker (dub-episode)"]
