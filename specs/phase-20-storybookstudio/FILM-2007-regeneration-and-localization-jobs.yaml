spec_id: "FILM-2007"
title: "Shot Regeneration and Localization Jobs for the Studio"
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: DONE
effort: L
dependencies:
  - spec_id: "FILM-2001"
    note: "both jobs change the edit package etag, which is how the Studio notices"
  - spec_id: "FILM-1909"
    note: "the render tools and the shot-generation stage these jobs reuse"
summary: >
  Two things the Studio asks StoryBook to do because only StoryBook can: plan
  a shot again, and make the episode speak another language. regenerate_shots
  (studio:render) opens a shots run scoped to the listed shots with a reason,
  through the generation core, in the request's mode (external over MCP: the
  agent writes the new plan through the brief path); the shots go to queued
  with their video cleared, so the package etag changes at once, and finalize
  writes the new plan in place and bumps episodes.version. No video is
  rendered (lead decision 6). localize_episode (studio:render) translates the
  dialogue with the existing dialogue_translation stage and queues a
  dub-episode job per language on the voice worker, which voices each line
  with its speaker's ElevenLabs voice (per-line TTS, the lead default for
  README open question 6), writing dubbed_versions and dubbed_dialogue_lines;
  the package's dubbed block then carries the lines the Studio's language
  lanes (FILM-2019) need. get_render_progress (FILM-1909) reports both. Design:
  PRD-EDD.md Part 3 "Workers, jobs and the status machine"; Part 4 flows 3
  and 5.
acceptance_criteria:
  - text: "regenerate_shots({episodeId, shotIds[], reason}) requires studio:render and member role; opens a generation run (FILM-1903) for the shot-generation stage scoped to those shots in the request context's mode (external for MCP, so the agent writes the shots through the brief path); returns {runId}; the shots move to status queued with video_url cleared (lead decision 6: a re-plan, no media rendered), so the package etag changes; finalize writes the new plan in place and episodes.version increments"
    met: true
    evidence: "#623: packages/features/studio-mcp/src/server/tools/studio/jobs.ts:109 (studio:render :126; member role via authorizeEpisodeTarget, FORBIDDEN otherwise :74); opens the run through GenerationService.startAs (:184) on the shots stage with regenerate {shotIds, reason} (packages/features/generation/src/stages/shots.ts:73), whose parts are only the listed shots (:695), briefs carry only their scene (:725) and the commit rewrites the shots in place and touches the episode (:925, :980); then queues the shots and clears video_url as the caller, keeping the old URL in generation_metadata.regeneration (jobs.ts:205). Over MCP the run is always external (the connection id; mcp_runs_are_external), so server mode is reachable only from a non-MCP caller. SDK client against /api/mcp on a dev server (port 3308, lane B): __tests__/studio-jobs.contract.test.ts:214 reads the parts back as [shot:a, shot:b], the shots queued with video null, the etag changed with the same version, then after submit and finalize the new prompts, the version +1 and a second etag change; currentEditPackageEtag and get_edit_package agree on each. sha256 is null before and after for shot media (not recorded, KB-189); the Studio diffs by key (FILM-2001)"
  - text: "A shot with status generating is refused with RUN_IN_PROGRESS; more than 20 shots per call is VALIDATION_FAILED"
