    evidence: "#623: jobs.ts:259 (studio:render :269); packages/features/audio-generation/src/server/localize-starts.ts:151 upserts a dubbed_versions row per language and queues one dub-episode message each (:315; message schema src/lib/dub-episode.ts:123, source kind dialogue_lines). One translation run per episode can be open, so every language still to translate goes into one translate-dialogue run (payload additionalLanguages, prompt-engine llm-job-payloads.ts:274), translated in turn by the LLM worker (handlers/translate-dialogue.ts:48). The voice worker's handler (apps/web/lambda/voice-worker/dub-episode.ts:137, dispatched at index.ts:250) waits for its language (:260), voices each line with its speaker's voice, writes the line at the source's timeline_start_seconds (:347; new column, migration 20261004172745 with a CHECK >= 0) fitted by timing_adjustment, continues itself 15 lines a message (:421), then marks the version ready (:453) and touches the episode (:472). Through the SDK against the dev server with the server's own workers on private queues and the vendor sandbox (Gemini, ElevenLabs): contract test :370 localizes hi and es; both versions ready in about 65 s, 10 voiced rows each at the source starts, the version +2"
  - text: "Budget and BYOK checks apply exactly as for start_voice_render (FILM-1909); cost lands in llm_usage_analytics/generation_jobs as today"
