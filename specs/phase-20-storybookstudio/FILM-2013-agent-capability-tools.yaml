open_questions:
  - "Which model drives the agent and critic (README open question 2). The profile is model-agnostic; the eval harness needs one configured model to produce a baseline."
  - "Should the edit policy's allowDialogueCuts default stay 'ask' (hit_duration proposes dialogue drops and applies them only on approval), or default to 'never' or 'allow'? Lead default in force: ask."
notes: >
  The compilers are deterministic code, not prompts: the model decides which
  intent and scope, the compiler decides which primitives. That keeps plans
  reproducible, cheap to preview and easy to test, and lets the eval harness
  score the model's choices separately from the compiler's correctness.
  The upstream editor's MCP_ACTION_PLAN_WRITABLE_TOOLS set gains every studio_* write tool
  except studio_deliver, which must stay a separate confirmed step.

  Built in aroundAI/storybookstudio#9 and #11 (pinned at storybookstudio@69426c2
  by #627) with the draft's corrections: 18 capability tools; the expert
  profile is the upstream editor's 131 plus 6 lifecycle tools; the lifecycle names are
  studio_*; get_audio_analysis stands in for the nonexistent detect_silence;
  cuts are ripple extract_range because trim_clips does not ripple. M2 exit
  check met 2026-10-05: 'tighten scene 3 to 12 s and fix the audio' ran plan
  → preview → apply → version → report over MCP, scene 3 21.0 s → 13.9 s (the
  dialogue alone is 12.7 s, and the card says so), episode 99.0 s → 91.9 s, 12
  op-log lines with reasons, 34 de-click fades applied by FILM-2016's fade
  compiler. The check found two bugs, both fixed and guarded: the studio:plan-proposed
  payload of a capability plan crashed FILM-2011's StudioCloudPanel and killed
  the MCP action bridge, and a rebase left two studio keys in preload.js. Stubs
  that remain: studio_render_preview, studio_review, studio_repair (FILM-2014),
  studio_add_graphic (FILM-2018), studio_add_captions without existing cues
  (transcription is a job). studio_deliver confirm:true and studio_create_variant
  are real since FILM-2017 (aroundAI/storybookstudio#10).

  M2 correction (aroundAI/storybookstudio#14, merged as 0b7bc20, pinned at
  storybookstudio@31127e4 by #630). M2 was first measured on a media-less
  fixture (#9: scene 3 21.0 s to 13.9 s); the compile-time audio reads never
  decoded anything there. Re-measured with real media: tighten_pacing finds no
  cut on the seeded episode (the card explains: 8 lines fill 19.5 of 21 s, and
  the gaps are under the 0.6 s pause limit), fix the audio previews in 0.04 s
  and applies 7 fades in 0.35 s, and the window stayed alive throughout.
  Compile-time audio reads now run in the main process with ffmpeg
  (electron/studio/audioReads.js: silencedetect and FILM-2016's ebur128); the
  renderer never calls decodeAudioData. That call segfaults the renderer on
  Electron 28 on macOS 26, and the upstream editor's own get_audio_analysis tool still
  does: KB-190. Report durations now end where the picture ends, so a
  captions clip no longer inflates them. The autoRepair request still has no
  progress or job id (task 32).
  hit_duration second tier (aroundAI/storybookstudio#21, merged as 587086e;
  pinned at storybookstudio@e1f0b0b). The packaged app had stopped at 97.2 s
  of 99.0 s because the compiler cut only dead air. It now proposes dialogue
  drops as a separate group the creator approves explicitly, never inside the
  default plan and never through autoRepair. The policy field is
  allowDialogueCuts (never, ask or allow); the default is ask, which is the
  lead default and the owner's to change (open_questions). Policy and brand
  reads are typed by aroundAI/storybookstudio#23 (merged as af41149) over the
  fields #634 added to the shared schemas.
