summary: >
  The model sees eighteen capability tools, not 129 primitives. The Studio's
  local MCP server (electron/mcpServer.js, 127.0.0.1:19790) gains a profile
  switch: agent (default) serves the capability tools; expert serves every
  upstream tool as today. Each editing capability is an intent compiler, a plain
  function (context, scope, params, policy) => ActionPlan, where ActionPlan is
  the upstream editor's run_mcp_action_plan shape (up to 50 primitive steps,
  createCheckpointFirst) plus a reasons[] array aligned to steps. Preview runs
  the plan through the primitives' own previewOnly path and renders per-scene
  plan cards; apply creates a version and logs every step with its reason.
  studio_get_context is the one call the agent makes first: script, scene map,
  policy, brand, timeline summary, QA state. The in-app agent
  (src/services/agentTools.js) is pointed at the same profile so Claude
  Desktop, Claude Code and the built-in agent have identical powers and
  produce identical cards. Design: PRD-EDD.md Part 2 "Agent interface",
  Part 1 R-20, R-21, R-23, R-25, R-26.
