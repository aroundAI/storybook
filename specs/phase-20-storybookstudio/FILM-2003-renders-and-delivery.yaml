notes: >
  Built in #620. The upload path reuses the storage adapter's
  getSignedUploadUrl (exact size and type on R2, 1 h) with the presign
  route's two rules (KB-28 key shape, canWriteProjectKey as the caller)
  rather than the route, since the caller is a tool. Thumbnails (image) and
  captions (WebVTT, a new 2 MB captions category in UPLOAD_CONSTRAINTS and
  the bucket's types) ride the same presign with their own keys. Renders
  stay within the project-assets limits: video/mp4 up to 500 MB. The Studio
  always shows a confirmation before calling request_render_upload
  (FILM-2017); the tool itself cannot know that, so the web app treats a
  delivery as an explicit user act and records created_by.
  deliver_edit is public.deliver_edit, SECURITY DEFINER and executable by
  authenticated, since the tool calls it through PostgREST as the user; the
  brief named it kit.deliver_edit. Every episodes update bumps version, and
  a delivery makes two (kit.end_edit_session's edit_state write, then the
  ready update); record_edit_events writes only edit_sessions, so the
  version the Studio got from open_edit_session holds through the edit.
  Lead default, owner may change: superseded render files are kept; the
  recommended 30-day purge via vendor-data-purge is not built here and is
  a follow-up for whoever builds the Edit record's retention (FILM-2006).
