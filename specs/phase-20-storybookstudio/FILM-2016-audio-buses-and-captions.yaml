notes: >
  Veo shot audio is a fifth bus (shotaudio) so it can duck under dialogue
  without being treated as music; the PRD's default is ducking, not muting,
  with one 'Shot audio' toggle per scene in the UI (FILM-2015 exposes it).

  Built in aroundAI/storybookstudio#8 (fork main fdc8f0d), recorded and the
  pin bumped in #625. Lead defaults taken where the spec was silent: the
  balance intent targets 12 dB of dialogue over the music bed after ducking
  (the policy has no ratio field); emphasis words come from
  studio_add_captions style.emphasisWords or from an unparsed brand
  captionStyle.emphasisWords (FILM-2004 follow-up: add captionStyle.emphasisWords
  as string[]); safe areas are 5 % on the sides and top and 8 % on top for
  9:16, replacing the draft's per-aspect numbers.

  Changes outside the file list: set_master_audio is now routed (it answered
  Unknown tool); a new expert tool set_audio_buses takes the tool count to
  131; update_caption_cues takes cues[].globalOverrides and a clip preset;
  editLogRuntime.timelineDocument carries audioBuses (a FILM-2012 file); the
  ASR mix hears dialogue and shot audio only.

  Measured on the 20-shot rough cut: the music drops 7.9 to 8.0 dB under
  dialogue (target 8, tolerance 1); the dialogue bus stays at 0.0 dB; normalize
  lands at -13.9 LUFS for a -14 target and -15.9 for -16; the stems sum to the
  mix with a residual 58 dB below it. Every guard was seen red once with its
  fix reverted (ten red runs, recorded in the fork PR).

  Known limits: the mixer insert-effects export path (OfflineAudioContext
  stems) does not apply buses; two caption test scripts use a flag that Node
  25 removed. Ducking and stems run only when the exporter sends studioAudio.

  Fix in aroundAI/storybookstudio#19 (merged as 35fed06, pinned at
  35fed06; the pin is edd4c28 since #630), found in FILM-2015's packaged-app run:
  on a pulled project loudnorm went dynamic and ffmpeg rebuilt its graph with
  no channel layout pinned, so the delivery bus mix failed with 'Audio bus mix
  failed: :'; the AAC encode then pushed true peak to -0.4 dBTP. The mix now
  pins the channel layout, aims at -2 dBTP with an oversampled limiter when
  normalization is dynamic, and errors lead with ffmpeg's reason. Verified in
  the packaged app: export -14.3 LUFS and -1.7 dBTP, QA pass, Send to
  StoryBook 'sent' with a ready render row. Status stays DONE.
