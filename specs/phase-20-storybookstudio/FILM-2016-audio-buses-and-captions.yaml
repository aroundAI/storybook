summary: >
  Sound and captions become things the AI can reason about. Audio tracks carry
  a bus (dialogue, music, sfx, ambience) summed into a master with a limiter;
  ducking is a sidechain from the dialogue bus onto the music bus, applied at
  preview as Web Audio gain automation on Velorn's mixer graph and at export
  as FFmpeg sidechaincompress; bus stems export separately so localization
  (FILM-2019) can swap dialogue without remixing. Captions keep Velorn's local
  whisper.cpp path and gain a brand caption preset (font, size, colours,
  background, position, max chars per line, emphasis words) and safe-area
  rules per aspect ratio, checked by QA (FILM-2014). Design: PRD-EDD.md Part 2
  "Audio, captions, compositions and localization"; Part 1 R-41, R-42.
