open_questions: []
notes: >
  The design rule from the upstream editor's AGENTS.md holds: preserve simple guided
  workflows and do not turn routine surfaces into node configuration. The
  five surfaces are the whole of what a non-editor sees; the full timeline is
  one click away and unchanged.

  Built in aroundAI/storybookstudio#16 (merged as 95d54c6; pinned at
  storybookstudio@31127e4 by #630). Lead defaults, the owner may change them:
  the scene strip's tolerance is 10 percent until EditPolicySchema has a field
  for it (a FILM-2004 follow-up); seasons are labelled by number because
  StoryBook returns no season names; the instruction box maps only a few
  common phrasings to an intent and does not guess the rest. An error
  boundary now wraps every studio surface (src/components/studio/StudioBoundary.jsx:8,
  mounted in src/App.jsx:634, :1049, :1152): a surface that throws no longer
  unmounts App, which also runs the upstream editor's MCP action bridge, so MCP calls no
  longer time out when a panel fails. The packaged-app run found bugs routed
  elsewhere: a Welcome crashed-project entry and Escape closing the whole
  Review screen (both fixed here), the delivery summary logging a save as an
  AI op (aroundAI/storybookstudio#15), report durations including the
  captions clip (aroundAI/storybookstudio#14), and the MCP port 19790 shared
  by every Studio instance (task 37).
  Re-runs of the packaged app finished the record (2026-10-05, Studio packed
  from fork main at 31127e4, then 35fed06 plus the badge fix, then 6882026
  plus #45): Re-run 2 delivered to a file and to StoryBook (the Deliver
  screen criterion), and Re-run 3 repeated the path after the rename and
  found the no-change plan fixed in aroundAI/storybookstudio#24 (merged as
  e1f0b0b, which the pin follows). aroundAI/storybookstudio#20 (merged as
  1b4fd5b) fixed the Deliver screen's QA badge, which stayed 'Not checked
  yet' for a folder export. What is left is the screen reader pass, which is
  the owner's; the status stays PARTIAL until it is recorded.
