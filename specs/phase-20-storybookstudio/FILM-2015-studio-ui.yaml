spec_id: "FILM-2015"
title: "Studio UI: Welcome, Episode Picker, AI Panel, Scene Strip, Review and Deliver"
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: PARTIAL
effort: L
dependencies:
  - spec_id: "FILM-2011"
    note: "sign-in, picker data, pull progress, updates"
  - spec_id: "FILM-2012"
    note: "versions and the report the review screen shows"
  - spec_id: "FILM-2013"
    note: "plan cards and the studio:plan-proposed event"
summary: >
  Five surfaces wrap the upstream editor without changing it: a Welcome screen
  (Open from StoryBook, recent projects, update badges), an episode picker
  (project → season → episode with status, size and 'on this machine'), the
  editor's two additions (an AI panel with the instruction box, per-scene plan
  cards, Approve / Approve scene / Reject and the report; a scene strip above
  the timeline with headings and target vs actual duration), a Review screen
  (two timelines stacked, changed clips highlighted, synced scrub, per-scene
  accept, 'Why this?' on any clip) and a Deliver screen (preset checklist,
  per-render QA badge with issues and 'Fix with AI', 'Send to StoryBook' with a
  confirmation summary, 'Export to file'). The AI panel never blocks the editor;
  plan cards are the unit of approval; anything leaving the machine shows a
  confirmation naming the episode, the files, their sizes and the destination.
  Design: PRD-EDD.md Part 1 "Screens and interaction model"; R-11, R-20, R-24,
  R-30, R-33, R-62.
