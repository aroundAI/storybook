    reason: "ci.yml stops at vite build; electron-builder runs only in release.yml on a release"
    closed_by: "unassigned"
open_questions:
  - "Windows at launch (README open question 4) decides whether NVENC and the Windows protocol registration are in this spec's CI matrix."
notes: >
  Velorn is GPL-3.0-only, so the fork is GPL and public; StoryBook's server
  code is a separate program over HTTP and stays outside the GPL boundary.
  Velorn's own AGENTS.md rules carry over: preserve simple guided workflows,
  keep project files portable, keep generation and editing separate layers,
  and have agent write actions inspect, preview and use the existing
  undo/checkpoint paths. Lead decisions (TEAM_BRIEF_v5): CI is the four upstream
  test scripts plus test:studio; the upstream CLA workflow was removed from the
  fork. Fork PRs aroundAI/storybookstudio#1 (part C), #2 (part B), #3
  (part A) and #4 (docs) merged 2026-10-04; the pin follows them in #615. The allowlist also serves
  exact files the app's own windows requested through media:getFileUrl (Welcome
  thumbnails of closed projects); embedded and sign-in pages still get 403
  (lead accepted). "Caches directory" means Velorn's temp folders
  comfystudio-shot-audio and comfystudio-caption-audio. docs/MCP.md and
  .mcp.json carry the bearer through ${STORYBOOKSTUDIO_MCP_TOKEN}. The matrix counts
  130 tools, not 129 (exists 112, adapter 18, build 21).
