    - {text: "Protocol allowlist: project path allowed, /etc/passwd and ../ traversal refused", met: true, evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 tests/studio/protocolAllowlist.test.mjs:34,39)"}
    - {text: "Checkpoints: create, restart (new process), restore equals snapshot", met: true, evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 tests/studio/checkpoints.test.mjs:66)"}
  integration:
