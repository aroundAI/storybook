spec_id: "FILM-2010"
title: "The StorybookStudio Fork and Its Security Baseline"
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: PARTIAL
effort: M
dependencies: []
summary: >
  Forks the upstream GPL-3.0 editor into aroundAI/storybookstudio and makes it safe to hold cloud
  tokens before any other work lands. The fork keeps every upstream file and
  adds a studio layer in new modules (electron/studio/, src/studio/), touching
  upstream files only at registration points so monthly upstream merges stay
  routine. Four security gaps in the upstream editor v0.3.36 are closed first: the local
  MCP server has no authentication (loopback only), the storybookstudio-file:// file
  protocol serves any path despite a comment claiming a restriction
  (electron/main.js ~3509), checkpoints live only in memory
  (MCP_PROJECT_CHECKPOINTS), and nothing stores secrets. This spec also
  writes docs/AI_EDITOR_CONTRACT.md and the capability matrix mapping all 130
  existing MCP tools to the contract's verbs. Design: PRD-EDD.md Part 2 "Fork
  strategy" and "Security hardening of the fork".
acceptance_criteria:
  - text: "Repository aroundAI/storybookstudio exists as a clone of the upstream GPL-3.0 editor at fdd8255 (v0.3.36) with upstream as a second remote; the design document is in docs/"
    met: true
    evidence: "https://github.com/aroundAI/storybookstudio, commit 233f35f 'Add StorybookStudio PRD and EDD' (docs/STORYBOOKSTUDIO_PRD_EDD.md, docs/images/); transferred from XuryaX 2026-10-04"
  - text: "The name is StorybookStudio everywhere a user or another program sees it: package.json productName and name, appId, window titles, the about dialog (the upstream name appears only in its Open-source licenses view, which GPL-3.0 §5 requires), the MCP server name, the deep-link scheme storybookstudio://, the file protocol storybookstudio-file://, the project file project.storybookstudio (the loader still opens the old extension and renames it on save), settings and storage keys"
    met: true
    evidence: "aroundAI/storybookstudio#22 (merged as 6882026, pinned at storybookstudio@e1f0b0b; owner decision 2026-10-05, #632: no upstream name survives in the product or its identifiers). package.json:3 name, :146 productName StorybookStudio, :145 appId co.aroundai.storybookstudio, :245 protocols with the storybookstudio scheme; electron/studio/protocol.js:12 STORYBOOKSTUDIO_SCHEME; tests/studio/no-upstream-names.test.mjs:73 (no tracked file is named for or mentions the upstream editor, red with 2108 hits on the old main, green after), :96 (the built renderer bundle), :122 (a packed macOS app's Info.plist carries CFBundleIdentifier co.aroundai.storybookstudio and the storybookstudio URL scheme); tests/studio/legacy-names.test.mjs:40 (settings under an earlier prefix move once), :68 (a project pulled before the rename opens and its first save writes project.storybookstudio and removes the old file), :111 (the earlier userData folder moves once, never over an existing one), :126 (LUTs copied from the earlier database). Data no longer leaves the app for the upstream author: src/services/feedback.js:11 ships no feedback endpoint (the upstream author's worker is not ours), the Discover catalog is empty (public/discover/catalog.json) and the app's Discord callout and sponsor links are gone (README.md:11 still carries the upstream community's Discord badge, a link in the repository page and not in the app). The upstream name appears only in the Open-source licenses view (src/components/studio/OpenSourceLicenses.jsx:8; electron/studio/licenses.js), where GPL-3.0 §5 requires it. Deviation from the criterion's wording: earlier names are read once and migrated (settings, userData folder, project files, file URLs under the earlier scheme at tests/studio/legacy-names.test.mjs:61), not kept as aliases"
  - text: "docs/AI_EDITOR_CONTRACT.md defines inputs, perception, editing primitives, editing intents, validation and lifecycle; docs/CAPABILITY_MATRIX.md lists every tool in electron/mcpServer.js with one of exists / adapter / build against the contract's verbs"
    met: true
    evidence: "aroundAI/storybookstudio#2 and #4 (storybookstudio@9fa74d2 docs/AI_EDITOR_CONTRACT.md (section 8 safety alignment in #4), docs/CAPABILITY_MATRIX.md, 130 tools: exists 112, adapter 18, build 21; scripts/capability-matrix.mjs --check; tests/studio/capabilityMatrix.test.mjs)"
  - text: "MCP server auth: on first run a 32-byte secret is generated into userData/mcp-secret and every request to 127.0.0.1:19790 must carry Authorization: Bearer <secret>; a request whose Origin or Host is not loopback is rejected 403; Settings shows the secret once with a ready-made `claude mcp add --transport http storybookstudio http://127.0.0.1:19790/mcp --header \"Authorization: Bearer …\"` command"
    met: true
    evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 electron/studio/mcpAuth.js:49 bearer 401, non-loopback Host or Origin 403; electron/mcpServer.js:10619 runs the check; electron/main.js:7771 passes the secret; electron/studio/mcpSecret.js:18 32-byte secret in userData/mcp-secret; electron/studio/studioMain.js:27 studio:getMcpConnectCommand feeds src/studio/McpConnectCommands.jsx in Settings; tests/studio/mcpAuth.test.mjs:71 and mcpSecret.test.mjs; live curls 401/401/403/403/200 in the PR body). Deviation: Settings shows the connect command whenever Settings is open, not once"
  - text: "storybookstudio-file:// resolves only paths under the open project folder, userData and the caches directory; any other path returns 403; the misleading comment is corrected; a test drives a traversal attempt"
    met: true
    evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 electron/studio/protocolAllowlist.js:42 resolveAllowedPath; electron/main.js:3522 the handler answers 403; tests/studio/protocolAllowlist.test.mjs:34 /etc/passwd, :39 ../ traversal, :46 symlink escape refused)"
  - text: "create_project_checkpoint and restore_project_checkpoint persist under <project>/edits/checkpoints/ and survive an app restart; the in-memory map becomes a cache"
    met: true
    evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 src/studio/checkpointStore.js:6 edits/checkpoints/, :24 the store; src/services/mcpActions.js:72 the map is the cache, :7671 and :7692 save and latest; tests/studio/checkpoints.test.mjs:66 create, new process, restore equals snapshot; restart probe in the PR body)"
  - text: "A secrets module in the main process wraps Electron safeStorage; nothing in the renderer, the MCP snapshot or logs can read a stored secret (a test greps the snapshot and log output for a planted value)"
    met: true
    evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 electron/studio/secrets.js:33 safeStorage, refuses with SecretsUnavailableError when encryption is unavailable; tests/studio/secrets.test.mjs:76 ciphertext only, :99 refuses plaintext, :151 no renderer path, :118 greps the file, snapshot, responses and logs for a planted value)"
  - text: "An upstream merge playbook (docs/UPSTREAM.md) describes the monthly merge, the registration-point files that may conflict (main.js, preload.js, mcpServer.js, App.jsx, package.json), and the two patches offered upstream (MCP auth, protocol allowlist)"
    met: true
    evidence: "aroundAI/storybookstudio#1 (storybookstudio@9fa74d2 docs/UPSTREAM.md last merged head fdd8255, the section Patches we offer upstream, the merge log)"
  - text: "CI on the fork runs the upstream editor's existing tests plus tests/studio/*; the package builds for macOS arm64 (the first target) with protocols: [{name: StorybookStudio, schemes: [storybookstudio]}] in electron-builder config"
    met: false
    reason: "half met. aroundAI/storybookstudio#1 (storybookstudio@9fa74d2 .github/workflows/ci.yml) runs on macos-14 the four upstream scripts (test:media-preparation, check:media-preparation, test:export-scheduler, test:rife-hardening) plus test:studio and npm run build, which is vite build only; nightly.yml runs npm test. package.json:245 declares the deep-link protocol (renamed storybookstudio by aroundAI/storybookstudio#22) and :256 the mac dmg arm64 target, but only release.yml:410 runs electron-builder --mac, on release, so no CI run on a pull request packages the app"
