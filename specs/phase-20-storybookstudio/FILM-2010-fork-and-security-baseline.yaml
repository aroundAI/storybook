    met: true
    evidence: "aroundAI/storybookstudio#22 (merged as 6882026, pinned at storybookstudio@e1f0b0b; owner decision 2026-10-05, #632: no upstream name survives in the product or its identifiers). package.json:3 name, :146 productName StorybookStudio, :145 appId co.aroundai.storybookstudio, :245 protocols with the storybookstudio scheme; electron/studio/protocol.js:12 STORYBOOKSTUDIO_SCHEME; tests/studio/no-upstream-names.test.mjs:73 (no tracked file is named for or mentions the upstream editor, red with 2108 hits on the old main, green after), :96 (the built renderer bundle), :122 (a packed macOS app's Info.plist carries CFBundleIdentifier co.aroundai.storybookstudio and the storybookstudio URL scheme); tests/studio/legacy-names.test.mjs:40 (settings under an earlier prefix move once), :68 (a project pulled before the rename opens and its first save writes project.storybookstudio and removes the old file), :111 (the earlier userData folder moves once, never over an existing one), :126 (LUTs copied from the earlier database). Data no longer leaves the app for the upstream author: src/services/feedback.js:11 ships no feedback endpoint (the upstream author's worker is not ours), the Discover catalog is empty (public/discover/catalog.json) and the app's Discord callout and sponsor links are gone (README.md:11 still carries the upstream community's Discord badge, a link in the repository page and not in the app). The upstream name appears only in the Open-source licenses view (src/components/studio/OpenSourceLicenses.jsx:8; electron/studio/licenses.js), where GPL-3.0 §5 requires it. Deviation from the criterion's wording: earlier names are read once and migrated (settings, userData folder, project files, file URLs under the earlier scheme at tests/studio/legacy-names.test.mjs:61), not kept as aliases"
  - text: "docs/AI_EDITOR_CONTRACT.md defines inputs, perception, editing primitives, editing intents, validation and lifecycle; docs/CAPABILITY_MATRIX.md lists every tool in electron/mcpServer.js with one of exists / adapter / build against the contract's verbs"
