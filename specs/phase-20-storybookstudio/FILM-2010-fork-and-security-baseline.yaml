    evidence: "aroundAI/storybookstudio#2 and #4 (storybookstudio@9fa74d2 docs/AI_EDITOR_CONTRACT.md (section 8 safety alignment in #4), docs/CAPABILITY_MATRIX.md, 130 tools: exists 112, adapter 18, build 21; scripts/capability-matrix.mjs --check; tests/studio/capabilityMatrix.test.mjs)"
  - text: "MCP server auth: on first run a 32-byte secret is generated into userData/mcp-secret and every request to 127.0.0.1:19790 must carry Authorization: Bearer <secret>; a request whose Origin or Host is not loopback is rejected 403; Settings shows the secret once with a ready-made `claude mcp add --transport http storybookstudio http://127.0.0.1:19790/mcp --header \"Authorization: Bearer …\"` command"
    met: true
    evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 electron/studio/mcpAuth.js:49 bearer 401, non-loopback Host or Origin 403; electron/mcpServer.js:10619 runs the check; electron/main.js:7771 passes the secret; electron/studio/mcpSecret.js:18 32-byte secret in userData/mcp-secret; electron/studio/studioMain.js:27 studio:getMcpConnectCommand feeds src/studio/McpConnectCommands.jsx in Settings; tests/studio/mcpAuth.test.mjs:71 and mcpSecret.test.mjs; live curls 401/401/403/403/200 in the PR body). Deviation: Settings shows the connect command whenever Settings is open, not once. A second Studio on one machine gets its own port: aroundAI/storybookstudio#34 (merged as ba8245d, at storybookstudio@418e8a8 electron/studio/mcpPort.js:8 19790 is the default, :9 in a range of ten ports to 19799, :25 and :34 the port is remembered in userData/mcp-endpoint.json, :43 the remembered port is tried first; electron/mcpServer.js:10736 start({ports}) moves to the next port only past EADDRINUSE (:10747) and, when all ten are taken, errors 'Ports 19790–19799 are all in use…' (:10753); :10819 passes its own port to the auth check, which refuses a Host naming another port with 403 'Host names another port.' (electron/studio/mcpAuth.js:62); electron/studio/studioMain.js:158 startMcpServer records the port (:163) and shows a warning dialog when the server does not start (:180), called from electron/main.js:7878; the Port section of storybookstudio/docs/MCP.md:52; tests/studio/mcp-port.test.mjs:58 two servers get different ports and both answer, :80 the Host check, :101 every port taken, :145 two instances keep their ports across restarts and their connect commands name them, :186 a failure to start reaches the user)"
  - text: "storybookstudio-file:// resolves only paths under the open project folder, userData and the caches directory; any other path returns 403; the misleading comment is corrected; a test drives a traversal attempt"
    met: true
    evidence: "aroundAI/storybookstudio#3 (storybookstudio@9fa74d2 electron/studio/protocolAllowlist.js:42 resolveAllowedPath; electron/main.js:3522 the handler answers 403; tests/studio/protocolAllowlist.test.mjs:34 /etc/passwd, :39 ../ traversal, :46 symlink escape refused)"
