remaining:
  - criterion: "CI packages the app for macOS arm64 on a pull request"
    reason: "ci.yml stops at vite build; electron-builder runs only in release.yml on a release"
    closed_by: "FILM-2015"
  - criterion: "The macOS caption engine downloads on first use"
    reason: "the first caption download on macOS answers 404 until the whisper-mac-engine release is published (README.md:136; the build is .github/workflows/whisper-mac-engine.yml, run by hand with publish set); a machine that already has the engine is unaffected"
    closed_by: "owner"
  - criterion: "The Linux packages name a real maintainer address"
    reason: "package.json:284 carries the placeholder maintainer aroundAI <opensource@aroundai.co>; the owner confirms or replaces it before a Linux release"
    closed_by: "owner"
  - criterion: "The Windows signing names are the real ones"
    reason: "package.json:238 azureSignOptions (publisherName aroundAI and the Azure account and profile names) are set without a signing run; the owner confirms them against the Azure account before a Windows release"
    closed_by: "owner"
open_questions:
  - "Windows at launch (README open question 4) decides whether NVENC and the Windows protocol registration are in this spec's CI matrix."
notes: >
  The upstream editor is GPL-3.0-only, so the fork is GPL and public; StoryBook's server
  code is a separate program over HTTP and stays outside the GPL boundary.
  The upstream editor's own AGENTS.md rules carry over: preserve simple guided workflows,
  keep project files portable, keep generation and editing separate layers,
  and have agent write actions inspect, preview and use the existing
  undo/checkpoint paths. Lead decisions (TEAM_BRIEF_v5): CI is the four upstream
  test scripts plus test:studio; the upstream CLA workflow was removed from the
  fork. Fork PRs aroundAI/storybookstudio#1 (part C), #2 (part B), #3
  (part A) and #4 (docs) merged 2026-10-04; the pin follows them in #615. The allowlist also serves
  exact files the app's own windows requested through media:getFileUrl (Welcome
  thumbnails of closed projects); embedded and sign-in pages still get 403
  (lead accepted). "Caches directory" means the upstream editor's temp folders
  for shot audio and caption audio. docs/MCP.md and
  .mcp.json carry the bearer through ${STORYBOOKSTUDIO_MCP_TOKEN}. Fork docs follow-up: docs/UPSTREAM.md says the MCP patch generates a per-launch token, but the code persists the secret in userData/mcp-secret. The matrix counts
  130 tools, not 129 (exists 112, adapter 18, build 21).
  Rename: owner decision 2026-10-05 (#632) reversed the rule that kept the
  upstream editor's internal identifiers. aroundAI/storybookstudio#22 (merged
  as 6882026, pinned at storybookstudio@e1f0b0b) renamed the package, appId,
  scheme, file protocol, project extension and storage keys, and moved every
  earlier name behind a one-time migration (src/studio/legacyNames.json,
  tests/studio/legacy-names.test.mjs). The same PR removed what sent data to
  the upstream author: the feedback endpoint, the Discover catalog and the
  app's Discord and sponsor links. The post-rename packaged-app run is
  recorded in FILM-2015. The three items left in remaining are the owner's.
