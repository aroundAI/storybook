open_questions:
  - "Should an admin be able to force-close another user's session from the web? Recommended yes, in FILM-2006's Edit record page."
notes: >
  Sessions are the join key for everything else in this phase: renders
  (FILM-2003), the Edit record page and ClickHouse fact (FILM-2006), and the
  Studio's local op log (FILM-2012) all carry sessionId. The status restore on
  close keeps the existing publish flow untouched: an episode that was
  published, opened in the Studio and abandoned goes back to published.

  Built in #614. Decisions the ACs left open, recorded here: the tables
  grant authenticated SELECT only; every write is one of three SECURITY
  DEFINER functions (open_edit_session, record_edit_events,
  close_edit_session), so the status machine cannot be bypassed by a
  direct insert. edit_sessions carries previous_status (what close
  restores), last_event_at (the 24-hour idle clock, set by the open and
  by every record call) and close_reason (client, stale, admin,
  delivered). An event needs a clientEventId (AC4's idempotency key) and
  its data is validated strictly per type. edit_state.editedBy is
  {userId, name}, the name copied at open so the badge shows it to every
  member. Opening and closing each bump episodes.version (the existing
  trigger); open_edit_session returns episodeVersion after the bump, which
  is what FILM-2003's deliver_edit should compare. FILM-2003's seam is
  kit.end_edit_session(session, 'delivered', summary, 'delivered'), which
  leaves the status to the caller. Open question (admin force-close): lead
  default, owner may change: close_edit_session(id, summary, 'admin')
  allows a project owner or admin, ready for FILM-2006's action. The PRD's
  session_opened event does not exist: open_edit_session records the open.
feature:
  database:
    tables: ["edit_sessions", "edit_events"]
    columns_added: ["episodes.edit_state jsonb"]
  queries: [{name: "summarizeEditSession", purpose: "events → summary", file: "packages/features/desktop-integration/src/edit-sessions.service.ts"}]
  actions: []
  ui: [{component: "EditingInStudioBadge", file: "apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/_components/editing-in-studio-badge.tsx"}]
  provider_integration: null
  mcp_tools: ["open_edit_session", "record_edit_events", "close_edit_session"]
