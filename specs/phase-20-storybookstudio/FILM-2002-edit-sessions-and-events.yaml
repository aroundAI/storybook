    met: true
    evidence: "apps/web/supabase/migrations/20261004160301_film-2002-edit-sessions-and-events.sql:38 (edit_sessions, plus previous_status, last_event_at and close_reason; one open session per episode, :73), :87 (edit_events, unique (edit_session_id, client_event_id)), :122 (read: has_role_on_project). Writes are granted to nobody directly: they go through the SECURITY DEFINER functions, which allow only the session's user (#614). pgTAP apps/web/supabase/tests/database/edit-sessions.test.sql:230"
  - text: "episodes.edit_state jsonb default '{}' is added with a TypeScript interface {sessionId, editedBy, since, lastDeliveredAt, editedIn: 'studio', versions} per the constitution's JSONB rule"
    met: true
    evidence: "apps/web/supabase/migrations/20261004160301_film-2002-edit-sessions-and-events.sql:29; packages/features/desktop-integration/src/edit-state.ts:9 (EditState, editedBy = {userId, name}, versions = the last delivered edit's count) (#614)"
  - text: "open_edit_session({episodeId, packageEtag}) (studio:write) requires project role member or above (viewer is FORBIDDEN); creates the row, sets episodes.status = 'editing' only from storyboard|generating|ready|published (from draft|story is VALIDATION_FAILED: nothing to edit), writes edit_state, returns {sessionId, previousStatus}; a second open on an episode with an open session by another user returns RUN_IN_PROGRESS with who and since; by the same user it returns the existing session"
