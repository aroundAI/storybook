spec_id: "FILM-2002"
title: "Edit Sessions, Edit Events and the editing Status"
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: DONE
effort: M
dependencies:
  - spec_id: "FILM-1904"
    note: "mcp_connections (the device the session belongs to), withMcpAuth, tool registry"
summary: >
  StoryBook remembers that an episode is being edited, by whom, on which
  device, against which version of the content, and what happened during the
  edit. Two tables (edit_sessions, edit_events), one JSONB column
  (episodes.edit_state) and three MCP tools: open_edit_session sets the
  episode's status to editing (the value has existed in the CHECK constraint
  since the first migration and has never been set) and returns a sessionId;
  record_edit_events appends batches of plan_proposed, plan_approved,
  plan_rejected, version_created, qa_run and delivered events; close_edit_session
  rolls the events into a summary and returns the status to its previous value
  if nothing was delivered. The web app shows "Editing in Studio by <name>
  since <time>" on the episode. Design: PRD-EDD.md Part 3 "Data model changes"
  (edit_sessions, edit_events) and "Workers, jobs and the status machine".
