spec_id: "FILM-2014"
title: "Preview Render Tiers, Deterministic QA and the Critic"
phase: 20
phase_name: "StorybookStudio (the desktop AI editor)"
category: feature
status: PARTIAL
effort: L
dependencies:
  - spec_id: "FILM-2012"
    note: "scene map, semantic fields and the op log the critic reads"
  - spec_id: "FILM-2013"
    note: "studio_render_preview, studio_review and studio_repair are its tools"
summary: >
  The AI sees its own work. Three render tiers on the user's GPU (keyframes
  after every applied plan; a 720p scene preview from proxies; an audio-only
  mix of the buses) feed a deterministic QA pass built from FFmpeg filters and
  ffprobe (loudness, clipping, black and frozen frames, silence, duration
  against target, codec, caption timing and safe areas, missing media, script
  coverage) and a critic with three analysers (pacing, audio, visual and
  narrative). Every QA issue names the studio_repair intent that fixes it, so
  repair is a plan, not a prompt. The vision step is the only one that costs
  tokens; it runs on at most 40 keyframes per review and is skipped when no
  hosted model is configured. The upstream editor's export path (hidden worker window,
  canvas compositing, FFmpeg frame pipe, hardwareExportFfmpeg.js) is reused for
  every tier. Design: PRD-EDD.md Part 2 "Render, QA and critic pipeline";
  Part 1 R-23, R-61.
acceptance_criteria:
  - text: "electron/studio/previewRender.js renders keyframes (one JPEG per cut and per 2 s, 640 px wide, under cache/kf/) in under 5 s for a 90 s cut on an M1 Air; a scene preview (720p, 24 fps, H.264 fast, from proxies) faster than real time; an audio-only WAV of the bus mix; preview renders bypass the media-preparation queue so a long export never blocks them"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 electron/studio/previewRender.js:95 renderKeyframes, :262 renderScenePreview, :148 renderAudioMix; src/studio/review/renderPlan.js:144 keyframeTimes; electron/mediaPreparation.js:334 startBypassing; tests/studio/preview-render.test.mjs:41 (640 px under cache/kf/), :57 (720p24 faster than real time), :81 (a preview proxy finishes while a 40 s delivery job encodes). Measured on an M5 Pro, not an M1 Air: keyframes for the 99 s cut 1.08 s, scene preview 2.2x real time (RELEASE_CHECKLIST.md:157)"
  - text: "electron/studio/qa.js runs: ebur128 (integrated loudness and true peak against the preset target, -14 LUFS YouTube, -16 Reels), astats clipping, blackdetect, freezedetect, silencedetect (longer than policy), ffprobe (duration within ±5% of policy.targetDurationSeconds; codec, fps, resolution against the preset), caption cues against the preset's safe rectangles and for overlaps, check_media_health for missing or offline assets, and script coverage (every scene has a clip; every dialogue line is placed or marked cut in the op log)"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 electron/studio/qa.js:23 analysisArgs, :68 runQa; src/studio/review/qaChecks.js:154 loudnessIssues, :130 clippedRanges, :249 probeIssues, :293 captionIssues, :339 mediaHealthIssues, :377 scriptCoverageIssues; loudness targets and safe areas are imported from FILM-2016 (buses.js, captions/layout.js), not copied"
  - text: "QA output is QaResultSchema {pass, issues:[{type, severity 0-1, timeRange, scene, detail, repairIntent?}]} (shared with FILM-2003); known-bad fixture renders (clipped audio, black frames, out-of-safe-area captions) fail and known-good pass"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 src/studio/review/qaChecks.js:406 qaResult (QaResultSchema with repairIntent); tests/studio/qa.test.mjs:43 (good passes), :64 (clipped audio fails), :74 (black frames fail), :122 (captions outside the 9:16 safe area fail with move_caption)"
  - text: "src/studio/critic/pacing.js: shot lengths vs policy, information delivery (dialogue end vs clip end), repeated shots by semantic similarity, cut density per scene; audio.js: dialogue-to-music ratio per segment from bus stems, fades at cuts, abrupt level changes; visual.js: a vision model on keyframes for subject framing, caption overlap and shot-boundary continuity, plus script fidelity from the scene map; each returns issues in the QA shape with severity"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 src/studio/critic/pacing.js:11, src/studio/critic/audio.js:13, src/studio/critic/visual.js:13; tests/studio/critic.test.mjs:38, :83 (loud music over dialogue is measured from the stems and names duck_music). Correction: the critic modules are .js, as the spec says, and work as ES modules because src/studio/package.json declares type module"
  - text: "studio_review {scope, versionId?} runs QA then the critic and returns both; with no hosted model configured the visual analyser is skipped and the result says so; vision is capped at 40 keyframes per review and its token cost is recorded in the op log"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 electron/studio/reviewTools.js:93 review, :122 appendOpLog; src/studio/critic/visual.js:13 MAX_VISION_FRAMES; electron/studio/visionClient.js:34; electron/studio/mcpCapabilities.js:692 the studio_review handler; tests/studio/critic.test.mjs:109 (no hosted model: vision skipped and says so), tests/studio/review-loop.test.mjs:81 (cost in the op log, capped at 40 keyframes). Owner-gated: the vision model is set by STUDIO_VISION_PROVIDER=anthropic and STUDIO_VISION_MODEL (claude-opus-5-5 when the provider is set), key from the secret vision.anthropic.apiKey or ANTHROPIC_API_KEY; unset, the visual analyser reports skipped"
  - text: "studio_repair {issues[]} compiles each issue's repairIntent (duck_music, trim_silence, normalize_loudness, move_caption, replace_missing_media, add_fade, re-time) to one action plan with reasons; FILM-2013's autoRepair loop uses it, stops at 3 rounds, and leaves remaining issues as cards"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 src/studio/intents/repair.js:95 compile; electron/studio/mcpCapabilities.js:367 reviewRound, :554 the autoRepair loop; tests/studio/repair.test.mjs:134 (one plan for every issue), tests/studio/review-mcp.test.mjs:45 (review, repair previewed and applied into a version, the next review clears it, over MCP), :86 (autoRepair over MCP), tests/studio/review-loop.test.mjs:39"
  - text: "Delivery renders (FILM-2017) go through the upstream editor's media-preparation queue with VideoToolbox on macOS, NVENC on Windows/Linux and x264 fallback; a 1080p 90 s render completes at 1× real time or faster with hardware encode on the reference machines"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 electron/studio/deliveryPath.js:44 render, :77 service.enqueue, :108 check; electron/studio/studioMain.js:68 swaps FILM-2017's render and qa seams for it; electron/mediaPreparation.js:27 the delivery kind; tests/studio/delivery-path.test.mjs:74 (VideoToolbox through the queue, a 94 s 1080p render 7.0x real time: 13.5 s on an M5 Pro), :84 (without hardware the x264 fallback and its reason are reported). NVENC and the reference machines are not measured"
  - text: "The upstream editor's export regression runner gains the QA pass over its fixture outputs so a regression in loudness or black frames fails CI"
    met: true
    evidence: "aroundAI/storybookstudio#12 (storybookstudio@31127e4 tests/fixtures/export-scheduler-electron.cjs:84; electron/studio/exportRegressionQa.js:12; tests/studio/export-regression-qa.test.mjs:38 (the native-encode test flag on check:export-worker-scheduling runs QA on its native render; a forced-black encode fails with 'Encoded MP4 failed QA: black_frames')"
