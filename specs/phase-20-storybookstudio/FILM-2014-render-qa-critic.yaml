open_questions:
  - "Vision model for the visual analyser: the same model that drives the agent, or a cheaper dedicated one? Decide with README open question 2."
notes: >
  Deterministic first, judgment second: FFmpeg catches most technical failures
  for free, so the critic's tokens go only to pacing, framing and continuity
  judgments. Continuity scoring across shot boundaries starts here as a visual
  issue type; SPIKE-06 decides whether it grows into generation requests.

  Built in aroundAI/storybookstudio#12 (merged as dc363cc; pinned at
  storybookstudio@31127e4 by #630). Lead defaults, the owner may change them:
  silence longer than 1.5 s fails unless the policy carries maxSilenceSeconds
  (the field exists since #634: edit-policy.schema.ts maxSilenceSeconds; the
  fork reads it at storybookstudio@e1f0b0b src/studio/policyFields.js:13,
  src/studio/review/qaChecks.js:10 and electron/studio/qa.js:45); QA fails at
  severity 0.5 and above; preview pictures come from FFmpeg, not the canvas
  exporter, so previews show no effects, text or kinetic captions
  (AI_EDITOR_CONTRACT line 7 says so). The vision model for the visual critic
  is the owner's choice (README question 2): until STUDIO_VISION_PROVIDER and
  STUDIO_VISION_MODEL are set it reports skipped; @anthropic-ai/sdk is now a
  dependency. CI found one thing local runs could not: the macOS runner has no
  VideoToolbox (error -12903), so the delivery test checks the x264 fallback
  and its reason when no hardware ran, and the MCP test allows 10 minutes per
  call because the SDK's 60 s default is shorter than one autoRepair request.
  Follow-ups: studio_edit autoRepair is still one long request with no
  progress or job id (FILM-2013, task 32). Also closes FILM-2017's loud-bed integration line (see
  that record).
