  ## Specification
  The five Requirements are in `cross_cutting_concern.rules`.

  ### Upload Constraints

  ```typescript
  // packages/features/assets/src/lib/upload-validation.ts

  export const UPLOAD_CONSTRAINTS = {
    image: {
      maxSize: 10 * 1024 * 1024, // 10MB
      allowedTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/gif'] as const,
      allowedExtensions: ['.jpg', '.jpeg', '.png', '.webp', '.gif'] as const,
      magicBytes: {
        'image/jpeg': [0xFF, 0xD8, 0xFF],
        'image/png': [0x89, 0x50, 0x4E, 0x47],
        'image/webp': [0x52, 0x49, 0x46, 0x46], // RIFF header
        'image/gif': [0x47, 0x49, 0x46, 0x38],
      },
    },
    video: {
      maxSize: 500 * 1024 * 1024, // 500MB
      allowedTypes: ['video/mp4', 'video/webm', 'video/quicktime'] as const,
      allowedExtensions: ['.mp4', '.webm', '.mov'] as const,
      magicBytes: {
        'video/mp4': [0x00, 0x00, 0x00], // ftyp box (variable)
        'video/webm': [0x1A, 0x45, 0xDF, 0xA3],
        'video/quicktime': [0x00, 0x00, 0x00], // moov/ftyp
      },
    },
    audio: {
      maxSize: 50 * 1024 * 1024, // 50MB
      allowedTypes: ['audio/mpeg', 'audio/wav', 'audio/ogg', 'audio/mp4'] as const,
      allowedExtensions: ['.mp3', '.wav', '.ogg', '.m4a'] as const,
      magicBytes: {
        'audio/mpeg': [0xFF, 0xFB], // or ID3 tag
        'audio/wav': [0x52, 0x49, 0x46, 0x46],
        'audio/ogg': [0x4F, 0x67, 0x67, 0x53],
      },
    },
  } as const;

  export type UploadCategory = keyof typeof UPLOAD_CONSTRAINTS;
  ```

  ### Validation Interface

  ```typescript
  export interface ValidationResult {
    valid: boolean;
    error?: {
      code: 'FILE_TOO_LARGE' | 'INVALID_TYPE' | 'INVALID_EXTENSION' | 'CORRUPTED_FILE' | 'UNKNOWN_ERROR';
      message: string;
      details?: {
        maxSize?: number;
        actualSize?: number;
        expectedTypes?: readonly string[];
        actualType?: string;
      };
    };
  }

  export interface ValidatedFile {
    file: File;
    category: UploadCategory;
    sanitizedName: string;
    contentType: string;
  }
  ```

  ### Validation Functions

  ```typescript
  /**
   * Validates a file against upload constraints
   */
  export async function validateUpload(
    file: File,
    category: UploadCategory
  ): Promise<ValidationResult> {
    const constraints = UPLOAD_CONSTRAINTS[category];

    // 1. Check file size
    if (file.size > constraints.maxSize) {
      const maxMB = Math.round(constraints.maxSize / (1024 * 1024));
      const actualMB = Math.round(file.size / (1024 * 1024) * 100) / 100;
      return {
        valid: false,
        error: {
          code: 'FILE_TOO_LARGE',
          message: `File is ${actualMB}MB but maximum allowed is ${maxMB}MB`,
          details: {
            maxSize: constraints.maxSize,
            actualSize: file.size,
          },
        },
      };
    }

    // 2. Check MIME type
    if (!constraints.allowedTypes.includes(file.type as any)) {
      return {
        valid: false,
        error: {
          code: 'INVALID_TYPE',
          message: `File type "${file.type}" is not allowed. Accepted types: ${constraints.allowedTypes.join(', ')}`,
          details: {
            expectedTypes: constraints.allowedTypes,
            actualType: file.type,
          },
        },
      };
    }

    // 3. Check file extension
    const ext = '.' + file.name.toLowerCase().split('.').pop();
    if (!constraints.allowedExtensions.includes(ext as any)) {
      return {
        valid: false,
        error: {
          code: 'INVALID_EXTENSION',
          message: `File extension "${ext}" is not allowed. Accepted extensions: ${constraints.allowedExtensions.join(', ')}`,
        },
      };
    }

    // 4. Verify magic bytes (content validation)
    const isValidContent = await verifyMagicBytes(file, category);
    if (!isValidContent) {
      return {
        valid: false,
        error: {
          code: 'CORRUPTED_FILE',
          message: 'File content does not match its declared type. The file may be corrupted or mislabeled.',
        },
      };
    }

    return { valid: true };
  }

  /**
   * Verifies file content matches expected magic bytes
   */
  async function verifyMagicBytes(file: File, category: UploadCategory): Promise<boolean> {
    const constraints = UPLOAD_CONSTRAINTS[category];
    const magicBytes = constraints.magicBytes[file.type as keyof typeof constraints.magicBytes];

    if (!magicBytes) {
      // No magic bytes defined for this type, skip content validation
      return true;
    }

    const buffer = await file.slice(0, 12).arrayBuffer();
    const bytes = new Uint8Array(buffer);

    // Check if file starts with expected magic bytes
    for (let i = 0; i < magicBytes.length; i++) {
      if (bytes[i] !== magicBytes[i]) {
        return false;
      }
    }

    return true;
  }

  /**
   * Sanitizes filename for storage
   */
  export function sanitizeFilename(filename: string): string {
    // Remove path traversal attempts
    const basename = filename.split(/[\\/]/).pop() || 'file';

    // Replace unsafe characters
    const sanitized = basename
      .replace(/[^a-zA-Z0-9._-]/g, '_')
      .replace(/_{2,}/g, '_')
      .toLowerCase();

    // Ensure extension is preserved
    const parts = sanitized.split('.');
    if (parts.length > 1) {
      const ext = parts.pop();
      const name = parts.join('_');
      return `${name}.${ext}`;
    }

    return sanitized;
  }

  /**
   * Generates unique storage path for uploaded file
   */
  export function generateStoragePath(
    projectId: string,
    assetId: string,
    fieldType: 'thumbnail' | 'file' | 'reference',
    filename: string
  ): string {
    const sanitized = sanitizeFilename(filename);
    const timestamp = Date.now();
    const random = Math.random().toString(36).substring(2, 8);

    return `${projectId}/${assetId}/${fieldType}-${timestamp}-${random}-${sanitized}`;
  }
  ```

