  ## Security Considerations

  - **Path Traversal**: Sanitize filenames to prevent `../../../etc/passwd`
  - **Content-Type Spoofing**: Verify magic bytes, don't trust Content-Type header alone
  - **Storage Isolation**: Files stored in project-specific paths
  - **Size Limits**: Enforced at application layer before storage
  - **Metadata Stripping**: Consider EXIF removal for privacy (future enhancement)

  ## Error Handling

  | Scenario | Error Code | User Message |
  |----------|------------|--------------|
  | File too large | `FILE_TOO_LARGE` | "File is X MB but maximum allowed is Y MB" |
  | Wrong MIME type | `INVALID_TYPE` | "File type 'X' not allowed. Accepted: Y, Z" |
  | Wrong extension | `INVALID_EXTENSION` | "Extension '.X' not allowed. Use: .Y, .Z" |
  | Corrupted content | `CORRUPTED_FILE` | "File appears corrupted or mislabeled" |
