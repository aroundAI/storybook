summary: |
  Platform connections (YouTube, TikTok, Instagram) use OAuth tokens that expire. Without proactive refresh:
  - Publishing fails mid-upload
  - Users must manually reconnect frequently
  - Scheduled posts fail silently

  This spec defines a robust token refresh strategy with graceful degradation.
cross_cutting_concern:
  concern_name: "OAuth Token Refresh"
  applies_to:
    - "YouTube"
    - "TikTok"
    - "Instagram"
  rules:
    - "Proactive Refresh: Refresh tokens before they expire"
    - "Just-in-Time Refresh: Refresh on demand if proactive refresh missed"
    - "Failure Handling: Mark connections as needing re-auth on refresh failure"
    - "User Notification: Alert users when re-authentication is required"
    - "Background Job: Cron job to refresh tokens expiring soon"
  file_path: "packages/features/publishing/src/lib/token-refresh.ts"
