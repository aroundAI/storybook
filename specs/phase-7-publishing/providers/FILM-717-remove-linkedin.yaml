summary: >
  LinkedIn is removed from the product. On 2026-10-02 the owner first chose to
  "retire LinkedIn for now" instead of moving its pinned API version
  (LinkedIn-Version 202401, sunset by LinkedIn on 2025-01-22, KB-164); later
  the same day the owner widened that to deleting it everywhere, because its
  text-post path "doesn't fit within how all the other platforms are
  integrated", and LinkedIn will be planned again later (FILM-718). Every piece
  of the integration is deleted, as FILM-514 deleted Suno: the provider and
  publisher, the text-post path and the Social Posts page built on it, the
  OAuth connect and callback routes and the card that reached them, LinkedIn
  in publishing, scheduling, the worker and token refresh, the scope lists,
  label maps, format families and VENDOR_API_PINS, the vendor sandbox's
  LinkedIn origin with its fixtures and fidelity tests, its E2E specs and
  guards, and its sections in the capability reference and docs. The database
  keeps the value: no migration drops 'linkedin' from a CHECK or deletes a
  row. A kept LinkedIn row is not a supported platform anywhere in the code,
  so it is hidden, never refreshed and never published to, and no path can
  create one.
