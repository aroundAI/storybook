notes: |
  ## The owner's decisions

  - 2026-10-02, on KB-164: "retire LinkedIn for now", instead of moving the
    pinned LinkedIn-Version (202401, sunset 2025-01-22). "For now" meant the
    product stops offering LinkedIn and the work can come back later.
  - 2026-10-02, later the same day: delete it everywhere, not hide it. Its
    text-post path "doesn't fit within how all the other platforms are
    integrated", and LinkedIn will be planned again later (FILM-718). No
    destructive migration: enum and CHECK values stay, rows stay.

  The first decision was built as a read-only "Retired" card and a
  platform_retired refusal; the second replaced that with this removal, on the
  same branch.

  ## How a kept row is handled

  The CHECK still admits 'linkedin', so an old row keeps its value, but
  `isPlatform` rejects it. Everything that reads a row narrows with it:

  | Reader | What happens to a LinkedIn row |
  |---|---|
  | Platform Connections (getConnectionsAction) | not returned, so not shown |
  | Publish screen (getConnectedPlatformsAction) | not returned, so not a channel |
  | Analytics channels (listAccountChannels, project channels) | not a channel, so the coverage strip never names it |
  | ensureValidToken | PLATFORM_UNSUPPORTED: no refresh, no deactivation, no notification |
  | Refresh cron | not selected |
  | Publish worker | a queued publish is marked failed with PLATFORM_UNSUPPORTED and acknowledged; a queued social post is acknowledged and nothing is written |

  Nothing creates one: the connect and callback routes are gone, the publish
  schema refuses 'linkedin', and the scan finds no other writer. A kept
  connection's token stays encrypted in the database; deleting it is a
  data-deletion request (the data-deletion page's section 1), handled by hand.

  ## Left on purpose (the scan's KEPT list says why, file by file)

  - Migration history and the schema mirrors of the constraints that keep the
    value (30-film-studio, 31-oauth-states, 32-platform-connections,
    38-revenue-tracking, 40-social-posts).
  - apps/web/supabase/config.toml: Supabase CLI's comment listing every
    provider it supports.
  - The tests that prove a kept row is handled, and film-717.json's guards.
  - Specs: the records of what was built and why (FILM-715, KB-164, KB-145,
    FILM-1802 and others) still name LinkedIn; specs are history, not code.

  ## Guards

  New, tooling/mutation-guards/film-717.json, all RED: R1 LinkedIn offered
  again, R2 the name back in code, R3 a kept token refreshed, R4 the cron
  selecting it, R5 the publish screen listing it, R6 the worker running a
  queued job, R7 analytics listing it as a channel, R8 the schema admitting
  it, R9 the settings list returning it.

  Removed with the code they guarded: KB-145 U1 (the LinkedIn callback),
  FILM-1723 "LinkedIn's version is declared a second time" and "A pin past
  its end loses the known bug that owns the move" (no pin is past its end
  now; the T-120 fixture test still covers the rule), SPEC-TESTS U2 (the
  LinkedIn provider), KB-105 P2 and P3 (the social-post actions).

  Re-pointed to the shared rule they guard, all RED: KB-145 U2 (X's callback),
  FILM-1801's two host guards (the TikTok worker handler, the Facebook
  provider), FILM-1723's headline guard (Meta, then X), FILM-1703 and
  FILM-1714 SM1/SM2 (a sixth platform joining AnalyticsPlatform), FILM-1716
  FF2 (X's short), KB-22 U5 and KB-25-45 R5 (the dialog and the revokers),
  KB-15 (PLATFORMS against the CHECK), KB-138 G1 (the API-keys action),
  KB-61 (the scheduled-report delete).

  ## Tests and E2E

  New: removed-platform.test.ts (publishing), the worker's
  removed-platform.test.ts, film-717-linkedin-removed.test.ts,
  linkedin-removed.spec.ts, and the kept-row cases in connection-actions,
  token-refresh, publish-actions and channels-language. Deleted with the
  integration: linkedin-provider.test.ts, the sandbox's linkedin-journey and
  linkedin-fidelity, sandbox-connect-linkedin.spec.ts, the LinkedIn cases in
  callback-success, disconnect-revoke, sandbox-disconnect-refresh, refusals,
  ai-sandbox-evidence and data-deletion.

  PR: #TBD-LI.
