summary: >
  The owner decided on 2026-10-02 to "retire LinkedIn for now" instead of
  moving its pinned API version: LinkedIn-Version 202401, which every LinkedIn
  call sent, was sunset by LinkedIn on 2025-01-22 (KB-164). "For now" means the
  product stops offering LinkedIn, and the work can come back later. Nothing
  offers LinkedIn any more: Platform Connections has no LinkedIn card unless the
  team still has a LinkedIn row, the publish screen lists no LinkedIn channel,
  the new-project form offers no LinkedIn target, and the LinkedIn-only Social
  Posts page is gone. The connect and callback routes stay and answer with a
  refusal the page reads ("LinkedIn is retired"), the publish worker answers a
  queued LinkedIn job the same way, and the integration itself (provider, OAuth
  config, app credentials, version pin, vendor hosts, sandbox origin, prompt) is
  deleted, as FILM-514 deleted Suno's. No row is deleted: existing LinkedIn
  connections are shown as retired and read-only, with Disconnect still
  available, and past LinkedIn publishes, revenue and social posts are kept.
