notes: |
  ## The owner's decision

  2026-10-02, on KB-164 (LinkedIn-Version 202401, sunset 2025-01-22): "retire
  LinkedIn for now", instead of moving the pinned version. "For now" means the
  product stops offering LinkedIn, and the work can come back later.

  ## Why the code is deleted, not kept

  Neither precedent kept code. FILM-514 deleted Suno and Udio ("If we need it
  then we would do it from scratch later"); FILM-513 deleted lip-sync, saying a
  return "is a new spec against a provider that exists, not a restoration of
  this one — the retained FILM-511 file and git history hold the design". No
  other retirement in specs/ kept a dormant integration. Kept code here would
  also keep the defect that caused the retirement: every LinkedIn call sent a
  sunset version header, and nothing could run it without a LinkedIn app. So
  the integration is deleted, and FILM-715 and the repository history hold the
  design for a return. What stays is what reads stored rows: the platform value,
  its label and icon, the disconnect path (LinkedIn offers apps no revoke,
  KB-25, so disconnect only clears our tokens) and the platform-access link.

  ## Existing rows

  Shown as retired and read-only, not hidden: a team that connected LinkedIn
  sees the row on a "Retired" card and can disconnect it, which clears the
  token we hold (the data-deletion page's promise). Past LinkedIn publishes
  stay in the episode's publish history; unpublishing one removes our record
  only, as before. Social posts were LinkedIn-only, so their page went with
  LinkedIn; their rows are kept in social_posts and are not shown.

  ## What stays, on purpose

  - The public page's Share menu keeps "LinkedIn": it opens
    linkedin.com/sharing with the page's URL in the viewer's browser. It calls
    no API, needs no app or version, and the scan's control case allows it.
  - auth.config.ts lists linkedin among Supabase's sign-in provider names; no
    LinkedIn sign-in is enabled.
  - The capability reference keeps its LinkedIn field blocks and rows as
    reference for a return; the pin table says LinkedIn is retired.

  ## Tests and guards

  New, each seen red on main first: retired-platforms.test.ts,
  token-refresh.test.ts (two), connection-actions.test.ts, publish-actions.test.ts,
  disconnect-copy.test.ts, callback-success.test.ts (two), connect-failure.test.ts,
  retired-platform.test.ts (worker, two), provenance.test.ts,
  film-717-linkedin-retired.test.ts, linkedin-retired.spec.ts (three of four
  red against main's component and connection actions; the fourth, the old
  connect link, is red through the route unit test). Guards:
  tooling/mutation-guards/film-717.json R1–R10 and E1–E2, all RED.

  Retired: KB-145 U1 (the LinkedIn callback stores nothing now), FILM-1723
  "LinkedIn's version is declared a second time in the lambda" (no version),
  SPEC-TESTS U2 (the LinkedIn provider test is gone). Re-pointed: KB-145 U2 to
  X's callback; FILM-1801's two host guards to the TikTok worker handler and
  the Facebook provider; FILM-1723's headline guard to the Meta/X order. All
  re-pointed guards RED.

  E2E: sandbox-connect-linkedin.spec.ts deleted; disconnect-revoke.spec.ts's
  LinkedIn case moved to linkedin-retired.spec.ts; connect-failure.spec.ts no
  longer loops over LinkedIn (its callback refuses everything) and its two
  KB-99 cases use X; sandbox-disconnect-refresh.spec.ts drops LinkedIn's
  refresh; the refusals catalogue and the AI-sandbox evidence drop the Social
  Posts cases; provenance-surfaces.spec.ts asserts the retired sentence.

  ## Records touched

  FILM-715 (RETIRED), KB-164 (fixed: resolved by retirement), KB-145 (guard
  note), FILM-1802 and the phase-18 README (sandbox origin 4105 gone),
  FILM-1723 (pin), FILM-1725 Check I and docs/OWNER-CHECKS.md OC-5 (X only),
  FILM-906 (cards), FILM-1007 (citation), INDEX.

  PR: #TBD-LI.
