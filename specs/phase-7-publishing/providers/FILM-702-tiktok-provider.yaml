notes: |
  ## Metadata
  - **Phase:** 7 - Publishing
  - **Priority:** P1 (Post-MVP)
  - **Effort:** L (1-3 days)
  - **Dependencies:** FILM-706 (TikTok OAuth), SPIKE-03 (TikTok OAuth Quirks)
  - **Blocks:** FILM-708 (Publish Hub)

  ## Specification
  ### Requirements

  1. **Video Upload**: Two-phase upload (init + upload chunks)
  2. **Metadata**: Caption, privacy, duet/stitch settings
  3. **Disclosure**: Commercial content disclosure
  4. **Progress Tracking**: Report upload progress
  5. **Post Status**: Track post creation status

  ### Provider Interface

  ```typescript
  // packages/features/publishing/src/providers/tiktok/types.ts

  export interface TikTokUploadInput {
    videoPath: string;
    caption: string;                    // Max 2200 chars
    privacy: 'PUBLIC' | 'FRIENDS' | 'SELF';
    disableDuet: boolean;
    disableStitch: boolean;
    disableComment: boolean;
    videoCoverTimestampMs?: number;     // Thumbnail frame
    brandContentToggle?: boolean;       // Is branded content
    brandOrganicToggle?: boolean;       // Is organic branded
  }

  export interface TikTokUploadResult {
    publishId: string;
    status: 'PROCESSING' | 'PUBLISH_COMPLETE' | 'FAILED';
    videoUrl?: string;
  }

  export interface TikTokUser {
    openId: string;
    unionId: string;
    avatarUrl: string;
    displayName: string;
    followerCount: number;
  }
  ```

  ### Provider Implementation

  ```typescript
  // packages/features/publishing/src/providers/tiktok/tiktok-provider.ts

  const TIKTOK_API_BASE = 'https://open.tiktokapis.com/v2';

  export class TikTokProvider {
    constructor(private accessToken: string) {}

    /**
     * Uploads a video to TikTok using the Content Posting API
     */
    async uploadVideo(
      input: TikTokUploadInput,
      onProgress?: (progress: number) => void
    ): Promise<TikTokUploadResult> {
      // 1. Get video info
      const videoSize = await this.getFileSize(input.videoPath);
      const chunkSize = 10 * 1024 * 1024; // 10MB chunks
      const totalChunks = Math.ceil(videoSize / chunkSize);

      // 2. Initialize upload
      const initResponse = await this.initUpload({
        sourceInfo: {
          source: 'FILE_UPLOAD',
          videoSize,
          chunkSize,
          totalChunkCount: totalChunks,
        },
      });

      const { uploadId, uploadUrl } = initResponse;

      // 3. Upload chunks
      const videoStream = await this.getVideoStream(input.videoPath);
      let uploadedChunks = 0;

      for await (const chunk of this.chunkStream(videoStream, chunkSize)) {
        await this.uploadChunk(uploadUrl, chunk, uploadedChunks);
        uploadedChunks++;
        onProgress?.(Math.round((uploadedChunks / totalChunks) * 100));
      }

      // 4. Complete upload and create post
      const postResponse = await this.createPost(uploadId, input);

      return {
        publishId: postResponse.publishId,
        status: 'PROCESSING',
      };
    }

    /**
     * Initializes the upload session
     */
    private async initUpload(params: {
      sourceInfo: {
        source: 'FILE_UPLOAD';
        videoSize: number;
        chunkSize: number;
        totalChunkCount: number;
      };
    }): Promise<{ uploadId: string; uploadUrl: string }> {
      const response = await fetch(`${TIKTOK_API_BASE}/post/publish/inbox/video/init/`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${this.accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          source_info: params.sourceInfo,
        }),
      });

      const data = await response.json();

      if (data.error.code !== 'ok') {
        throw new Error(`TikTok init failed: ${data.error.message}`);
      }

      return {
        uploadId: data.data.upload_id,
        uploadUrl: data.data.upload_url,
      };
    }

    /**
     * Uploads a single chunk
     */
    private async uploadChunk(
      uploadUrl: string,
      chunk: Buffer,
      chunkIndex: number
    ): Promise<void> {
      const response = await fetch(uploadUrl, {
        method: 'PUT',
        headers: {
          'Content-Type': 'video/mp4',
          'Content-Range': `bytes ${chunkIndex * chunk.length}-${(chunkIndex + 1) * chunk.length - 1}/*`,
        },
        body: chunk,
      });

      if (!response.ok) {
        throw new Error(`Chunk upload failed: ${response.statusText}`);
      }
    }

    /**
     * Creates the post after upload is complete
     */
    private async createPost(
      uploadId: string,
      input: TikTokUploadInput
    ): Promise<{ publishId: string }> {
      const response = await fetch(`${TIKTOK_API_BASE}/post/publish/video/init/`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${this.accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          post_info: {
            title: input.caption,
            privacy_level: input.privacy,
            disable_duet: input.disableDuet,
            disable_stitch: input.disableStitch,
            disable_comment: input.disableComment,
            video_cover_timestamp_ms: input.videoCoverTimestampMs,
            brand_content_toggle: input.brandContentToggle,
            brand_organic_toggle: input.brandOrganicToggle,
          },
          source_info: {
            source: 'FILE_UPLOAD',
            video_upload_id: uploadId,
          },
        }),
      });

      const data = await response.json();

      if (data.error.code !== 'ok') {
        throw new Error(`TikTok post failed: ${data.error.message}`);
      }

      return { publishId: data.data.publish_id };
    }

    /**
     * Checks the status of a published video
     */
    async getPublishStatus(publishId: string): Promise<TikTokUploadResult> {
      const response = await fetch(
        `${TIKTOK_API_BASE}/post/publish/status/fetch/?publish_id=${publishId}`,
        {
          headers: { 'Authorization': `Bearer ${this.accessToken}` },
        }
      );

      const data = await response.json();

      return {
        publishId,
        status: data.data.status,
        videoUrl: data.data.public_post?.video_url,
      };
    }

    /**
     * Gets user profile info
     */
    async getUserInfo(): Promise<TikTokUser> {
      const response = await fetch(
        `${TIKTOK_API_BASE}/user/info/?fields=open_id,union_id,avatar_url,display_name,follower_count`,
        {
          headers: { 'Authorization': `Bearer ${this.accessToken}` },
        }
      );

      const data = await response.json();
      const user = data.data.user;

      return {
        openId: user.open_id,
        unionId: user.union_id,
        avatarUrl: user.avatar_url,
        displayName: user.display_name,
        followerCount: user.follower_count,
      };
    }

    private async *chunkStream(stream: ReadableStream, chunkSize: number): AsyncGenerator<Buffer> {
      const reader = stream.getReader();
      let buffer = Buffer.alloc(0);

      while (true) {
        const { done, value } = await reader.read();

        if (done) {
          if (buffer.length > 0) yield buffer;
          break;
        }

        buffer = Buffer.concat([buffer, Buffer.from(value)]);

        while (buffer.length >= chunkSize) {
          yield buffer.slice(0, chunkSize);
          buffer = buffer.slice(chunkSize);
        }
      }
    }

    private async getFileSize(path: string): Promise<number> {
      if (path.startsWith('http')) {
        const response = await fetch(path, { method: 'HEAD' });
        return parseInt(response.headers.get('content-length') ?? '0');
      }
      const fs = await import('fs');
      const stats = await fs.promises.stat(path);
      return stats.size;
    }

    private async getVideoStream(path: string): Promise<ReadableStream> {
      if (path.startsWith('http')) {
        const response = await fetch(path);
        return response.body!;
      }
      const fs = await import('fs');
      const stream = fs.createReadStream(path);
      return Readable.toWeb(stream) as ReadableStream;
    }
  }
  ```

