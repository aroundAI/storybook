  ## Error Handling
  | Error | Handling |
  |-------|----------|
  | `spam_risk_too_many_pending` | Too many pending posts |
  | `spam_risk_user_banned` | Account suspended |
  | `video_too_long` | Video exceeds 10 min limit |
  | `invalid_video_format` | Unsupported format |

  ## Constraints
  - Video max length: 10 minutes
  - Video max size: 4GB
  - Caption max length: 2200 characters
  - Chunk size: 5-64MB recommended
