summary: >
  TikTok is essential for short-form video distribution. The TikTok Content Posting API allows
  uploading videos up to 10 minutes. This provider handles the unique upload flow and metadata
  requirements.
provider:
  vendor: "TikTok Content Posting API"
  file_path: "packages/features/publishing/src/providers/tiktok/tiktok-provider.ts"
  base_url: "https://open.tiktokapis.com/v2"
  auth: "OAuth 2.0 bearer access token"
  endpoints:
    - method: POST
      path: "/post/publish/inbox/video/init/"
      purpose: "initialize the chunked upload"
    - method: PUT
      path: "{upload_url returned by init}"
      purpose: "upload video chunks (Content-Range)"
    - method: POST
      path: "/post/publish/video/init/"
      purpose: "create the post from the uploaded video"
    - method: GET
      path: "/post/publish/status/fetch/?publish_id={publishId}"
      purpose: "poll post status"
    - method: GET
      path: "/user/info/?fields=open_id,union_id,avatar_url,display_name,follower_count"
      purpose: "read user info"
  rate_limits: null
  webhooks: []
