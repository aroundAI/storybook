  ## Environment Variables
  ```env
  LINKEDIN_CLIENT_ID=
  LINKEDIN_CLIENT_SECRET=
  ```

  ## Error Handling
  | Error | User Experience |
  |-------|-----------------|
  | Video too long | Show duration limit based on account type |
  | Post too long | Real-time character counter |
  | Upload failed | Retry with exponential backoff |
  | Rate limited | Show wait time, queue for later |
  | Invalid scope | Prompt to reconnect with correct permissions |

  ## Security Considerations
  - OAuth tokens stored encrypted in database
  - Refresh tokens used to maintain access without re-authorization
  - Company page access requires additional organization permissions
  - All API calls use HTTPS

