spec_id: "FILM-719"
title: "Channel posting cadence: a release drips onto each channel, and an episode's Shorts follow it until the next episode"
phase: 7
phase_name: "Publishing"
category: feature
status: DONE
effort: M
dependencies:
  - spec_id: "FILM-708"
    note: "the Publish screen, its Schedule Release panel and Shorts groups' platforms"
  - spec_id: "FILM-2207"
    note: "preparePublish and schedulePublishes, which a cadence release writes through (stacked on #664)"
summary: >
  The owner has five channels, each with five long videos and four or five
  Shorts or Reels per video (owner, 2026-10-15). The Schedule Release panel
  put an episode's videos 15 minutes apart, so a channel got a long video
  and all its Shorts within hours. Nothing looked at what other episodes
  already had queued on the same channel. A burst of templated uploads is
  what YouTube's inauthentic-content policy and near-duplicate checks look
  for. No platform publishes a daily cap: the risk is the burst, not the
  volume.

  Each channel now has posting rules, one set for Shorts and one for long
  videos, in channel_posting_cadences. The rules are wall-clock slots in the
  channel's timezone (their count is the daily cap), weekdays, the days
  between long videos, how long Shorts wait after their long video, and
  random jitter. A channel with no rules posts on the defaults: one Short a
  day at 18:00 starting 20 hours after the long video, long videos at 17:00
  at least 3 days apart, and ±20 minutes of jitter.

  A release on the channels' cadence puts the long video in the channel's
  next free slot and the Shorts one slot at a time after it. Shorts follow
  their own episode only (owner, 2026-10-15): an episode's Shorts take slots
  only until the next episode's long video. Those that do not fit are held,
  never dropped. A new long video holds an earlier episode's Shorts still
  scheduled after it. The owner re-queues held Shorts, after everything on
  the channel, or discards them. A long video and a Short may share a day
  (owner, 2026-10-15).

  Each post holds its slot (publishes.slot_at), and a unique index allows
  one post per slot on a channel, so two releases planned at once cannot
  double-book a channel. A Short waits for its episode's long video to be
  live (publishes.after_episode_full) and fails, saying why, if the long
  video never goes out. Both scheduled paths share the job's cadence gate:
  a slotted post on a channel that has already had its day's posts is moved
  on a day, and two overlapping runs can no longer both claim a row (KB-196).
