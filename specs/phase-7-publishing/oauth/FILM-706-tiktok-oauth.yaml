  ## Metadata
  - **Phase:** 7 - Publishing
  - **Priority:** P1 (Post-MVP)
  - **Effort:** M (4-8 hours)
  - **Dependencies:** FILM-CC-03 (OAuth Token Refresh), SPIKE-03 (TikTok OAuth Quirks)
  - **Blocks:** FILM-702 (TikTok Provider), FILM-708 (Publish Hub)
