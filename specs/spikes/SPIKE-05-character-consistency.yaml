  ## Research Questions

  ### 1. Element Prompt Fundamentals
  - How does the element prompt parameter work?
  - What types of elements can be specified? (characters, objects, styles)
  - What's the prompt format and structure?
  - How detailed should element descriptions be?
  - Are there character limits on element prompts?
  - Can multiple elements be specified in one prompt?

  ### 2. Character Consistency Testing
  - How consistent are character appearances across shots?
    - Facial features
    - Body type and proportions
    - Clothing and accessories
    - Hair color and style
    - Age appearance
  - Does consistency vary by:
    - Shot angle/distance
    - Action/movement complexity
    - Lighting conditions
    - Background complexity

  ### 3. Reference Images vs Text-Only
  - Can we provide reference images for characters?
  - How do reference images compare to text descriptions?
  - What image formats/sizes work best?
  - Can we use previous generated shots as references?
  - Do reference images significantly improve consistency?

  ### 4. Prompt Engineering Strategies
  - What prompt patterns work best for consistency?
  - Should element descriptions be repeated in main prompt?
  - How do we handle multiple characters in one shot?
  - How do we maintain character while varying actions?
  - What level of detail is optimal?

  ### 5. Multi-Character Scenarios
  - Can we maintain 2+ characters consistently?
  - How do we distinguish between multiple characters?
  - Do characters interfere with each other's consistency?
  - Can we have character interactions while maintaining consistency?

  ### 6. Consistency Limitations
  - At what point does consistency break down?
  - How many sequential shots maintain consistency?
  - What variables most affect consistency?
  - Are there certain character types that work better?
  - What's the failure rate for consistency?

  ### 7. Style and Aesthetic Consistency
  - Beyond characters, can we maintain visual style?
  - Can we keep consistent color grading/mood?
  - Can we maintain consistent world/setting design?
  - How do we handle time of day changes?

  ### 8. Recovery Strategies
  - What do we do when consistency breaks?
  - Can we regenerate shots that don't match?
  - Can we use failed shots as negative examples?
  - Should we batch generate and cherry-pick?

  ### 9. User Expectations Management
  - What's a realistic expectation for consistency?
  - Should we show users examples of variations?
  - How do we communicate limitations?
  - Should we offer a "character library" feature?

  ## Approach

  ### Phase 1: Element Prompt Documentation (4 hours)
  1. Review Kling documentation on element prompts
  2. Review PiAPI documentation for element parameter
  3. Search for community examples and best practices
  4. Document known prompt patterns
  5. Identify any undocumented features or quirks

  ### Phase 2: Single Character Testing (12 hours)

  **Test Set 1: Simple Character (5 shots)**
  - Character: "A young woman with red hair in a ponytail, wearing a blue jacket"
  - Generate 5 shots with same character, different actions:
    1. Walking forward
    2. Turning around
    3. Waving
    4. Sitting down
    5. Standing up
  - Evaluate consistency across shots
  - Document variations

  **Test Set 2: Detailed Character (5 shots)**
  - Character: "A 30-year-old Black man with short curly hair, brown eyes, beard, wearing round glasses, gray hoodie, and jeans"
  - Generate 5 shots with different actions and angles
  - Compare consistency with simple description
  - Note which details are maintained

  **Test Set 3: Character in Different Contexts (5 shots)**
  - Same character in different settings:
    1. Indoor office
    2. Outdoor park
    3. Nighttime street
    4. Busy cafe
    5. Empty room
  - Evaluate if context affects consistency

  **Test Set 4: Character at Different Distances (5 shots)**
  - Same character at different shot types:
    1. Extreme close-up (face)
    2. Close-up (head and shoulders)
    3. Medium shot (waist up)
    4. Full shot (entire body)
    5. Wide shot (character in environment)
  - Evaluate if distance affects consistency

  ### Phase 3: Reference Image Testing (10 hours)

  **Test Set 5: Generated Reference (5 shots)**
  - Generate initial shot of character
  - Use that shot as reference for 4 more shots
  - Compare consistency with text-only approach
  - Document improvement or degradation

  **Test Set 6: External Reference (5 shots)**
  - Use external image as character reference
  - Generate 5 shots with different actions
  - Evaluate how well Kling matches reference
  - Test with different reference image types:
    - Photo realistic
    - Illustration
    - 3D render
    - AI-generated image

  **Test Set 7: Progressive Referencing (5 shots)**
  - Generate shot 1 from text description
  - Use shot 1 as reference for shot 2
  - Use shot 2 as reference for shot 3
  - Continue chain for 5 shots
  - Evaluate drift over sequence

  ### Phase 4: Multi-Character Testing (10 hours)

  **Test Set 8: Two Characters (5 shots)**
  - Character A: "A young woman with red hair"
  - Character B: "A tall man with black hair"
  - Generate 5 shots with both characters
  - Evaluate consistency of each character
  - Note any interference between characters

  **Test Set 9: Character Interactions (5 shots)**
  - Same two characters in interaction scenarios:
    1. Standing together talking
    2. Walking side by side
    3. Sitting across from each other
    4. One in foreground, one in background
    5. High-five or handshake
  - Evaluate consistency during interactions

  ### Phase 5: Prompt Engineering (8 hours)

  **Test Set 10: Prompt Variation Testing**
  Generate same character with different prompt styles:
  - Short prompt: "Red-haired woman in blue jacket"
  - Medium prompt: "A woman with long red hair, blue denim jacket, jeans"
  - Long prompt: "A 25-year-old woman with flowing red hair in a ponytail, bright blue eyes, wearing a blue denim jacket with patches, black t-shirt underneath, dark blue jeans, and white sneakers"
  - Element only: Element in element prompt, no mention in main
  - Element + main: Element described in both prompts
  - Element + negative: Element in prompt, contradictory main prompt

  Compare consistency across styles

  **Test Set 11: Action Complexity Testing**
  Same character performing:
  - Simple action: Standing still, slight movement
  - Medium action: Walking, waving
  - Complex action: Dancing, jumping, running
  Evaluate if action complexity affects consistency

  ### Phase 6: Failure Analysis (6 hours)
  1. Collect all inconsistent results
  2. Categorize types of inconsistencies
  3. Identify patterns in failures
  4. Document what elements are most/least stable
  5. Create failure rate statistics
  6. Develop mitigation strategies

  ### Phase 7: Best Practices Documentation (6 hours)
  1. Compile most effective prompt patterns
  2. Create character prompt template
  3. Document do's and don'ts
  4. Create examples of good vs bad results
  5. Write guidelines for prompt engineering
  6. Develop quality assessment criteria

  ### Phase 8: Integration Strategy (4 hours)
  1. Design how character data is stored
  2. Define how element prompts are generated from character descriptions
  3. Plan for handling consistency failures
  4. Design user feedback for inconsistent results
  5. Consider batch generation and selection approach
  6. Plan for future improvements (character library, fine-tuning)

