summary: >
  One of the biggest challenges in AI video generation for storytelling is maintaining
  character consistency across shots. Kling AI offers an "element" prompt parameter
  designed to maintain consistency of characters, objects, or styles across videos. We
  need to thoroughly test this feature to understand its capabilities and limitations
  before building our multi-shot episode system.
