notes: |
  **Phase**: 4
  **Priority**: P0
  **Effort**: M (3-4 days)
  **Dependencies**: FILM-405 (generate-video-action)
  **Blocks**: FILM-409 (visual-studio)

  ## Requirements

  ### Functional Requirements

  1. **Batch Validation**
     - Accept array of shot IDs (max 50)
     - Validate all shots exist
     - Check user has access to all shots
     - Verify no shots already have videos

  2. **Batch Budget Check**
     - Calculate total estimated cost
     - Check budget for entire batch
     - Reserve budget atomically
     - Roll back if any validation fails

  3. **Batch Job Creation**
     - Create all generation_jobs records
     - Add all jobs to queue with same priority
     - Return array of job IDs
     - Handle partial failures gracefully

  4. **Priority Management**
     - Support batch priority (high/normal/low)
     - All jobs in batch get same priority
     - Process high priority batches first

  ### Non-Functional Requirements

  - Complete within 10 seconds for 50 shots
  - Atomic operation (all or nothing)
  - Return detailed error for each failed shot
  - Log batch operations for analytics

  ## Interface

  ### TypeScript Types

  ```typescript
  import { z } from 'zod';

  export const BatchGenerateVideosSchema = z.object({
    shotIds: z.array(z.string().uuid()).min(1).max(50),
    provider: z.enum(['kling', 'runway', 'luma']).optional(),
    mode: z.enum(['std', 'pro']).optional().default('std'),
    priority: z.enum(['high', 'normal', 'low']).optional().default('normal'),
  });

  export interface BatchGenerateResult {
    shotId: string;
    success: boolean;
    generationJobId?: string;
    error?: string;
  }

  export interface BatchGenerateResponse {
    totalShots: number;
    successCount: number;
    failureCount: number;
    totalEstimatedCostCents: number;
    results: BatchGenerateResult[];
  }
  ```

  ### Server Action Implementation

  ```typescript
  'use server';

  import { enhanceAction } from '@kit/next/actions';
  import { getSupabaseServerClient } from '@kit/supabase/server-client';
  import { generateVideoAction } from './generate-video-action';

  export const batchGenerateVideosAction = enhanceAction(
    async (data, user) => {
      const client = getSupabaseServerClient();
      const results: BatchGenerateResult[] = [];
      let successCount = 0;
      let failureCount = 0;
      let totalEstimatedCost = 0;

      // Validate all shots exist and belong to same account
      const { data: shots, error: shotsError } = await client
        .from('shots')
        .select('id, video_url, episodes!inner(project_id, projects!inner(account_id))')
        .in('id', data.shotIds);

      if (shotsError || !shots || shots.length !== data.shotIds.length) {
        throw new Error('One or more shots not found');
      }

      // Check all shots belong to same account
      const accountIds = new Set(
        shots.map((s) => s.episodes.projects.account_id)
      );
      if (accountIds.size > 1) {
        throw new Error('All shots must belong to the same account');
      }

      // Check none already have videos
      const shotsWithVideos = shots.filter((s) => s.video_url);
      if (shotsWithVideos.length > 0) {
        throw new Error(
          `${shotsWithVideos.length} shots already have videos`
        );
      }

      // Calculate total estimated cost
      for (const shot of shots) {
        const provider = await createVideoProvider({
          accountId: shot.episodes.projects.account_id,
          provider: data.provider || 'kling',
        });

        const cost = provider.estimateCost({
          prompt: shot.prompt,
          duration: shot.duration.toString(),
          aspectRatio: shot.aspect_ratio,
          mode: data.mode,
        });

        totalEstimatedCost += cost;
      }

      // Check budget for entire batch
      const accountId = shots[0].episodes.projects.account_id;
      const budgetCheck = await checkAndReserveBudget(
        accountId,
        totalEstimatedCost
      );

      if (!budgetCheck.allowed) {
        throw new Error(
          `Insufficient budget for batch. Required: $${(totalEstimatedCost / 100).toFixed(2)}, Available: $${(budgetCheck.remaining / 100).toFixed(2)}`
        );
      }

      // Generate videos for all shots
      const priorityMap = { high: 8, normal: 5, low: 2 };
      const priority = priorityMap[data.priority || 'normal'];

      for (const shotId of data.shotIds) {
        try {
          const result = await generateVideoAction({
            shotId,
            provider: data.provider,
            mode: data.mode,
          });

          results.push({
            shotId,
            success: true,
            generationJobId: result.generationJobId,
          });
          successCount++;
        } catch (error) {
          results.push({
            shotId,
            success: false,
            error: error instanceof Error ? error.message : 'Unknown error',
          });
          failureCount++;
        }
      }

      return {
        totalShots: data.shotIds.length,
        successCount,
        failureCount,
        totalEstimatedCostCents: totalEstimatedCost,
        results,
      };
    },
    { schema: BatchGenerateVideosSchema, auth: true }
  );
  ```

  ## Implementation Details

  ### File Structure

  ```
  packages/features/video-generation/src/
  ├── server/
  │   ├── actions/
  │   │   ├── batch-generate-action.ts     # Batch action (CREATE THIS)
  │   │   └── __tests__/
  │   │       └── batch-generate-action.test.ts
  ```

  ### Transaction Strategy

  ```
  1. Validate all shots
  2. Calculate total cost
  3. Check budget for total
  4. Reserve budget
  5. For each shot:
     - Create generation job
     - Add to queue
     - Track result
  6. Return summary + individual results
  ```

  ### Error Handling

  **Partial Failure Strategy**: Continue processing remaining shots even if some fail. Return detailed results for each shot.

  ```typescript
  // Example result with partial failure
  {
    totalShots: 5,
    successCount: 4,
    failureCount: 1,
    results: [
      { shotId: '1', success: true, generationJobId: 'job-1' },
      { shotId: '2', success: true, generationJobId: 'job-2' },
      { shotId: '3', success: false, error: 'Shot already has video' },
      { shotId: '4', success: true, generationJobId: 'job-4' },
      { shotId: '5', success: true, generationJobId: 'job-5' },
    ]
  }
  ```

