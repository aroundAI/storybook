  ## Test Plan

  ### Unit Tests

  ```typescript
  import { describe, it, expect } from 'vitest';
  import { batchGenerateVideosAction } from '../batch-generate-action';

  describe('batchGenerateVideosAction', () => {
    it('should generate videos for all shots', async () => {
      const result = await batchGenerateVideosAction({
        shotIds: ['shot-1', 'shot-2', 'shot-3'],
      });

      expect(result.successCount).toBe(3);
      expect(result.results).toHaveLength(3);
    });

    it('should check budget for entire batch', async () => {
      await expect(
        batchGenerateVideosAction({
          shotIds: ['shot-1', 'shot-2', 'shot-3'],
        })
      ).rejects.toThrow('Insufficient budget');
    });

    it('should handle partial failures', async () => {
      const result = await batchGenerateVideosAction({
        shotIds: ['shot-valid', 'shot-with-video', 'shot-valid-2'],
      });

      expect(result.successCount).toBe(2);
      expect(result.failureCount).toBe(1);
    });

    it('should reject more than 50 shots', async () => {
      const shotIds = Array.from({ length: 51 }, (_, i) => `shot-${i}`);

      await expect(
        batchGenerateVideosAction({ shotIds })
      ).rejects.toThrow();
    });
  });
  ```

  ## Security Considerations

  - Verify user has access to all shots
  - Validate shots belong to same account
  - Check RLS policies on all operations
  - Rate limit batch operations per account

  ## Performance Considerations

  - Parallel validation of shots (Promise.all)
  - Batch database queries where possible
  - Limit batch size to 50 shots
  - Use database transactions for atomicity

  ### Optimization Example

  ```typescript
  // Fetch all shots in one query instead of N queries
  const shots = await client
    .from('shots')
    .select('*')
    .in('id', shotIds);

  // Parallel job creation
  const jobPromises = shotIds.map((shotId) =>
    generateVideoAction({ shotId })
  );

  const results = await Promise.allSettled(jobPromises);
  ```

