summary: >
  Users need to generate videos for multiple shots simultaneously. The batch generation action accepts
  an array of shot IDs, validates permissions, checks budget for all generations, and queues multiple
  jobs atomically. This provides a better UX than generating shots one-by-one and ensures budget is
  reserved for the entire batch.
