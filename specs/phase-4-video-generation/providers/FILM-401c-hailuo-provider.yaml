        supportedAspectRatios: ['16:9', '9:16', '1:1'],
        maxDuration: 6,
        minDuration: 5,
        supportsImageToVideo: true,
        costPerSecond: {
          standard: 8, // ~$0.40 for 5s
          professional: 8,
        },
      },
      factory: (config) => new HailuoProvider(config),
    },
  ]
