summary: >
  There is no universal engagement rate — each platform defines a valuable
  viewer differently, so each weights the funnel differently — but the
  funnel itself (Reach, Hook, Attention, Transmission, Audience) is
  universal. That asymmetry is what lets one interface serve five platforms
  without pretending they measure the same thing. This spec defines the
  platform-independent stage vocabulary and the per-platform x per-format map
  that binds a primary and supporting signals to each stage, while declaring
  no new capability-matrix entries: support is computed from FILM-1703's
  existing levels, never authored.
