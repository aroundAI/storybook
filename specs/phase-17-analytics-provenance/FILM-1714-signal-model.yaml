notes: |
  ## Overview

  There is no universal engagement rate. Each platform defines a valuable
  viewer differently, so each weights the funnel differently — but the
  funnel itself is universal. That asymmetry is what lets one interface
  serve five platforms without pretending they measure the same thing.

  | Stage | Question |
  |---|---|
  | Reach | Did the platform show it? |
  | Hook | Did they stop or click? |
  | Attention | Did they keep watching? |
  | Transmission | Did they pass it on? |
  | Audience | Did they come back or follow? |

  Stages are platform-independent and never change. Which metric fills a
  stage is per platform and per format, and that mapping is the whole of
  this spec.

  ## A stage may be unbound, and often should be

  Five stages is a vocabulary, not a quota. Reach is clean on YouTube
  long-form — impressions, then CTR. On a feed-based Short it has no
  honest equivalent: `stayed-to-watch` is not exposed to us at all, and
  there is no impression count. Forcing an approximate metric into the
  stage so every platform shows five filled boxes is the failure this spec
  exists to prevent.

  ```
  Stage  = Reach
  status = unbound
  reason = platform_does_not_expose_an_impression_equivalent
  ```

  Four honest stages beat five with one invented. Use `unbound`
  aggressively.

  An unbound stage and a dark stage are different facts: unbound —
  permanent, platform-shaped. "Instagram exposes no impression
  equivalent." dark — bound to a signal whose inputs are `not_ingested`. A
  ticket. Same emptiness on screen, different sentence, and only one
  belongs in a backlog. Collapsing them makes the ingestion gap invisible,
  which is precisely what FILM-1703's `not_ingested` level exists to
  prevent.

  ## A stage is not one metric

  ```
  Stage
   |-- primary       the canonical diagnostic for this platform x format
   |-- supporting[]  what explains the primary
   `-- unavailable[] named, so the gap stays visible
  ```

  Examples, from the research and from what can actually be computed:

  | Platform x format x stage | Primary | Supporting |
  |---|---|---|
  | YouTube long . Hook | impressions CTR | first-30s retention |
  | YouTube long . Attention | average view duration | average % viewed, retention curve |
  | TikTok short . Attention | average watch time | full_video_watched_rate |
  | Instagram short . Transmission | shares per reach | saves per reach, comments per reach, reposts per reach |
  | Instagram short . Attention | ig_reels_avg_watch_time | reels_skip_rate |

  Treating signals as interchangeable loses the thing that makes a stage
  diagnosable: the primary says whether the stage is weak, the supporting
  signals say why.

  Corrected 2026-09-21 against the capability reference. The Instagram
  Attention row previously read "average watch time" / "average % viewed".
  Both halves were wrong in opposite directions, which is why it is worth
  writing down:

  - The primary is real and better-named. `ig_reels_avg_watch_time` is
    documented for REELS. It is simply never requested
    (`instagram-insights.ts`), so FILM-1712 must land before this binds.
    Its unit is inferred to be milliseconds and must be confirmed before a
    figure is shown — a 1000x error here is silent and plausible-looking.
  - The supporting signal does not exist. Instagram has no completion rate
    and no retention graph, so "average % viewed" cannot be computed for
    it. `reels_skip_rate` — "the percentage of views from people who
    skipped during the first 3 seconds" — is the real supporting signal,
    and it is arguably a Hook signal being borrowed by Attention. Worth
    deciding deliberately rather than by default.

  Transmission gains `reposts_count` (Media node, FEED and REELS, added
  2026-04-22) — the first media-level pass-it-on signal Instagram has
  offered, which is precisely what this stage asks for. It is subject to
  FILM-1712.

  ## Support is computed, never authored

  A signal has no storage, so it can never fill FILM-1703's
  `PlatformCapability` shape — which requires a `SourceTable`. The signal
  layer therefore authors no capabilities. It declares its inputs and
  inherits:

  ```ts
  interface SignalDefinition {
    id: SignalId;
    stage: FunnelStage;
    inputs: readonly MetricFamily[];   // non-empty
    composition: 'measured' | 'ratio' | 'interpolated';
    definition: string;                // creator-facing, per FILM-1703's note discipline
  }
  ```

  Support is the weakest input, computed at read time. Nothing is added to
  `CAPABILITY_MATRIX`; its invariants and its four levels stay untouched,
  and there is no fifth level and no nullable table.

  Keep the full input list, not just the minimum. A two-input signal whose
  minimum is `derived` needs to say which half is soft — "views per
  follower" reading a native engagement family and an account-level
  channel family is not usefully summarised by one word.

  `composition` is not `SupportLevel.derived`. FILM-1703's `derived` means
  snapshot-delta ingestion. A share rate is arithmetically derived and, on
  YouTube, `native` — both inputs are natively ingested. These axes are
  orthogonal and conflating them is the most likely way this layer
  corrupts the existing vocabulary.

  `SUPPORT_ORDER` must be written down in `data-provenance.ts` with an
  argument: FILM-1703 defines four levels and no total order, so "weakest"
  is undefined until someone states it. The placement of `not_ingested`
  relative to `unsupported` is a product call — both yield no number, only
  one is buildable — and belongs in a comment, not in an implementation
  detail.

  ## Expandability

  Adding a platform must be adding data.

  ```ts
  type PublishFormat = /* FILM-1716's format families */;
  type StageBinding =
    | { primary: SignalId; supporting: readonly SignalId[] }
    | { primary: null; note: string };   // note required exactly when unbound

  const SIGNAL_MAP:
    Record<AnalyticsPlatform, Record<PublishFormat, Record<FunnelStage, StageBinding>>>;
  ```

  Format lives in the same table as an inner key rather than a second
  table — two tables means two structural tests and a join at every read.
  Signal definitions stay platform-agnostic; only the map is per-platform.
  That is what keeps growth linear when Snap or Threads arrives.

  ### The test that enforces it

  `packages/clickhouse/__tests__/signal-map.test.ts`:

  1. An entry exists for every platform x format x stage. Adding a
     platform fails here and in `data-provenance.test.ts` — failing two
     suites is the signal that the platform union is the seam.
  2. Every unbound binding carries a non-empty note; every referenced
     `SignalId` exists.
  3. Every `inputs` is non-empty and every member is in
     `METRIC_FAMILIES`, so deleting a family from FILM-1703 fails here.
  4. Load-bearing: a stage may be bound to a `not_ingested` signal — that
     is the dark-but-buildable state that keeps the backlog visible — but
     binding to an `unsupported` input is rejected. The matrix says what
     is possible; the map may not claim more.
  5. Reverse coverage: every family `native` on some platform is an input
     to at least one signal, or is in an explicit allowlist with a
     reason. Otherwise newly-ingested data reaches no stage and nobody
     notices.

  ## Out of scope

  - Benchmarking a signal against anything — FILM-1715.
  - The format family vocabulary — FILM-1716, which this consumes.
  - Reading patterns across stages — FILM-1718.
  - Rendering — FILM-1719.

  ## Verification

  ```bash
  pnpm --filter @kit/clickhouse test
  pnpm turbo typecheck --force && pnpm lint
  ```

  Pure module, no database. Mutation-test the guards rather than trusting
  them — the tests are the deliverable: add a platform to
  `AnalyticsPlatform`; both suites must fail. Bind a stage to an
  `unsupported` input; the map test must fail. Drop a note from an unbound
  stage; the test must fail. Remove a family from `METRIC_FAMILIES` that a
  signal uses; the test must fail. Make a `native` family feed no signal;
  the reverse-coverage test must fail. A guard that has never been seen
  failing has not been verified.

  ## Risk

  The vocabulary is the fragile thing. Four support levels, a separate
  composition axis, unbound versus dark, primary versus supporting — each
  distinction earns its keep, and each is one careless rename away from
  collapsing into the others. The tests above are what hold them apart;
  the comments arguing each distinction are what stop someone
  "simplifying" them.

  The second risk is the map becoming decorative — accurate when written,
  stale later. Rule 4 above is the mitigation: the map cannot claim
  support the matrix does not grant, and the matrix is itself bound to the
  writer call sites by FILM-1703.

  ## As built (2026-10-01, #500)

  `packages/clickhouse/src/lib/signal-map.ts`, exported from
  `@kit/clickhouse`. `SUPPORT_ORDER` and `weakestSupport` are in
  `data-provenance.ts`. Downstream specs (FILM-1715, 1718, 1719, 1720,
  1726, 1727) build on these names:

  - Stages: `FUNNEL_STAGES`, `FunnelStage`, `FUNNEL_STAGE_QUESTION`,
    `FUNNEL_STAGE_LABEL`.
  - Signals: `SIGNAL_IDS`, `SignalId`, `SIGNALS`, `SignalDefinition`,
    `SignalComposition`, `SignalUnitCheck`.
  - The map: `PublishFormat` (FILM-1716's `FormatFamily`), `StageBinding`,
    `FormatStageMap`, `SIGNAL_MAP`, `UnboundReason`, `UnavailableSignal`.
  - Support: `SignalInputSupport`, `SignalSupport`, `signalSupport`,
    `computeSignalSupport`, `SIGNAL_INPUT_GAPS`, `SignalInputGap`,
    `FAMILIES_OUTSIDE_THE_FUNNEL`.
  - Reading: `StageReading`, `stageReading`, `stageReadings`. A reading is
    `unbound` (reason, note), `dark` (blockers) or `measurable`. Bands are
    FILM-1715's `BenchmarkBand`; nothing here defines one.

  Decisions taken while building, each held by a test:

  - **Field-level gaps (lead-approved, 2026-10-01).** FILM-1712 is DONE,
    and the family level now over-claims for Instagram. `watch_time` is
    `derived` because the total is stored, but `ig_reels_avg_watch_time`
    is requested and then discarded, and `reels_skip_rate` is never
    requested. `SIGNAL_INPUT_GAPS` lowers those two signals to
    `not_ingested` with KB-151 as the blocker. A gap can only weaken
    support. It goes red once its code marker appears (stale), or when the
    families are already that weak (redundant). It is never written into
    `CAPABILITY_MATRIX`.
  - **Unit check.** `SignalDefinition.unitCheck` withholds a figure in an
    unconfirmed unit by making it `not_ingested`, with the confirmer as
    blocker. Instagram's average carries FILM-1712's confirmation
    (milliseconds, 2026-09-29).
  - **The unbound arm carries `reason` as well as `note`.** The reason is a
    closed `UnboundReason` that code can branch on. The note is the
    sentence a creator reads. Every reason is a fact about the platform or
    the format. A gap in our backlog binds the stage, which then shows as
    dark.
  - **`unavailable[]` lists names with notes, not `SignalId`s.** A signal
    id would carry a computed support, and at family granularity that can
    be false: Instagram "average % viewed" would read `derived`.
  - **Instagram Hook is unbound.** `reels_skip_rate` measures the first
    three seconds, but the Instagram Attention criterion binds it there,
    and a signal answers one stage (`SignalDefinition.stage`, enforced). So
    Hook says where the figure is read.
  - **A YouTube Short's Reach is unbound** (no impression equivalent), and
    its Hook is `first_3s_retention`, interpolated off the native retention
    curve.
  - **`average_view_duration` serves YouTube and TikTok.**
    `ig_reels_avg_watch_time` stays separate because Meta divides by its
    own count, not by views (FILM-1712: 121 against 221).
  - **Formats nothing publishes** on a platform (X and LinkedIn's `clip`,
    `live`, horizontal long-form on TikTok and Instagram) are unbound with
    `format_not_published_on_platform`. The test derives which those are
    from FILM-1716's tables, in both directions.
  - **Teasers and trailers** bind like the platform's other videos. No
    platform reports whether they sent viewers to the episode, so that
    question is not in the map.

  **The sixth stage (owner decision 2026-10-01, FILM-1726).** Monetisation
  is appended to `FUNNEL_STAGES` after `audience`. `FunnelStage` widens,
  and `FUNNEL_STAGE_QUESTION`, `FUNNEL_STAGE_LABEL` and every
  `FormatStageMap` stop compiling until each platform x format binds it,
  or leaves it unbound with a reason. `signal-map.test.ts` rule 1 fails on
  the same cells. Its signals read the `revenue` family, which is
  `not_ingested` on YouTube (FILM-1726) and `unsupported` elsewhere. So
  YouTube Monetisation would be dark, and TikTok and Instagram unbound.
  Consumers that iterate `FUNNEL_STAGES` or call `stageReadings` need no
  change. Consumers that key a `Record` on `FunnelStage` stop compiling,
  which is intended. The rule-1 test that pins the five names is updated
  in the same PR.
