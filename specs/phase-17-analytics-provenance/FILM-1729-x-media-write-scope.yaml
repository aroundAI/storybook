summary: >
  FILM-1723 moved X video upload from the retired v1.1 endpoint to
  /2/media/upload, which demands the media.write OAuth 2.0 scope that
  TWITTER_OAUTH_CONFIG.scopes does not request — so a video publish to X is
  refused with a 403. Not a regression: the v1.1 endpoint never accepted
  OAuth 2.0 user tokens either, so X video publishing did not work before.
  It was unowned across three specs (FILM-1723 excludes scope changes,
  FILM-1711 audits analytics scopes only, FILM-1727 is X analytics) until
  this spec claimed it. It was deferred for want of X credentials; #488
  then shipped the scope and the connect-page notice (FILM-714), and the
  2026-10-01 re-audit (§7) built the rest that needs no X account: the
  publish screen now sends X its videos (owner decision, §8), anything X
  would refuse is refused on the screen first, and the whole flow runs
  against FILM-1802's X sandbox. A live refresh and a live upload stay open
  for FILM-1725.
