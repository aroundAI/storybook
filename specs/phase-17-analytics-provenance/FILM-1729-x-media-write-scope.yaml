notes: |
  ## 1. Why this exists

  FILM-1723 moved X video upload from the retired v1.1 endpoint on
  upload.twitter.com to /2/media/upload on api.x.com. The v2 endpoint demands
  the media.write scope of an OAuth 2.0 user token. TWITTER_OAUTH_CONFIG.scopes
  (packages/features/publishing/src/oauth/twitter/config.ts) requests
  tweet.read, tweet.write, users.read and offline.access — not
  media.write. So a video publish to X is refused with a 403.

  This is not a regression. The v1.1 endpoint never accepted OAuth 2.0 user
  tokens at all, so X video publishing did not work before FILM-1723 either.
  FILM-1723 replaced a call that could not succeed with one that can, once the
  scope is granted, and made the refusal name the missing scope.

  It was unowned. FILM-1723 §6 excludes scope changes. FILM-1711 audits
  analytics scopes. FILM-1727 is X analytics. Nothing covered a
  publishing scope, which is how a one-line gap survives three specs that each
  walk past it. This spec owns it.

  ## 2. Why it is deferred

  We hold no X credentials (owner, 2026-09-22). X has no sandbox and closed
  Free/Basic/Pro to new signups on 2026-02-06 (see FILM-1725 Check A), so there
  is no free way to exercise the consent screen or the upload.

  Adding the string to the array is trivial and could be done today. It is
  deliberately not done ahead of credentials, for two reasons:

  - Red before green cannot be met. The only guard that matters — a real token
    carrying media.write completes INIT → APPEND → FINALIZE → post — cannot be
    seen to pass, and a scope change that has never been exercised is a claim, not a
    result.
  - It widens a consent screen. Every existing X connection would have to
    re-authorise to gain the scope. Asking users to re-consent for a feature we have
    not once seen work is the wrong order.

  Deferred, not dropped. The rule is FILM-1725's: an unanswered question does
  not get to become an assumed fact by sitting in a code comment.

  ## 3. What brings it back

  Any one of:

  - An X developer app with pay-per-use credit is provisioned — for this, or for
    FILM-1725 Check A / FILM-1727, which need the same thing. One purchase unblocks
    all three; do them together.
  - A user reports X video publishing failing. (Today the error names the scope, so
    the report will be recognisable.)
  - Phase 18's FILM-1802 lands. The sandbox can enforce media.write on
    /2/media/upload exactly as X documents it, which makes §4 steps 1–4 testable
    locally. It does not lift the deferral on its own: a sandbox proves our code
    against our reading of X's documentation, not against X. The live upload
    (§5, last criterion) still needs the credential.

  ## 4. The change, when it comes back

  1. Add the scope. X_MEDIA_UPLOAD_SCOPE ('media.write') is already exported
     from packages/shared/src/vendors/x.ts by FILM-1723; add it to
     TWITTER_OAUTH_CONFIG.scopes from that constant rather than as a second string
     literal, and correct that array's comment ("Required scopes for video upload" is
     currently untrue).
  2. Fix the class, not the instance. The publish lambda
     (apps/web/lambda/publish-worker/handlers/twitter.ts) walks the upload protocol
     independently of the provider. Check whether it validates or assumes scopes, and
     keep one source of truth. Then audit the publishing scopes of the other four
     platforms the same way FILM-1711 audits analytics scopes — a table of endpoint →
     required scope → requested?, cited to vendor docs — so this gap is closed as a
     class. Record the scope in docs/platform-capability-reference.md.
  3. Existing connections. A token issued before the change lacks the scope and
     cannot gain it by refresh. Detect it — from the granted scope string stored at
     connection time if we keep it, otherwise from the 403 — and route the user to
     re-authorise through the existing token-refresh.reauth path rather than
     failing the publish with a raw vendor error. Return the refusal as a value,
     not a thrown message: thrown server-action errors are replaced with a generic
     sentence in production builds (FILM-CC-04 KB-6).
  4. X tokens are never refreshed. FILM-1723 noted that token-refresh.ts has no
     X branch, while offline.access is requested and the access token lasts two
     hours. A scheduled video publish more than two hours after connecting would fail
     regardless of scope. Confirm this when the credential exists; if true it is
     in scope here, because media.write is not useful without it.
  5. UI. The re-authorise prompt is something a user sees, so it needs a
     Playwright spec and screenshots in the PR (CLAUDE.md, "Screenshots are required
     for UI changes") — including the state after re-authorising.

  ## 6. Risk

  None while deferred beyond the status quo: X video publishing does not work,
  did not work before, and the failure now says why.

  When it returns, the risk is the consent change: every connected X account must
  re-authorise once. Ship the detection and the prompt (§4.3) in the same release as
  the scope, never the scope alone — otherwise existing connections fail exactly as
  they do today, with a message telling users about a scope they cannot grant.

  ## 7. Re-audit, 2026-10-01

  #488 (FILM-714) added `media.write` to the X scopes and a notice on the
  platforms page telling anyone who connected X earlier to reconnect. That
  shipped the scope ahead of §6's rule (scope and detection together); this
  re-audit closes most of the gap:

  - Detection (§4.3): `holdsXUploadScope` reads the grant stored at connect
    time. `publishToAllAction` and `retryPublishAction` refuse an X
    connection without it as a value, naming the account and the fix, before
    anything is written. A connection with no recorded scopes predates the
    scope and is refused the same way. A scheduled publish fails in the
    worker with the same words, before INIT, instead of X's 403.
  - One source of truth (§4.2): the provider, the lambda and the OAuth config
    all take `X_MEDIA_UPLOAD_SCOPE`; neither upload path checks scopes itself.
  - The audit (§4.2): the "Publishing scopes" table in the capability
    reference. One gap, filed as a lead (Instagram, Business-Manager Page
    roles).

  ## 8. X on the publish screen (owner decision, 2026-10-01)

  Building the Playwright flow found that nothing in the product published
  to X: the episode publish screen sent full videos only to YouTube and
  Facebook and Shorts only to YouTube, Instagram, Facebook and TikTok, and
  PublishHub, which lists X, is mounted nowhere (KB-148). The owner's
  decision: X goes on the publish screen, for both full videos and Shorts,
  and a video X would refuse is refused on the screen, as a value with a
  clear reason, before any row is written — not discovered in the worker.

  - The two lists, which were repeated seven times across three files, are
    one pair in `@kit/publishing/lib/constants` (`FULL_VIDEO_PLATFORMS`,
    `SHORTS_PLATFORMS`, `takesVideo()`), both now including X.
  - X's limits, from https://docs.x.com/x-api/media/quickstart/best-practices
    read 2026-10-01, in `X_VIDEO_LIMITS` (packages/shared/src/vendors/x.ts):
    at least 0.5 s and at most 20 minutes (the default account; 125 for
    Premium, which we cannot see, so the default applies), at most 8 GB, and
    an aspect ratio between 1:3 and 3:1. A post's text, which is the title,
    at most 280 characters (https://docs.x.com/fundamentals/counting-characters,
    same day; counted per code point, while X weighs CJK and emoji as two, so
    a title near the limit in those scripts can still be refused by X).
  - Not enforced, and why: the same page says dimensions "must be between
    32x32 and 1280x1024" and that subscribers "can upload a 1080p video" —
    a contradiction, so no maximum is applied; frame rate, codec and pixel
    format need the sample tables, not the header read here.
  - The video's length and shape come from its own MP4 header, read with
    HTTP range requests (`readMp4Facts`, packages/features/publishing/src/lib/mp4-facts.ts):
    nothing is downloaded, a `moov` after the media is found by stepping
    over box headers, and a rotated recording is reported in the shape it
    plays. A file it cannot read is refused with a reason ("upload it again
    as an MP4"), since X would refuse it too.
  - Scheduled publishes are checked for scope in the worker; their video
    limits are checked only when the publish is created on the screen.
