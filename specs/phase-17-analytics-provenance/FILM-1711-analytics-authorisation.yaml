summary: >
  video_metrics holds YouTube rows and nothing else not because of the sync
  schedule or an API limitation, but because TikTok and Instagram analytics
  have never been authorised: TikTok requests no analytics scope at all (and
  the scope the code assumed, video.query, does not exist — video.list is
  required), and Instagram requests none of the insights permissions either.
  This spec audits all five platforms' analytics scope requirements against
  vendor documentation rather than the repo's own comments, adds the missing
  scopes to each OAuth config, and makes an unauthorised or scope-gated
  connection a distinct, detectable, legible state rather than a thrown
  error in a cron job. It also catches a second live violation of its own
  guarding principle: fetchTotals requests YouTube's monetary revenue
  metrics on a token that never carries yt-analytics-monetary.readonly.
