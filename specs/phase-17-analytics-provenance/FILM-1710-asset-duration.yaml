spec_id: "FILM-1710"
title: "Asset Duration"
phase: 17
phase_name: "Analytics Provenance and Signal"
category: feature
status: PARTIAL
effort: M
dependencies:
  - spec_id: "FILM-1711"
    note: "TikTok leg only"
summary: >
  video_dim.duration_seconds holds the episode's duration (falling back to
  its target duration, then zero) rather than the duration of the clip that
  was actually published — in the live fixture, Instagram and TikTok
  "short" publishes average 1,550 seconds of episode duration. Research
  during this spec withdrew an earlier claim that this was producing live
  wrong Hook Lab verdicts: the Hook Lab path reads hook_variants.duration_seconds,
  not video_dim.duration_seconds, and the latter column has no readers at
  all — so this is a latent write-only data defect, not a live incident, but
  it must be fixed before FILM-1616 becomes the column's first reader. The
  fix adds a nullable publishes.duration_seconds and a nullable
  video_dim.asset_duration_seconds, written from the provider (YouTube and
  TikTok; Instagram has no such field and stays duration_unknown
  permanently), and renames the existing column to episode_duration_seconds
  so every stale reader fails to compile.
