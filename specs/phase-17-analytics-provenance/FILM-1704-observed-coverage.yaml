summary: >
  FILM-1703's capability matrix says what a platform can report, which is a static product fact and
  not enough to explain a blank card: a creator needs to know whether a platform is unsupported,
  simply not connected, connected but empty in this window, or genuinely covered — and collapsing
  'not connected' into 'no data' generates a support ticket every time. This spec designs one
  ClickHouse query, queryObservedCoverage, that unions across the five fact tables once per page
  load rather than once per card, plus a pure fold from those rows into a four-state CoverageState,
  distributed through a context so fifteen cards share one fetch. It renders nothing — FILM-1705 is
  the visible payload.
