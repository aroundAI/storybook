summary: >
  No rate is computed without recording which denominator definition it
  used. That rule began as a FILM-1722 criterion, passed to FILM-1719 under
  the owner's 2026-09-22 ruling, and became FILM-1719's sixteenth criterion,
  which FILM-1719 met on its own surfaces only. The rates already on screen
  elsewhere, engagement rate and RPM, still divide by video_metrics.views
  without saying which definition of a view that column held, and YouTube
  changed it on 2026-08-27. The owner accepted on 2026-10-02 the
  recommendation that this gets its own spec. It stamps those reads with the
  view definitions they divided by, and the changes their window crosses,
  and shows the stamp on every card that renders them. It changes no figure:
  every rate keeps the value it shows today.
