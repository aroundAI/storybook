summary: >
  FILM-1721 named three empirical checks able to falsify a row in the
  capability reference; only one could run. This spec is the holding pen for
  every vendor-verification question the team cannot currently pay to
  answer — a paid X credential, a TikTok sandbox app, an Instagram insights
  permission, live Meta or X connections — so each stays a tracked, dated
  question with an exact command and a trigger to revisit, rather than
  quietly hardening into an assumed fact. It is deferred, not dropped: it is
  complete only when every check has run and its answer is recorded, not
  when a decision is made to skip it.
