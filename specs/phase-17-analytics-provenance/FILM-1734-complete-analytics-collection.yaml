summary: >
  The owner wants a morning report that replaces YouTube Studio, Instagram
  and Facebook (plan approved 2026-10-18). StoryBook collected most of the
  figures but kept some to itself and never collected others. This makes it
  collect and expose every one: YouTube's live counts and dislikes from the
  Data API, its whole-channel days and lifetime statistics, the Analytics
  API's traffic sources by day (previously fetched and discarded),
  Instagram's per-post follows and profile visits and its account's day,
  and each publish's data date; and server readers that return each video's
  figures by day and for its lifetime, each channel's days, each channel's
  freshness and each video's audience, every figure a number or null (not
  measured), never 0.
