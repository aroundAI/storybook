notes: |
  ## Decisions

  - Two traffic copies, never one key. The Analytics API names traffic
    sources differently from the Reporting CSV (EXT_URL / EXTERNAL_URL,
    YT_CHANNEL / CHANNEL_PAGE …), so the two could not replace each other
    the way video_metrics' two YouTube writers do. Both are kept under
    metric_source and every reader takes one copy of a day: the CSV's,
    the reconciled report every reader used before, where it has the day,
    else the Analytics API's, which arrives about two days sooner.
    lib/traffic-groups.ts groups the Analytics API's names like their CSV
    equivalents.
  - YouTube's live counts are snapshots, never baselines: YouTube's days
    still come from the Analytics API. A Data API "day" in the readers is
    the change between that day's last snapshot and the previous day's
    (UTC fetch days), only where both exist, and is not clamped: likes
    taken back are reported as a fall.
  - Instagram's account reach for a day is a unique count, so it goes to
    channel_windows as a 1-day window (read through reach.ts, the one reader
    of unique figures); its views go to channel_metrics_daily.
  - Meta's follows are follows: the readers put them in `follows` and leave
    `subscribersGained` null for Instagram and Facebook, and the reverse for
    YouTube.

  ## What the readers return

  Rows are one per (video or channel, day, source); nothing is merged or
  summed across sources. A YouTube video can have an analytics_api (or
  reporting_csv, where the CSV replaced the day) row from video_metrics, a
  data_api row from its snapshots and a reporting_csv row with impressions
  and CTR. ChannelDailyFigures adds lifetimeViews and lifetimeVideos to the
  contract FILM-1735 was given; Source adds tiktok_api and x_api.

  ## Not done here

  - A Data API figure for a video that is not due on its timetable this
    hour is as old as its last visit; the readers say so through asOf.
  - Revenue by day already existed (FILM-1726) and is not a reader here.
