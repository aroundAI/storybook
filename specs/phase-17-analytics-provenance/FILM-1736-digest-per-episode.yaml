open_questions:
  - "The channel assessment's per-platform engagement rate: the digest gives each video's, not a channel's. A channel's would be a pooled rate over its videos' rows; not built until the owner asks for it"
notes: |
  ## Kept from FILM-1735

  The `retention` section (videos under 7 days old, their curve against the
  channel's median curve) is kept as it was, with two corrections: it now
  reads Facebook's curves, which FILM-1720 stores, and compares a curve with
  the channel's videos on the same platform. Each video's own `retention`
  under `videos` is the one a report reads; it covers every listed video.

  ## Two engagement rates, one definition

  `videos[].engagementRate` is the Content tab's figure, over the video's
  stored days (video_daily_stats). Each trend source's `engagementRate` is
  the same function over that source's own counts, so YouTube's live counts
  (data_api), which carry no shares, give their own figure beside the stored
  one. A report quotes `engagementRate`; the trend shows how it moved.
