summary: >
  The owner wants each morning report laid out per channel, then per
  episode: the long video one row per platform (YouTube, Facebook,
  Instagram) with likes, dislikes, comment trend, view time, engagement
  rate and retention, then each Short of the episode the same way, an
  assessment per episode and one of the channel (2026-10-18). The digest
  now carries what that needs: an `episodes` section grouping the listed
  videos by episode, long video and Shorts by platform; each video's
  engagement rate on the day and through it, the Content tab's figure;
  its retention in its platform's own kind; and its last seven days by
  source with the comments read on each. Facebook's and Instagram's
  dislikes are null with "No dislikes on this platform.", never 0.
