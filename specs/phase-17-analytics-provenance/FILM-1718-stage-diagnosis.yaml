notes: |
  ## Overview

  Five stage bands are more useful read together than separately. The
  pattern across them names which part of the funnel is the constraint,
  which is the question a creator actually has.

  ```
  Reach        above
  Hook         above
  Attention    below
  Transmission above
  Audience     below
  ```

  tells you what to change. A single composite score of the same five
  numbers tells you nothing.

  This spec depends only on FILM-1714 and FILM-1715 — deliberately not on
  the genome. `metrics -> diagnosis` must work from day one; `metrics +
  genome -> creative explanation` enriches it later. Coupling them would
  make the diagnosis wait seven months for enough tagged videos to be
  meaningful.

  ## The patterns

  | Pattern | Diagnosis (what is measured) |
  |---|---|
  | Reach below, others above | Content signals are strong relative to distribution — investigate packaging and distribution |
  | Reach above, rest weak | Distribution is not the constraint; content signals are weak relative to comparable videos |
  | Hook above, Attention below | Openings hold, later retention is weaker than comparable videos |
  | Attention above, Transmission below | Attention is strong; transmission is weaker relative to comparable videos |
  | Attention and Transmission above, Audience below | Consumption is strong; follow conversion is weaker than comparable videos |
  | All above | Strong across every measurable stage |

  ### The table is a precedence list, not a partition

  The rows above are ordered, and the first match wins. They are
  deliberately not mutually exclusive and not exhaustive: bands are
  three-valued (`below | typical | above`), and the rows are phrased only
  in `above`/`below` terms, so `typical` satisfies neither side.
  Combinations like Reach below, Hook below, the rest above match no row.

  So the contract is: evaluate in order, first match wins, and a
  fully-judged combination matching nothing yields `no_clear_pattern` — a
  named outcome distinct from "too few judged stages". Both are absent
  states; they are absent for different reasons and must not share a
  sentence.

  `no_clear_pattern` is a real and common answer. A video whose five
  stages are all `typical` has no diagnosis worth making, and saying so is
  better than forcing it into the nearest row.

  ## The wording is measurement, not cause

  "Packaging is the limit" is an inference the metrics do not prove. The
  cause could be packaging, timing, topic, seasonality, or a metric that
  is under-reported on that platform.

  So diagnosis describes what was measured and points at where to look.
  Hypothesis belongs to the creative-insight layer above it, and causation
  belongs only to a concluded Change log entry (FILM-1610) or a concluded channel experiment (FILM-1724) — and a causal claim names which
  kind backs it (owner, 2026-09-24).

  ```
  measurement -> diagnosis -> hypothesis
  ```

  never

  ```
  measurement -> pretend-causality
  ```

  Concretely: "Attention is strong; transmission is weaker relative to
  comparable videos" — not "enjoyed but not worth passing on", which
  asserts a viewer's mental state from a share count.

  ## Patterns over partial data

  Most videos will not have five judged stages. A stage can be unbound
  (the platform exposes no equivalent), dark (its inputs are not
  ingested), `not_judgable` (too young), or `insufficient_cohort` (too few
  peers).

  A pattern must be computed over judged stages only, and must say how
  many it had. "Content is outperforming distribution" inferred from two
  judged stages out of five is a different claim from the same sentence
  over five, and the difference must be visible.

  Where too few stages are judged to distinguish patterns, the diagnosis
  is a named absent state — not the nearest matching pattern.

  This is the same discipline as everything else in the phase: cannot say
  is a real answer, and it never renders as a weak one.

  ## Boundary with FILM-1616

  FILM-1616 keeps a low-CTR flag (threshold `0.03`) and a retention-cliff
  flag in the weekly diagnostics table, and states explicitly that they
  are a breakage check, not strategy — "did something break this week",
  deliberately kept visually distinct from the deep-dive cards, because
  "users will read a low-CTR flag as a content verdict".

  Two rules keep these from colliding: the stage layer contains no
  absolute thresholds — every figure is relative to the channel's own
  cohort; Reach benchmarks CTR, it never flags it. The diagnostics table
  gets no bands — it keeps its absolute flags.

  Same underlying number, two framings, and neither borrows the other's
  language.

  ## Out of scope

  - Explaining why a pattern occurred — FILM-1717.
  - Any recommendation. This spec names the constraint; recommending a
    change requires evidence and belongs above.
  - Rendering — FILM-1719.
  - Cross-platform patterns. A pattern is computed within one platform,
    because its inputs are.

  ## Verification

  ```bash
  pnpm --filter @kit/content-analytics test
  pnpm turbo typecheck --force && pnpm lint
  ```

  Pure function over five optional bands — exhaustively testable without a
  database, and it should be tested exhaustively rather than by example:
  every combination of five three-valued bands (3^5 = 243, plus the
  unjudged cases) resolves to exactly one outcome — a pattern,
  `no_clear_pattern`, or the too-few-judged state. If FILM-1726 adds a
  Monetisation stage this becomes 3^6 = 729; the resolution must therefore
  be a function over the stage list, not an enumeration written against
  five — a constraint on the implementation, not a reason to wait for that
  decision. An all-`typical` video yields `no_clear_pattern`, not the
  nearest row. A pattern computed over two judged stages is distinguishable
  in the output from the same pattern over five. A stage that is dark and
  a stage that is `below` produce different patterns. A snapshot test over
  the diagnosis strings, so causal language cannot be introduced without a
  reviewer seeing the diff.

  ## Risk

  The copy is the risk, not the logic. The mapping is a small pure
  function; the sentences are what users act on, and each is one edit away
  from becoming a causal claim. The snapshot test exists so that edit is
  always visible in review.

  Partial-data patterns are the subtle failure. A confident sentence built
  on two judged stages reads identically to one built on five unless the
  output carries the count — and the count is the kind of detail that gets
  dropped during UI work. FILM-1719 must render it.

  ## As built (2026-10-01, #TBD)

  `packages/clickhouse/src/lib/stage-diagnosis.ts`, exported from
  `@kit/clickhouse` beside the two modules it reads: FILM-1714's
  `signal-map.ts` and FILM-1715's `self-benchmark.ts`. It lives in
  `@kit/clickhouse` rather than `@kit/content-analytics` because both of
  its inputs do, so the suite to run is
  `pnpm --filter @kit/clickhouse test`, not the content-analytics one
  this spec's Verification names. FILM-1719 builds on these names:

  - `judgeStage(reading, benchmarkFor)` → `StageJudgement`: a band
    (with FILM-1715's `directional` or `established`) or an exclusion,
    one of `STAGE_EXCLUSIONS` (`unbound`, `dark`, `not_judgable`,
    `insufficient_cohort`). `benchmarkFor` is called only for a
    measurable stage. `judgeStages(platform, format, benchmarkFor)` does
    every stage of one platform × format through `stageReadings`.
  - `diagnoseStages(judgements)` → `StageDiagnosis`, on `kind`:
    `pattern` (with `pattern: StagePatternId`), `no_clear_pattern` or
    `too_few_judged` (with `minJudged`). Each carries `sentence` and
    `coverage`: `judgedCount`, `stageCount`, the judged stages with their
    bands, the excluded stages under each reason, and a creator-facing
    coverage sentence ("Judged on 2 of 5 stages. Not judged: Hook (the
    platform does not report it), …"). FILM-1719 must render the
    coverage with the diagnosis, as Risk says.
  - `STAGE_PATTERNS`, `StagePattern`, `StageRequirement`,
    `matchPattern`, `MIN_JUDGED_STAGES`, `NO_CLEAR_PATTERN_SENTENCE`.

  Decisions taken while building, each held by a test:

  - **How the table's rows read over partial data.** A stage a row names
    ("Hook above") must be judged in that band. "Others" and "rest"
    ("Reach below, others above") constrain only the judged others: an
    unjudged stage is excluded, not weak, so it does not stop the row.
    "Weak" in row 2 is `below`, since `typical` satisfies neither side.
  - **Two judged stages is the minimum.** A pattern is a relation between
    stages, and every row compares at least two; one judged stage is a
    band. Below two the rows also overlap (Reach above, nothing else
    judged, fits rows 2 and 6), and from two up they are pairwise
    exclusive, so precedence decides nothing today. A test counts the
    overlaps so that changing is visible.
  - **Row 6 says "every judged stage"**, not the table's "every
    measurable stage": a measurable stage can still be `not_judgable`
    or thinly peered, and the sentence is read over judged ones. The
    other five sentences keep the table's wording, with the third
    row's comma made a semicolon.
  - **A sixth stage is a compile error, by design.** Each row spells out
    a `Record<FunnelStage, StageRequirement>`, with no helper filling in
    "the others". Appending `monetisation` to `FUNNEL_STAGES` (FILM-1726)
    was tried: all six rows failed with TS2741 ("Property 'monetisation'
    is missing"), and so did `diagnoseStages`'s input type, until each
    row decides what it asks of the new stage. The evaluation, the
    coverage and the exhaustive test all iterate `FUNNEL_STAGES`, so
    they need no change: the test then covers 7^6 combinations, and its
    count of fully judged combinations becomes 3^6 = 729.

  What the signal map allows today, for a short vertical: YouTube judges
  at most four stages (a Short has no Reach), Instagram two (Reach and
  Transmission; Attention is dark on KB-151), and TikTok one
  (Transmission; Reach and Attention are dark), so a TikTok video gets
  `too_few_judged` whatever its bands until its dark stages are
  ingested. That is FILM-1714's coverage, reported honestly, not a gap
  in this layer.
