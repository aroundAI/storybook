summary: >
  Five stage bands read together name which part of the funnel is the
  constraint — a question a single composite score of the same five numbers
  cannot answer. This spec defines a closed, precedence-ordered pattern set
  over judged stage bands (first match wins, a fully-judged combination
  matching nothing yields no_clear_pattern), depending only on FILM-1714 and
  FILM-1715 and deliberately not on the content genome, so metrics ->
  diagnosis works from day one while metrics + genome -> creative
  explanation enriches it later. Wording describes what was measured, never
  a cause, and the layer carries no absolute thresholds — those stay with
  FILM-1616's separate breakage-check diagnostics table.
