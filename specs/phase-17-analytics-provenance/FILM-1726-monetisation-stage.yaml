summary: >
  Monetisation is the sixth funnel stage (owner, 2026-10-01). The phase had
  locked it out because video_metrics.revenue_cents was literal 0, but that
  zero was a fact about our writers, not the platforms. The decision is made
  again on access and product value. YouTube reports earnings to Partner
  Program channels behind a scope we now request. Facebook reports ad-break
  earnings to Page admins. TikTok and Instagram report none. So the stage is
  bound on YouTube and Facebook and unbound on TikTok and Instagram. YouTube's
  daily estimate is stored in its own ClickHouse table, and "not measured"
  never reads as $0, in ClickHouse or in Postgres.
