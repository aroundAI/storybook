notes: |
  ## 1. Why a locked decision is being re-opened

  The phase locked five funnel stages and explicitly excluded a sixth
  (README.md:215):

  > No Monetisation stage. video_metrics.revenue_cents is literal 0 on all
  > four write paths. It would be dark or wrong on every platform forever. Its
  > absence is a decision.

  The first sentence is true. The second does not follow, and FILM-1721's
  re-verification showed why.

  This spec does not argue that the stage should exist. It argues that the
  decision was made on a fact about our writers that was mistaken for a fact
  about the platforms, and that it therefore has to be made again — possibly to
  the same conclusion, on better grounds.

  ## 2. What is actually true

  ### YouTube revenue is plumbed end to end and blocked by one scope

  | Step | Where | State |
  |---|---|---|
  | Requested | youtube-analytics.ts:151-165 — fetchTotals asks for estimatedRevenue, estimatedAdRevenue, estimatedRedPartnerRevenue | done |
  | Mapped | analytics-sync-cron.ts:733-735 into NormalizedAnalytics | done |
  | Written | upsertRevenueRecords → revenue_records, split by category, source = 'api' | done |
  | Authorised | yt-analytics-monetary.readonly | not requested |

  So the pipeline exists and carries zero. That is scope_missing, not
  unsupported — the distinction FILM-1703 exists to preserve, and the one this
  decision collapsed.

  Since 2026-09-09 the monetary metrics are additionally documented as
  YouTube Partner Program members only. That is a second, different gate:
  creator-resolved, the same shape as TikTok's Business-account requirement, and
  account_type_gated in FILM-1703's vocabulary. A non-YPP creator has an honest
  dark stage. A YPP creator has one we chose not to authorise.

  ### Facebook has its own revenue surface

  total_video_ad_break_earnings, total_video_ad_break_ad_cpm,
  total_video_ad_break_ad_impressions, creator_monetization_qualified_views —
  on video_insights, queryable by Page admins only. Recorded in FILM-1720
  §4.

  ### And revenue already exists in the product

  FILM-1609 shipped manual revenue entry, and revenue_records carries a source
  column precisely so a person's entry and the API's can coexist. A monetisation
  stage would not be starting from nothing; it would be finding a home for data
  that already has a table.

  ### The zero is being written as authoritative

  upsertRevenueRecords's own comment records that effectiveRevenueCategory
  reads source = 'api' as proof of a platform payout. With the scope absent,
  we write zero-valued api rows — figures marked authoritative that measure
  nothing. This is a live correctness concern independent of whether the stage
  ships, and it may belong in FILM-1711 rather than here. Decide which.

  **Resolved by FILM-1711 (#289, merged 2026-09-22; recorded 2026-09-25).**
  The sync writes revenue only when it was measured
  (`if (normalizedData.revenue_measured)`,
  `packages/features/content-analytics/src/server/analytics-sync-cron.ts:625`),
  and YouTube without the monetary scope is unmeasured; and
  `planRevenueRowWrites`
  (`packages/features/content-analytics/src/lib/revenue-mix.ts:128`) never
  inserts a zero, only writes one to correct an existing row. Merged, not yet
  deployed — see FILM-1711's Deployment note.

  ## 3. What this spec must settle

  1. Where a stage would read revenue from. VideoMetric has a single
     revenue_cents and no ad/premium split; the split exists only in
     NormalizedAnalytics and in Postgres revenue_records. Either the stage
     reads Postgres — unlike every other stage, which reads ClickHouse — or
     video_metrics gains columns. Both have costs; neither is obviously right.

  2. Whether a stage may be bound on two platforms and dark on three. This is
     the direct test of the phase's own rule that "four honest stages beat five
     with one invented", and of "a stage may be unbound, and often should be".
     If a stage bound only on YouTube and Facebook is acceptable, say so and say
     why. If it is not, that is a general rule about stage coverage which should
     be written down rather than applied once to revenue.

  3. Whether the access states render honestly. A dark Monetisation stage must
     distinguish not in YPP (creator-resolved) from we never asked for the
     scope (ours) from this platform has no revenue API (the platform's). Three
     different sentences, three different owners. FILM-1703 already has the
     vocabulary; this is the first stage that would need all three at once.

  4. The interaction with manual revenue. A creator who types their earnings in
     has revenue data. Does the stage use it? If it does, the stage is bound for
     platforms with no revenue API, and "dark" stops meaning "unmeasurable". If it
     does not, we are ignoring the most accurate figure we hold.

  5. Whether it is desirable at all. Feasibility is not the same as value. A
     creator-facing monetisation stage sitting beside Reach and Hook may be a
     distraction from the diagnosis the other five stages produce, and revenue is
     an outcome of the funnel rather than a stage in it. This spec may
     legitimately conclude that the original decision stands — on this ground,
     which is a product argument, rather than on a data-availability argument that
     turned out to be wrong.

  ## 4. Out of scope

  - Requesting the monetary scope — FILM-1711.
  - Building a Facebook provider — FILM-1720.
  - Changing revenue_records or the manual revenue form — FILM-1609, shipped.
  - The five existing stages. If this concludes "yes", FILM-1714, FILM-1718 and
    FILM-1719 all change, and that is a follow-up, not this spec.

  ## 5. Downstream, if the answer is yes

  Recorded so the cost is visible while deciding, not after:

  - FILM-1714 — FunnelStage is "platform-independent and never changes"; a
    sixth value changes the type and every exhaustive switch on it.
  - FILM-1718 — the diagnosis space is 3^5 = 243 band combinations plus the
    unjudged cases. A sixth stage makes it 3^6 = 729, and the six-pattern table
    needs a monetisation row or an explicit statement that it has none.
  - FILM-1719 — "the five-stage strip" is named as such in three places.
  - FILM-1717 — FILM-1610's closed metric_watched vocabulary takes the
    FunnelStage values.

  ## 7. Risk

  The risk is not getting the answer wrong. It is answering it again from a
  premise nobody checked. The original decision was reasonable given what its
  author believed; it became wrong when the belief did, and nothing connected the
  two. That is the general failure this phase exists to fix, and this spec is the
  phase applying its own rule to its own locked decisions.

  ## 8. The decision (owner, 2026-10-01): yes

  Monetisation is the sixth stage, after Audience, and §5's downstream work
  is built or scheduled. The premise is the true one: revenue is held back
  by access, and access differs by platform and by owner. It was never a
  question of revenue being unmeasurable.

  The product argument, recorded because a later "no" would have to answer
  it: a creator who is paid judges a video by what it earned. A strip that
  ends at Audience sends them to the Revenue tab to learn whether the rest
  paid off, and leaves the diagnosis silent on the one outcome they act on.
  Revenue is an outcome of the funnel, not a step a viewer takes, which is
  why the stage is last and why FILM-1718 gives it no pattern of its own
  (§11).

  The answers to §3, each proposed here and approved by the lead on
  2026-10-01:

  1. **Where it reads from: ClickHouse, like every other stage.** FILM-1715's
     self-benchmark is a ClickHouse query, and a stage that read Postgres
     would need a second benchmark. Revenue gets its own table,
     `video_revenue_daily` (migration 022), not a column on `video_metrics`.
     Two writers share a YouTube `video_metrics` key, the Analytics-API sync
     and the Reporting ingest, and the later row replaces the other whole
     (ReplacingMergeTree, KB-94). Only the sync can see revenue, so on a
     shared row a day's earnings would come and go with ingest order. FILM-1504
     gave reach its own table for the same reason. The table is USD by
     construction (KB-12): its one writer is YouTube's estimate, requested
     with no currency.
  2. **Bound on two platforms and unbound on two is acceptable.** That is
     "a stage may be unbound" working as written. Coverage is a fact about
     platforms, and an unbound stage tells the creator so in one sentence.
     A strip that hid the stage on TikTok would hide that fact.
  3. **The access states render apart.** `monetisationAccess` returns the
     platform's (`unsupported`), the creator's (`account_type_gated`: the
     Partner Program, or Page admin rights on a Page that runs ad breaks) or
     ours (`scope_missing`, which offers a reconnect, or `not_requested` /
     a review state, which do not). Each has its own owner and sentence.
  4. **Manual revenue does not fill the stage.** A creator's entry is their
     figure, not the platform's, and binding it would make "unbound" stop
     meaning "the platform reports nothing". It stays on the Revenue tab,
     and the unbound note points there.
  5. **Desirable: yes**, on the product argument above (owner).

  Signals: `estimated_revenue` (measured; the platform's estimate),
  `revenue_per_mille` (ratio; earnings per thousand views, YouTube's player
  formats only) and `ad_break_cpm` (measured; Facebook's advertiser rate,
  supporting). A YouTube Short reads `estimated_revenue` alone: YouTube pays
  Shorts from a pool shared out by views, so a Short's per-view rate mostly
  restates the pool's. Facebook has no single view (FILM-1722), so it has no
  per-view rate either.

  ## 9. The zero-valued `api` rows

  FILM-1711 stopped new ones (§2). The ones already written are marked, not
  deleted: `revenue_records.revenue_cents` is NULL on a synced row that
  measured nothing (migration 20261001140344). Deleting revenue records is
  irreversible and the migration runs against production (lead,
  2026-10-01). In production no connection has held the monetary scope,
  so every zero-valued `api` row predates any measurement. Elsewhere, a zero can
  only be a measured correction, and marking it NULL changes no sum. A
  `manual` row keeps NOT NULL by check. `revenue_cents_by_publish` and
  every `revenue_records` read skip NULL, so an unmeasured USD row cannot
  give a EUR-only account a $0.00 card. `planRevenueRowWrites` fills a
  NULL row once the platform reports, a measured zero included. TikTok and
  Instagram now mark revenue unmeasured, because their zero was hardcoded,
  not reported.

  ## 10. As built (#TBD-1726)

  - Stage and signals: `packages/clickhouse/src/lib/signal-map.ts`
    (`FUNNEL_STAGES`, three signals, `platform_does_not_expose_revenue`).
  - Access: `packages/clickhouse/src/lib/monetisation-access.ts`.
    `CONNECTION_REVENUE_STATES` is publishing's `AnalyticsAccessState`
    without `no_provider`, read from its source by the test.
  - ClickHouse: migration `022_video_revenue_daily` (assumes FILM-1727's
    021 has run, and recreates `video_daily_stats` with 021's column list).
    `insertVideoRevenueDaily`, a purge entry, and the matrix moves
    `revenue × youtube` to native. Every `video_daily_stats` reader returns
    `revenue_cents: number | null`. Content-analytics keeps the null
    (`lib/estimated-revenue.ts`): dashboards and cards say "Not measured",
    and exports leave the cell blank and give coverage.
  - Postgres: migration `20261001140344_revenue-records-unmeasured`, with
    pgTAP `revenue-records-unmeasured.test.sql`.
  - Facebook: the four ad-break metrics in their own read, behind FILM-1720's
    switch. A permission refusal is `account_type_gated`, anything else is
    `unavailable`, and neither costs the video's other figures. None is
    stored until FILM-1725 Check K.
  - Guards: `tooling/mutation-guards/film-1726.json`, 16 entries, all RED.

  ## 11. FILM-1718's rows with a sixth stage

  `STAGE_PATTERNS` spells out every stage on every row, so a sixth stage
  fails to compile (TS2741) until each row says what it asks of it. No row
  is added for Monetisation. "Revenue below while the funnel is above" would
  name no stage to look at: the levers (ad suitability, ad breaks, the
  season's advertiser demand) are measured by no stage. A Monetisation band
  still shows on the strip. The requirement per row:

  | Row | `monetisation:` | Why |
  |---|---|---|
  | `reach_below_content_above` | `'any'` | The sentence is about content against distribution; earnings are neither |
  | `reach_above_content_below` | `'any'` | Same |
  | `hook_above_attention_below` | `'any'` | Names two stages only |
  | `attention_above_transmission_below` | `'any'` | Names two stages only |
  | `consumption_above_audience_below` | `'any'` | Names three stages only |
  | `above_at_every_judged_stage` | `'above_where_judged'` | "Strong across every judged stage" is false if Monetisation is judged below |

  `MIN_JUDGED_STAGES`, the exclusions and the coverage sentence need no
  change: they iterate `FUNNEL_STAGES`. The exhaustive test becomes 3^6
  combinations plus the unjudged cases, as FILM-1718's verification
  section already anticipates.

  **`MIN_JUDGED_STAGES` did need a change** (decided by the lead
  2026-10-01 under the owner's overnight authorisation; owner to confirm).
  "Need no change" held for the exclusions and the coverage sentence, not
  for the minimum. Counted toward it, Reach and Monetisation alone made two
  judged stages with every content stage unjudged, so rows 1 and 2 spoke
  of content signals nobody had read: 768 combinations each, and a 256-way
  overlap of rows 2 and 6 (Reach and Monetisation above, nothing else
  judged), which the overlap test exists to catch. Only `PATTERN_STAGES`,
  distribution and content, count toward the minimum now
  (packages/clickhouse/src/lib/stage-diagnosis.ts:256); Monetisation is
  still judged, shown and counted in "Judged on N of 6". The exhaustive
  counts over the 729 fully judged combinations are 3, 3, 81, 81, 27, 1
  and 533 with no clear pattern. Guard MS19 (FILM-1726) holds it. #TBD-1726
