summary: >
  The phase locked five funnel stages and explicitly excluded a sixth,
  Monetisation, on the grounds that video_metrics.revenue_cents is literal
  0 on all four write paths. FILM-1721's re-verification showed that
  premise was a fact about our own writers (an unrequested OAuth scope),
  not a fact about the platforms — YouTube revenue is plumbed end to end
  and blocked only by yt-analytics-monetary.readonly, and Facebook has its
  own ad-break revenue surface. This spec does not argue the stage should
  exist; it argues the original decision has to be re-made on correct
  grounds, possibly to the same conclusion.
