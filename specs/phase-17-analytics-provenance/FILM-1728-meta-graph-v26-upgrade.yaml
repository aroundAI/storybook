summary: >
  FILM-1723 pinned Meta Graph to v23.0 as the safe, minimal-diff choice —
  the only version the repository had already run on purpose. The owner's
  decision was to take that pin first, then move to the latest version
  (v26.0) as its own change with the changelog research done and written
  down, and separately to audit how well the version is encapsulated so a
  2029 bump is a scheduled chore rather than an investigation. This spec
  does both: moves META_GRAPH_VERSION to v26.0 (confirming nothing we call
  changed across v24–v26, except that v25.0 deprecated 41 Facebook insight
  metrics our reference incorrectly still lists as available), and adds a
  served-version assertion, an expiry test that fails 120 days early, one
  implementation per flow, and a reference-vs-changelog reconciliation test.
