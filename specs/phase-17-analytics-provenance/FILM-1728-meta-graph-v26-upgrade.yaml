notes: |
  ## 1. Why this exists

  FILM-1723 replaced three Graph versions — two of them expired, all of them
  silently served as v20.0 — with one constant, META_GRAPH_VERSION, pinned to
  v23.0. That was the right pin for a change with a deadline: v23.0 was the only
  version the repository had already run on purpose, so nothing moved that did
  not have to.

  The owner's decision (2026-09-22): take that safe pin first, then move to the
  latest version as its own change, and make sure the product does not have to
  worry about this again for years. This spec does both halves:

  - §4–§6 move the pin to v26.0, with the changelog research done and
    written down rather than assumed.
  - §7 is the audit the owner asked for — how well is the version
    encapsulated, and what breaks when someone bumps it in 2029? — and the four
    changes that turn the next bump from an investigation into a scheduled chore.

  The version is the cheap part. What a bump can break is never the URL; it is
  a field, a metric, or a behaviour that the new version no longer has. So
  the durable protection is not "one constant" (FILM-1723 already gave us that)
  but knowing what we call, and being told when the vendor answers differently.

  ## 2. What changes

  | | From | To |
  |---|---|---|
  | META_GRAPH_VERSION | v23.0 | v26.0 |
  | META_GRAPH_VERSION_RELEASED | 2025-05-29 | 2026-07-29 |
  | META_GRAPH_VERSION_EXPIRES | 2027-10-08 | see §3 — not yet published |

  All three in packages/shared/src/vendors/meta.ts. The row and the "Pinned"
  line under Graph API versions in docs/platform-capability-reference.md
  change with them; packages/shared/__tests__/vendor-api-versions.test.ts fails
  until the constant, the line and the row agree, and on a version literal written
  anywhere else. No call site changes (§7.1 shows why). If one has to, that is
  a finding, not a routine edit.

  ## 3. The expiry date: a fact to fetch, and today it does not exist

  Meta's changelog (read 2026-09-22):

  | Version | Released | Available until |
  |---|---|---|
  | v23.0 | 2025-05-29 | 2027-10-08 |
  | v24.0 | 2025-10-08 | 2028-02-18 |
  | v25.0 | 2026-02-18 | 2028-07-29 |
  | v26.0 | 2026-07-29 | TBD |

  Meta publishes a version's expiry only when the next version ships. Its
  guarantee is "at least two years from release", so v26.0 lives to no earlier
  than 2028-07-29. Meta's cadence has each version lasting ~2 years 3 months, so
  the likely date is early 2029 — but that is a pattern, not a promise.

  - On the day this is implemented, re-read the changelog. If v27.0 has shipped
    the date will be there; use it.
  - If it has not, set META_GRAPH_VERSION_EXPIRES = '2028-07-29' and mark it as
    the guaranteed floor — in the constant's comment, in the reference row, and
    in a way the binding test recognises explicitly (a META_GRAPH_VERSION_EXPIRY_IS_FLOOR
    flag or equivalent). An inferred date dressed as a documented one is the
    failure FILM-1721 exists to prevent.
  - §7.3 adds the test that makes this date matter: it starts failing 120 days
    before expiry, so the floor is revisited before it can bite.

  ## 4. What v24.0, v25.0 and v26.0 change — researched, not assumed

  Read 2026-09-22 from Meta's per-version changelog pages and the Instagram
  Platform changelog. Set against every call this repository makes (the
  inventory is §7.1).

  ### 4.1 On the surfaces we call: nothing

  | Surface | v24.0 | v25.0 | v26.0 |
  |---|---|---|---|
  | OAuth: /dialog/oauth, /oauth/access_token, fb_exchange_token, /me/permissions | — | — | — |
  | /me/accounts with id,name,access_token,category,picture,instagram_business_account | — | — | — |
  | Page video: /{page}/videos (resumable upload_phase start/transfer/finish, file_url), /{page}/video_reels, /{video}?fields=status,permalink_url | — | — | — |
  | Instagram publish: /{ig-user}/media (media_type=REELS, video_url, cover_url, share_to_feed), /{container}?fields=status_code, /media_publish, /{media}?fields=permalink,shortcode | — | — | — |
  | Instagram insights: media views, reach, total_interactions, likes, comments, saved, shares (Story: views, reach, total_interactions, shares); user views, reach (period=day), follower_demographics (breakdown=country,city,age,gender, metric_type=total_value); followers_count | — | — | — |
  | Media fields: media_type, media_product_type | — | — | — |

  The one Instagram removal in this window — impressions, plays,
  clips_replays_count, ig_reels_aggregated_all_plays_count, gone on all
  versions since 2025-04-21 — was handled by FILM-1721 and is in the reference's
  forbidden block already.

  ### 4.2 Things v26.0 retires that we must confirm we do not use

  v26.0 ("Legacy Protocol Features Deprecated", all versions from 2026-10-27): the
  pretty, debug and If-None-Match query parameters are ignored;
  date_format and root GET /?ids=… return an error. Grep of every Meta
  call site on the FILM-1723 branch, 2026-09-22: none used. Add each to the
  forbidden block so it stays that way.

  v25.0 (all versions from 2026-05-19): metadata=1 no longer returns node
  metadata. Not used.

  ### 4.3 The finding: v25.0 deprecated 41 Facebook insight metrics, and our reference says five of them exist

  v25.0's changelog, verbatim: "page reach, page post reach, video impressions,
  and story impressions metrics listed below will be deprecated. Once deprecated,
  these metrics will return an error if requested using any API version."
  Timing: "Will apply to all versions when v26.0 is released" — i.e. since
  2026-07-29.

  Video Insights API, the full 15 (Page and Post lists are in the changelog and
  should be pasted into the reference's forbidden block with it):
  post_impressions_unique, total_video_impressions,
  total_video_impressions_unique, total_video_impressions_paid_unique,
  total_video_impressions_paid, total_video_impressions_organic_unique,
  total_video_impressions_organic, total_video_impressions_viral_unique,
  total_video_impressions_viral, total_video_impressions_fan_unique,
  total_video_impressions_fan, total_video_impressions_fan_paid_unique,
  total_video_impressions_fan_paid, total_video_views_organic_unique,
  total_video_views_paid_unique, total_video_views_unique.

  Our docs/platform-capability-reference.md (Facebook section, "verified
  2026-09-21") lists total_video_views_unique, total_video_impressions_unique
  and post_impressions_unique (as Reels reach) as available — and its
  facebook/video-insights field block carries total_video_impressions too.
  Meta's own video_insights reference page still lists all of them with no
  deprecation notice (read 2026-09-22). So the two Meta documents contradict
  each other, and ours followed the wrong one.

  What this means, and what it does not:

  - We do not call any of these today. Nothing breaks now.
  - FILM-1720 (Facebook analytics) is planned against that section and
    would have requested them. Its reach binding (post_impressions_unique) is
    gone; Facebook reach on Reels may now have no organic field, which changes
    what FILM-1703's matrix can say for Facebook reach.
  - The changelog is the authoritative signal and the reference page is stale, so
    treat the 41 as gone — but that is a reading, not a measurement. This is a
    FILM-1725 check (call /{video}/video_insights?metric=total_video_views_unique
    on the first connected Page; a 400 confirms the changelog). No production
    credentials: the owner runs it on their own connected Page after FILM-1711.
  - Meta's Threads/Instagram documentation has moved to "views" as the one
    metric across surfaces; the Facebook Page side is following. FILM-1720
    should be written against total_video_views and the retention/watch-time
    fields, not against impressions.

  ### 4.4 New since June 2026 that this product should know about (not this spec's scope)

  From the Instagram Platform changelog, all versions:

  - is_ai_generated on POST /{ig-user}/media (2026-06-22) — applies
    Instagram's AI info label to the container. This product publishes
    AI-generated video; whether the label is required, expected, or merely
    available is a product and policy question, and an unlabelled AI video is a
    plausible reason for a future enforcement action. File as its own item;
    answer before onboarding other creators.
  - reposts_count, saved_count, shares_count, total_like_count,
    total_comments_count, total_views_count on GET /{media} (2026-04-22) —
    aggregate fields without an /insights call. FILM-1712's "what is cheap"
    section should re-check against these.
  - link_clicks on Story insights (2026-06-22), reels_skip_rate,
    reposts, crossposted_views, facebook_views (2025-12-03) — for
    FILM-1712 / FILM-1720.
  - enable_fb_login on Instagram OAuth (2026-02-06) and the growing
    "Instagram API with Instagram Login" surface — see §7.5, the one structural
    risk this spec cannot close.

  ## 5. Verification for the bump itself

  - The pin is honoured. curl -sI "https://graph.facebook.com/v26.0/me" | grep -i
    facebook-api-version → v26.0. Measured 2026-09-21: it does. Re-run on the
    day; it costs nothing and needs no credentials.
  - Red before green. Bump only the constant → vendor-api-versions.test.ts
    fails naming the reference row; bump only the row → it fails naming the
    constant; then both. Entries in tooling/mutation-guards/.
  - Forbidden block extended with §4.2's parameters and §4.3's 41 metrics
    before the pin moves; platform-field-names.test.ts stays green, proving
    nothing we request is among them.
  - The bundle carries one version. Bundle the publish lambda as SST does
    (FILM-1723's esbuild check): exactly one "v26.0", no other Graph version
    literal. apps/web/lambda/ is not typechecked (KB-14), so the bundle is the
    evidence.
  - A live token refresh — the owner's, after deploy. FILM-1725 Check D (one
    forced Meta refresh at the first deploy carrying FILM-1723) must be re-run at
    the first deploy carrying this. If Check D has not yet run for v23.0, one run
    against v26.0 closes both. No production credentials are used by anyone but
    the owner, on their own connection.

  ## 6. Out of scope

  - New metrics, fields or scopes — FILM-1711, FILM-1712, FILM-1720 own what is
    requested. §4.3 and §4.4 are inputs to them, not work here.
  - Facebook analytics (FILM-1720): written against whichever pin is on main
    when it starts, and against §4.3.
  - FILM-1801's resolver: it edits the *_HOST constants in the same file; this
    edits META_GRAPH_VERSION* — adjacent lines, no shared ones.

  ## 7. The audit: how encapsulated is the version, and what does 2029 touch?

  Measured on the FILM-1723 branch (#284), 2026-09-22.

  ### 7.1 Where the version lives — one place, eleven consumers

  packages/shared/src/vendors/meta.ts holds the version and three hosts, and
  exports five URLs built from them. Every Meta call in the repository reaches
  Graph through one of those exports:

  | Consumer | Uses | What it calls |
  |---|---|---|
  | publishing/src/oauth/meta/config.ts | dialog, token, graph URLs | OAuth start; META_OAUTH_CONFIG for the two below |
  | apps/web/app/api/platforms/connect/meta/route.ts | authUrl | /dialog/oauth |
  | apps/web/app/api/platforms/callback/meta/route.ts | tokenUrl, graphUrl | code exchange, long-lived exchange, /me/accounts, /{ig-user} |
  | publishing/src/oauth/meta/disconnect.ts | graphUrl | DELETE /me/permissions |
  | publishing/src/lib/token-refresh.ts | META_OAUTH_TOKEN_URL, META_GRAPH_BASE | fb_exchange_token, /me/accounts |
  | publishing/src/providers/facebook/types.ts → facebook-provider.ts | META_GRAPH_BASE, META_GRAPH_VERSION (re-exported as FACEBOOK_*) | /videos, /video_reels, /{video}, /me/accounts |
  | publishing/src/providers/instagram/instagram-provider.ts | META_GRAPH_BASE | /media, /{container}, /media_publish, /{media}, /{ig-user}, /pages/search |
  | content-analytics/src/providers/instagram/instagram-insights.ts | META_GRAPH_BASE | /{media}, /{media}/insights, /{ig-user}/insights, /{ig-user} |
  | apps/web/lambda/publish-worker/handlers/facebook.ts | META_GRAPH_BASE, META_GRAPH_VIDEO_BASE | /videos (non-resumable), /{video} |
  | apps/web/lambda/publish-worker/handlers/instagram.ts | META_GRAPH_BASE | /media, /{container}, /media_publish, /{media} |

  Also checked: no Meta SDK (every call is a hand-built fetch); no Meta
  webhooks (nothing to re-subscribe on a version change); no versioned Graph
  URL is stored in Postgres or ClickHouse (the only stored URLs are public
  permalinks on www.facebook.com / www.instagram.com, which are unversioned).
  vendor-api-versions.test.ts fails on a version literal outside the vendors
  directory, so a twelfth consumer cannot restate it.

  Verdict on the constant: good. In 2029 the version bump itself is three
  lines, and the guard makes it impossible to half-do.

  ### 7.2 What the constant does not protect — and what will actually break

  A bump breaks when the new version stops returning a field we parse, or
  changes a behaviour we depend on. Four things about today's shape make that
  harder to notice than it should be:

  1. Nothing checks what Meta actually served. The v18.0 → v20.0 silent
     substitution ran for eight months and was found by a human reading a
     response header during FILM-1723. Every one of the eleven call sites
     discards that header. If the served version ever differs from the pinned
     one — expiry, a Meta-side default, a typo — nothing today would say so.
  2. Eleven hand-written fetch sites, four packages, no choke point. Each
     builds its URL, appends the token, and parses Meta's error envelope its own
     way. A cross-cutting change (the header check above, a retry rule, a
     deprecation-warning capture) is eleven edits.
  3. The lambda handlers duplicate the providers. handlers/instagram.ts is
     a second copy of the container → poll → publish flow;
     handlers/facebook.ts a second (non-resumable) upload path. A field that
     changes semantics must be fixed twice, and KB-14 means the lambda copy is
     not even typechecked.
  4. Meta sends deprecation warnings on live responses and we drop them.
     Graph answers with an X-Business-Use-Case-Usage / x-app-usage header
     pair and, for deprecated fields, a warning/__debug__ object in the
     body. The pretty/date_format retirement in §4.2 was announced that way
     months before v26.0. Nobody reads it, so the changelog page is our only
     early warning — and, per §4.3, it can disagree with the reference pages.

  ### 7.3 The four changes that make the next bump boring

  These are the work of this spec beyond the three-line bump. Each is small; the
  first is the one that pays for all of them.

  A. A served-version assertion, in one place. A thin metaFetch() in
  @kit/shared/vendors (client-safe, no framework imports, so the lambdas can
  use it): builds the URL from META_GRAPH_BASE, attaches the token as a header
  (not a query parameter — see §7.4), reads facebook-api-version from every
  response, and fails loudly on the first mismatch with the pinned version —
  a logged error with vendor, expected, served, and the endpoint. Once per
  process is enough (a WeakSet/flag), so it costs nothing on the hot path.
  Also captures Meta's warning field and usage headers into the same log line
  shape. All eleven sites move onto it, which is mechanical and removes
  their private URL-building. Guard: a test that fails on a bare fetch( of a
  Meta host outside metaFetch (extend vendor-api-versions.test.ts; FILM-1801
  already has the host scanner).

  B. An expiry that cannot be missed. vendor-api-versions.test.ts already
  binds META_GRAPH_VERSION_EXPIRES to the reference table. Add: the test
  fails when today is within 120 days of that date, with a message naming
  this spec and the three files to change. If the date is a floor (§3), the
  message says to re-read the changelog first. Same rule for every vendor that
  publishes an expiry (today: only Meta). A CI job that goes red four months
  early, on a schedule, is what "not worrying for years" means in practice —
  a calendar reminder nobody set.

  C. One implementation per flow. Move the Instagram container flow and the
  Facebook upload flow into the providers (@kit/publishing) and have the lambda
  handlers call them. The lambda already bundles @kit/shared; bundling
  @kit/publishing's provider modules is the same esbuild step. Until KB-14
  lands this also puts that code under tsc for the first time. If the
  non-resumable graph-video path exists for a reason (very large files? a
  timeout?), keep it as a provider option, not a second file.

  D. The reference and the changelog, reconciled by test. Extend the
  forbidden block with §4.2 and §4.3, and add a dated "per-version findings"
  table to the reference's Graph API versions section — one row per version
  crossed, what it changed on our surfaces, and the date read. A future bump
  appends rows; the test that binds the pinned version to the table also asserts
  a row exists for every version between the old pin and the new one. Reading
  the changelog becomes a checklist item that cannot be skipped, not a virtue.

  ### 7.4 Two things found in passing, not fixed here

  - Access tokens travel in query strings at most call sites
    (?access_token=…). That puts them in server logs, proxies and the browser
    history of anyone who pastes a URL. Meta accepts Authorization: Bearer.
    metaFetch() (A) should send the header and the sites should stop
    appending the token; this is a security improvement riding on an
    encapsulation change, and it should be called out as such in the PR. Do not
    file it as a KB entry until it is confirmed that the lambda's CloudWatch
    logs actually contain a URL with a token (they may not log request URLs).
  - FACEBOOK_API_VERSION / FACEBOOK_GRAPH_API_BASE in
    providers/facebook/types.ts are second names for the shared constants.
    Harmless; remove when (A) moves the provider onto metaFetch().

  ### 7.5 The risk this spec cannot close: which Instagram API we are on

  There are two Instagram APIs. We use "Instagram API with Facebook Login"
  (graph.facebook.com, a Facebook Page's instagram_business_account). Meta's
  newer surface is "Instagram API with Instagram Login" (graph.instagram.com,
  no Page required), and the changelog shows it gaining features first (§4.4:
  enable_fb_login, the 2025 insights additions were "for apps using Instagram
  API with Instagram Login" before reaching ours). If Meta ever retires the
  Facebook-Login path, no version pin helps: it is a different host, a different
  token, a different app review. Nothing indicates that today, and the
  Facebook-Login path is the one that supports Page publishing, which we need.
  Record it here so that the person doing the 2029 bump reads Meta's Instagram
  Platform overview page first and checks whether the ground has moved — that is
  the one manual step the tests in §7.3 cannot replace.

  ## 9. Risk

  The bump: low, concentrated in token refresh, exactly as FILM-1723 found —
  a broken refresh fails silently weeks later as connections decaying one by one.
  Check D is a deploy-day action, not a nicety. Rollback is three constants, and
  because every call reads the one constant a rollback cannot be partial.

  The durability work: low, but it touches every Meta call. Do (A) as a
  mechanical move with no behaviour change first — same URLs, same parsing, plus
  the header read — and land it before the pin moves, so that the bump itself is
  verified by the new assertion on its first deploy. (C) is the largest change
  and the only one with real behaviour to get wrong; it can trail the others.

  Do not schedule the bump inside the FILM-1723 deploy. Land and deploy
  v23.0 first; it is the change with a deadline (v20.0 expires 2026-09-24). This
  one has none until 2028 at the earliest — and after (B), the day it acquires
  one will show up in CI four months ahead.
