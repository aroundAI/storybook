summary: >
  FILM-1723 pinned Meta Graph to v23.0 as the safe, minimal-diff choice —
  the only version the repository had already run on purpose. The owner's
  decision was to take that pin first, then move to the latest version
  (v26.0) as its own change with the changelog research done and written
  down, and separately to audit how well the version is encapsulated so a
