summary: >
  Short-form and long-form are different products with different funnels,
  and no spec in the repository segments analytics by them. This spec
  introduces a format family axis — short_vertical, long_vertical,
  long_horizontal, teaser, trailer, clip, live — mapped from video_dim's
  content_type and platform rather than read from either, since
  content_type alone has only four values (three of which behave as
  long-form) and does not capture orientation or surface. Duration cannot
  yet refine the mapping because video_dim.duration_seconds is the
  episode's duration until FILM-1710 lands.
