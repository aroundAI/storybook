notes: |
  ## Overview

  Short-form and long-form are different products with different funnels,
  and no spec in the repository segments analytics by them. A grep across
  `specs/` for "shorts vs long" returns nothing.

  The distinction is not cosmetic. In short-form the viewer did not ask
  for the video — the first question is why didn't they swipe. In
  long-form they chose it — the first question is why did they click. CTR
  is central to one and meaningless to the other. A single benchmark pool
  mixing both produces a number that describes neither.

  ## content_type is not the answer, but it is the input

  `video_dim.content_type` is `'full' | 'short' | 'teaser' | 'trailer'`
  (`migrations/005_video_dim.ts:19`, CHECK at `30-film-studio.sql:539`).

  Two problems with reading it directly: four values, three of which
  behave as long-form — any lookup keyed on `'short' | 'long'` silently
  drops `teaser` and `trailer`. It does not capture orientation or surface
  — a 45-second vertical clip on YouTube and the same clip on Instagram
  are creatively alike and analytically different — different feeds,
  different view definitions, different viewer intent.

  So the axis is a format family, mapped from `content_type` and platform
  rather than read from either:

  ```
  short_vertical . long_vertical . long_horizontal . teaser . trailer . clip . live
  ```

  `FORMAT_BY_CONTENT_TYPE` is exported, and `verify-queries.ts` asserts
  that every `content_type` actually present in `video_dim` has a
  mapping, following FILM-1703's live-check pattern. A new content type
  then fails CI rather than falling silently out of every lookup.

  ## Duration cannot classify format yet

  The obvious implementation — classify by duration — is unavailable
  until FILM-1710 lands, because `video_dim.duration_seconds` is the
  episode's duration. In the live fixture, Instagram and TikTok publishes
  marked `short` average ~1,550 seconds.

  So this spec depends on FILM-1710, and until the asset duration exists
  the mapping is driven by `content_type` and platform alone. Once it
  exists, duration can refine the family — but a publish whose asset
  duration is null must fall back to the declared type rather than being
  guessed into a family.

  ## What the family axis is for

  Three consumers, all of which need it before they are correct:
  FILM-1714 keys its signal map on platform x format x stage — YouTube
  long Hook is CTR; YouTube short Hook has no honest primary at all.
  FILM-1715 never relaxes the format axis when finding comparable videos
  — a Short benchmarked against long-form is nonsense. FILM-1717 compares
  creative attributes within a family, because a hook mechanism that works
  in a 20-second vertical is not evidence about a 20-minute horizontal.

  ## Scope constraint worth stating now

  `DimScope.contentType` is a single string (`queries-advanced.ts:25`)
  and `buildDimConditions` binds one value. A family spanning several
  content types — `long_horizontal` covering `full`, `teaser` and
  `trailer`, say — cannot be expressed without widening the scope to
  accept a list.

  Either widen it here, or restrict v1 to families that map one-to-one and
  record the limitation. Do not emit a query that silently filters to the
  first value.

  ## Out of scope

  - Adding new `content_type` values. This spec maps what exists.
  - Per-family thresholds or benchmarks — FILM-1715.
  - `live` as a real ingest path; it is in the vocabulary so the axis does
    not need widening later, and maps to nothing until live publishing
    exists.

  ## Verification

  ```bash
  pnpm --filter @kit/clickhouse test
  ./scripts/local-env.sh verify
  pnpm turbo typecheck --force && pnpm lint
  ```

  Pure mapping, unit-testable. The live check is the one that matters over
  time:

  ```sql
  SELECT DISTINCT platform, content_type FROM video_dim FINAL;
  ```

  must be fully covered by `FORMAT_BY_CONTENT_TYPE`, and the test must be
  seen failing by adding an unmapped content type to the fixture.

  ## Risk

  The vocabulary could grow indefinitely — every surface on every platform
  is a candidate family. The discipline is that a family must change how a
  video is analysed, not merely describe it. If two families always
  produce the same signal map and the same benchmark pool, they are one
  family with two names, and the taxonomy work belongs in FILM-1717
  instead.

  ## Implementation notes (#497)

  **The API** (`@kit/clickhouse`, `packages/clickhouse/src/lib/format-families.ts`), for FILM-1714, FILM-1715,
  FILM-1717 and FILM-1724:

  | Export | What it is |
  |---|---|
  | `FormatFamily`, `FORMAT_FAMILIES` | The seven families, in display order |
  | `FORMAT_FAMILY_LABEL` | What a card calls each |
  | `ContentType`, `CONTENT_TYPES` | publishes.content_type's CHECK |
  | `PublishPlatform`, `PUBLISH_PLATFORMS` | publishes.platform's CHECK (X is `twitter`) |
  | `FORMAT_BY_CONTENT_TYPE` | content type x platform -> declared family |
  | `DURATION_REFINEMENTS` | where a known duration overrides it |
  | `resolveFormatFamily({ platform, contentType, assetDuration })` | `{ ok, family, declared, basis, duration }` or `{ ok: false, reason }` |
  | `formatFamilyOfDim(row)` | the same over a video_dim row |
  | `contentTypesFor(family, platform)` | declared content types in a family |
  | `unmappedFormatPairs(pairs)` | what the live check fails on |
  | `formatFamilyPredicate(family)` | the SQL for `DimScope.formatFamily` |
  | `DimScope.formatFamily`, `DimScope.contentType: string \| string[]` | scope by family, or by several declared types |

  `AssetDuration` moved from `@kit/content-analytics` to `@kit/clickhouse`
  (`lib/asset-duration.ts`) so the resolver can take one; content-analytics
  re-exports it unchanged, and FILM-1710's two guards follow the file.

  **Mapping choices.** `full` is horizontal where long-form plays in a
  player (YouTube, Facebook, X, LinkedIn) and vertical where it is the same
  full-screen feed (TikTok, Instagram). `short` is `short_vertical` in a
  swipe feed and `clip` in a scrolling timeline (X, LinkedIn). `teaser` and
  `trailer` are their own families. `live` maps from nothing.

  **The one duration refinement** is YouTube's own rule: a vertical upload
  over three minutes is not a Short (60 s before 2024-10-15), sourced and
  dated in `docs/platform-capability-reference.md`. So a YouTube `short`
  with a known duration over 180 s is `long_vertical`. 61-180 s keeps the
  declared type, because the upload date is not an input.
  `creatorContentType` would be the platform's own answer if it were
  ingested.

  **SQL and TS agree by construction and by test.** `formatFamilyPredicate`
  is generated from the same two tables, binds `platform:content_type` keys
  as `Array(String)` (the JS client cannot send `Array(Tuple(...))`, found
  only by running it), and applies on the newest dim row (HAVING), because
  the asset duration arrives after a publish's first dim row. verify-queries
  checks every family row for row against `resolveFormatFamily`, including a
  superseded row whose duration was still null. That check passed with the
  filter in the wrong clause until the fixture was inserted with
  `optimize_on_insert: 0`; ReplacingMergeTree had collapsed the superseded
  row on the way in.

  **The consumer.** The Language tab's "Shorts vs Long-form" card was the
  short/long lookup: `short` and `teaser` in one bucket, the rest in the
  other, every platform pooled. It is now "By format family", a row per
  family and no ratio between rows. It drops the revenue column: every
  pipeline writer stores a video's revenue as a literal 0 (FILM-1703), so
  "$0" was a zero nobody measured. It says how many were placed by
  declared type and how many no family covers. The Shorts ROI card and the
  clipping advice compare two named families (`short_vertical`,
  `long_horizontal`) rather than a pooled split. Evidence screenshots come
  from `apps/e2e/tests/analytics/format-family-evidence.spec.ts`, read off
  the page against a seeded ClickHouse: short 3 / 210 views, long vertical
  2 / 120, long horizontal 1 / 400, trailer 1 / 30; three placed by declared
  type, one (a `podcast` row) not covered and counted. Main's card showed
  shorts 4 / 260 and long-form 4 / 505 for the same rows.

  No `clip` row can appear on that card today: `video_metrics.platform` is
  an enum of the ingested platforms, so an X or LinkedIn publish has a dim
  row and no figures. The family is still resolved for it, which is what
  FILM-1714's signal map and FILM-1715's cohorts need.
