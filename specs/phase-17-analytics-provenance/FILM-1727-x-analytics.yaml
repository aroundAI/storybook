    columns_added: []
    migration: "packages/clickhouse/src/migrations/021_twitter.ts"
  queries:
    - {name: "queryPlatformBreakdown", purpose: "X's shares are null, not 0", file: "packages/clickhouse/src/queries.ts"}
    - {name: "queryLatestSnapshots", purpose: "a NULL share stays NULL in the baseline", file: "packages/clickhouse/src/queries.ts"}
  actions: []
  ui: []
  budget: "packages/features/content-analytics/src/lib/x-read-budget.ts"
  provider: "packages/features/content-analytics/src/providers/twitter/x-analytics.ts"
  sync: "packages/features/content-analytics/src/server/analytics-sync-cron.ts"
  sandbox: "apps/vendor-sandbox/src/social/vendors/x/data.ts"
  provider_integration:
    vendor: "X (Twitter)"
    endpoints:
      - "GET /2/media/analytics (Enterprise tier; video_views, playback quartiles, watch_time_ms, CTA clicks, timestamped_metrics)"
      - "GET /2/tweets/analytics (Enterprise tier; bookmarks, clicks, shares, quote_tweets, impressions, follows/unfollows)"
      - "media.non_public_metrics via the ordinary posts lookup (pay-per-use tier; playback quartile counts, view_count; 30-day wall from post creation)"
