summary: >
  X has a publishing provider but no analytics provider. Split from FILM-1720
  ("Facebook and X Analytics") on 2026-09-21, with Facebook shipping first.
  Authorisation is not the blocker — tweet.read and users.read are already
  requested for publishing. X has two capability tiers: Enterprise
  (/2/media/analytics, unpublished pricing) and pay-per-use
  (media.non_public_metrics, metered, 30-day wall from post creation). This
  spec decides to ship the pay-per-use path, with Enterprise fields declared
  and dark, and records that the decisive unknown is the undocumented
  historical window on /2/media/analytics, not the price — which
  FILM-1725 Check A must settle before the Enterprise tier can be scoped.
