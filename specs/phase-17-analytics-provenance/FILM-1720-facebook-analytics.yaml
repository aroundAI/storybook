notes: |
  ## Built 2026-10-01 (#504), shipped dark

  **Owner decision, 2026-10-01:** build Facebook against the local vendor
  sandbox (apps/vendor-sandbox, the Meta origin) and ship it dark until the
  owner holds App Review / read_insights. Live checks stay with the owner:
  this spec is PARTIAL, closed by the owner or FILM-1725.

  **Owner decision, 2026-10-01 (option A):** Facebook rows go in
  video_metrics like Instagram's snapshot deltas, with `views` NULL.
  Migration 020 makes `views` Nullable (013/014's pattern: MODIFY, then
  recreate video_daily_stats) and gives Facebook's denominators their own
  nullable columns on video_metrics and video_snapshots. A pooled views
  figure never adds a Facebook denominator to a YouTube view; FILM-1713's
  rates are absent as no_single_view_definition. Rejected: a separate table
  (no card would show Facebook) and storing 3-second views as `views`
  (reverses FILM-1722).

  What was built, and where:

  | Layer | Facebook |
  |---|---|
  | ClickHouse | migration 020: 'facebook' = 4 on six tables, `views` Nullable, ten denominator columns |
  | AnalyticsPlatform / SyncPlatform | both include facebook |
  | Capability matrix | an entry per family; reach and accounts reached from the Page post's insights |
  | Signal map | Reels and player maps bound to Facebook's own denominators |
  | Provider | `providers/facebook`, four reads through metaFetch |
  | Sync | snapshot deltas, retention graph; revenue untouched |
  | OAuth | read_insights + pages_manage_engagement behind the `facebook` scope switch |
  | Sandbox | the four reads, and the retired metrics refused |

  **Readers.** With a NULL-views Facebook reel in verify-queries' hand
  fixture, the upload-month median and the cohort medians counted it as a
  fourth January video with 0 views. Readers that count videos or take a
  quantile of their views now keep to VIEWS_COLUMN_PLATFORMS; every
  hand-computed figure held. The reach page read Facebook's NULL as 0 on
  its Facebook line; it now says not measured (evidence spec
  reach-evidence.spec.ts, screenshots reach-06 to reach-08). Every other
  reader that hands back views does the same since KB-153 (fixed in this
  PR): per-video totals, views at age, the platform split, the daily
  series, the dashboards, the reports and the insights payload all say
  not measured, and the LEFT JOIN readers read a miss as 0 again.

  **Registry (handed over by FILM-1728).** facebook.total_video_impressions
  and facebook.post_impressions_unique are `availability: 'retired'`,
  retiredOn 2026-07-29, citing
  https://developers.facebook.com/docs/graph-api/changelog/version25.0
  (read 2026-10-01). Replacements, from the changelog's own guidance and the
  Insights reference
  (https://developers.facebook.com/docs/graph-api/reference/insights/, read
  2026-10-01): post_media_view ("played or displayed") for the impression
  and post_total_media_view_unique ("total unique media viewers") for reach.

  ## Read first: Graph v25.0 retired Facebook reach (FILM-1728 §4.3, 2026-10-01)

  Graph v25.0's changelog deprecated 41 Page, Post, Video and Story insight
  metrics for every version from v26.0's release (2026-07-29): requesting one
  returns an error. Among them are the reach bindings this spec was planned
  against: post_impressions_unique (Reels reach), total_video_views_unique
  and total_video_impressions(_unique). Meta's video_insights reference page
  still lists them; the changelog wins, and the capability reference's
  Facebook section and forbidden block now say so. FILM-1725 Check J is the
  one call on the owner's first Page that confirms it.

  What changes here: write the provider against total_video_views,
  blue_reels_play_count, fb_reels_total_plays and the watch-time and
  retention fields, not against impressions or a _unique reach. Facebook
  reach on Reels may have no organic field at all, so FILM-1703's matrix
  should expect null (cannot measure) for Facebook reach. The Graph pin is
  v26.0 (FILM-1728), and every call goes through metaFetch in
  @kit/shared/vendors.

  Assigned here by the lead (2026-10-01): FILM-1722's view-definition
  registry still defines facebook.total_video_impressions and
  facebook.post_impressions_unique (packages/clickhouse/src/lib/view-definitions.ts),
  both retired by v25.0. Add a `retired` availability to ViewDefinition and
  settle both entries, with FILM-1725 Check J as the live confirmation.

  ## Where Facebook actually stands

  | Layer | Facebook |
  |---|---|
  | Publishing provider | exists (FILM-704) |
  | Analytics provider | none |
  | Analytics API | `/{video-id}/video_insights` |
  | OAuth | `read_insights` + the ANALYZE task — not requested |
  | Commercial | included |
  | `AnalyticsPlatform` | no |
  | ClickHouse enum | no |

  A Facebook connection can be created, can publish, and can carry revenue
  rows in Postgres — and can never produce an analytics row.

  Worse: `dim-sync.ts` has no platform filter and `video_dim.platform` is
  an unconstrained `LowCardinality(String)`, so Facebook publishes do get
  dimension rows that can never have metrics, appearing as zero-view
  videos in any dim-driven denominator. That is a live distortion, not a
  future one, and it is why this spec ships before FILM-1727.

  ## Facebook's metrics are real, and its denominators are not ours

  `GET /{video-id}/video_insights`, Pages only, 2 years of retention,
  requiring a Page token from someone with the `ANALYZE` task. Meta's own
  two doc pages disagree on the permission (`pages_manage_engagement` +
  `read_insights` versus `pages_read_engagement`); request all three.

  Facebook has things no other platform here offers: a real retention
  graph (`post_video_retention_graph` — note its segment count is
  undocumented; the 40-equal-intervals figure belongs to
  `total_video_retention_graph`, the video metric, per FILM-1721 §8), an
  explicit replay count (`fb_reels_replay_count`), and follows attributed
  to a reel (`post_video_followers`).

  And four more things, added 2026-09-21 after re-reading the live
  reference. The list above was drawn from an eight-metric summary; the
  edge carries 57 video metrics, 11 Reels metrics and 4 ad-break metrics.
  What that omitted is not filler:

  - Organic/paid splits on most view metrics. No other platform here
    offers this — TikTok's `video_views` explicitly cannot be separated.
    It is the only place in the product where "did this do well, or was
    it boosted" is answerable from the platform rather than inferred.
  - `total_video_views_autoplayed` vs `total_video_views_clicked_to_play`.
    An intent distinction, and a better Hook signal than anything YouTube
    exposes — particularly now that YouTube's own `views` folds autoplay
    in and stops distinguishing them.
  - `total_video_view_time_by_age_bucket_and_gender` — demographics
    weighted by watch time rather than by view count. FILM-1703 models the
    `demographics` family as counts; this does not fit that shape and
    needs a decision.
  - A revenue surface: `total_video_ad_break_earnings`,
    `total_video_ad_break_ad_cpm`, `total_video_ad_break_ad_impressions`,
    `creator_monetization_qualified_views`. Page admins only. This is what
    puts the "no Monetisation stage" decision back in play — FILM-1726.

  ### Four denominators, none of them a YouTube view

  1. Impression — entered the screen, no playback, estimated
  2. Play (`blue_reels_play_count`) — >=1 millisecond, replays excluded
  3. 3-second view (`total_video_views`) — >=3s or nearly full length if
     shorter
  4. ThruPlay — an Ads metric. Not on `video_insights` at all

  `total_video_15s_views` is not ThruPlay. ThruPlay is "completed or
  >=15s, whichever first"; the organic metric has no completion clause, so
  a short video that completes under 15s counts for one and not the
  other. Do not label it ThruPlay.

  ### The non-equivalence that will bite

  `post_video_avg_time_watched` can exceed the video's own duration.
  Replay time is in the numerator (documented); the denominator is
  initial plays, which exclude replays (per Meta's Business Help Center —
  the API reference does not state it, so this half is inferred).

  YouTube's average view duration cannot do this. Compute our own average
  explicitly and label the denominator rather than shipping Meta's
  precomputed figure as comparable.

  Not available: follower vs non-follower reach for video or Reels. Only
  the page-level `page_media_view` carries `is_from_followers`.

  ## The enum migration — append facebook

  The platform value is `facebook`. Unlike X (FILM-1727 §4), there is no
  vocabulary question: `oauth_states` permits `'meta'`, but that names the
  OAuth provider shared by Facebook and Instagram, not an analytics
  platform.

  `platform` is `Enum('youtube' = 1, 'tiktok' = 2, 'instagram' = 3)` in
  seven analytics tables — `001_create_tables.ts:17`,
  `002_metrics_v2.ts:27` and `:48`, `003_reach_and_traffic.ts:22` and
  `:35`, `004_extended_metrics.ts:27` and `:37`. No migration has ever
  extended it.

  The other three tables need different treatment, not the same
  migration: `video_dim.platform` is an unconstrained
  `LowCardinality(String)`, and `channel_daily` and `channel_subscribers`
  carry no platform column at all.

  Widening means an `ALTER TABLE ... MODIFY COLUMN` on each, plus
  `AnalyticsPlatform` (`clickhouse/src/types.ts:11`) and `SyncPlatform`.
  `QueryFilters.platforms` is typed as `Array(Enum(...))` at the parameter
  level, so a widened enum must be reflected there or a valid selection
  errors at the server.

  Append only `facebook`. X appends its own value in FILM-1727, after
  settling its name. Appending is metadata-only, so doing it twice costs
  nothing; what must never happen is appending a value and later renaming
  it, which rewrites every row.

  ## dim-sync stops creating rows that can never have metrics

  The fix is general, not Facebook-specific: `dim-sync` should create
  dimension rows only for platforms in `AnalyticsPlatform`. Facebook is
  the first platform to join it, which is why the fix lands here — and it
  stops LinkedIn and X publishes polluting denominators in the meantime.

  ## This is the test of FILM-1714's expandability

  Facebook binds its stages to its own four denominators. If adding it
  requires changing anything other than the enum, the type unions, the
  capability matrix and the signal map, then FILM-1714's design did not
  work. That is the finding, verified by the diff rather than by a test.
  FILM-1727 runs the same test a second time, against a platform whose
  stages bind to conversation rather than watch behaviour.

  ## Out of scope

  - X — FILM-1727.
  - Snap, Threads, LinkedIn. The framework should make them additive.
  - Pursuing Meta Advanced Access — a commercial decision this spec
    surfaces.
  - Whether a Monetisation stage exists — FILM-1726. This spec decides
    only whether the ad-break metrics are ingested.
  - Changing how the existing three platforms are analysed.

  ## Verification

  ```bash
  pnpm --filter @kit/clickhouse test
  pnpm --filter @kit/content-analytics test
  ./scripts/local-env.sh verify
  pnpm turbo typecheck --force && pnpm lint
  ```

  The enum migration must be verified against a table with rows, not an
  empty one: insert under the old enum, migrate, assert existing rows
  still read and the new value is accepted.

  One live check that can falsify this spec cheaply, before
  implementation: a `video_insights` call with `read_insights`, which
  settles the permission ambiguity between Meta's two doc pages.

  ## Risk

  The enum migration touches every analytics table. Metadata-only if the
  value is appended, a full rewrite if anything is renumbered.

  Facebook publishes already pollute `video_dim` as zero-view rows. That
  distorts denominators today, which is the argument for shipping this
  before X.
