    evidence: "Six live tables carry the enum (packages/clickhouse/src/migrations/020_facebook.ts:57): 001's video_metrics is the seventh in the count and 002 drops it; channel_windows has had 'facebook' = 4 since 016. AnalyticsPlatform packages/clickhouse/src/types.ts:11 (X joined it in FILM-1727), SYNC_PLATFORMS packages/features/content-analytics/src/server/types.ts:14 (since KB-150 (#511) the one list with SYNCED_PLATFORMS, packages/features/content-analytics/src/lib/sync-status.ts:13), QueryFilters' parameter enum packages/clickhouse/src/queries.ts:290 (built from PLATFORM_ENUM_TYPE, no longer a literal). The three without it: video_dim.platform is a String, so dim-sync now decides (next criterion); channel_daily and channel_subscribers have no platform column and Facebook writes neither: channel_totals is not_ingested (packages/clickhouse/src/lib/data-provenance.ts:1012). #504"
  - text: "dim-sync no longer creates dimension rows for platforms that cannot have metrics"
