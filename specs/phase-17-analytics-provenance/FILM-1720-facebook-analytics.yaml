summary: >
  Split 2026-09-21 from a combined "Facebook and X Analytics" XL spec,
  because the two halves share almost nothing — different APIs, auth,
  blockers and cost models — and Facebook, the larger and more valuable
  half, should not wait on X's decisions (now FILM-1727). Facebook has a
  publishing provider but no analytics provider at all: no AnalyticsPlatform
  entry, no ClickHouse enum value, and read_insights is not requested. Worse,
  Facebook publishes already get dimension rows in an unconstrained
  video_dim.platform that can never have metrics, distorting denominators
  today — which is why this ships before X. The video_insights edge exposes
  57 video metrics, 11 Reels metrics and 4 ad-break metrics across four
  distinct, non-YouTube-like view denominators, including an organic/paid
  split no other platform offers and a revenue surface that reopens the
  Monetisation-stage question (FILM-1726).
