spec_id: "FILM-1723"
title: "API Version Consolidation"
phase: 17
phase_name: "Analytics Provenance and Signal"
category: feature
status: PARTIAL
effort: M
dependencies: []
summary: >
  Four different Meta Graph API versions were pinned across the codebase
  (v18.0, v19.0, v23.0), the oldest on the OAuth token-refresh critical path
  that also feeds analytics sync; X was still on the retired v1.1 media
  upload endpoint and legacy api.twitter.com hosts. This spec consolidates
  each vendor to one pinned, documented version behind a single constant,
  with a test that fails on any stray version literal. It settled first
  whether Graph v18.0 still responded (it did, silently served as v20.0),
  then pinned Meta to v23.0 and moved X to api.x.com and /2/media/upload.
  Coordinates with phase 18's FILM-1801, which makes the same vendor hosts
  overridable for the local sandbox — both edit the same constant files.
