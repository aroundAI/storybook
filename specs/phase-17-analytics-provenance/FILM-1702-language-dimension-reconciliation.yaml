summary: >
  publishes.language (the asset's language) and platform_connections.language (the channel's target
  language) are two different columns answering two different questions, both default to 'en', and
  the Language tab read only the connection column while every other tab read the publish column —
  so a routing mismatch between them was invisible and the English bucket silently doubled as
  'language never set'. This spec makes 'not set' representable (NULL in Postgres, '' in ClickHouse)
  with a recorded, non-heuristic rule for interpreting existing 'en' rows, adds channel_language to
  video_dim beside the existing publish language, moves the Language tab onto ClickHouse via
  querySegmentPerformance so it and Deep Dive can never disagree, and exposes the choice as an
  explicit on-screen toggle defaulting to content language.
