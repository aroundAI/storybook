summary: >
  The analytics page presents YouTube, TikTok and Instagram numbers as though they were one kind of
  thing, and the differences between what each platform natively reports, derives, has never been
  asked for, or cannot report at all are large enough to invert a conclusion. This spec is the
  single, pure, dependency-free definition of that truth — a four-level SupportLevel
  (native/derived/not_ingested/unsupported) deliberately without a fifth 'fabricated' level, crossed
  with orthogonal access/availability/window axes so that 'the platform can't' is never collapsed
  into 'we haven't'. It ships no UI; its value is being kept honest by three test layers — a
  structural check that every (family, platform) pair is populated, a writer-binding check that
  fails CI the moment ingest code and the matrix disagree about what is written, and a live cross-
  check against a real ClickHouse service.
