  actions: []
  ui:
    - {component: "AudienceGrid", file: "components/audience/audience-grid.tsx"}
    - {component: "DeviceTypeCard", file: "components/audience/device-type-card.tsx"}
    - {component: "InterestsCard (deleted)", file: "components/audience/interests-card.tsx"}
    - {component: "PeakActivityCard (deleted)", file: "components/audience/peak-activity-card.tsx"}
    - {component: "ViewsCard", file: "components/overview/views-card.tsx"}
