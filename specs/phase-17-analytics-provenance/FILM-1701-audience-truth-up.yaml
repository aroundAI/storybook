audience_dimensions:
  - {dimension: age_group, status: read, note: "Audience › Age Distribution"}
  - {dimension: gender, status: read, note: "Audience › Gender Split, Overview › Gender"}
  - {dimension: country, status: read, note: "Audience › Top Geographies, Overview › Top Regions"}
  - {dimension: device, status: read, note: "Audience › Device Type — plumbed by this spec"}
  - {dimension: follower_status, status: read, note: "Deep Dive › returning-viewer proxy (getReturningViewerProxyAction)"}
