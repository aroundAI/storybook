spec_id: "FILM-1701"
title: "Audience Truth-Up"
phase: 17
phase_name: "Analytics Provenance and Signal"
category: feature
status: DONE
audited: "2026-09-23"
effort: M
dependencies: []
summary: >
  Three cards on the Audience tab (Device Type, Interests, Peak Activity) rendered numbers that were
  never measured: the server type ProjectAudienceData had no deviceType, peakActivity or interests
  field, so their `||` fallback to hardcoded literals was the only code path ever executed. This
  spec plumbs the one card with real underlying data (Device Type, bound to the device dimension
  that was already ingested but never read), deletes the two cards with no underlying data at all
  (Interests, Peak Activity), and fixes a seed-script bug that wrote every publish's rows under
  platform: 'youtube' regardless of its true platform — a bug that would have made every later
  provenance-phase spec unverifiable, since they are all checked by looking at a page whose whole
  subject is which platform a number came from.
