summary: >
  Raw counts are not comparable between videos. A normalised measure — a rate
  against a denominator — is the layer everything above this depends on, and
  the codebase currently has engagement rate defined independently in four
  places with no shared helper, while share rate, save rate and subscriber
  conversion do not exist at all despite their inputs being persisted. This
  spec consolidates the definitions into one pure module and adds velocity
