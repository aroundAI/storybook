    met: true
    evidence: "Met (#667): runCommentSync (packages/features/content-analytics/src/server/comment-sync.ts), run by StorybookCommentSyncCron (sst.config.ts) through /api/cron/comment-sync; YouTubeCommentsReader (providers/youtube/youtube-comments.ts) reads commentThreads.list; audience_comments has no author column (migration 20261016093821). comment-sync.test.ts 'stores a video’s comments…'"
  - text: "A young video is read often and an old one rarely, and every comment is read again at least weekly"
    met: true
    evidence: "Met (#667): planCommentSync (lib/audience-comments/sync-schedule.ts): hourly for two days, six-hourly for a week, daily for a month, then weekly; a refresh every 7 days. audience-comment-reaction.test.ts 'when a video’s comments are read again'"
  - text: "No stored YouTube comment outlives 30 days without a refresh, and a channel's comments go with its vendor-data purge"
    met: true
    evidence: "Met (#667): deleteExpiredYouTubeComments runs first in every sync, whatever else fails (comment-sync.test.ts, guard AC1); a complete refresh deletes what the platform no longer returns, an incomplete one deletes nothing (AC2); purge_connection_vendor_rows deletes audience_comments and audience_comment_syncs (audience-comments.test.sql, vendor-data-purges.test.sql)"
  - text: "A label is a tone and topics from closed lists, never a composite score, written once per comment"
    met: true
    evidence: "Met (#667): CommentLabelSchema (lib/audience-comments/labels.ts) and the check constraints on comment_labels; nine topics and three tones, each with its meaning; audience-comments.test.sql rejects a topic or tone outside the lists"
  - text: "The server labels a project's unlabelled comments when the team lets the server generate, through the generation core"
    met: true
    evidence: "Met (#667): labelCommentsOnServer (server/comment-labelling.ts) opens a comment_labels run per project as the team's primary owner (scheduledProjectJobTarget) and dispatches it; the worker's handler (apps/web/lambda/llm-worker/handlers/comment-labels.ts) labels in batches of 50, at most four calls a run. A team with server generation off, no model or no spend left gets no run. comment-labels-handler.test.ts"
  - text: "Comment text reaches a model as data: defused, and only closed-list labels for ids the model was sent are written"
    met: true
    evidence: "Met (#667): sanitizeStrings over the batch (KB-101) and the prompt's role (prompts/analytics/comment-labels.json); comment-labels-handler.test.ts 'sends a comment’s text defused' and 'writes only labels from the closed lists' (guard AC6)"
  - text: "A desktop AI reads the comments and the labelling rules over MCP, writes labels back as its own, and reads each video's reaction"
    met: true
    evidence: "Met (#667): get_audience_comments, label_audience_comments (studio:write) and get_comment_reaction (packages/features/studio-mcp/src/server/tools/analytics/audience-comments.ts); a label written over MCP is source 'mcp' with the client's model and connection. E2E: apps/e2e/tests/analytics/audience-comments.spec.ts pulls 22 comments over the real endpoint, labels them, and reads 68 / 9 / 23 % back"
  - text: "An MCP connection reads and labels only its own team's comments"
    met: true
    evidence: "Met (#667): the read tools are in analytics-forbidden.test.ts (FORBIDDEN for team B's project, episode and publishes); label_audience_comments returns another team's ids in `refused` and writes nothing for them (audience-comment-tools.test.ts, guard AC7; the E2E sends one); comment_labels' composite key to its comment's account (guard DB2)"
  - text: "The page tells apart a platform that cannot be read, a video not read yet, one with no comments, too few labelled for shares, and shares"
    met: true
    evidence: "Met (#667): CommentReaction (lib/audience-comments/reaction.ts) has a case for each; shares need 20 labelled comments (MIN_LABELLED_FOR_SHARES, guard AC4); never-read is not no-comments (guard AC5). On the page: audience-comments.spec.ts 'a video nobody has read says so'"
  - text: "Each video's reaction is shown by the video's age, and videos can be compared on the project's page"
    met: true
    evidence: "Met (#667): AudienceCommentsSection (components/audience-comments/audience-comments-section.tsx) on the episode and project analytics pages: a tone bar and topics for all, a row per video with its first day, days 2–7, days 8–30 and after; the comments below, filtered by tone, topic or unlabelled. Screenshots on #667"
