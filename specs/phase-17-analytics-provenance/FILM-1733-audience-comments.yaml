summary: >
  The owner asked (2026-10-16) for the comments on their videos to be read
  and kept, so that how the audience reacts can be followed over time and
  compared between videos. Only comment counts were synced. Comment text on
  the team's own published videos is now read hourly into audience_comments,
  without commenter names or ids; each comment is labelled with a tone and
  the topics it is about, from closed lists, by the server's model or by the
  team's own AI through the MCP connector; and the episode and project
  analytics pages show each video's reaction, by the video's age, with the
  comments behind it. YouTube is live; Instagram and Facebook wait on Meta's
  App Review for their comment permissions; TikTok has no API for it.
acceptance_criteria:
