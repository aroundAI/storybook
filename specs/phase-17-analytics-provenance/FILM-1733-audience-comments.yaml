open_questions:
  - "Should the AI Insights panel read the comment labels too (lib/insights-inputs.ts)? Not done here: its prompt and cache key would change, which FILM-808 owns"
  - "Should channel experiments measure a reaction (share of a tone or a topic) beside their metrics? A measure added there changes what an experiment's baseline snapshots"
notes: |
  ## Decisions (owner, 2026-10-16)

  - Comment text is stored, not only labels: the comments behind a figure
    can be read, and relabelled when the rules improve. This differs on
    purpose from phase 21's rule (no comment text), which is about
    competitors' channels; these are the team's own.
  - YouTube's derived-metric rule (III.E.4.h): every figure carries "not
    from YouTube" and is the channel's team's only; the III.L request is
    filed in parallel.
  - YouTube first; Instagram and Facebook after Meta's review.

  ## Where the text lives and how long

  audience_comments (Postgres, RLS: the team reads, only the sync writes).
  YouTube: refreshed at least weekly; a comment not returned for 30 days
  is deleted by every sync run, so a revoked token, a deleted video or a
  disconnect cannot leave one behind; an in-app disconnect purges within 7
  days (KB-20). Instagram and Facebook comments are kept as their
  statistics are (KB-20 decisions). Replies are read on YouTube only.

  ## Who labels

  The server, through a comment_labels run per project, when the team lets
  the server generate; otherwise the team's AI over MCP. Either may
  relabel; the last write stands, and the label says who wrote it and with
  which model.
