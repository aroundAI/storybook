summary: >
  Rewritten 2026-09-14 after the first draft claimed most missing metrics were
  a field-list change; research against vendor documentation showed that is
  true for YouTube but false for TikTok and Instagram. Separates what the
  growth research asks for into data already fetched and discarded (or never
  requested despite having access) versus a second API integration mistaken
  for a URL parameter, because the two cost very different amounts and only
  one is cheap. The first draft's meta-error — citing the repo's own
  TypeScript types as evidence of a platform's capability — is the risk this
  spec exists to correct.
