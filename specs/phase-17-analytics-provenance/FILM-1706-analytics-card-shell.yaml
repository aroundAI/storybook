summary: >
  components/overview/analytics-card.tsx is the shared shell for roughly fourteen card files across
  Overview and Deep Dive, and it has three problems: it is written in raw Tailwind palette classes
  with hand-written dark variants while every card body inside it already uses semantic tokens; its
  default h-64 height is overridden by every Deep Dive caller; and it has nowhere to put depth
  beyond one text-xs footnote, which is why the traffic-share card already crams a three-line
  methodological caveat into small grey type and FILM-1705's coverage caveat would make it worse.
  This spec redesigns the shell around 'one claim per card, evidence one gesture away' — an eyebrow
  with the provenance chip, one figure and one plain-language sentence, the unchanged chart, and a
  keyboard-operable collapsible disclosure for breakdown, source and caveats — moves it onto design-
  system tokens, deletes the gradient variant, and makes metricFamily a required prop so a new card
  cannot compile without declaring what it shows.
