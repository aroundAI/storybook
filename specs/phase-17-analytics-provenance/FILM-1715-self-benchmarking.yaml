summary: >
  Platform view definitions differ enough that cross-platform percentages are
  not comparable, so the only defensible benchmark is the channel's own
  history at a comparable age. Most of the hard parts — maturity judgement,
  ingest-lag exclusion, exact quantiles via queryCohortMedians and
  queryVideoViewsAtAge, and suppression reasons — already exist and have
  never been wired together; this spec is the join. It returns a band (not a
  percentile, since only three quantiles exist), always alongside lift,
  cohort median and n, with checkpoints treated as a per-platform capability
  rather than a global constant, and with shrinkage so small cohorts cannot
  outrank large ones.
