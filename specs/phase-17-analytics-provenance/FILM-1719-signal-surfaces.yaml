notes: |
  ## Overview

  Everything below this spec produces facts. This one is where a creator
  meets them, and the design constraint is a tension worth naming:
  Apple-like simplicity without hiding the data.

  Those are only in tension if simplicity means less information. It does
  not — it means ranked information, with the lower ranks off the critical
  path. The current cards are simultaneously sparse (one number) and
  cluttered (a paragraph of grey caveats beneath it). Three depths fix
  both.

  ## Three depths, nothing hidden

  1 — Verdict. The five-stage strip and one sentence naming the diagnosis.
  This is the "what do I do next" answer and it is all most readings need.

  2 — Measure. Per stage: the primary signal, its value, its lift, the
  cohort median, `n`, the cohort it was compared against with any relaxed
  axes, and the supporting signals.

  3 — Raw. The underlying rows.

  FILM-1706's `collapsible` carries depths 2 and 3 — in place,
  keyboard-operable, and with content that stays in the DOM so browser
  find and copy-paste reach it. Tooltip content does not.

  ## The strip bands; the drill-down does not

  The five-stage strip is the only place a band appears alone. Everywhere
  below it, the actual numbers:

  ```
  4.2% shares/reach . 1.8x typical . typical = 2.3% . n = 83
  ```

  Banding everything is how a dashboard becomes visual noise, and "above"
  is not something a creator can act on. The band exists to make five
  stages scannable at once; the moment there is room for a number, show
  the number.

  ## Five emptinesses, and none of them look alike

  This is the spec where the phase's honesty work is either preserved or
  thrown away. A stage can be empty for five different reasons:

  | State | Renders as |
  |---|---|
  | `unbound` | stage named, muted rule, the platform's reason. No figure, no bar. |
  | `dark` | stage named, muted rule, what blocks it and its ticket. No figure, no bar. |
  | `not_judgable` | the measured value if it exists, plus "too new to compare" |
  | `insufficient_cohort` | the measured value if it exists, plus the peer count |
  | `below` | a band, a bar, a figure, a lift, an `n` |

  A zero-length bar is forbidden. It is indistinguishable from a bad
  score, and it is the single most likely way this design fails.

  `not_judgable` and `insufficient_cohort` still show the measured value
  where one exists — the number is real, only the comparison is missing.
  Saying so is more honest than hiding both.

  ## Evidence is rendered, not implied

  Where a creative insight appears, its `Evidence` appears with it — n,
  cohort n, the comparable definition, claim strength, and both comparable
  sets. The successful and unsuccessful comparables are links to those
  videos, not a count: "here are 12 that used this mechanism and 11
  comparable ones that did not" is what a creator learns from.

  `MetricProvenance` lives in depth 3, answering which provider field,
  through which ingestion path, at which checkpoint — continuous with the
  chip FILM-1705 already puts on every card.

  No recommendation renders without its evidence block. The type prevents
  constructing one (FILM-1717); this spec ensures the UI cannot drop it
  either.

  ## Claim strength is visible in the wording

  The three strengths from FILM-1717 must be distinguishable without
  reading carefully: `observed` — "Videos tagged identity had 1.7x typical
  transmission"; `controlled_association` — "Among comparable videos,
  identity is associated with 1.7x"; `causal` — "Changing the framing
  increased transmission" — and only ever beside the concluded Change log
  entry (FILM-1610) or concluded channel experiment (FILM-1724) that
  established it, saying which kind it is (owner, 2026-09-24).

  A UI that renders all three identically destroys the distinction the
  whole genome spec was built to preserve.

  ## Model after

  The north star, and the reason the rest exists:

  > This video succeeded primarily because of its hook structure and
  > identity framing. Among comparable videos that combination is
  > associated with 2.1x typical transmission and 1.6x follower
  > conversion. Here are the other 12 videos with the same pattern, the 11
  > comparable ones that underperformed, and five concepts that preserve
  > the mechanism.

  Every clause of that is a rendering of something a spec below already
  produces — stage bands, a diagnosis, a genome claim with its evidence
  and both comparable sets. The concept generation is FILM-1717 v2; this
  spec renders what exists and leaves the slot.

  ## Out of scope

  - Generating the concepts — FILM-1717 v2.
  - The card shell itself — FILM-1706.
  - The provenance chip and coverage strip — FILM-1705.
  - Any new query. If a number is not already produced by a spec below, it
    does not appear here.

  ## Verification

  ```bash
  pnpm --filter @kit/content-analytics test
  pnpm turbo typecheck --force && pnpm lint
  NEXT_PUBLIC_SITE_URL=https://example.com pnpm --filter web build
  ```

  Visual pass in Chrome, measured in the DOM rather than eyeballed, as the
  FILM-1605 pass was. The fixture must produce, on one screen: an unbound
  stage, a dark stage, a `not_judgable` stage, an `insufficient_cohort`
  stage and a genuinely `below` stage — and the assertion is that all five
  differ in the DOM, not merely that the page renders.

  Then: assert no element with a computed height of zero sits where a bar
  would be; assert every rendered recommendation has a sibling evidence
  block; assert `aria-expanded` flips on each disclosure.

  ## Risk

  This is where the phase's honesty is most likely to be lost. Every spec
  below carefully distinguishes states that a designer will be tempted to
  render as "grey and empty". The DOM assertions above are the guard, and
  they should be written before the components, not after.

  Density is the second risk. Five stages, each with a band, a lift, a
  median and an n, plus evidence blocks, can produce a page busier than
  the one it replaces — which would defeat the design half of this phase.
  The three-depth split is the mitigation, and depth 1 must stay genuinely
  scannable: one strip, one sentence.

  ## As built (2026-10-02, #550)

  The Video Log's Signals button opens the surface for one video, at a
  checkpoint the video is old enough for (7, 30 or 90 days). One action,
  `getSignalSurfaceAction`, composes existing reads and adds no query:
  FILM-1715's `queryVideoBenchmark` for the subject's metadata and whether
  the checkpoint can be judged, FILM-1714's `stageReadings`, FILM-1717's
  `querySegmentVideoMeasures` for each stage's figure on every video of the
  channel, `benchmarkVideoAgainstCohort` over those, FILM-1718's
  `diagnoseStages`, and FILM-1717's genome analysis per stage. Pure
  decisions live in `src/lib/signal-surface.ts`.

  Six stages, not five: FILM-1726 added Monetisation, and the strip reads
  `stageReadings`, so it renders six. "The five empty states" are the five
  kinds of cell; there is a sixth stage, not a sixth state.

  Limits, recorded rather than hidden:

  - Language is never held for stage peers. The segment measures carry no
    language, so every stage comparison is across all languages and says
    so (`relaxedAxes` always includes `language`). The 24-month window
    widens to 48 only when 24 holds too few peers, and says so.
  - Hook on a Short (first_3s_retention) and Monetisation have no
    per-video checkpoint reading, so they render dark with that reason.
    Instagram and Facebook stages are measurable but have no segment
    measure yet, so they render dark the same way. The cell says which gap
    it is; FILM-1718's coverage sentence calls both "not collected yet".
  - Building it found KB-173: `queryVideoBenchmark` failed whenever its
    scope named the account, which this surface is the first to do.

  Evidence: `__tests__/signal-surface.test.ts` (13),
  `__tests__/signal-surface-dom.test.tsx` (11, the spec's DOM assertions),
  and `apps/e2e/tests/analytics/signal-surface-evidence.spec.ts` against
  local ClickHouse with the spec's fixture on one screen
  (`CLICKHOUSE_EVIDENCE=1`).
