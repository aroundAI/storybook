summary: >
  Everything below this spec produces facts; this one is where a creator
  meets them, under the constraint that Apple-like simplicity must not mean
  hiding the data — it means ranked information, with lower ranks off the
  critical path. Three depths (verdict, measure, raw) built on FILM-1706's
  collapsible carry that ranking. The spec's central discipline is that five
  different kinds of stage emptiness (unbound, dark, not_judgable,
  insufficient_cohort, below) must never render alike, a zero-length bar is
  forbidden, and no recommendation or causal claim may render without its
  evidence — this is where the phase's honesty work is either preserved or
  thrown away, and it introduces no new query: if a number is not already
  produced by a spec below, it does not appear here.
