open_questions:
  - "Is Instagram's AI info label required, expected, or merely available for the Reels this product publishes — and does the answer differ between the owner's own account and other creators'?"
notes: |
  ## Where this came from

  FILM-1728 §4.4 read the Instagram Platform changelog
  (https://developers.facebook.com/docs/instagram-platform/changelog/) on
  2026-10-01. The 2026-06-22 entry: "AI Info Label — Set the new
  is_ai_generated parameter to true" when publishing media, to apply the AI
  disclosure label. It is a parameter on the container request, so it must be
  decided before the container is created; it cannot be added after publishing
  through this API.

  ## Why it is a question and not a change

  - The product no longer generates video itself (in-app video generation was
    retired 2026-09-23): video is made outside and uploaded. Much of it is
    likely AI-generated, since the studio writes VEO prompts, but the app does
    not know which uploads are. Sending true for everything would mislabel any
    video that is not; sending nothing may be what Meta's policy forbids.
  - The changelog says the parameter exists. It does not say when Meta
    expects it. That is in Meta's policy and help pages, which this spec has
    not read; the answer must cite them, with the date read.
  - The owner is the first and only user today, publishing for one company.
    The risk grows when other creators are onboarded: an enforcement action
    lands on their account, not ours.

  ## Where the code would change

  The container is created in one place since FILM-1728:
  InstagramProvider.createMediaContainer
  (packages/features/publishing/src/providers/instagram/instagram-provider.ts),
  which the publish lambda now calls. On main before FILM-1728 there is a
  second copy in apps/web/lambda/publish-worker/handlers/instagram.ts; FILM-1728
  removes it. A declaration needs somewhere to live (publish metadata, or a
  project default) and a control in the publish flow, which makes this a UI
  change with a Playwright spec and screenshots if the answer is "required".

  ## Other platforms, not researched

  The same disclosure question probably exists elsewhere: YouTube and TikTok
  both have disclosure settings for AI-generated or altered content. Neither
  has been read for this spec. Each needs its own first-party source before
  anything is claimed about it.
