spec_id: "FILM-1731"
title: "Instagram AI Info Label — Do Our Reels Need is_ai_generated?"
phase: 17
phase_name: "Analytics Provenance and Signal"
category: feature
status: DRAFT
effort: S
dependencies:
  - spec_id: "FILM-1728"
    note: "found it in the Instagram Platform changelog, read 2026-10-01"
summary: >
  Since 2026-06-22 Instagram's content publishing API takes an
  is_ai_generated parameter on POST /{ig-user-id}/media, which applies
  Instagram's "AI info" label to the container. Our Reels are published
  without it. Whether the label is required, expected or only available for
  what this product publishes is a product and policy question, not a code
  one, and it has no owner. An unlabelled AI video is a plausible reason for
  a future enforcement action against a creator's account. This spec holds
  the question until it is answered, and the small change that follows the
  answer. It must be answered before the product is opened to creators other
  than the owner.
