summary: >
  The Platforms filter at the top of the analytics page reaches two of six tabs — Content server-
  side, parts of Overview client-side — and leaves the seven most-read MetricCards, the Audience
  tab, Deep Dive and the Language tab completely unfiltered, so deselecting TikTok changes the
  Content grid while the headline Views figure sits untouched. This is the loudest remaining lie
  once the rest of the phase has made the page honest, which is why it is scheduled last: it needs
  FILM-1704's coverage states so a card can dim rather than blank when a selection leaves it nothing
  to show, and FILM-1707's Deep Dive scope decision so the filter does not make an already-dangerous
  pooling bug harder to see. The work is mechanical once those land — ScopeSchema and DimScope
  already carry a platform field that Deep Dive simply never populates — filtering server-side in
  the query wherever possible, and the decisive test is arithmetic: the all-platforms Views total
  must equal the sum of the three single-platform totals.
