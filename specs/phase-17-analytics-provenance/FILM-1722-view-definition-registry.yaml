summary: >
  Every platform in this product has a column called `views`, and they count
  different events — at least one of them changed its meaning three weeks
  before this spec was written. This spec builds a pure, testable registry
  (packages/clickhouse/src/lib/view-definitions.ts, exported from @kit/clickhouse)
  recording what `views` meant on a given platform on a given date, so that no
  comparison spanning a definition change is computed silently. The registry
  itself shipped; adoption by the surfaces that compute comparisons has not —
  see remaining.
