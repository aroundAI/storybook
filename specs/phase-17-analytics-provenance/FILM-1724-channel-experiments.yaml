summary: >
  A creator makes videos in several styles and wants to know which work —
  five thumbnail styles of which three pull their weight, or mouth-open vs
  mouth-closed thumbnails compared afterwards. Nothing in the product does
  this today: the Change log (FILM-1610) compares the same video before and
  after a change and cannot measure anything baked into a new upload;
  self-benchmarking (FILM-1715) compares a video with the channel's own
  history but doesn't compare styles against each other. A channel
  experiment compares groups of different videos, one group per style, each
  measured at the same age as the others, with no verdict until every style
  has enough measured videos.
