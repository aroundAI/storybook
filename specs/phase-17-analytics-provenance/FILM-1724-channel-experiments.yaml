notes: |
  ## 1. Overview

  A creator makes videos in several styles and wants to know which work:
  five thumbnail styles, of which three turn out to pull their weight. Or two
  kinds of thumbnail, mouth open against mouth closed, with each new upload in
  one or the other and the two groups compared afterwards.

  Nothing in the product does this today.

  - The Change log (FILM-1610) compares the same videos before and after
    a start date. It fits changes that can be made to a published video, such
    as a thumbnail or title, and cannot measure anything baked into the video.
    A new upload has no "before" of its own.
  - Hook Lab (FILM-1510) mapped one published video to each hook variant.
    Reviewed 2026-09-20: it could not be used (no way to create a test), read
    retention at the wrong place in the video, and could read another
    account's data (FILM-CC-04 KB-9, KB-10). It was removed, code and tables.
    Hook tests are designed here (§6), from scratch.
  - Self-benchmarking (FILM-1715) compares a video with the channel's own
    history at a comparable age. That is exactly the comparison a style needs,
    but it answers "how did this video do?", not "which of my styles does
    better?".

  A channel experiment compares groups of different videos: one group per
  style, each video measured at the same age as the others.

  ## 2. What the user does

  1. Creates an experiment on one channel and one format family (FILM-1716:
     shorts and long-form are different products, and are never pooled),
     naming 2–8 styles.
  2. As each new video goes out, assigns it to a style. The page suggests the
     style with the fewest videos so far, so the groups stay balanced. The user
     can override the suggestion, and the override is recorded.
  3. Watches each style's results fill in as videos reach each age, then ends
     the experiment and records what they concluded, as the Change log does.

  Only videos published on or after the experiment's start can be
  assigned. Assigning older videos after seeing how they did would let the
  result be chosen rather than observed.

  ## 3. Schema (hand-written migration; mirrored in schemas/)

  - channel_experiments:
    - account, connection_id (required; a channel-level question), format
      family, title, hypothesis, expected outcome;
    - status, with the same lifecycle trigger pattern as FILM-1610 round 4:
      planned → running → concluded or abandoned;
    - started_at / ended_at, calendar days in the user's zone as in
      FILM-1610 E1, and the chosen metrics.
  - channel_experiment_styles: experiment, name, description, sort order.
    At least 2 and at most 8, enforced by the table.
  - channel_experiment_videos: style, publish, assigned_by and
    assigned_at (set by trigger, as FILM-1610 R4), and whether the suggested
    style was overridden.
    - Unique (experiment, publish): a video belongs to one style per
      experiment.
    - The publish must be on the experiment's channel and account (the
      composite key pattern from FILM-1608), and published on or after
      started_at.
  - Freezing: the hypothesis and expected outcome are fixed once running,
    as FILM-1610 round 5 H3. Styles can't be removed once a video is assigned
    to them.
  - RLS: account membership reads; project-member writes. pgTAP proves
    both, including a user who belongs to two accounts.

  ## 4. Measures: the same age, never the same calendar window

  Every measure is taken at a video age, so a style whose videos went out
  in a busy month is not flattered by the calendar:

  | Measure | Source | At |
  |---|---|---|
  | Views at N days | queryVideoViewsAtAge (FILM-1603/1715) | 7 and 30 days, mature videos only |
  | CTR over the first N days | video_reach_daily, impression-weighted as FILM-1610 §5 | 7 days |
  | Average percentage viewed, first N days | video_daily_stats, view-weighted | 7 days |
  | Subscribers per 1,000 views, first N days | FILM-1610 queryNetSubscribersForVideos | 30 days |

  - Checkpoints come from FILM-1715 §5, not constants.
  - A video younger than a checkpoint is pending, not zero. Each style
    shows "n measured, m pending".
  - The folds are pure functions, as in FILM-1610's watched-metrics.ts.

  ## 5. Comparing styles, honestly

  - Per style: the median at each checkpoint, the p25–p75 range, and n.
    Reuse FILM-1715's band and confidence approach (§8 there), and don't invent
    a new statistic.
  - No verdict until every style has enough measured videos at that
    checkpoint. The threshold is decided in review; 5 is the starting proposal.
    Until then the page says how many more each style needs.
  - After that, a style is "ahead" only where its range doesn't overlap
    the others'. Overlapping ranges are shown as "no clear difference yet". The
    page never picks a winner from medians alone.
  - What the page states plainly: these are associations between styles
    and outcomes on this channel, not proof of cause. Topic, timing and
    seasonality are not controlled. Balanced assignment (§2) reduces that, and
    the page says what it can't rule out.

  ## 6. Relation to other specs

  - FILM-1610 Change log: stays the tool for thumbnail and title swaps on
    published videos. Its per-video queries, folds, lifecycle trigger and
    refusal handling (withRefusals) are reused, not copied.
    **The Change log's baseline and delete rules do not carry over by
    default.** The owner decided two of them on 2026-09-24 (KB-7, KB-8) for
    before/after windows only: a baseline is measured again at conclusion and
    both are shown with no headline comparison, and an entry is deleted only
    while planned or abandoned. A channel experiment measures each video at
    the same age rather than over a window before a start date, so the
    re-measure question may not arise in the same form; whether a style
    experiment can be deleted once videos are assigned is its own decision.
    Decide both here when this spec is designed — reuse the lifecycle trigger,
    not these two answers.
  - FILM-1717, FILM-1718, FILM-1719: a causal claim may be backed by a
    concluded Change log entry or a concluded channel experiment, and names
    which kind (owner, 2026-09-24).
  - FILM-1717 Content genome: concluded channel experiments are the
    strongest evidence it can use, because the styles were varied on purpose.
    How it consumes them is decided there.
  - Hook tests (replacing FILM-1510's Hook Lab): an experiment whose
    styles are hooks, measured on early retention. Two limits the review
    measured decide where that is allowed:
    - Facebook has a retention graph too (post_video_retention_graph), so "only
      YouTube has a curve" stops being true the moment FILM-1720's Facebook leg
      lands. Its segment count is undocumented — the 40-interval figure belongs
      to total_video_retention_graph, a different metric — so its resolution, and
      therefore whether an early-retention measure is even expressible on it, is an
      open question. Do not assume it matches YouTube's.
    - YouTube's retention curve is 1% steps of the video's length, so a
      10-minute video's first point is at 6 seconds and "retention at 3s"
      does not exist for it. Early-retention measures are offered only for
      short-form videos (FILM-1716), where the curve resolves them: about
      150 seconds or less for a 3-second point.
    - The length must be the published video's. video_dim.duration_seconds
      is the episode's until FILM-1710, and Hook Lab also used the hook's
      own length in its place (KB-10 H-2).

  ## 7. Out of scope

  - YouTube's own "Test & Compare" (A/B thumbnails on one video). Its results
    are shown in YouTube Studio; whether any API exposes them is to be checked
    in FILM-1721 before anyone builds on it.
  - Automatic assignment at upload time. Assignment is by hand, with a
    suggestion.
  - Cross-channel experiments. Styles are compared within one channel and one
    format family.

  ## 9. Before building

  1. Review Hook Lab (FILM-1510). Done 2026-09-20 (FILM-CC-04 KB-9,
     KB-10), and Hook Lab removed. Hook tests are designed here (§6); its
     missing same-account check is a requirement here (§3).
  2. Settle the verdict threshold and the band method with FILM-1715,
     which owns them.

  ## 10. Verification

  The FILM-1610 process applies:
  - red before green for every guard, and a mutation-guard entry per rule;
  - pgTAP for every table rule;
  - an E2E happy flow on a production build (Test) with an evidence spec;
  - screenshots in the PR.

  ## 11. Decisions made in design (t1724's choices, lead-approved 2026-10-01)

  1. Verdict threshold and band: FILM-1715's MIN_MATURE_VIDEOS (5,
     FILM-1606's directional floor), imported as EXPERIMENT_VERDICT_MIN;
     the band is FILM-1715's interquartile band, inclusive at both ends, so
     touching ranges overlap. Styles are compared pair by pair; nothing is
     ranked by median, and confidence tiers come from resolveConfidence.
  2. Checkpoints: the §4 ages (views 7 and 30; CTR and average percentage
     viewed 7; subscribers per 1,000 views 30), each passed through
     FILM-1715's per-platform capability (judgeSubjectCheckpoint), so a
     platform window or late ingest is a named reason per video.
  3. Delete: only while planned or abandoned — the same answer KB-7 gave
     the Change log, for its own reason here: a planned experiment cannot
     have videos yet, and a concluded one is the evidence FILM-1717 cites.
  4. Re-measure (the KB-8 question): there is no baseline window, because
     every video is measured at its own age. Results are read live while
     running; concluding freezes them once, in result_snapshot, and a
     concluded experiment shows — and FILM-1717 reads — that snapshot.
  5. A video can be removed or moved only while running and before its
     first checkpoint (7 days), so a result cannot be chosen after it is
     seen.
  6. The suggested style is one SQL function the assignment trigger stores
     and the page reads (lead: no TypeScript copy), so criterion 6's unit
     layer is pgTAP.
  7. Calendar: the experiment stores its creator's IANA zone; "published on
     or after the start" compares the publish's local date there.
  8. Hook tests: retention at 3 seconds, from the latest curve (labelled
     as such: it is not an age-fixed figure), offered only for
     short_vertical, YouTube only, with a known asset duration of 150 s or
     less. Facebook's curve resolution is still open (§6), so it is not
     offered there.
  9. Writes: the experiment and its styles need account access; an
     assignment also needs a writing role (owner, admin, member) on the
     video's project.

  ## Built (2026-10-01, #512)

  - Tables, triggers, RLS and create_channel_experiment:
    apps/web/supabase/migrations/20261001114902_channel-experiments.sql,
    pgTAP channel-experiments.test.sql (55 cases). The Change log's guard
    now calls the shared experiment_status_move_allowed.
  - Comparison, pure, in @kit/clickhouse (lib/channel-experiments.ts):
    compareStyles, summariseStyle, verdictFor, relationBetween,
    quantileInclusive (ClickHouse's quantileExactInclusive), and for
    FILM-1717/1718/1719 the causal form: **ConcludedChannelExperiment**
    (kind 'concluded_channel_experiment'), built only by
    toConcludedChannelExperiment from a concluded row with its frozen
    result, and experimentFindings, which yields only non-overlapping
    pairs with basis 'concluded_channel_experiment'. evidenceKindOf says
    'association' for anything not concluded.
  - Each video's figures: @kit/content-analytics
    lib/channel-experiment-measures.ts, reusing judgeSubjectCheckpoint and
    FILM-1610's folds; the views series is chosen once per experiment
    through viewsDenominatorFor (FILM-1722).
  - The read: queryChannelExperimentVideoDays (ClickHouse), verified on
    24.8 against a hand-computed fixture in verify-queries.ts and red with
    its first-days filter removed.
  - The page: /home/[account]/studio/analytics/channel-experiments, in the
    team sidebar as Channel Experiments.
feature:
  database:
    tables:
      - "channel_experiments"
      - "channel_experiment_styles"
      - "channel_experiment_videos"
    columns_added: []
  queries:
    - name: "queryChannelExperimentVideoDays"
      purpose: "each assigned video's own first N days of metrics and reach, with its channel's ingest start (channelIngestSql); scoped by account and channel"
      file: "packages/clickhouse/src/queries-advanced.ts:2826"
    - name: "queryVideoViewsAtAge"
      purpose: "not called: its one ingest lag per video is the video's, not the channel's, and FILM-1715 moved to the channel's; views at age are summed from queryChannelExperimentVideoDays instead, judged by judgeSubjectCheckpoint"
      file: "packages/clickhouse/src/queries-advanced.ts:2273"
    - name: "queryNetSubscribersForVideos"
      purpose: "not called: it takes one calendar window for every video, and a channel experiment needs each video's own first 30 days; its fold, foldNetSubscribers, is reused"
      file: "packages/clickhouse/src/queries-detail.ts:689"
  actions:
    - name: "createChannelExperimentAction, startChannelExperimentAction, addExperimentStyleAction, removeExperimentStyleAction, assignExperimentVideoAction, unassignExperimentVideoAction, concludeChannelExperimentAction, abandonChannelExperimentAction, deleteChannelExperimentAction, getChannelExperimentAction, listChannelExperimentsAction, listAssignableVideosAction"
      file: "packages/features/content-analytics/src/server/channel-experiment-actions.ts"
  ui:
    - component: "ChannelExperimentsClient, CreateChannelExperimentForm, ChannelExperimentDetail, ChannelExperimentResultsView"
      file: "apps/web/app/home/[account]/studio/analytics/channel-experiments/page.tsx"
  provider_integration: null
