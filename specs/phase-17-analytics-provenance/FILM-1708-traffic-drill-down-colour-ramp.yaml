summary: >
  Two things the 'Where views came from' card cannot currently do, both already paid for by data
  that exists. It cannot show what a group is made of — Browse + Suggested = 52% is the tab's
  headline number and nothing says it means RELATED_VIDEO + SUBSCRIBER + NOTIFICATION — even though
  queryTrafficSourceRows already returns per-source rows and sourcesInGroup already inverts the
  taxonomy; this spec is its first production consumer. And it cannot reliably show its eight
  traffic groups apart: --chart-1 through --chart-5 are defined twice with conflicting values in
  shadcn-ui.css, the surviving three groups are distinguished only by alpha on the same colour, and
  native title= tooltips are unstyled and keyboard-unreachable. This spec de-duplicates the ramp
  onto the coherent oklch definition, extends it to eight hues assigned by semantics rather than
  index, and moves tooltips onto the existing ChartTooltip primitive while preserving FILM-1605's
  rule that a floored 2px slice must still report its true, unrounded share on hover.
