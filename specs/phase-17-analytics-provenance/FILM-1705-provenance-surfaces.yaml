summary: >
  The visible payload of the phase: today provenance appears in exactly seven places, all hardcoded
  prose derived from nothing, while Deep Dive's pooled cards and every Audience card say nothing at
  all. This spec adds three surfaces built entirely from FILM-1703's matrix and FILM-1704's observed
  coverage — a per-card chip answering 'what does this number cover', a page-level strip answering
  'why is my TikTok missing', and a platform filter that dims rather than removes a platform it
  cannot cover — plus settles that a connected platform outside the three-value AnalyticsPlatform
  enum (Facebook) is shown as unsupported rather than silently dropped. The rule enforced
  throughout: no card hand-writes a platform name; every word of provenance copy comes from
  capabilityFor().note.
