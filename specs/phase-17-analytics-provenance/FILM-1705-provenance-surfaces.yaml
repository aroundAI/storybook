notes: |
  ## 1. Overview

  This is the visible payload of the phase: the point at which a reader can tell,
  without asking anyone, which platforms a number covers.

  Today provenance appears in exactly seven places across the whole feature, all
  of them hardcoded prose, none of them derived from anything:

  - `metric-cards.tsx:117` and `overview/revenue-card.tsx:42` — "(YouTube only)"
  - `overview/views-card.tsx:38-39` — "Aggregated across TikTok, YouTube, and
    Instagram", which is a static claim that stays put when you deselect two
    platforms in the filter, and which FILM-1701 removes
  - `deep-dive/traffic-share-card.tsx:99,341` — "new data arrives with the
    YouTube bulk report ingest", inside an empty state
  - `deep-dive/traffic-share-card.tsx:456-458` — "Shares cover videos published
    through this platform… will not match YouTube Studio exactly"

  Deep Dive's median, back-catalog and cohort cards say nothing at all, despite
  pooling all three platforms. Every Audience card says nothing. The seven
  MetricCards say nothing except Revenue.

  ## 2. Three surfaces, each answering a different question

  **The chip — "what does *this number* cover?"** On the card, next to the title.
  A `Badge variant="outline"` from `@kit/ui/badge` with a small dot: *YouTube
  only* / *2 of 3 platforms* / *Derived*. Colour encodes **level, not platform** —
  brand colours inside a data card compete with the chart for meaning, and a red
  dot for YouTube next to a red chart series is actively misleading. Neutral for
  `native`, `warning` for `derived`, `info` for partial coverage.

  **The strip — "why is my TikTok missing?"** One line under the page header,
  stating which platforms are connected, which have data in this window, and
  which cannot have it. This is the question that otherwise becomes a support
  ticket, and it is worth answering once at the top rather than fifteen times.

  **The filter — "can I even ask that?"** `components/platform-filter.tsx`
  already accepts an `available` prop and **no call site ever passes it**, so it
  always offers all three. Wire it — but to a third state, not to removal.

  ## 3. Dim, never remove

  When a platform cannot be covered by the cards on the current tab, the filter
  shows it dimmed with a reason, and it stays selectable.

  Removing it is worse than useless: a user who cannot find TikTok in the filter
  concludes the product does not support TikTok, which is both wrong and
  unrecoverable — there is no affordance left to explain it. A dimmed row with
  "not reported for the cards on this tab" teaches; an absent row misinforms.

  The same rule applies to cards: a card that cannot cover a selected platform
  says so and keeps rendering what it does cover. It does not blank.

  ## 4. The capability/observed split in the copy

  FILM-1704 produces four states and each needs distinct wording. The failure to
  avoid is a single "No data" that covers all of them.

  | State | Chip | Card body |
  |---|---|---|
  | `covered` | "YouTube only" / "2 of 3 platforms" | the number |
  | `no_data_in_window` | as above, muted | names the window and the connected channel that has no rows |
  | `not_connected` | "Not connected" | invites connecting, does not imply breakage |
  | `not_ingested` | "Not yet supported" | states what blocks it, from `blockedBy` |
  | `unsupported` | "Not reported" | states that the platform does not report it |

  All copy comes from `capabilityFor().note` — written once in the matrix, never
  retyped at a call site. A card that hardcodes a platform name in a string is a
  review failure; §7 makes that checkable.

  ## 5. Where the chip comes from

  FILM-1706 adds `metricFamily: MetricFamily` as a **required** prop on
  `AnalyticsCard`. Required-ness is the enforcement mechanism: a new card cannot
  compile without declaring what it shows, and the shell renders the chip and the
  coverage caveat itself, so card bodies stop hand-writing provenance prose.

  `AnalyticsCard` is used by roughly fourteen card files across Overview and Deep
  Dive, so the shell is the leverage point — one change, fourteen cards. The
  Language tab's cards use a different shell and are brought across in FILM-1707.

  The seven `MetricCards` at the top of the page are not `AnalyticsCard`s and
  need the chip adding to their own shell (`components/metric-cards.tsx`). They
  are the most-read numbers on the page and currently the least qualified: two of
  the seven (`watchTimeSeconds`, `subscribersGained`) are hardcoded to `0` at
  `components/analytics-dashboard.tsx:274-275` with the comment "Not available at
  project level", which is a coverage statement rendered as a measurement.

  ## 6. The Facebook question, settled here

  `platform_connections` and `publishes` both `CHECK` six platforms — youtube,
  tiktok, instagram, facebook, twitter, linkedin. `AnalyticsPlatform` and the
  ClickHouse `Enum` allow three. `components/platform-filter.tsx` offers three.
  `lib/schemas/report.schema.ts:26` offers **facebook** for export.

  So a user can connect a Facebook channel, select it for an export, and have the
  ClickHouse write rejected by the enum. Worse, `dim-sync.ts` has no platform
  filter and `video_dim.platform` is an unconstrained `LowCardinality(String)`, so
  Facebook publishes *do* get dimension rows that can never have metrics — they
  appear as zero-view videos in any dim-driven denominator.

  **Decision for this spec: a connected platform outside `AnalyticsPlatform` is
  shown in the strip as unsupported, with its connection named.** Hiding it is
  what produced the confusion; the strip exists precisely to stop a user
  wondering. Whether Facebook should also come out of the export schema is a
  product call recorded in the phase README, not settled here.

  ## 8. Verification

  ```bash
  pnpm --filter @kit/content-analytics test
  pnpm turbo typecheck --force && pnpm lint
  NEXT_PUBLIC_SITE_URL=https://example.com pnpm --filter web build
  ```

  Visual pass in Chrome across **all six tabs**, measured in the DOM rather than
  eyeballed, as the FILM-1605 pass was — assert the rendered chip text against
  `capabilityFor()` for each card, so a mismatch fails rather than being noticed.

  The fixture from FILM-1701 must exercise, on one page: a covered platform, a
  connected platform with no rows in window, an unconnected platform, a
  not-ingested family, and an unsupported family.

  ## 9. Risk

  The chip is a claim, and a wrong chip is worse than none — it converts a
  missing explanation into a false one. That is why this spec sits behind
  FILM-1701 (no fabricated numbers to label), FILM-1703 (one definition, tested
  against the writers) and FILM-1704 (real coverage rather than a guess).

  The second risk is visual noise: fifteen cards each gaining a badge, a caveat
  line and possibly a dimmed state can make the page busier than the one it
  replaces, which would defeat the design half of this phase. FILM-1706's
  disclosure pattern is the mitigation — the chip stays on the front, the
  explanation moves behind it — and the two specs should be reviewed together
  even though they land separately.
