  - "Should the owner be able to delete a day's report from the page? Not built: no one on the team may delete one, so two jobs can never leave two versions of a day; a removal is a service-role repair"
notes: |
  ## Why the first save wins

  A routine may run one job per project or one job for several, and two
  jobs may overlap. The digest is the same for the same facts, but two
  models (or one model twice) do not write the same text. So the text is
  fixed by whichever job saves first: save_project_report inserts only
  when the project's day has no report, and answers otherwise with the
  saved one, which the job then shows instead of its own.

  ## What the digest is not

  No composite score and no causal claim: it compares a day with the
  previous 7 and 28 days and a video with itself at fixed ages, and says so
  in its notes. A null is "not measured", with the reason, never 0.
