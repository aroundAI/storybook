summary: >
  The owner wants one report every morning from a Claude Desktop routine,
  carrying everything they would otherwise open YouTube Studio, Instagram or
  Facebook for, with a comment analysis, saved to StoryBook as well as told
  to them (2026-10-18). A job may cover one project or several, and each
  project's text must be the same however the jobs are grouped. StoryBook
  now computes each project's day as a deterministic digest
  (get_daily_digest, with a digestHash); the first job that day writes the
  analysis and saves it (save_project_report, kept once per project and
  day); every later job reads the saved one (get_project_report). The
  project's Analytics page shows the saved reports under Daily reports.
