notes: |
  ## Overview

  Everything below this spec answers what happened to this video. This one
  answers what should I make next, and it is the difference between an
  analytics dashboard and a creative intelligence system.

  It turns "Transmission: above" into "Identity framing is associated with
  2.1x typical transmission, on 8 comparable videos."

  ## Two milestones, not one pull request

  This is XL and contains enough to become an unreviewable single change.
  Split it:

  Genome v1 — observable attributes on the existing tag infrastructure,
  winner/loser comparison, evidence levels, adjusted lift. Useful alone:
  it makes FILM-1718's diagnosis explainable.

  Genome v2 — semantic attributes, creative templates, hypothesis
  generation, experiment linkage, causal evidence. This is what makes it
  generative.

  v1 must ship and be useful before v2 starts.

  ## Three things that share storage and must not share meaning

  | Concept | Question | Example |
  |---|---|---|
  | Taxonomy | What is this video? | `topic = AI`, `format = tutorial` |
  | Genome | What creative mechanisms does it contain? | `identity = high`, `result_first = true` |
  | Performance | What happened? | `attention = 1.4x`, `transmission = 2.1x` |

  Physically all of these flow through `publish_tags` -> `video_dim.tags`,
  which is `Array(String)` and already serialises any dimension — so
  ClickHouse needs no change at all. Semantically they stay distinct
  types, or the genome degenerates into an undifferentiated tag bag and
  nothing can be reasoned about.

  ## Two attribute layers

  Layer A — observable. Extractable or recorded at publish: duration,
  hook type, opening visual, first sentence, face present, text present,
  cuts per minute, scene changes, question in first 3s, result-first.

  Layer B — semantic. What the creative is doing: curiosity, novelty,
  utility, relatability, identity, surprise, aspiration, controversy,
  humour, authority. Harder to capture, more useful.

  Both are additional `dimension` values on the existing CHECK in
  `68-content-taxonomy.sql` (today `topic`, `format`, `thumbnail_style`,
  `hook_type`). Layer A is v1; Layer B is v2.

  ## Not a second statistics engine

  The correlation is FILM-1606's `querySegmentPerformance({ kind: 'tag'
  })`, unchanged — a genome attribute is a tag, and its association with
  an outcome is its segment median at a checkpoint with its confidence
  tier and `spread`. The one worthwhile addition is a stage-aware measure,
  so `hook_type:cold_open` scores against the Hook stage rather than
  against views. That is one `GROUP BY` expression and a different
  measure, not a new path.

  Building a parallel statistics layer here would duplicate FILM-1606's
  checkpoint handling, maturity gating and confidence tiers — and the two
  would disagree on screen within a release.

  ## Discriminating attributes, not merely correlated ones

  The naive question is what do winners have?. The useful question is
  what do winners have that comparable losers don't?

  ```
  identity framing:   winners 4.2%   comparable losers 1.3%   <- discriminates
  face present:       winners 71%    comparable losers 68%    <- tells you nothing
  ```

  The second is common among winners and worthless as guidance. So every
  claim carries both sets: successful comparables — videos with this
  mechanism, above the median; unsuccessful comparables — videos with this
  mechanism, below it.

  This is also far more useful to a creator than a statistic. "Here are 12
  videos that used this mechanism successfully and 11 comparable ones that
  did not" teaches faster than "1.9x association", and it is what lets the
  system say the difference is not the format, it is the hook.

  ## Confounding, and three claim strengths

  "Face present performs 20% better" may mean faces work — or that face
  videos are shorter, or on different topics, or by a different creator.
  The topic may be the real variable.

  | Strength | Wording | Source |
  |---|---|---|
  | `observed` | "Videos tagged identity had 1.7x typical transmission" | a cross-tab |
  | `controlled_association` | "Among comparable videos, identity is associated with 1.7x" | same platform, format family, duration band, topic, creator; one attribute varying |
  | `causal` | "Changing the framing increased transmission" | only from a concluded Change log entry (FILM-1610) or a concluded channel experiment (FILM-1724), named by kind |

  The third is the one people will trust for creative decisions, so it is
  gated on a concluded Change log entry (FILM-1610) or a concluded channel experiment (FILM-1724), and reachable by no other path. The claim names
  which kind backs it, because they answer different questions: a Change log
  entry compares the same published videos before and after a change (a
  title, a thumbnail); a channel experiment compares styles across new
  uploads. Decided by the owner, 2026-09-24.

  ## Evidence, and why "come back in seven months" is unacceptable

  Reusing FILM-1606's tiers, surfaced as evidence rather than as a gate:

  | Level | Wording |
  |---|---|
  | Observation | "Early signal — 7 videos" |
  | Directional | "Directional — 19 videos" |
  | Established | "Established pattern — 53 videos" |

  At weekly publishing a binary attribute needs roughly seven months to
  reach the top tier; at biweekly, fifteen. The genome is a back-catalog
  feature and that must be said plainly — but the product still has to
  extract value below the top tier. An early signal labelled as one is
  useful; silence is not.

  Shrinkage. Two videos at +180% must not outrank a hundred at +35%. The
  smaller the cohort, the more the observed lift shrinks toward 1x. Both
  lifts survive — the UI says "early signal . 1.35x adjusted", the raw
  layer still knows it saw 2.8x on n=2.

  Every claim carries the `Evidence` object defined in the phase plan:
  level, n, cohort n, comparable definition, claim strength, observed and
  adjusted lift, shrinkage factor, both comparable sets, source rows, and
  a `MetricProvenance` naming the provider field and ingestion path that
  produced the measure.

  A recommendation without an `Evidence` must not construct. Enforced by
  the type, not by review.

  ## Templates and the closed loop (v2)

  A winning pattern generalises into a template — hook mechanism, body,
  payoff, emotional mechanism, typical duration, strongest stages —
  instantiable into new concepts that preserve the mechanism while
  changing the subject. That is the difference between finding similar
  videos and understanding the creative grammar.

  ```
  genome hypothesis -> experiment -> variant -> outcome
      -> causal evidence -> genome confidence update
  ```

  `analytics_experiments` already exists and already refuses to claim
  significance (FILM-1610). The one addition that closes the loop: an
  experiment must reference the genome hypothesis that generated it.
  Without that link the genome can only ever accumulate correlations,
  however well controlled.

  ## Two vocabularies to reconcile while here

  `hook_variants.hook_type` (`71-hook-testing.sql`) is free `text` with no
  foreign key, while the taxonomy has a `hook_type` dimension with a
  controlled vocabulary. They are already two vocabularies for one concept
  — validate the Lab's against `content_tags`, or the genome reports on
  `cold_open` while the Hook Lab reports on `Cold Open`.

  Adding the five `FunnelStage` values to FILM-1610's closed
  `metric_watched` vocabulary lets an experiment record which stage it was
  about — the cleanest available join between the two specs, and it
  avoids a parallel enum.

  ## Out of scope

  - A new statistics path, a new table, or a ClickHouse change.
  - Significance testing. FILM-1610 forbids it and this spec does not
    revisit it.
  - Automated semantic extraction in v1 — Layer B is v2.
  - Rendering — FILM-1719.

  ## Verification

  ```bash
  pnpm --filter @kit/clickhouse test
  pnpm --filter @kit/content-analytics test
  ./scripts/local-env.sh verify
  pnpm turbo typecheck --force && pnpm lint
  ```

  The statistics are pure and belong in unit tests. The decisive ones: the
  failing control — an attribute present in 71% of winners and 68% of
  comparable losers must produce no finding; n=2 at +180% must rank below
  n=100 at +35%; a `causal` claim constructed without a reference to a
  concluded Change log entry or channel experiment, typed by which kind it
  is, must not compile; a recommendation constructed without an
  `Evidence` must not compile; confounded input — two attributes that
  always co-occur must not both be reported as independent findings.

  ## Risk

  This spec can quietly become a bullshit generator. It produces sentences
  that sound authoritative about creative decisions, from small samples,
  on observational data. Every safeguard here — comparable losers, claim
  strengths, shrinkage, the evidence object, the compile-time gate —
  exists for that one reason, and none of them should be treated as
  optional polish.

  Sample size is a product problem, not only a statistical one. Seven
  months to an established pattern is the honest number. A product that
  says nothing until then will be judged useless; one that overclaims
  before then will be judged wrong. The evidence-level vocabulary is the
  only way through, and it has to be in the first version.

  Scope. The v1/v2 split above is the mitigation for this being XL. If v1
  starts absorbing semantic extraction or templates, stop and re-split.

  ## Owner decision (2026-10-01): v1 and v2 together

  The rule above — v1 ships and is useful before v2 begins — is retired by
  the owner's decision of 2026-10-01: both milestones are built together.
  They are still separate commits (v1 first), and the scope rule that
  motivated the split still holds: semantic extraction is not automated.

  ## Built (2026-10-01, #545)

  Pure, from `@kit/clickhouse`:

  - `lib/genome-attributes.ts` — `TAXONOMY_DIMENSIONS`,
    `GENOME_OBSERVABLE_DIMENSIONS`, `GENOME_SEMANTIC_DIMENSIONS`,
    `TAG_DIMENSIONS` (the table's CHECK), `CLOSED_TAG_VALUES`,
    `GENOME_DIMENSION_STAGE`, `parseVideoTag`, `splitVideoTags`,
    `durationBandOf` / `durationAttribute`.
  - `lib/genome-measures.ts` — `SEGMENT_MEASURES` (impressions,
    impressions_ctr, average_view_duration, share_rate, comment_rate,
    subscriber_conversion), `stageMeasureFor`, `metricProvenanceFor`.
  - `lib/genome-evidence.ts` — `Evidence`, `ClaimStrength`,
    `CausalBacking`, `concludedChangeLogEntry`,
    `concludedChannelExperiment`, `EVIDENCE_LEVEL_LABEL`, `evidenceLabel`,
    `rankingDistance`, `GenomeFinding`, `Recommendation` / `recommendFrom`.
  - `lib/genome.ts` — `analyseGenome`, `MIN_PREVALENCE_GAP`,
    `quantileExactInclusive`.
  - `lib/genome-loop.ts` (v2) — `genomeHypothesisKey`,
    `GENOME_HYPOTHESIS_PATTERN`, `hypothesesFrom`, `applyLinkedTests`,
    `deriveTemplates`, `instantiateTemplate`.

  Server: `querySegmentVideoMeasures` and the `measure` option of
  `querySegmentPerformance` (`@kit/clickhouse/server`);
  `getGenomeFindingsAction` (`@kit/content-analytics`), which refuses a
  stage, a platform or ClickHouse being off as a value.

  Decisions taken while building, each in the code beside it:

  - **Duration is derived, not tagged.** `video_dim` holds the published
    asset's length (FILM-1710); a hand-entered copy could only disagree.
  - **hook_type moves from taxonomy to genome**, slugs unchanged.
  - **Yes/no, banded and semantic dimensions take fixed values**; hook types,
    opening visuals and first sentences stay each account's vocabulary.
  - **Unknown is not absent.** An attribute is compared only among videos
    tagged in its dimension.
  - **A finding needs a 20-point prevalence gap** between winners and
    comparable losers, and its lift must point the same way.
  - **Evidence levels are FILM-1606's 5/15 tiers.** The illustrative counts
    in the Evidence table above (7, 19, 53) predate that choice; 19 videos is
    an Established pattern here.
  - **The stage travels in the hypothesis key** (`dimension:slug@stage`), so
    FILM-1610's `metric_watched` vocabulary is unchanged and there is still
    one stage vocabulary.
  - **A test on another channel says nothing about this one**: only this
    channel's concluded entries update a finding. A confirmation does not
    cancel a rejection.
  - **Every genome attribute is part of the video**, so a hypothesis says a
    channel experiment tests it; a Change log entry can still be linked by
    hand, and backs a causal claim when it concludes confirmed.
  - **A channel experiment (FILM-1724) confirms only where its styles
    separated.** Its concluded record carries frozen results; a confirmed
    experiment whose styles' ranges all overlapped showed no clear
    difference, and counts as inconclusive whatever the owner recorded.
  - **A hypothesis key may name `monetisation`.** FILM-1726 (owner-approved)
    appended it as a sixth stage (#523); both tables accept it, and the
    TypeScript pattern, derived from FUNNEL_STAGES, is the same pattern.
  - **Some stages have no checkpoint measure yet**: a YouTube Short's Hook
    (first-3s retention) and every signal built on accounts reached
    (TikTok and Instagram Reach, Instagram Transmission). They are refused
    by name.

  Verified on ClickHouse 24.8 against a hand-computed fixture
  (`genomeSteps`, packages/clickhouse/scripts/verify-queries.ts), seen red
  with the share rate read as 0 instead of NULL at zero views; pgTAP
  (genome-tag-dimensions, genome-hypothesis-link) on a throwaway Postgres,
  red without each migration and with each constraint or trigger dropped;
  the tag form in a production build (apps/e2e/tests/tags/genome-tags.spec.ts),
  red with the refusal on the slug field.
