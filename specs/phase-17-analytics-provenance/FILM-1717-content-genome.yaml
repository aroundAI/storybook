summary: >
  Everything else in the phase answers what happened to this video; this
  spec answers what should I make next, turning a stage verdict like
  "Transmission: above" into "Identity framing is associated with 2.1x
  typical transmission, on 8 comparable videos." It is XL and is split into
  two milestones — v1 (observable attributes on the existing tag
  infrastructure, winner/loser comparison, evidence levels, adjusted lift)
  and v2 (semantic attributes, creative templates, hypothesis generation,
  experiment linkage, causal evidence). The owner decided on 2026-10-01 to
  build both together. It reuses FILM-1606's segment-performance statistics
  rather than building a second engine, and requires no ClickHouse schema
  change because taxonomy, genome and performance attributes all flow
  through the existing publish_tags / video_dim.tags infrastructure as
  distinct types sharing one physical store.
