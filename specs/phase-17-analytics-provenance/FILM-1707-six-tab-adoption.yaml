summary: >
  Finishes rolling FILM-1705's chip and FILM-1706's shell across all six analytics tabs — Language
  and AI Insights use entirely different card shells today — and settles the one question a chip
  cannot answer by labelling: Deep Dive pools YouTube's true-daily rows with TikTok and Instagram's
  snapshot-delta rows (attributed to the fetch day, not the data day) in the same time-bucketed
  aggregates, which a '3 platforms' chip would make look honest rather than expose. Decided here:
  time-bucketed aggregates exclude snapshot_delta rows (true-daily only, currently YouTube),
  lifetime aggregates keep pooling every platform since fetch-day attribution cannot distort a sum,
  each affected card states which kind it is, and a platform switcher defaults to all platforms
  rather than silently to YouTube. This will move median and cohort figures already on screen for
  any project with TikTok or Instagram publishes, and requires a one-time dismissible on-tab note
  explaining why.
