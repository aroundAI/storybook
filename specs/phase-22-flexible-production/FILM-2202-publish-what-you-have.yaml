spec_id: "FILM-2202"
title: "Publish What You Have: no locked stages, publish any episode with a video"
phase: 22
phase_name: "Flexible Production"
category: feature
status: DRAFT
effort: S
dependencies:
  - spec_id: "FILM-2201"
    note: "deriveStageViews, canPublish, episode_renders.source"
summary: >
  The web half of the owner's second ask. The episode tabs stop locking:
  each is reachable, and an empty one says what it needs. Publish opens when
  the episode has any video. With none, the Publish page is the upload
  surface: a drop zone and a field for an already-published link. An upload
  records a ready episode_renders row (source upload, no edit session) and
  moves the episode to ready. Design: EDD J4, §6.5.
