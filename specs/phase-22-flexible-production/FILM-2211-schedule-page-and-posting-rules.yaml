summary: >
  The owner, 2026-10-18: "Posting rules are channel-wide — why must I open
  an episode to see/edit them? And give me a tab on the left where I see
  what's published and what's scheduled, in a table with timings, filters
  for long/short and platform." A channel's posting rules were reachable
  only from an episode's Publish screen, and a project's calendar only
  over MCP and in the morning digest.

  A Schedule item in the project's left nav opens a page with the
  project's channels and how each posts, in one line, and every post of
  the project in time order in the viewer's timezone, filtered by type,
  platform, status and dates in the URL. A scheduled post is cancelled and
  a held Short re-queued or discarded from the table. Every connected
  channel in Settings → Platforms has a Posting rules button that opens the
  same dialog. Nothing new is stored: the page reads the calendar service
  and the cadence table through the existing services and actions.
