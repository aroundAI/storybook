notes: >
  Decisions the plan left open. The page reads the posts in UTC days from
  the From and To dates, and shows each post's time in the browser's zone;
  a post near midnight can fall a day outside the dates as written. The
  Posting rules button shows on every connected channel, not only YouTube,
  Facebook and Instagram: the rules are per connection whatever its
  platform. The sidebar's labels are not translated (none of its items
  are); the page title is studio:routes.schedule. Re-queueing a held Short
  from the table re-queues that one Short, through the same action the
  Publish screen uses for an episode's held Shorts.

  Found while verifying: two filter changes made faster than the server
  answered lost the first, because each built the URL from search params
  that lag until the read finishes; the filters now build on the URL they
  asked for (useOptimistic), guard E2E F1. And a type whose saved rules
  are switched off showed the saved times although the defaults apply;
  the summary now shows the defaults, guard S1.

  Review, 2026-10-18. The Next dev overlay's "2 Issues" on the Schedule
  page and "1 Issue" on Settings → Platforms were not this spec's: read
  from Playwright's console and pageerror events, the only errors on
  either page are "WebSocket connection to 'ws://127.0.0.1:4121/'
  failed" and "[LlmWebSocket] WebSocket error", which
  packages/ui/src/hooks/llm-websocket-provider.tsx logs on every page
  when no LLM WebSocket server runs (none does in a dev or test run). No
  hydration, key or page error came from the branch; the E2E now fails on
  any other. Instagram takes no long videos in this product, so its rules
  are Shorts only, and the table names the viewer's zone as the release
  panel does (GMT+5:30, not Asia/Calcutta, Chromium's older alias).
