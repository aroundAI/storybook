summary: >
  The owner, 2026-10-18: the next two weeks are already scheduled when a
  big story breaks. The owner can make a video fast, and it does best near
  the news, but every new episode went to the end of the queue. A breaking
  release puts it out now, with its Shorts posting more for a few days.

  The owner's choices: scheduled long videos keep their times, and the
  breaking long video is squeezed in beside them, even if two long videos
  then land on one day. It goes at the next scheduler run (about 5
  minutes) or at a time the owner gives. Its Shorts jump to the front of
  each channel's Shorts queue from about an hour after it, with extra
  Short times for a few days (default 2 more a day for 3 days, both
  settable) that only breaking Shorts use. The Shorts already queued shift
  back in order, and the normal daily limit applies again after the
  boost. It is available over MCP behind "Schedule publishes"
  (studio:publish): it is still a schedule, not Publish now, so the
  2026-10-10 rule holds. Preview first, then confirm. More than 6 YouTube
  uploads in a day across the team's channels is warned about, not
  refused.
