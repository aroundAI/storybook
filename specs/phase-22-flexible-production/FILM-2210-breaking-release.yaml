notes: >
  Decisions the plan left open. The breaking long video holds no cadence
  slot (slot_at null), so it can share an exact time with a scheduled long
  video without the slot index refusing it. The extra times go one at a
  time into the middle of the widest gap between 09:00 and 21:00 (or the
  channel's first and last times, when wider) on a 5-minute grid: 11:00
  and 17:00 with 2 extra give 11:00, 14:00, 17:00, 19:00. The boost days
  start on the first day with a time after the floor, and every boost
  time is used on each allowed weekday, without the every-N-days rule.
  Breaking Shorts on boost days do not count toward the normal limit;
  those placed after the boost do. reschedule_publishes also inserts the
  new rows, so the moves and the release are one transaction rather than
  two. The planner lives in its own file, plan-breaking-release.ts.

  Verified 2026-10-18 on the local stack (dev server :3100): six episodes
  scheduled over MCP, Ep 7 breaking now through the Breaking news tab
  (8 queued Shorts moved back), Ep 8 breaking over MCP at Ep 3's 20:00;
  the day x posts table is in the PR. Found while verifying: a scheduled
  release's preview stayed live, so a second click would have scheduled it
  twice; a schedule now spends the preview (guard E2E U1).
