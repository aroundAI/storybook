summary: >
  The owner experiments with posting times and had bulk-scheduled many
  episodes, and there was no way to change a scheduled post's time: MCP had
  cancel_scheduled_publish and the schedule tools, the Schedule tab only
  Cancel. Moving meant cancelling and scheduling again, which lost the
  post's tags and needed a risky cancel. New posting rules applied only to
  episodes scheduled after them.

  The owner, 2026-10-22: "I am going to change everything that's scheduled
  from now on. I did a bulk schedule before." So a post's time now changes
  in place (Change time on the Schedule tab, reschedule_publish over MCP),
  with the posting rules checked and an override for an experiment; an
  episode's long video moves on every platform together and its Shorts
  follow. Saving posting rules, on the Schedule page, in Settings →
  Platforms, on the Publish screen or with set_channel_cadence, re-plans
  everything already scheduled on that channel in the same request; Re-plan
  to posting rules and replan_schedule do it for a whole project. Every
  move is kept in the post's history, shown on the tab and in the morning
  digest.
