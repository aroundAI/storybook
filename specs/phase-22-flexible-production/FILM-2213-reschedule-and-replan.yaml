notes: >
  Decisions the brief left open. A re-plan lays the posts on the channels'
  next allowed slots from now, so a bulk schedule on sparse old rules can
  move earlier as well as later under denser new ones; long videos keep the
  order they were scheduled in, and their spacing from any long video that
  stays, published ones in the last 35 days included. Each post keeps its
  own jitter, cut to the channel's current jitter, so a preview and the
  write give the same times. A post within 15 minutes of going out is not
  moved by a re-plan and cannot be moved by hand: it may already be on its
  way. A time moved within the rules holds that time as its slot; one moved
  past them holds none, as a post scheduled by hand never did, and is
  marked manualTime. MCP schedule_publish with ignoreCadence marks its posts
  manualTime too, so a re-plan never undoes an explicit override.

  Saving one channel's rules re-plans every post on that channel, whichever
  project it belongs to: a channel's calendar is one queue. Shorts on other
  channels that wait for a long video moved here are not re-planned (they
  still wait for it at the scheduled job's gate); Re-plan to posting rules
  re-plans all of a project's channels together. A history entry's `by` is
  the user who made the change, or who saved the rules for a re-plan.

  YouTube is called from the web app as KB-214's cancel calls it
  (getAccessToken through the connection's stored token), before the
  database write. A re-plan in which YouTube refuses one post keeps that
  post where it is and plans the rest around it, up to four times, and says
  which stayed and why; a reschedule by hand refuses as a whole.

  Verification. Unit and integration tests run against an in-memory
  PostgREST that keeps the slot index and runs reschedule_publishes all or
  nothing, with the real youtube-staged.service against a fake YouTube.
  Red before green: with the re-plan removed from saveCadenceAndReplan (the
  behaviour on main) four of reschedule.service.test.ts's re-plan tests
  fail, and with the dialog's preview step removed two of
  posting-rules-replan.test.tsx's fail. The local Supabase and the browser
  were not running while this was built, so the pgTAP file runs in the
  merge queue's Supabase DB job, and the Schedule tab's screenshots are
  pending; the UI is covered by React Testing Library instead of
  Playwright, including the second change of a moved post.
