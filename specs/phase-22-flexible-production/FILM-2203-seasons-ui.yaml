spec_id: "FILM-2203"
title: "Seasons UI: create empty seasons, manage them, move episodes between them"
phase: 22
phase_name: "Flexible Production"
category: feature
status: DRAFT
effort: M
dependencies:
  - spec_id: "FILM-2201"
    note: "season.service.ts, reorder_seasons, soft_delete_season, episode_positions"
summary: >
  The owner's first ask. The empty project offers Plan a season with AI
  (today's Generate Season, unchanged), Start a season and Add a finished
  video. A season can be created with only a name, renamed, given notes,
  moved up or down and deleted (its episodes move to Unsorted). An empty
  season shows New episode and Upload video. Episodes drag between seasons
  or move from a menu, and show S1 · E3 labels and a status pill. Design:
  EDD J1, §7.1, §7.2.
