spec_id: "FILM-2203"
title: "Seasons UI: create empty seasons, manage them, move episodes between them"
phase: 22
phase_name: "Flexible Production"
category: feature
status: PARTIAL
effort: M
dependencies:
  - spec_id: "FILM-2201"
    note: "season.service.ts, reorder_seasons, soft_delete_season, episode_positions"
summary: >
  The owner's first ask. The empty project offers Plan a season with AI
  (today's Generate Season, unchanged), Start a season and Add a finished
  video. A season can be created with only a name, renamed, given notes,
  moved up or down and deleted (its episodes move to Unsorted). An empty
  season shows New episode and Upload video. Episodes drag between seasons
  or move from a menu, and show S1 · E3 labels and a status pill. Design:
  EDD J1, §7.1, §7.2.
acceptance_criteria:
  - text: "The empty Episodes page shows three cards (data-test zero-plan-season, zero-start-season, zero-add-video); Plan a season opens today's Generate Season dialog unchanged"
    met: true
    evidence: "Met (#661): episodes-zero-state.tsx; the Plan card holds SeasonGeneratorDialog's own trigger, so Generate Season is unchanged"
  - text: "CreateSeasonDialog (react-hook-form, shared zod schema) creates a season with only a name; it appears as an empty section with New episode and Upload video"
    met: true
    evidence: "Met (#661): create-season-dialog.tsx over CreateSeasonSchema and createSeasonAction (insertSeason). The page now loads only live seasons (it read deleted ones too) and no longer drops a season without episodes (groupEpisodesBySeason filtered them out); an empty season shows EmptySeasonSlot (empty-season-slot.tsx) with New episode and Upload video, both opening the new-episode dialog in that season"
  - text: "Season header menu: rename, edit notes, move up, move down, delete; delete confirms with the episode count and moves them to Unsorted"
    met: true
    evidence: "Met (#661): season-header.tsx adds Move up and Move down (reorderSeasonsAction, every season's order) and Delete season, keep episodes (deleteSeasonKeepEpisodesAction at the season's version), beside the existing Delete Season & Episodes, which stays as it was (owner's choice deferred: both kept). An empty season hides Bulk Generate and Generate All Sound"
  - text: "Episodes move between seasons and Unsorted by drag and by a keyboard-reachable Move to season menu; the move is optimistic and rolls back on refusal"
    met: true
    evidence: "Met (#661): season-drag.tsx: DndContext with pointer and keyboard sensors, each season and Unsorted a drop target, the number badge the handle; the row's Move to season menu (outside the link, focus-visible) is the keyboard path. Both call moveEpisodeToSeasonAction at the episode's version and refresh; a refusal is a toast and nothing moves. Unsorted is a drop target only while it holds an episode; the menu reaches it always"
  - text: "Cards show S{n} · E{position} from episode_positions (Unsorted: #number) and a status pill: Draft; In production for story, storyboard, generating and editing (owner, 2026-10-09); Ready; Live"
    met: true
    evidence: "Met (#661): the page computes one label per episode with seasonPositions and episodeLabel (packages/features/episodes/src/lib/season-position.ts); the row shows it and a status pill (STATUS_PILL in episode-list-item.tsx). The position view the spec named was replaced by this function (FILM-2201)"
  - text: "Playwright evidence for each state above, including after a rename and after a delete"
    met: false
    reason: "not met: apps/e2e/tests/flexible-production/seasons.spec.ts is written (empty season and a second create, move down, move an episode keeping its number, delete keeping episodes; screenshots under CAPTURE_EVIDENCE) but not run; the app needs a local Supabase, whose images this environment's network policy blocks"
test_plan:
  unit: []
  integration: []
  e2e:
    - {text: "apps/e2e/tests/flexible-production/seasons.spec.ts: create empty, reorder, move an episode, delete moves episodes", met: false, reason: "written, not run (no local Supabase in this environment)"}
open_questions: []
notes: "Generate Season is not changed by this spec (owner, 2026-10-09)."
