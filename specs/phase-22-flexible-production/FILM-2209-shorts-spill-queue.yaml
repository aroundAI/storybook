spec_id: "FILM-2209"
title: "Shorts spill queue: an episode's Shorts keep posting after the next long video, oldest first, never past the daily cap"
phase: 22
phase_name: "Flexible Production"
category: feature
status: DONE
effort: M
dependencies:
  - spec_id: "FILM-719"
    note: "the channel posting cadence, whose Shorts window this replaces"
  - spec_id: "FILM-2208"
    note: "schedule_release and set_channel_cadence over MCP"
summary: >
  The owner's posting plan (2026-10-18): a long video at 20:00 every 3
  days, Shorts at set times (how many a day, the times and every how many
  days all customisable). On day 3, when the second long video goes out,
  the first episode's Shorts keep posting; an episode with 8 Shorts keeps
  posting them on days 3 and 4 without ever passing the Shorts-a-day cap;
  releasing 5 episodes two days after 4 never schedules anything before an
  earlier episode. FILM-719 let an episode's Shorts post only until the
  next episode's long video and held the rest: an 8-Short episode lost two
  to holds, re-queued Shorts were bumped again by the next release, and
  Shorts had no "every N days".

  The owner chose spill over, oldest first. Each channel has one Shorts
  queue: a release appends its Shorts after every Short already there, no
  earlier than their long video on that channel plus the wait (on a channel
  with none, the episode's earliest long video), never more a local day
  than the channel's Short times, and only on every Nth day. Nothing is
  held or moved; an upload no slot in a year fits is refused with a reason.
  The release says how far each channel's queue runs past its last long
  video, and calls it out past 7 days. Fixed on the way: a long video and a
  Short no longer take one slot time; long-video spacing counts local days
  across daylight saving; jitter stays on the slot's day and in queue
  order; a Short waits for its long video on its own channel in the
  planner and the scheduled job; and a late post moves the queue behind it
  on a slot each instead of a flat 24 hours.
