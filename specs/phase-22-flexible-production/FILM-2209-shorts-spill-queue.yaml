    evidence: "Met (#TBD): packages/features/publishing/src/lib/cadence/plan-release.ts (planRelease, step 3). Tests: plan-release.test.ts 'never puts a Short ahead of one already queued on the channel', 'appends a later batch: 5 episodes released 2 days after 4…'; schedule-release.service.test.ts 'appends a later batch and never writes to an earlier episode’s posts'; E2E apps/e2e/tests/mcp/cadence-release.spec.ts 'nine episodes of eight Shorts…' and apps/e2e/tests/publishing/cadence-release.spec.ts. Guards C2 (film-719-cadence.json), Q13, E2E C5"
  - text: "An episode's Shorts keep posting after the next episode's long video, sharing its day, never more a local day than the channel's Short times"
    met: true
    evidence: "Met (#TBD): plan-release.ts (no window), cadence.ts nextFreeSlot (per-day cap). Tests: 'keeps posting episode 1’s 8 Shorts on day 3, beside long video 2, and on day 4, never more than 2 a day', 'places an episode’s Shorts after the next episode’s long video when they do not fit before it'. Guards C1 (re-anchored), C3"
  - text: "Shorts per day (the number of Short times, 1–6), the times and every N days (1–30) are set per channel on the Publish screen and over MCP; long videos keep 'a long video every N days'"
    met: true
    evidence: "Met (#TBD): migration 20261018065822_film-2209-shorts-every-n-days.sql (every_n_days, Shorts only; start_after_hours defaults to 2, as the code does); ChannelCadenceSchema everyNDays; channel-cadence-dialog.tsx ('Post Shorts every N days', 'N Shorts a day'); set_channel_cadence everyNDays. Tests: plan-release.test.ts 'posts Shorts every 2 days when told to…'; release-tools.test.ts 'sets Shorts every N days, and refuses it for long videos'; pgTAP channel-posting-cadence.test.sql (5 new). E2E: the dialog saves 2 times every 2 days, reopens on them, and the calendar shows 2 Shorts on alternate days. Guard Q1"
  - text: "A Short waits for its episode's long video on its own channel where there is one, in the planner and in the scheduled job"
    met: true
    evidence: "Met (#TBD): plan-release.ts anchorOn; gate.ts longVideoStates over dispatch.ts longVideosFor; schedule-release.service.ts readAnchors (byChannel). Tests: 'waits for the episode’s long video on the Short’s own channel', schedule-release.service.test.ts 'makes a YouTube Short wait for the YouTube long video…', cadence-gate.test.ts 'waits for the long video on its own channel, though another channel’s is live'. Guards Q2, Q11"
  - text: "No two posts on a channel take one slot time, whatever their type, so a release is never refused by the slot index for a long video beside a Short"
    met: true
    evidence: "Met (#TBD): nextFreeSlot rules.blocked, used for both types in planRelease. Tests: 'never gives a long video and a Short one time on a channel'; service test 'places a long video beside a Short on the same slot time without the slot index refusing it'. Guards Q3, Q4"
  - text: "Long videos are spaced in local calendar days, so 20:00 every 3 days stays 20:00 across a daylight-saving change"
    met: true
    evidence: "Met (#TBD): plan-release.ts (startOfLocalDay(addDays(...))). Test 'keeps 20:00 every 3 days across a daylight-saving change' (America/New_York, 8 March 2026). Guards Q5, C4 (re-anchored), E2E Q14"
  - text: "Jitter keeps a post on its slot's local day and at least a minute after the post before it on the channel"
    met: true
    evidence: "Met (#TBD): plan-release.ts jittered over cadence.ts onSlotDay. Test 'keeps jittered posts on their slot’s day and in queue order'; E2E: every channel's Shorts strictly in order by scheduled_at. Guards Q6, Q7"
  - text: "A late post on a channel that has had its local day's posts moves to the next free slot under the cadence, with the posts queued after it, in order; the day is the channel's local day, not the last 24 hours"
    met: true
    evidence: "Met (#TBD): dispatch.ts shiftQueue, postsToday, gateCadence; gate.ts deferredForCap (used by the scheduled Lambda and the in-process job). Tests: cadence-gate.test.ts 'moves it and the Shorts queued after it on a slot each, in order, from tomorrow', 'counts the local day, not the last 24 hours', 'moves a post on a channel with no posting rules to the same time the next day'. Guards Q10, Q12, G2 (re-anchored)"
  - text: "Nothing is held: an upload no slot within 365 days fits refuses the release, naming the channel; Shorts an older release held are re-queued at the end of their queue and stay there"
    met: true
    evidence: "Met (#TBD): schedule-release.service.ts planFor (refusal), requeueHeldShorts; holdDisplaced and the 'next-episode' hold removed. Tests: service 'refuses, saying why, an upload no slot in a year fits', 're-queues them at the end of their channel’s queue, and the next release leaves them there'; E2E: a held draft re-queued from the Publish screen goes after episode 2's last Short. Guards Q9, Q13, E2E C5"
