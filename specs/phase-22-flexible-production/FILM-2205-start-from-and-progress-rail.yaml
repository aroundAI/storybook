spec_id: "FILM-2205"
title: "Start From and Progress Rail: begin with an idea, a script or a video"
phase: 22
phase_name: "Flexible Production"
category: feature
status: DONE
effort: L
dependencies:
  - spec_id: "FILM-2202"
    note: "unlocked stages and AttachVideoPanel"
  - spec_id: "FILM-2203"
    note: "seasons the dialog places an episode in"
summary: >
  The new-episode dialog asks how to start: from an idea (today's wizard),
  from a script (paste or upload Fountain, Final Draft or plain text) or from
  a finished video (upload or link). The episode workspace's tabs become a
  progress rail showing each stage as done, empty or skipped, and an empty
  stage offers its actions and a Skip. A script is read into the screenplay
  stage's scenes and stored in the shape the stage commits, over the web and
  over MCP (create_episode startFrom, import_screenplay). Design: EDD J2, J3,
  §6.4, §7.3, §7.4.
acceptance_criteria:
  - text: "The dialog's tiles (data-test start-from-idea, start-from-script, start-from-video) share one discriminated-union zod schema with the server action and the MCP input; the season select is controlled"
    met: true
    evidence: "Met (#661): create-episode-dialog.tsx over CreateEpisodeStartSchema (packages/features/episodes/src/lib/schemas/create-episode-start.schema.ts), the same schema createEpisodeStartAction parses; START_FROM feeds the MCP create_episode startFrom. The season select is controlled (value from the form, Unsorted as a value), and the dialog resets to its season on every open. The existing data-test hooks stay, so episode-numbers.spec.ts drives it unchanged; the idea start still lands on the episode root"
  - text: "From a script parses Fountain, .fdx and plain text into screenplay_data checked with the screenplay stage's SceneSchema, stamps origin import, and skips ideation and story"
    met: true
    evidence: "Met (#661): parseScript (packages/features/episodes/src/lib/script-import.ts) reads Fountain (title page, notes, boneyard, parentheticals, multi-line speech), Final Draft and plain text, and checks the scenes with the stage's SceneSchema; importScreenplay stores them through screenplayDataFromScenes, the shape the stage commits (extracted from it; generation's 294 tests unchanged), in one write with origin {kind: human, via: import}. Changed from the spec: no dialogue_lines on import (a commit of several writes needs a generation run; the shots stage writes the lines). A script that cannot be read creates nothing. Tests: script-import.test.ts (found AFTERNOON read as midday), screenplay-import.test.ts"
  - text: "From a finished video lands on Publish with ideation through audio skipped"
    met: true
    evidence: "Met (#661): START_PLAN.video skips ideation through audio and lands on Publish, where FILM-2202's attach panel takes the file or the link"
  - text: "The progress rail (an ol with aria-current) replaces the tabs; an empty stage shows StageEmptyState with Generate (disabled with the missing input named), its alternative, and Skip; writing to a skipped stage un-skips it"
    met: true
    evidence: "Met (#661): episode-workspace-tabs.tsx: a nav with an ol of seven steps (Video and Publish open the Publish page), aria-current step, a mark for done, not started and skipped; Edit record a separate link. StageBanner, under it, names what an empty stage's generator needs (screenplay: 'or paste a script', with ImportScriptDialog), and skips or un-skips through setStageSkippedAction; output on a skipped stage reads as done (deriveStageViews). Audio shows no state: the workspace does not load its cue count. workspace-tabs.spec.ts updated to the rail (video step, aria-current step)"
  - text: "Playwright evidence of each tile, a second submission after reset, and the rail in each state"
    met: true
    evidence: "Met (#661): start-from.spec.ts, 4 passed (local Supabase, 2026-10-09), all red on main (ca2cbcf07). From a script the episode opens on Screenplay with Idea and Story skipped; from a video, on Publish with every earlier stage skipped; skip then un-skip from the rail's banner. The idea tile: follow-up.spec.ts. Running it found a real bug: an untouched script field was refused with Zod's bare 'Required', not 'Paste the script, or choose a file' (fixed in the schema; create-episode-start-schema.test.ts, red first). Screenshot in the PR"
