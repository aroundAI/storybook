spec_id: "FILM-2205"
title: "Start From and Progress Rail: begin with an idea, a script or a video"
phase: 22
phase_name: "Flexible Production"
category: feature
status: DRAFT
effort: L
dependencies:
  - spec_id: "FILM-2202"
