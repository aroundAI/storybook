spec_id: "FILM-2207"
title: "MCP Scheduled Publishing: an external AI schedules what the Publish screen would"
phase: 22
phase_name: "Flexible Production"
category: feature
status: DONE
effort: M
dependencies:
  - spec_id: "FILM-2204"
    note: "the episode video an external AI attaches"
  - spec_id: "FILM-708"
    note: "the publish checks, and Shorts groups' platforms"
summary: >
  An MCP connection a person grants studio:publish schedules an episode's
  video, or one of its Shorts groups, to channels of its project at a
  future time, and cancels a scheduled publish before it goes out (owner,
  2026-10-10). Publishing immediately stays a web action. A scheduled
  publish is a publishes row until the scheduled job claims it, so nothing
  reaches a platform from the tool call itself. Every target is checked by
  the Publish screen's own checks before any row is written, and a refused
  target schedules nothing.
acceptance_criteria:
  - text: "studio:publish is its own scope: the consent screen and the token form offer it, and never tick it for the person"
    met: true
    evidence: "Met (#664): packages/features/studio-mcp/src/scopes.ts (OPT_IN_SCOPES, preselectedScopes), used by apps/web/app/oauth/authorize/_components/consent-form.tsx; a client asking for no scope is offered it unticked (parseScopes). Migration 20261010120704_mcp-publish-scope.sql widens both scope checks; pgTAP mcp-connections-rls.test.sql 'studio:publish may be granted'. Tests: __tests__/tools/publish-tools.test.ts"
  - text: "schedule_publish and cancel_scheduled_publish need studio:publish; a connection without it is refused with how to get it"
    met: true
    evidence: "Met (#664): tools/publish/index.ts; build-server.ts names the reconnect step. E2E apps/e2e/tests/mcp/schedule-publish.spec.ts 'a connection without studio:publish reads the publishes but cannot schedule'"
  - text: "schedule_publish runs the Publish screen's checks (preparePublish: the team's and project's channel, the Shorts group's platforms, the thumbnail, YouTube's audience, X) plus a future time, a video under the scheduled Lambda's rule and a usable channel token, and writes all rows in one insert"
    met: true
    evidence: "Met (#664): packages/features/publishing/src/server/publish-preflight.ts holds the checks publishToAllAction ran inline, now called by both; schedule-publishes.service.ts. Tests: __tests__/schedule-publishes.test.ts (past time, wrong platform, no group, no video, inactive channel: nothing written); E2E schedules a YouTube full and an Instagram cut and refuses the cut for YouTube against local Supabase"
  - text: "cancel_scheduled_publish deletes a publish only while it is still scheduled, for project owners and admins (publishes_delete)"
    met: true
    evidence: "Met (#664): cancelScheduledPublish deletes with status = 'scheduled', so one the scheduled job has claimed is refused. Tests: 'refuses one the scheduled job claimed after it was read', 'refuses a project member who is not an owner or admin'; E2E cancels the YouTube row and the Instagram row stays"
  - text: "list_episode_publishes lists an episode's Shorts groups (platforms, languages) and its publishes with status and scheduled time"
    met: true
    evidence: "Met (#664): tools/publish/index.ts (studio:read); E2E 'schedules the video and a Shorts cut…'"
  - text: "Mutation guards for each rule"
    met: true
    evidence: "Met (#664): tooling/mutation-guards/mcp-schedule-publish.json MP1–MP9, each red under its mutation"
open_questions: []
notes: "Reverses, for scheduling only, Phase 19's 'publishing stays a web action' (owner, 2026-10-10). The scheduled job and Lambda publish these rows as they publish the Publish screen's; metadata.createdVia = 'mcp' marks them."
