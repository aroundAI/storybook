      assetType: type,
      projectId,
    });
    setOpenDialog(type);
  };

  const handleSuccess = (assetId: string) => {
    trackEvent('asset_created', {
      assetId,
      projectId,
    });
    setOpenDialog(null);
    router.refresh();
  };
  ```

