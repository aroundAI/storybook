design_guideline:
  guideline_type: "Interaction Patterns"
  applies_to:
    - "Shot grid"
    - "Timeline"
    - "Asset assignment"
    - "Loading states"
    - "Empty states"
    - "Error states"
    - "Real-time updates"
  patterns:
    - "Shot grid reordering (drag and drop): draggable grid items with sequence update; drag feedback styles — dragging `opacity-50 scale-105 shadow-lg z-50`, drop target `ring-2 ring-primary ring-offset-2`, invalid `ring-2 ring-destructive`; a `GripVertical` drag handle labelled \"Drag to reorder\""
    - "Timeline clip manipulation: horizontal drag with snapping (`SNAP_THRESHOLD_PX = 10`; snap points clip edges, playhead, grid lines) and `cursor-ew-resize` handles on both clip edges labelled \"Resize clip start\" / \"Resize clip end\""
    - "Asset assignment: drag an asset onto a shot; an `AssetDropZone` accepts listed asset types and shows idle (dashed muted border), active (primary), invalid (destructive) and hasContent (solid border) states"
    - "Shot grid keyboard: `←` `→` `↑` `↓` — Navigate shots (Grid focused)"
    - "Shot grid keyboard: `Space` — Play/pause preview (Shot selected)"
    - "Shot grid keyboard: `Enter` — Open shot editor (Shot selected)"
    - "Shot grid keyboard: `Delete` / `Backspace` — Remove shot (Shot selected)"
    - "Shot grid keyboard: `Shift+Click` — Multi-select range (Grid focused)"
    - "Shot grid keyboard: `Cmd/Ctrl+A` — Select all (Grid focused)"
    - "Shot grid keyboard: `Escape` — Deselect all (Any selection)"
    - "Timeline keyboard: `Space` — Play/pause (Timeline focused)"
    - "Timeline keyboard: `←` `→` — Scrub playhead (1 frame) (Timeline focused)"
    - "Timeline keyboard: `Shift+←` `Shift+→` — Scrub playhead (1 second) (Timeline focused)"
    - "Timeline keyboard: `[` — Set in-point (Playback)"
    - "Timeline keyboard: `]` — Set out-point (Playback)"
    - "Timeline keyboard: `Home` — Go to start (Timeline focused)"
    - "Timeline keyboard: `End` — Go to end (Timeline focused)"
    - "Timeline keyboard: `+` `-` — Zoom in/out (Timeline focused)"
    - "Timeline keyboard: `Cmd/Ctrl+Z` — Undo (Global)"
    - "Timeline keyboard: `Cmd/Ctrl+Shift+Z` — Redo (Global)"
    - "Progressive loading: a skeleton while data loads (`ShotGridSkeleton`), a placeholder with `ProgressRing` and sr-only progress text while generating, and an optimistic status update on action"
    - "Skeleton components: `ShotGridSkeleton` renders a responsive grid of `aspect-video` skeletons; `EpisodeCardSkeleton` renders a card-shaped skeleton"
    - "Empty states: an `EmptyState` with icon, title, description and an optional action button, e.g. \"No episodes yet\" → Create Episode, \"No characters defined\" → Add Character"
    - "Error states: a generation failure shows the error with a Retry button when retryable; provider unavailable shows a warning that the job is queued and retries automatically; credit limit reached links to Upgrade Plan"
    - "Real-time updates: optimistic UI with server reconciliation — subscribe to a Supabase `postgres_changes` channel per episode and merge UPDATE payloads into the cached shots"
    - "All keyboard shortcuts have visible hints (via Tooltip)"
    - "Focus is managed during drag operations"
    - "Screen readers announce status changes via `aria-live`"
    - "Drag handles have appropriate ARIA labels"
    - "Keyboard-only users can complete all interactions"
