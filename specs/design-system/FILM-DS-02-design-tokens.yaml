summary: >
  Consistent visual language across the Film Studio requires standardized design tokens.
  These tokens define colors, spacing, and semantic meanings for statuses, asset types,
  and timeline tracks.
acceptance_criteria:
  - text: "All status states have distinct, accessible colors"
  - text: "Dark mode variants are defined for all tokens"
  - text: "Token names match database enum values"
  - text: "Helper functions provide type-safe access"
  - text: "Colors meet WCAG AA contrast requirements"
  - text: "Icons are specified using Lucide icon names"
test_plan:
  unit:
    - text: "Test getStatusToken returns correct values"
    - text: "Test getStatusClasses composes correctly"
    - text: "Test all token types are exported"
    - text: "Test TypeScript types match token keys"
  integration: []
  e2e: []
retirement:
  commit: "5f44d0e1"
  date: "2026-02-19"
  what_happened: >
    `packages/features/film-studio/src/lib/design-tokens.ts` and its tests were deleted
    with `@kit/film-studio` in 5f44d0e1 (2026-02-19); their only consumer outside the
    package, the old timeline editor, went in the same commit, and the
    Kling/Runway/Hailuo provider tokens lost their subject when in-app generation was
    removed in 5b88db3a. Status colours are now CSS custom properties (`--status-*`,
    light and dark) in `apps/web/styles/shadcn-ui.css:49`, mapped per component, e.g.
    `apps/web/app/home/[account]/studio/[projectSlug]/episodes/_components/status-badge.tsx`
    — the CSS-variable design this spec's open question rejected. Kept as a record; not
    outstanding work.
  replacement: "apps/web/styles/shadcn-ui.css:49"
open_questions:
  - "Should we use CSS variables instead of Tailwind classes? **No, Tailwind for consistency with @kit/ui**"
  - "Should provider colors match official brand guidelines? (nice-to-have)"
design_guideline:
  guideline_type: "Design Tokens"
  applies_to:
    - "job status badges, shot overlays, and progress indicators"
    - "asset cards, type badges, and filters"
    - "the multi-track timeline editor"
    - "episode progress and pipeline visualization"
    - "provider selection and connection status"
  patterns:
    - "Generation status colors (`statusTokens`): pending, queued, generating, completed, failed, approved — each with bg/text/border/ring Tailwind classes (light and dark), a Lucide icon and a label"
    - "Asset type colors (`assetTypeTokens`): character, location, prop, voice, music, sfx — each with bg, bgLight, text, a Lucide icon and a label"
    - "Timeline track colors (`timelineTrackTokens`): video, dialogue, music, sfx, ambient — each with bg, bgHover, border, text and a label"
    - "Episode status workflow (`episodeStatusTokens`): draft (0) → story (1) → storyboard (2) → generating (3) → editing (4) → ready (5) → published (6), each with label, color, step and description"
    - "Provider brand colors (`providerTokens`): video — kling, runway, hailuo; audio — elevenlabs, playht, suno, udio; platform — youtube, tiktok, instagram, facebook; each with name, bg, icon and category"
    - "Utility functions: `getStatusToken(status)` for type-safe access, `getStatusClasses(status)` composing bg/text/border classes, `getAssetTypeBadge(type)` returning className, icon and label"
    - "All color combinations must meet WCAG AA (4.5:1 contrast)"
    - "Status indicators use icons + color (never color alone)"
    - "Dark mode tokens tested for visibility"
    - "Focus states visible on all interactive elements"
  file_path: "packages/features/film-studio/src/lib/design-tokens.ts"
