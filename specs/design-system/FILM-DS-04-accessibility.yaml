  patterns:
    - "WCAG 1.1.1 Non-text Content: Alt text for all images/videos — Thumbnails, generated content"
    - "WCAG 1.3.1 Info and Relationships: Semantic HTML structure — Headings, landmarks, lists"
    - "WCAG 1.4.1 Use of Color: Not sole indicator — Icons + color for status"
    - "WCAG 1.4.3 Contrast: 4.5:1 minimum — All text/backgrounds"
    - "WCAG 1.4.11 Non-text Contrast: 3:1 for UI components — Buttons, inputs, cards"
    - "WCAG 2.1.1 Keyboard: All functionality via keyboard — Navigation, actions"
    - "WCAG 2.1.2 No Keyboard Trap: Can navigate away — Modals, editors"
    - "WCAG 2.4.3 Focus Order: Logical sequence — Tab order"
    - "WCAG 2.4.7 Focus Visible: Clear focus indicator — Custom focus styles"
    - "WCAG 4.1.2 Name, Role, Value: ARIA for custom controls — Timeline, shot grid"
    - "Shot grid: `role=\"grid\"` with `aria-label` and `aria-rowcount`; each cell `role=\"gridcell\"` with `aria-rowindex`, `aria-colindex`, `aria-selected` and a roving `tabIndex`"
    - "Status badge: icon (`aria-hidden`) + color + text label, with sr-only \", in progress\" while generating"
    - "Progress ring: `role=\"progressbar\"` with `aria-valuenow`/`aria-valuemin`/`aria-valuemax` and an `aria-label` (default \"{progress}% complete\"), plus sr-only percentage text"
    - "Timeline editor: `role=\"application\"` described by sr-only instructions; playhead `role=\"slider\"` with value and `aria-valuetext`; tracks `role=\"list\"`, clips `role=\"listitem\"` labelled with name and time range"
    - "Modal/dialog: `aria-labelledby`/`aria-describedby`; focus the first input, button or select on open; return focus to the trigger on close"
    - "Live regions: a `role=\"status\"`, `aria-live=\"polite\"`, `aria-atomic=\"true\"` sr-only announcer reports completed and failed generations"
    - "Focus management: `useFocusTrap` cycles Tab/Shift+Tab between the first and last focusable elements of an active modal or sheet and focuses the first on activation"
    - "Skip links: \"Skip to main content\" (`#main-content`) and \"Skip to navigation\" (`#sidebar-nav`), sr-only until focused"
    - "Contrast minimums: normal text 4.5 (WCAG AA), large text 3.0 (18pt+ or 14pt bold), UI components 3.0, focus indicator 3.0; status colors validated against 4.5"
