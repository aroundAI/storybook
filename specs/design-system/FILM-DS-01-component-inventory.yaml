title: "Component Inventory"
phase: null
phase_name: "Design System"
category: design_guideline
status: DONE
audited: "2026-09-25"
effort: S
dependencies: []
summary: >
  The Film Studio introduces complex UI patterns not covered by the base @kit/ui
  library. This spec inventories all components needed, categorizing them by reuse
  potential and complexity.
acceptance_criteria:
  - text: "All required components are identified and categorized"
    met: true
    evidence: null
  - text: "Each component has clear ownership (package)"
    met: true
    evidence: "design_guideline.patterns names, for each of the 15 new components, the file that owns it or why none does (re-audited 2026-09-25), e.g. `apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/visual-studio/_components/shot-grid.tsx:16`, `packages/features/public-sharing/src/components/video-player.tsx:28`"
  - text: "Effort estimates are provided for planning"
    met: true
    evidence: null
  - text: "Component hierarchy shows relationships"
    met: true
    evidence: null
  - text: "No duplicate components across packages"
    met: true
    evidence: null
open_questions:
  - "Should we create a `@kit/studio-ui` package for shared studio components? (non-blocking)"
  - "Should `TimelineEditor` be extracted to its own package for reuse? (post-MVP)"
design_guideline:
  guideline_type: "Component Inventory"
  applies_to:
    - "@kit/ui"
    - "@kit/episodes"
    - "@kit/audio-generation"
    - "@kit/assets"
    - "@kit/public-sharing"
    - "apps/web (studio routes)"
  patterns:
    - "Reusable from @kit/ui (no modification): `Card`, `CardHeader`, `CardContent` — Asset cards, episode cards, shot cards"
    - "Reusable from @kit/ui (no modification): `Button`, `IconButton` — All actions and CTAs"
    - "Reusable from @kit/ui (no modification): `Dialog`, `Sheet` — Modals, side panels, editors"
    - "Reusable from @kit/ui (no modification): `Tabs`, `TabsList`, `TabsTrigger`, `TabsContent` — Studio workspace navigation"
    - "Reusable from @kit/ui (no modification): `Form`, `FormField`, `FormItem`, `FormLabel` — All input forms"
    - "Reusable from @kit/ui (no modification): `Input`, `Textarea` — Text inputs throughout"
    - "Reusable from @kit/ui (no modification): `Select`, `Combobox` — Dropdowns, provider selection"
    - "Reusable from @kit/ui (no modification): `Progress` — Linear progress indicators"
    - "Reusable from @kit/ui (no modification): `Badge` — Status labels, tags"
    - "Reusable from @kit/ui (no modification): `Table`, `TableHeader`, `TableRow`, `TableCell` — Analytics data display"
    - "Reusable from @kit/ui (no modification): `Tooltip` — Help text, hover info"
    - "Reusable from @kit/ui (no modification): `Skeleton` — Loading states"
    - "Reusable from @kit/ui (no modification): `Alert`, `AlertTitle`, `AlertDescription` — Notifications, warnings"
    - "Reusable from @kit/ui (no modification): `Avatar` — Character thumbnails"
    - "Reusable from @kit/ui (no modification): `Checkbox`, `RadioGroup` — Multi-select, options"
    - "Reusable from @kit/ui (no modification): `Slider` — Volume, timeline zoom"
    - "Reusable from @kit/ui (no modification): `Switch` — Toggle settings"
    - "Reusable from @kit/ui (no modification): `Popover` — Contextual menus"
    - "Reusable from @kit/ui (no modification): `DropdownMenu` — Action menus"
    - "Reusable from @kit/ui (no modification): `ScrollArea` — Scrollable containers"
    - "Reusable from @kit/ui (no modification): `Separator` — Visual dividers"
    - "New high-complexity component: `TimelineEditor` — Multi-track video/audio timeline with scrubbing (effort XL, package @kit/episodes). Now: retired with the Edit Suite (FILM-607); no owner"
    - "New high-complexity component: `ShotGrid` — Draggable grid with generation overlays (effort L, package @kit/episodes). Now: owned by the app: `apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/visual-studio/_components/shot-grid.tsx:16` (no drag or generation overlays; in-app video generation was retired)"
    - "New high-complexity component: `WaveformVisualizer` — Audio waveform with playhead sync (effort M, package @kit/audio-generation). Now: built as `Waveform` in @kit/audio-generation (`packages/features/audio-generation/src/components/Waveform.tsx:35`), used by `apps/web/app/home/[account]/studio/[projectSlug]/audio-library/_components/audio-asset-card.tsx`"
    - "New high-complexity component: `VideoPlayer` — Custom player with frame-accurate seeking (effort M, package @kit/episodes). Now: owned by @kit/public-sharing (`packages/features/public-sharing/src/components/video-player.tsx:28`)"
    - "New high-complexity component: `CharacterCard` — Reference images + element prompt preview (effort M, package @kit/assets). Now: not built; characters render as @kit/assets `AssetCard` (`packages/features/assets/src/components/asset-card.tsx:150`)"
    - "Medium-complexity extension: `GenerationStatusBadge` — base `Badge`; extension: Animated states, progress ring (effort S). Now: not built; it badged video-generation jobs, retired with in-app video generation (5b88db3a)"
    - "Medium-complexity extension: `ProgressRing` — base New (SVG); extension: Circular progress for jobs (effort S). Now: not built; it showed video-generation job progress, retired with in-app video generation (5b88db3a)"
    - "Medium-complexity extension: `AssetPicker` — base `Dialog` + `Combobox`; extension: Modal with preview, search (effort M). Now: owned by @kit/audio-generation (`packages/features/audio-generation/src/components/AssetPicker.tsx:50`); exported, no app caller"
    - "Medium-complexity extension: `PromptEditor` — base `Textarea`; extension: Token counter, variables (effort M). Now: not built; shot prompts are edited in a plain `Textarea` in the app (`apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/visual-studio/_components/shot-details-sidebar.tsx:1336`)"
    - "Medium-complexity extension: `CostEstimate` — base `Badge`; extension: Credits display, warnings (effort S). Now: not built; no component shows a per-action cost estimate"
    - "Low-complexity composition: `StudioSidebar` — `Nav` + `Badge` + `Tooltip` (effort S). Now: owned by the app: `apps/web/app/home/[account]/studio/[projectSlug]/_components/studio-sidebar.tsx:154`"
    - "Low-complexity composition: `EpisodeCard` — `Card` + `Badge` + `Progress` + menu (effort S). Now: owned by the app: `apps/web/app/home/[account]/studio/[projectSlug]/episodes/_components/episode-card.tsx:34`"
    - "Low-complexity composition: `PipelineProgress` — `Steps` + `Progress` + status (effort S). Now: built as the stage tabs `EpisodeWorkspaceTabs`, owned by the app: `apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/_components/episode-workspace-tabs.tsx:100`"
    - "Low-complexity composition: `ShotCard` — `Card` + `Badge` + overlay + menu (effort S). Now: owned by the app: `apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/visual-studio/_components/shot-card.tsx:272`"
    - "Low-complexity composition: `DialogueLine` — `Card` + `Avatar` + play button (effort S). Now: no single-line component; the app renders lines in `DialogueTimeline` (`apps/web/app/home/[account]/studio/[projectSlug]/episodes/[episodeSlug]/audio-studio/_components/dialogue-timeline.tsx:105`); @kit/audio-generation `DialogueList` is exported with no app caller"
    - "Each feature package exports components from a single entry point (`src/components/index.ts`)"
  file_path: null
