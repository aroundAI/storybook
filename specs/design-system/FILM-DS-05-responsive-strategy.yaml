  │          │                                                       │
  │ Sidebar  │  Main Content Area                                   │
  │ (240px)  │                                                       │
  │          │  ┌─────────────────────────────────────────────────┐ │
  │          │  │ Workspace (Tabs)                                │ │
  │          │  │                                                  │ │
  │          │  │  Story | Visual | Audio | Edit | Publish        │ │
  │          │  │                                                  │ │
  │          │  └─────────────────────────────────────────────────┘ │
  │          │                                                       │
  ├──────────┴───────────────────────────────────────────────────────┤
  │ Queue Panel (slide-over from right, optional)                    │
  └──────────────────────────────────────────────────────────────────┘
