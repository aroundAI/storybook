design_guideline:
  guideline_type: "Responsive Strategy"
  applies_to:
    - "Desktop layout"
    - "Tablet layout"
    - "Mobile layout"
    - "Shot Grid"
    - "Timeline Editor"
    - "Asset Picker"
    - "Navigation"
    - "Touch interactions"
    - "Typography"
  patterns:
    - "Breakpoint `sm`: min width 640px — Large phones (landscape)"
    - "Breakpoint `md`: min width 768px — Tablets (portrait)"
    - "Breakpoint `lg`: min width 1024px — Tablets (landscape), small laptops"
    - "Breakpoint `xl`: min width 1280px — Laptops, desktops"
    - "Breakpoint `2xl`: min width 1536px — Large monitors, ultra-wide"
    - "Desktop layout (≥1280px): header; 240px sidebar; main content area with workspace tabs (Story | Visual | Audio | Edit | Publish); optional queue panel sliding over from the right"
    - "Tablet layout (768px - 1279px): header with hamburger menu; full-width main content with stacked or scrollable tabs; sticky bottom action bar; sidebar as a collapsible sheet (hamburger trigger)"
    - "Mobile layout (<768px): compact header; single-column content (cards); bottom navigation (Story, Visual, Audio, Edit, Publish); all modals as full-screen sheets; simplified timeline view"
    - "Shot grid: responsive columns `grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5`; on mobile, swipe gestures for previous/next shot"
    - "Timeline editor on Desktop: Full multi-track timeline with zoom controls"
    - "Timeline editor on Tablet: Simplified view, pinch-to-zoom"
    - "Timeline editor on Mobile: Single track view, swipe to switch tracks"
    - "Timeline editor switches between `MobileTimeline` (max-width 768px), `TabletTimeline` (max-width 1024px) and `DesktopTimeline` via `useMediaQuery`"
    - "Asset picker on Desktop: Dialog with sidebar filters"
    - "Asset picker on Tablet: Sheet from right, 50% width"
    - "Asset picker on Mobile: Full-screen sheet with bottom filters"
    - "Navigation: a 240px `aside` sidebar at ≥1280px; below that a hamburger button opens the sidebar in a left `Sheet`"
    - "Gesture \"Swipe left/right\": Navigate shots (Shot Grid)"
    - "Gesture \"Pinch\": Zoom timeline (Timeline)"
    - "Gesture \"Long press\": Open context menu (Cards)"
    - "Gesture \"Pull down\": Refresh (Lists)"
    - "Gesture \"Swipe up\": Expand preview (Video Player)"
    - "Typography scale: h1 `text-2xl sm:text-3xl lg:text-4xl`, h2 `text-xl sm:text-2xl lg:text-3xl`, h3 `text-lg sm:text-xl lg:text-2xl`, body `text-sm sm:text-base`, small `text-xs sm:text-sm`"
    - "Container queries (future): components adapt to their container rather than the viewport, e.g. shot cards 16/9 at ≥400px and 1/1 below"
    - "Use `useMediaQuery` hook sparingly (causes re-render)"
    - "Prefer CSS-based responsiveness when possible"
    - "Lazy load mobile-specific components"
    - "Reduce image quality on mobile networks"
  file_path: null
