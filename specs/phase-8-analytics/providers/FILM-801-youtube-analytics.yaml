notes: |-
  ## Metadata

  - **Phase:** 8 - Analytics
  - **Priority:** P2 (Post-MVP)
  - **Effort:** M (4-8 hours)
  - **Dependencies:** FILM-705 (YouTube OAuth)
  - **Blocks:** FILM-804 (Analytics Sync), FILM-805 (Analytics Dashboard)

  ## Specification

  ### Requirements

  1. **Video Metrics**: Views, likes, comments, shares
  2. **Watch Time**: Total minutes watched, average duration
  3. **Engagement**: CTR, average percentage viewed
  4. **Audience**: Geographic, demographic, traffic sources
  5. **Revenue**: Estimated earnings (if monetized)
  6. **Retention**: Audience retention curve data

  ### Provider Interface

  ```typescript
  // packages/features/content-analytics/src/providers/youtube/types.ts

  export interface YouTubeAnalyticsInput {
    videoId: string;
    startDate: Date;
    endDate: Date;
    metrics?: YouTubeMetric[];
  }

  export type YouTubeMetric =
    | 'views'
    | 'likes'
    | 'dislikes'
    | 'comments'
    | 'shares'
    | 'estimatedMinutesWatched'
    | 'averageViewDuration'
    | 'averageViewPercentage'
    | 'subscribersGained'
    | 'subscribersLost'
    | 'estimatedRevenue'
    | 'annotationClickThroughRate'
    | 'cardClickRate';

  export interface YouTubeAnalyticsResult {
    videoId: string;
    period: {
      startDate: string;
      endDate: string;
    };
    totals: YouTubeTotals;
    dailyData: YouTubeDailyMetrics[];
    retention?: RetentionData;
    demographics?: DemographicData;
    trafficSources?: TrafficSourceData[];
    geography?: GeographyData[];
  }

  export interface YouTubeTotals {
    views: number;
    likes: number;
    dislikes: number;
    comments: number;
    shares: number;
    estimatedMinutesWatched: number;
    averageViewDuration: number; // seconds
    averageViewPercentage: number;
    subscribersGained: number;
    subscribersLost: number;
    estimatedRevenue: number; // cents
  }

  export interface YouTubeDailyMetrics {
    date: string;
    views: number;
    estimatedMinutesWatched: number;
    averageViewDuration: number;
    subscribersGained: number;
  }

  export interface RetentionData {
    // Percentage of viewers still watching at each point
    points: Array<{
      elapsedVideoTimeRatio: number; // 0-1
      audienceWatchRatio: number; // 0-1
    }>;
  }

  export interface DemographicData {
    ageGroups: Array<{
      ageGroup: 'age13-17' | 'age18-24' | 'age25-34' | 'age35-44' | 'age45-54' | 'age55-64' | 'age65-';
      viewPercentage: number;
    }>;
    genders: Array<{
      gender: 'male' | 'female' | 'user_specified';
      viewPercentage: number;
    }>;
  }

  export interface TrafficSourceData {
    source: 'ADVERTISING' | 'BROWSE_FEATURES' | 'END_SCREEN' | 'EXT_URL' | 'NOTIFICATION' | 'PLAYLIST' | 'RELATED_VIDEO' | 'SUBSCRIBER' | 'YT_SEARCH' | 'OTHER';
    views: number;
    watchTimeMinutes: number;
  }

  export interface GeographyData {
    country: string;
    views: number;
    watchTimeMinutes: number;
    viewPercentage: number;
  }
  ```

  ### Provider Implementation

  ```typescript
  // packages/features/content-analytics/src/providers/youtube/youtube-analytics.ts

  import { google } from 'googleapis';

  export class YouTubeAnalyticsProvider {
    private youtubeAnalytics;
    private youtube;

    constructor(private accessToken: string) {
      const oauth2Client = new google.auth.OAuth2();
      oauth2Client.setCredentials({ access_token: accessToken });
      this.youtubeAnalytics = google.youtubeAnalytics({ version: 'v2', auth: oauth2Client });
      this.youtube = google.youtube({ version: 'v3', auth: oauth2Client });
    }

    /**
     * Fetches comprehensive analytics for a video
     */
    async getVideoAnalytics(input: YouTubeAnalyticsInput): Promise<YouTubeAnalyticsResult> {
      const { videoId, startDate, endDate } = input;
      const startDateStr = this.formatDate(startDate);
      const endDateStr = this.formatDate(endDate);

      // Fetch metrics in parallel
      const [totals, dailyData, retention, demographics, trafficSources, geography] =
        await Promise.all([
          this.fetchTotals(videoId, startDateStr, endDateStr),
          this.fetchDailyMetrics(videoId, startDateStr, endDateStr),
          this.fetchRetention(videoId),
          this.fetchDemographics(videoId, startDateStr, endDateStr),
          this.fetchTrafficSources(videoId, startDateStr, endDateStr),
          this.fetchGeography(videoId, startDateStr, endDateStr),
        ]);

      return {
        videoId,
        period: { startDate: startDateStr, endDate: endDateStr },
        totals,
        dailyData,
        retention,
        demographics,
        trafficSources,
        geography,
      };
    }

    /**
     * Fetches aggregate totals
     */
    private async fetchTotals(
      videoId: string,
      startDate: string,
      endDate: string
    ): Promise<YouTubeTotals> {
      const response = await this.youtubeAnalytics.reports.query({
        ids: 'channel==MINE',
        startDate,
        endDate,
        metrics: [
          'views',
          'likes',
          'dislikes',
          'comments',
          'shares',
          'estimatedMinutesWatched',
          'averageViewDuration',
          'averageViewPercentage',
          'subscribersGained',
          'subscribersLost',
          'estimatedRevenue',
        ].join(','),
        filters: `video==${videoId}`,
      });

      const row = response.data.rows?.[0] || [];

      return {
        views: row[0] || 0,
        likes: row[1] || 0,
        dislikes: row[2] || 0,
        comments: row[3] || 0,
        shares: row[4] || 0,
        estimatedMinutesWatched: row[5] || 0,
        averageViewDuration: row[6] || 0,
        averageViewPercentage: row[7] || 0,
        subscribersGained: row[8] || 0,
        subscribersLost: row[9] || 0,
        estimatedRevenue: Math.round((row[10] || 0) * 100), // Convert to cents
      };
    }

    /**
     * Fetches daily metrics
     */
    private async fetchDailyMetrics(
      videoId: string,
      startDate: string,
      endDate: string
    ): Promise<YouTubeDailyMetrics[]> {
      const response = await this.youtubeAnalytics.reports.query({
        ids: 'channel==MINE',
        startDate,
        endDate,
        metrics: 'views,estimatedMinutesWatched,averageViewDuration,subscribersGained',
        dimensions: 'day',
        filters: `video==${videoId}`,
        sort: 'day',
      });

      return (response.data.rows || []).map((row: any[]) => ({
        date: row[0],
        views: row[1] || 0,
        estimatedMinutesWatched: row[2] || 0,
        averageViewDuration: row[3] || 0,
        subscribersGained: row[4] || 0,
      }));
    }

    /**
     * Fetches audience retention data
     */
    private async fetchRetention(videoId: string): Promise<RetentionData | undefined> {
      try {
        const response = await this.youtubeAnalytics.reports.query({
          ids: 'channel==MINE',
          startDate: '2020-01-01', // Lifetime
          endDate: this.formatDate(new Date()),
          metrics: 'audienceWatchRatio',
          dimensions: 'elapsedVideoTimeRatio',
          filters: `video==${videoId}`,
          sort: 'elapsedVideoTimeRatio',
        });

        return {
          points: (response.data.rows || []).map((row: any[]) => ({
            elapsedVideoTimeRatio: row[0],
            audienceWatchRatio: row[1],
          })),
        };
      } catch {
        // Retention data may not be available for all videos
        return undefined;
      }
    }

    /**
     * Fetches demographic breakdown
     */
    private async fetchDemographics(
      videoId: string,
      startDate: string,
      endDate: string
    ): Promise<DemographicData | undefined> {
      try {
        const [ageResponse, genderResponse] = await Promise.all([
          this.youtubeAnalytics.reports.query({
            ids: 'channel==MINE',
            startDate,
            endDate,
            metrics: 'viewerPercentage',
            dimensions: 'ageGroup',
            filters: `video==${videoId}`,
          }),
          this.youtubeAnalytics.reports.query({
            ids: 'channel==MINE',
            startDate,
            endDate,
            metrics: 'viewerPercentage',
            dimensions: 'gender',
            filters: `video==${videoId}`,
          }),
        ]);

        return {
          ageGroups: (ageResponse.data.rows || []).map((row: any[]) => ({
            ageGroup: row[0],
            viewPercentage: row[1],
          })),
          genders: (genderResponse.data.rows || []).map((row: any[]) => ({
            gender: row[0],
            viewPercentage: row[1],
          })),
        };
      } catch {
        return undefined;
      }
    }

    /**
     * Fetches traffic source breakdown
     */
    private async fetchTrafficSources(
      videoId: string,
      startDate: string,
      endDate: string
    ): Promise<TrafficSourceData[]> {
      const response = await this.youtubeAnalytics.reports.query({
        ids: 'channel==MINE',
        startDate,
        endDate,
        metrics: 'views,estimatedMinutesWatched',
        dimensions: 'insightTrafficSourceType',
        filters: `video==${videoId}`,
        sort: '-views',
      });

      return (response.data.rows || []).map((row: any[]) => ({
        source: row[0],
        views: row[1] || 0,
        watchTimeMinutes: row[2] || 0,
      }));
    }

    /**
     * Fetches geographic breakdown
     */
    private async fetchGeography(
      videoId: string,
      startDate: string,
      endDate: string
    ): Promise<GeographyData[]> {
      const response = await this.youtubeAnalytics.reports.query({
        ids: 'channel==MINE',
        startDate,
        endDate,
        metrics: 'views,estimatedMinutesWatched,viewerPercentage',
        dimensions: 'country',
        filters: `video==${videoId}`,
        sort: '-views',
        maxResults: 25,
      });

      return (response.data.rows || []).map((row: any[]) => ({
        country: row[0],
        views: row[1] || 0,
        watchTimeMinutes: row[2] || 0,
        viewPercentage: row[3] || 0,
      }));
    }

    /**
     * Gets basic video info (for video list)
     */
    async getVideoInfo(videoId: string): Promise<{
      title: string;
      thumbnailUrl: string;
      publishedAt: string;
      duration: number;
    }> {
      const response = await this.youtube.videos.list({
        part: ['snippet', 'contentDetails'],
        id: [videoId],
      });

      const video = response.data.items?.[0];
      if (!video) throw new Error('Video not found');

      return {
        title: video.snippet?.title || '',
        thumbnailUrl: video.snippet?.thumbnails?.high?.url || '',
        publishedAt: video.snippet?.publishedAt || '',
        duration: this.parseDuration(video.contentDetails?.duration || ''),
      };
    }

    private formatDate(date: Date): string {
      return date.toISOString().split('T')[0];
    }

    private parseDuration(isoDuration: string): number {
      // Parse ISO 8601 duration (PT1H2M3S)
      const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return 0;
      const hours = parseInt(match[1] || '0');
      const minutes = parseInt(match[2] || '0');
      const seconds = parseInt(match[3] || '0');
      return hours * 3600 + minutes * 60 + seconds;
    }
  }
  ```

