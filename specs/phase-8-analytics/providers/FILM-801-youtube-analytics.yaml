  ## Rate Limits

  - YouTube Analytics API: 200 queries/day per project
  - Batch requests where possible
  - Cache responses to reduce API calls

  ## Error Handling

  | Error | Handling |
  |-------|----------|
  | `quotaExceeded` | Queue for later, notify user |
  | `forbidden` | Token invalid, trigger re-auth |
  | `notFound` | Video deleted or not owned |
  | No data available | Return empty/null for optional fields |
