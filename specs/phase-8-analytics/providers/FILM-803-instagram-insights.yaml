summary: >-
  Instagram Insights API provides engagement and reach metrics for Reels and videos on
  Professional accounts. This provider fetches and normalizes data for the analytics
  dashboard.
provider:
  vendor: "Instagram (Meta Graph API)"
  file_path: "packages/features/content-analytics/src/providers/instagram/instagram-insights.ts"
  base_url: "https://graph.facebook.com/v18.0"
  auth: "access_token query parameter"
  endpoints:
    - method: "GET"
      path: "/{mediaId}?fields=media_type"
      purpose: "media type"
    - method: "GET"
      path: "/{mediaId}/insights?metric=<per media type>"
      purpose: "media insights (plays, reach, impressions, interactions, likes, comments, saved, shares)"
    - method: "GET"
      path: "/{mediaId}/insights?metric=reach&breakdown=follow_type"
      purpose: "reach breakdown for Reels"
    - method: "GET"
      path: "/{instagramAccountId}/insights?metric=follower_demographics&period=lifetime&metric_type=total_value&timeframe=this_month&breakdown={country|city|age|gender}"
      purpose: "account audience demographics"
    - method: "GET"
      path: "/{instagramAccountId}/insights?metric=impressions,reach,profile_views,website_clicks&period=day"
      purpose: "account overview metrics"
    - method: "GET"
      path: "/{instagramAccountId}?fields=followers_count"
      purpose: "follower count"
  rate_limits: null
  webhooks: []
