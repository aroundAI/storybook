  ## Performance Considerations

  - Use React Query caching to avoid repeated fetches
  - Paginate content table for large datasets
  - Use indexes on `snapshot_date` and `platform`
  - Consider materialized views for heavy aggregations

  ## Responsive Design

  | Breakpoint | Adaptation |
  |------------|------------|
  | Desktop | Full dashboard with side-by-side charts |
  | Tablet | Stacked charts, collapsible filters |
  | Mobile | Single column, simplified metrics |
