notes: |-
  ## Metadata

  - **Phase:** 8 - Analytics
  - **Priority:** P2 (Post-MVP)
  - **Effort:** L (1-3 days)
  - **Dependencies:** FILM-801-804 (Analytics Providers & Sync)
  - **Blocks:** None

  ## Specification

  ### Requirements

  1. **Unified View**: Aggregate metrics from all platforms
  2. **Platform Comparison**: Side-by-side performance comparison
  3. **Content Performance**: Per-episode/video metrics
  4. **Time Range Selection**: Custom date range filtering
  5. **Export**: Download reports as CSV/PDF
  6. **Real-time Updates**: Show latest synced data with freshness indicator

  ### Dashboard Layout

  ```typescript
  // packages/features/content-analytics/src/components/analytics-dashboard.tsx

  'use client';

  import { useState } from 'react';
  import { useQuery } from '@tanstack/react-query';
  import { Tabs, TabsContent, TabsList, TabsTrigger } from '@kit/ui/tabs';
  import { Card, CardContent, CardHeader, CardTitle } from '@kit/ui/card';
  import { DateRangePicker } from '@kit/ui/date-range-picker';
  import { MetricCards } from './metric-cards';
  import { PerformanceChart } from './performance-chart';
  import { ContentTable } from './content-table';
  import { PlatformBreakdown } from './platform-breakdown';
  import { AIInsights } from './ai-insights';
  import { getAggregateAnalyticsAction } from '../server/analytics-actions';

  interface AnalyticsDashboardProps {
    projectId: string;
    accountId: string;
  }

  export function AnalyticsDashboard({ projectId, accountId }: AnalyticsDashboardProps) {
    const [dateRange, setDateRange] = useState<DateRange>({
      from: subDays(new Date(), 30),
      to: new Date(),
    });
    const [selectedPlatforms, setSelectedPlatforms] = useState<string[]>([
      'youtube', 'tiktok', 'instagram', 'facebook'
    ]);

    const { data: analytics, isLoading, dataUpdatedAt } = useQuery({
      queryKey: ['analytics', projectId, dateRange, selectedPlatforms],
      queryFn: () => getAggregateAnalyticsAction({
        projectId,
        startDate: dateRange.from,
        endDate: dateRange.to,
        platforms: selectedPlatforms,
      }),
      refetchInterval: 5 * 60 * 1000, // Refresh every 5 minutes
    });

    return (
      <div className="space-y-6">
        {/* Header */}
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-2xl font-bold">Analytics</h1>
            <p className="text-sm text-muted-foreground">
              Last synced: {formatDistanceToNow(dataUpdatedAt)} ago
            </p>
          </div>
          <div className="flex items-center gap-4">
            <PlatformFilter
              selected={selectedPlatforms}
              onChange={setSelectedPlatforms}
            />
            <DateRangePicker
              value={dateRange}
              onChange={setDateRange}
              presets={DATE_RANGE_PRESETS}
            />
            <ExportButton data={analytics} />
          </div>
        </div>

        {/* Overview Metrics */}
        <MetricCards
          data={analytics?.totals}
          previousData={analytics?.previousPeriodTotals}
          isLoading={isLoading}
        />

        {/* Main Content */}
        <Tabs defaultValue="overview" className="space-y-4">
          <TabsList>
            <TabsTrigger value="overview">Overview</TabsTrigger>
            <TabsTrigger value="content">Content</TabsTrigger>
            <TabsTrigger value="audience">Audience</TabsTrigger>
            <TabsTrigger value="insights">AI Insights</TabsTrigger>
          </TabsList>

          <TabsContent value="overview" className="space-y-4">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <Card>
                <CardHeader>
                  <CardTitle>Performance Over Time</CardTitle>
                </CardHeader>
                <CardContent>
                  <PerformanceChart
                    data={analytics?.dailyMetrics}
                    platforms={selectedPlatforms}
                  />
                </CardContent>
              </Card>

              <Card>
                <CardHeader>
                  <CardTitle>Platform Breakdown</CardTitle>
                </CardHeader>
                <CardContent>
                  <PlatformBreakdown data={analytics?.platformMetrics} />
                </CardContent>
              </Card>
            </div>

            <Card>
              <CardHeader>
                <CardTitle>Top Performing Content</CardTitle>
              </CardHeader>
              <CardContent>
                <ContentTable
                  data={analytics?.topContent}
                  limit={5}
                />
              </CardContent>
            </Card>
          </TabsContent>

          <TabsContent value="content">
            <ContentTable
              data={analytics?.allContent}
              sortable
              filterable
              paginated
            />
          </TabsContent>

          <TabsContent value="audience">
            <AudienceAnalytics data={analytics?.audience} />
          </TabsContent>

          <TabsContent value="insights">
            <AIInsights
              projectId={projectId}
              analytics={analytics}
            />
          </TabsContent>
        </Tabs>
      </div>
    );
  }

  const DATE_RANGE_PRESETS = [
    { label: 'Last 7 days', value: 7 },
    { label: 'Last 30 days', value: 30 },
    { label: 'Last 90 days', value: 90 },
    { label: 'This year', value: 365 },
  ];
  ```

  ### Aggregate Analytics Server Action

  ```typescript
  // packages/features/content-analytics/src/server/analytics-actions.ts

  'use server';

  import { enhanceAction } from '@kit/next/actions';
  import { getSupabaseServerClient } from '@kit/supabase/server-client';
  import { z } from 'zod';

  const GetAggregateAnalyticsSchema = z.object({
    projectId: z.string().uuid(),
    startDate: z.date(),
    endDate: z.date(),
    platforms: z.array(z.enum(['youtube', 'tiktok', 'instagram', 'facebook'])),
  });

  export const getAggregateAnalyticsAction = enhanceAction(
    async ({ projectId, startDate, endDate, platforms }) => {
      const client = getSupabaseServerClient();

      // Get all publishes for this project within date range
      const { data: publishes } = await client
        .from('publishes')
        .select(`
          id,
          platform,
          title,
          published_at,
          platform_content_id,
          episodes (id, title, thumbnail_url),
          content_analytics (*)
        `)
        .eq('episodes.project_id', projectId)
        .in('platform', platforms)
        .gte('published_at', startDate.toISOString())
        .lte('published_at', endDate.toISOString());

      // Calculate totals
      const totals = calculateTotals(publishes);

      // Calculate previous period for comparison
      const periodLength = differenceInDays(endDate, startDate);
      const previousStartDate = subDays(startDate, periodLength);
      const previousEndDate = subDays(endDate, periodLength);

      const { data: previousPublishes } = await client
        .from('publishes')
        .select('content_analytics (*)')
        .eq('episodes.project_id', projectId)
        .in('platform', platforms)
        .gte('published_at', previousStartDate.toISOString())
        .lte('published_at', previousEndDate.toISOString());

      const previousPeriodTotals = calculateTotals(previousPublishes);

      // Get daily metrics for charting
      const dailyMetrics = aggregateDailyMetrics(publishes, startDate, endDate);

      // Get platform breakdown
      const platformMetrics = aggregateByPlatform(publishes);

      // Get top content
      const topContent = getTopContent(publishes, 10);

      // Get audience data (aggregate from latest snapshots)
      const audience = await getAudienceData(client, projectId, platforms);

      return {
        totals,
        previousPeriodTotals,
        dailyMetrics,
        platformMetrics,
        topContent,
        allContent: publishes,
        audience,
      };
    },
    { schema: GetAggregateAnalyticsSchema, auth: true }
  );

  function calculateTotals(publishes: any[]): AnalyticsTotals {
    const latestAnalytics = publishes?.map(p => {
      const sorted = p.content_analytics?.sort((a, b) =>
        new Date(b.snapshot_date).getTime() - new Date(a.snapshot_date).getTime()
      );
      return sorted?.[0];
    }).filter(Boolean) || [];

    return {
      views: latestAnalytics.reduce((sum, a) => sum + (a?.views || 0), 0),
      likes: latestAnalytics.reduce((sum, a) => sum + (a?.likes || 0), 0),
      comments: latestAnalytics.reduce((sum, a) => sum + (a?.comments || 0), 0),
      shares: latestAnalytics.reduce((sum, a) => sum + (a?.shares || 0), 0),
      watchTimeSeconds: latestAnalytics.reduce((sum, a) => sum + (a?.watch_time_seconds || 0), 0),
      subscribersGained: latestAnalytics.reduce((sum, a) => sum + (a?.subscribers_gained || 0), 0),
      revenueCents: latestAnalytics.reduce((sum, a) => sum + (a?.revenue_cents || 0), 0),
      contentCount: publishes?.length || 0,
    };
  }

  function aggregateDailyMetrics(
    publishes: any[],
    startDate: Date,
    endDate: Date
  ): DailyMetric[] {
    const dailyMap = new Map<string, DailyMetric>();

    // Initialize all days
    let current = startDate;
    while (current <= endDate) {
      const dateStr = format(current, 'yyyy-MM-dd');
      dailyMap.set(dateStr, {
        date: dateStr,
        views: 0,
        likes: 0,
        comments: 0,
        shares: 0,
      });
      current = addDays(current, 1);
    }

    // Aggregate analytics by day
    publishes?.forEach(publish => {
      publish.content_analytics?.forEach(snapshot => {
        const dateStr = snapshot.snapshot_date;
        const existing = dailyMap.get(dateStr);
        if (existing) {
          existing.views += snapshot.views || 0;
          existing.likes += snapshot.likes || 0;
          existing.comments += snapshot.comments || 0;
          existing.shares += snapshot.shares || 0;
        }
      });
    });

    return Array.from(dailyMap.values()).sort((a, b) =>
      a.date.localeCompare(b.date)
    );
  }

  function aggregateByPlatform(publishes: any[]): PlatformMetric[] {
    const platformMap = new Map<string, PlatformMetric>();

    publishes?.forEach(publish => {
      const platform = publish.platform;
      const latestAnalytics = publish.content_analytics?.sort((a, b) =>
        new Date(b.snapshot_date).getTime() - new Date(a.snapshot_date).getTime()
      )?.[0];

      if (!latestAnalytics) return;

      const existing = platformMap.get(platform) || {
        platform,
        views: 0,
        likes: 0,
        comments: 0,
        shares: 0,
        contentCount: 0,
      };

      existing.views += latestAnalytics.views || 0;
      existing.likes += latestAnalytics.likes || 0;
      existing.comments += latestAnalytics.comments || 0;
      existing.shares += latestAnalytics.shares || 0;
      existing.contentCount += 1;

      platformMap.set(platform, existing);
    });

    return Array.from(platformMap.values());
  }
  ```

  ### Content Table Component

  ```typescript
  // packages/features/content-analytics/src/components/content-table.tsx

  'use client';

  import {
    Table,
    TableBody,
    TableCell,
    TableHead,
    TableHeader,
    TableRow,
  } from '@kit/ui/table';
  import { Badge } from '@kit/ui/badge';
  import { formatNumber, formatDuration } from '../lib/format';

  interface ContentTableProps {
    data: ContentAnalytics[];
    limit?: number;
    sortable?: boolean;
    filterable?: boolean;
    paginated?: boolean;
  }

  export function ContentTable({
    data,
    limit,
    sortable = false,
    filterable = false,
    paginated = false,
  }: ContentTableProps) {
    const [sortField, setSortField] = useState<string>('views');
    const [sortDirection, setSortDirection] = useState<'asc' | 'desc'>('desc');
    const [filter, setFilter] = useState('');
    const [page, setPage] = useState(1);
    const pageSize = 10;

    const sortedData = useMemo(() => {
      let result = [...(data || [])];

      if (filter) {
        result = result.filter(item =>
          item.title.toLowerCase().includes(filter.toLowerCase())
        );
      }

      if (sortable) {
        result.sort((a, b) => {
          const aVal = a[sortField] || 0;
          const bVal = b[sortField] || 0;
          return sortDirection === 'desc' ? bVal - aVal : aVal - bVal;
        });
      }

      if (limit) {
        result = result.slice(0, limit);
      }

      if (paginated) {
        const start = (page - 1) * pageSize;
        result = result.slice(start, start + pageSize);
      }

      return result;
    }, [data, filter, sortField, sortDirection, limit, page]);

    return (
      <div className="space-y-4">
        {filterable && (
          <Input
            placeholder="Search content..."
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
            className="max-w-sm"
          />
        )}

        <Table>
          <TableHeader>
            <TableRow>
              <TableHead>Content</TableHead>
              <TableHead>Platform</TableHead>
              <TableHead
                className={sortable ? 'cursor-pointer' : ''}
                onClick={() => sortable && handleSort('views')}
              >
                Views
              </TableHead>
              <TableHead
                className={sortable ? 'cursor-pointer' : ''}
                onClick={() => sortable && handleSort('likes')}
              >
                Likes
              </TableHead>
              <TableHead
                className={sortable ? 'cursor-pointer' : ''}
                onClick={() => sortable && handleSort('comments')}
              >
                Comments
              </TableHead>
              <TableHead>Engagement</TableHead>
              <TableHead>Published</TableHead>
            </TableRow>
          </TableHeader>
          <TableBody>
            {sortedData.map((item) => (
              <TableRow key={item.id}>
                <TableCell>
                  <div className="flex items-center gap-3">
                    <img
                      src={item.thumbnail_url || '/placeholder.png'}
                      alt={item.title}
                      className="w-16 h-9 object-cover rounded"
                    />
                    <div>
                      <div className="font-medium line-clamp-1">{item.title}</div>
                      <div className="text-sm text-muted-foreground">
                        {item.episode_title}
                      </div>
                    </div>
                  </div>
                </TableCell>
                <TableCell>
                  <PlatformBadge platform={item.platform} />
                </TableCell>
                <TableCell>{formatNumber(item.views)}</TableCell>
                <TableCell>{formatNumber(item.likes)}</TableCell>
                <TableCell>{formatNumber(item.comments)}</TableCell>
                <TableCell>
                  <EngagementRate
                    likes={item.likes}
                    comments={item.comments}
                    views={item.views}
                  />
                </TableCell>
                <TableCell>
                  {format(new Date(item.published_at), 'MMM d, yyyy')}
                </TableCell>
              </TableRow>
            ))}
          </TableBody>
        </Table>

        {paginated && (
          <Pagination
            page={page}
            totalPages={Math.ceil((data?.length || 0) / pageSize)}
            onPageChange={setPage}
          />
        )}
      </div>
    );
  }

  function EngagementRate({ likes, comments, views }: {
    likes: number;
    comments: number;
    views: number;
  }) {
    const rate = views > 0 ? ((likes + comments) / views) * 100 : 0;
    const color = rate > 5 ? 'text-green-600' : rate > 2 ? 'text-yellow-600' : 'text-muted-foreground';

    return (
      <span className={color}>
        {rate.toFixed(1)}%
      </span>
    );
  }
  ```

