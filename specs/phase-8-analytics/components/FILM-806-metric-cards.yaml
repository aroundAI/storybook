  ## Specification

  ### Requirements

  1. **Key Metrics**: Views, Likes, Comments, Shares, Watch Time, Subscribers, Revenue
  2. **Period Comparison**: Show % change from previous period
  3. **Trend Indicators**: Up/down arrows with color coding
  4. **Responsive Grid**: Adapt to screen size
  5. **Loading States**: Skeleton animation during fetch
  6. **Tooltips**: Explain metric meaning on hover

  ### Metric Card Component

  ```typescript
  // packages/features/content-analytics/src/components/metric-cards.tsx

  'use client';

  import {
    Clock,
    DollarSign,
    Eye,
    Heart,
    Info,
    MessageCircle,
    Minus,
    Share2,
    TrendingDown,
    TrendingUp,
    UserPlus,
  } from 'lucide-react';

  import { Card, CardContent } from '@kit/ui/card';
  import { Skeleton } from '@kit/ui/skeleton';
  import { Tooltip, TooltipContent, TooltipTrigger } from '@kit/ui/tooltip';

  import {
    calculateChange,
    formatCurrency,
    formatDuration,
    formatNumber,
    formatPercent,
  } from '../lib/format';
  import type { AnalyticsTotals } from '../types';

  interface MetricCardsProps {
    data: AnalyticsTotals | null;
    previousData: AnalyticsTotals | null;
    isLoading: boolean;
  }

  export function MetricCards({ data, previousData, isLoading }: MetricCardsProps) {
    if (isLoading) {
      return (
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
          {Array.from({ length: 7 }).map((_, i) => (
            <MetricCardSkeleton key={i} />
          ))}
        </div>
      );
    }

    const metrics: MetricConfig[] = [
      {
        key: 'views',
        label: 'Views',
        value: data?.views || 0,
        previousValue: previousData?.views || 0,
        formatter: formatNumber,
        description: 'Total video views across all platforms',
        icon: Eye,
      },
      {
        key: 'likes',
        label: 'Likes',
        value: data?.likes || 0,
        previousValue: previousData?.likes || 0,
        formatter: formatNumber,
        description: 'Total likes, hearts, and reactions',
        icon: Heart,
      },
      {
        key: 'comments',
        label: 'Comments',
        value: data?.comments || 0,
        previousValue: previousData?.comments || 0,
        formatter: formatNumber,
        description: 'Total comments and replies',
        icon: MessageCircle,
      },
      {
        key: 'shares',
        label: 'Shares',
        value: data?.shares || 0,
        previousValue: previousData?.shares || 0,
        formatter: formatNumber,
        description: 'Times content was shared or reposted',
        icon: Share2,
      },
      {
        key: 'watchTime',
        label: 'Watch Time',
        value: data?.watchTimeSeconds || 0,
        previousValue: previousData?.watchTimeSeconds || 0,
        formatter: formatDuration,
        description: 'Total time viewers spent watching',
        icon: Clock,
      },
      {
        key: 'subscribers',
        label: 'Subscribers',
        value: data?.subscribersGained || 0,
        previousValue: previousData?.subscribersGained || 0,
        formatter: formatNumber,
        description: 'New followers and subscribers gained',
        icon: UserPlus,
      },
      {
        key: 'revenue',
        label: 'Revenue',
        value: data?.revenueCents || 0,
        previousValue: previousData?.revenueCents || 0,
        formatter: (v) => formatCurrency(v / 100),
        description: 'Estimated ad revenue (YouTube only)',
        icon: DollarSign,
      },
    ];

    return (
      <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
        {metrics.map((metric) => (
          <MetricCard key={metric.key} metric={metric} />
        ))}
      </div>
    );
  }

  export interface MetricConfig {
    key: string;
    label: string;
    value: number;
    previousValue: number;
    formatter: (value: number) => string;
    description: string;
    icon: React.ComponentType<{ className?: string }>;
  }

  export function MetricCard({ metric }: { metric: MetricConfig }) {
    const {
      label,
      value,
      previousValue,
      formatter,
      description,
      icon: Icon,
    } = metric;

    const change = calculateChange(value, previousValue);
    const TrendIcon =
      change.direction === 'up'
        ? TrendingUp
        : change.direction === 'down'
          ? TrendingDown
          : Minus;

    const trendColor =
      change.direction === 'up'
        ? 'text-green-600'
        : change.direction === 'down'
          ? 'text-red-600'
          : 'text-muted-foreground';

    return (
      <Card>
        <CardContent className="px-4 pb-3 pt-4">
          <div className="mb-2 flex items-start justify-between">
            <div className="flex items-center gap-1.5">
              <Icon className="text-muted-foreground h-4 w-4" />
              <span className="text-muted-foreground text-sm font-medium">
                {label}
              </span>
            </div>
            <Tooltip>
              <TooltipTrigger asChild>
                <button
                  className="text-muted-foreground hover:text-foreground"
                  aria-label={`Info about ${label}`}
                >
                  <Info className="h-3.5 w-3.5" />
                </button>
              </TooltipTrigger>
              <TooltipContent>
                <p className="max-w-xs text-sm">{description}</p>
              </TooltipContent>
            </Tooltip>
          </div>

          <div className="flex items-baseline justify-between">
            <span className="text-2xl font-bold tabular-nums">
              {formatter(value)}
            </span>
            <div
              className={`flex items-center gap-0.5 text-sm ${trendColor}`}
              aria-label={`${change.direction === 'up' ? 'Increased' : change.direction === 'down' ? 'Decreased' : 'No change'} by ${formatPercent(Math.abs(change.percentage))}`}
            >
              <TrendIcon className="h-3.5 w-3.5" />
              <span>{formatPercent(Math.abs(change.percentage))}</span>
            </div>
          </div>
        </CardContent>
      </Card>
    );
  }

  export function MetricCardSkeleton() {
    return (
      <Card>
        <CardContent className="space-y-2 px-4 pb-3 pt-4">
          <Skeleton className="h-4 w-16" />
          <Skeleton className="h-8 w-24" />
        </CardContent>
      </Card>
    );
  }
  ```

  ### Formatting Utilities

  ```typescript
  // packages/features/content-analytics/src/lib/format.ts

  /**
   * Formats large numbers with abbreviations (1.2K, 3.4M, etc.)
   * Handles both positive and negative values.
   */
  export function formatNumber(value: number): string {
    const absValue = Math.abs(value);
    const sign = value < 0 ? '-' : '';

    if (absValue >= 1_000_000_000) {
      return `${sign}${(absValue / 1_000_000_000).toFixed(1)}B`;
    }
    if (absValue >= 1_000_000) {
      return `${sign}${(absValue / 1_000_000).toFixed(1)}M`;
    }
    if (absValue >= 1_000) {
      return `${sign}${(absValue / 1_000).toFixed(1)}K`;
    }
    return value.toLocaleString();
  }

  /**
   * Formats seconds into human-readable duration.
   * Returns "0m" for zero or negative values.
   */
  export function formatDuration(seconds: number): string {
    if (seconds <= 0) {
      return '0m';
    }

    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);

    if (hours >= 1000) {
      return `${formatNumber(hours)}h`;
    }
    if (hours > 0) {
      return `${hours}h ${minutes}m`;
    }
    return `${minutes}m`;
  }

  /**
   * Formats dollars to currency string
   */
  export function formatCurrency(dollars: number): string {
    return new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      minimumFractionDigits: 0,
      maximumFractionDigits: 0,
    }).format(dollars);
  }

  /**
   * Formats percentage with sign
   */
  export function formatPercent(value: number): string {
    const formatted = Math.abs(value).toFixed(1);
    return `${formatted}%`;
  }

  export interface ChangeResult {
    percentage: number;
    direction: 'up' | 'down' | 'neutral';
  }

  /**
   * Calculates percentage change between current and previous values
   */
  export function calculateChange(
    current: number,
    previous: number,
  ): ChangeResult {
    if (previous === 0) {
      return {
        percentage: current > 0 ? 100 : 0,
        direction: current > 0 ? 'up' : 'neutral',
      };
    }

    const percentage = ((current - previous) / previous) * 100;

    return {
      percentage,
      direction: percentage > 1 ? 'up' : percentage < -1 ? 'down' : 'neutral',
    };
  }
  ```

  ### Compact Metric Card Variant

  ```typescript
  // For use in smaller spaces or sidebars

  interface CompactMetricProps {
    label: string;
    value: string | number;
    change?: number;
  }

  export function CompactMetric({ label, value, change }: CompactMetricProps) {
    const changeColor = change && change > 0 ? 'text-green-600' : change && change < 0 ? 'text-red-600' : '';

    return (
      <div className="flex items-center justify-between py-2">
        <span className="text-sm text-muted-foreground">{label}</span>
        <div className="flex items-center gap-2">
          <span className="font-medium tabular-nums">{value}</span>
          {change !== undefined && (
            <span className={`text-xs ${changeColor}`}>
              {change >= 0 ? '+' : ''}{change.toFixed(1)}%
            </span>
          )}
        </div>
      </div>
    );
  }
  ```

