summary: >-
  Revenue tracking enables creators to monitor their earnings across multiple platforms
  (YouTube AdSense, TikTok Creator Fund, Instagram Bonuses). This is a P2 feature that
  provides business insights for content monetization, helping creators understand which
  content generates the most revenue and optimize their publishing strategy.

  Revenue data comes from platform APIs where available, and can be manually entered for
  platforms without API access. The feature includes projections, trend analysis, and
  comparison across content types and platforms.
