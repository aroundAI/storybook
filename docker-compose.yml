# Local Development with Docker Compose
#
# This file provides local services for development:
# - Redis: For job queues (BullMQ) and caching
#
# Usage:
#   docker compose up -d        # Start services
#   docker compose down         # Stop services
#   docker compose logs redis   # View Redis logs
#
# Note: Supabase is managed separately via `pnpm supabase:start`

services:
  redis:
    image: redis:7-alpine
    container_name: storybook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Redis Commander for web-based Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: storybook-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  redis-data:
