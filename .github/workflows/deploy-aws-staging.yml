name: Deploy to AWS Staging

on:
  # Manual deployment only - trigger from GitHub Actions UI
  # This prevents unnecessary AWS costs for in-progress PRs
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.14.0'

jobs:
  deploy:
    name: Deploy to AWS Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Reduced from 30 to prevent hung jobs

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The same list CI's Unit Tests job runs, with no continue-on-error:
      # a failing test used to be reported and then deployed anyway.
      - name: Run tests
        run: bash scripts/test-units.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      # Migrations go out BEFORE the app (FILM-1610 review). The app reads
      # columns and calls functions that only a migration creates, so an app
      # deployed first fails every read that touches them. This step used to
      # be a placeholder `echo` placed after the deploy, so migrations were
      # never applied by this workflow at all.
      #
      # Migrations here are written to be expand-only — the app already
      # running keeps working against the new schema while this job builds
      # the next one. A migration that breaks the running app needs its own
      # rollout plan, not this step.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version CI's Supabase DB job applies migrations with.
          version: 2.117.0

      - name: Apply database migrations (staging)
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          # Fail closed: without these the app would go live against a
          # schema it does not match.
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret STAGING_$name — migrations cannot be applied, so the app is not deployed."
              exit 1
            fi
          done

          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Build for AWS Staging
        working-directory: apps/web
        run: |
          pnpm add -D open-next@latest
          pnpm build
          pnpm exec open-next build
        env:
          # SECURITY: Only expose public variables during build
          # Runtime secrets are injected into Lambda after deployment
          NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_SITE_URL }}
          NEXT_PUBLIC_PRODUCT_NAME: ${{ secrets.NEXT_PUBLIC_PRODUCT_NAME }}

      - name: Deploy to Staging Lambda
        working-directory: apps/web/.open-next
        run: |
          zip -r function.zip server-function/*
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_LAMBDA_STAGING_FUNCTION_NAME }} \
            --zip-file fileb://function.zip

      # SECURITY NOTE: Environment variables are managed via sst.config.ts, not via GitHub Actions
      # Secrets are stored in AWS Systems Manager Parameter Store and fetched at runtime
      # This prevents CloudTrail exposure of secrets
      # See: deployment/SECRETS_SETUP.md for setup instructions

      - name: Upload assets to staging S3
        working-directory: apps/web/.open-next
        run: |
          aws s3 sync assets/ s3://${{ secrets.S3_STAGING_ASSETS_BUCKET }}/assets/ \
            --cache-control "public, max-age=3600"

      - name: Invalidate staging CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_STAGING_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "🚀 Staging deployment complete!"
          echo "Preview: https://${{ secrets.STAGING_SITE_URL }}"
          echo "⚡️ Powered by AWS Lambda + OpenNext"

      - name: Health check
        run: |
          echo "Waiting for staging deployment to propagate..."

          # Retry health check up to 5 times with 20s intervals (faster for staging)
          for i in {1..5}; do
            sleep 20
            echo "Health check attempt $i/5..."

            response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.STAGING_SITE_URL }}/healthcheck)

            if [ "$response" = "200" ]; then
              echo "✅ Staging health check passed on attempt $i"
              exit 0
            fi

            echo "⏳ Attempt $i failed with status $response"

            if [ "$i" = "5" ]; then
              echo "⚠️  Staging health check failed after 5 attempts"
              exit 1
            fi

            echo "Retrying in 20 seconds..."
          done
