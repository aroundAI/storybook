name: Workflow
# The merge queue is the gate (owner, 2026-10-01). A pull request runs the
# fast lane only: 🔎 Changes, ʦ TypeScript, 💅 Format, 🧪 Unit Tests and
# 🗄️ ClickHouse SQL (or 📚 Docs checks on the docs-only path). The heavy
# jobs run once, at merge time, on the exact commit that lands: GitHub's
# `merge_group` event builds main + the PR, and only a green ✅ CI result
# merges it. `workflow_dispatch` runs the same full suite on any branch, for
# a PR whose author wants it before queueing. Nothing runs on a push to
# main: the queue already tested that commit.
#
# Phase 2 (path-scoped heavy jobs): 🔎 Changes works out which heavy jobs a
# queued change needs (scripts/ci/scope-heavy.sh) and writes it to the run's
# summary. It is report-only until the owner sets the repository variable
# CI_SCOPE_HEAVY to `true`; then the jobs it rules out are skipped. A nightly
# full run on main catches anything scoping missed.
on:
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:
  # The nightly full suite on main, scoped or not: whatever a scoped queue
  # run skipped is tested within a day, with GitHub's failure email.
  schedule:
    - cron: '30 2 * * *'
  # Only pull requests into main (owner, 2026-10-01). A PR stacked on another
  # feature branch runs nothing until it is retargeted to main: its code is
  # tested once, on top of main, instead of once per base it passes through.
  # Retargeting alone starts no run (`edited` is not a trigger here); the
  # rebase onto main that follows it does.
  pull_request:
    branches: [ main ]
# CI minutes are rationed: a newer push to the same PR cancels the older run.
# Queue and dispatch runs are never cancelled: each merge group has its own
# ref, so its run completes and decides the merge. The nightly run has its
# own group, so a dispatch on main neither waits for it nor displaces it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: 🔎 Changes
    # Docs-only fast path. A change is docs-only when its changed-file list
    # is non-empty and every file matches `**/*.md`, `specs/**` or `docs/**`
    # (scripts/ci/docs-only.sh, table test beside it). Then every heavy job
    # below is skipped by its `if`, which branch protection counts as
    # passing, and 📚 Docs checks runs what can still fail on a docs edit.
    # Jobs are skipped rather than the workflow: a workflow skipped by
    # `paths-ignore` reports nothing, and the required checks hang at
    # "Expected". No usable base, an empty diff or any other file means
    # code=true. The heavy jobs skip only on an explicit code == 'false', so
    # a failed or blank classification runs the full suite. Editing this
    # file or the classifier is itself code, so a change to the rule always
    # runs the full suite.
    #
    # Second fast path: a push to a PR that leaves the PR's code exactly as
    # it was, after a run that passed. The usual case is a rebase that
    # resolves a conflict in a shared spec file. See the "Reuse" step below.
    #
    # `heavy` decides the heavy jobs (🧪 Unit guards, 🐘 Supabase DB,
    # 🧬 E2E evidence, ⚫️ Test, 🧬 E2E guards): false on a pull request (the
    # fast lane), true in the merge queue, on a manual dispatch and nightly.
    #
    # The scope_* and skip_* outputs are Phase 2's: set in the merge queue
    # only, by the "Scope the heavy jobs" step. Jobs skip only on an explicit
    # skip_*=true, which needs vars.CI_SCOPE_HEAVY == 'true'; blank (a PR, a
    # dispatch, the nightly run, report-only, a failed step) runs everything.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.reuse.outputs.code || steps.classify.outputs.code }}
      heavy: ${{ github.event_name != 'pull_request' }}
      scope_full: ${{ steps.scope.outputs.full }}
      scope_enforced: ${{ steps.scope.outputs.enforced }}
      scope_test: ${{ steps.scope.outputs.test }}
      scope_supabase: ${{ steps.scope.outputs.supabase }}
      scope_unit_guards: ${{ steps.scope.outputs.unit_guards }}
      scope_e2e_guards: ${{ steps.scope.outputs.e2e_guards }}
      skip_test: ${{ steps.scope.outputs.skip_test }}
      skip_supabase: ${{ steps.scope.outputs.skip_supabase }}
      skip_unit_guards: ${{ steps.scope.outputs.skip_unit_guards }}
      skip_e2e_guards: ${{ steps.scope.outputs.skip_e2e_guards }}
      unit_shards: ${{ steps.scope.outputs.unit_shards }}
      e2e_shards: ${{ steps.scope.outputs.e2e_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        id: classify
        # The PR's base, or the queue's main; a dispatch has no base, so it
        # runs the full suite.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ('$BASE'): running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a source file renamed to .md is a deleted source
          # file, and must be listed under its old name too.
          if ! files=$(git diff --name-only --no-renames "$BASE...HEAD"); then
            echo "git diff failed: running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          result=$(printf '%s\n' "$files" | bash scripts/ci/docs-only.sh)
          echo "Result: $result"
          echo "$result" >> "$GITHUB_OUTPUT"

      # A push that changed only prose since a green run keeps that run's
      # verdict for the code: typically a rebase whose one conflict was in the
      # records (specs/INDEX.md, a specs/known-bugs/ file). It applies
      # only when all three hold, and anything else runs the full suite:
      #   1. the previous head can be fetched;
      #   2. the PR's code patch (its diff from the merge-base, non-docs paths
      #      only, compared by patch-id) is identical before and after
      #      (scripts/ci/code-patch-unchanged.sh, table test beside it);
      #   3. this workflow's run on the previous head concluded `success`, so
      #      a failed or cancelled run is never inherited.
      # Then code=false and 📚 Docs checks runs in place of the heavy jobs,
      # exactly as on the docs-only path. Pull requests only: the PR's code
      # on top of the current main is fully tested by its merge-queue run,
      # which this step never touches.
      - name: Reuse the previous run when only docs changed since it
        id: reuse
        if: ${{ steps.classify.outputs.code == 'true' && github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREV: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          git fetch --no-tags --quiet origin "$PREV" 2>/dev/null || true
          verdict=$(bash scripts/ci/code-patch-unchanged.sh "$PREV" "$HEAD_SHA" "$BASE")
          echo "$verdict"
          if ! printf '%s\n' "$verdict" | grep -qx 'unchanged=true'; then
            echo "Code changed, or could not tell: running the full suite."
            exit 0
          fi
          if ! runs=$(gh api "repos/$REPO/actions/runs?head_sha=$PREV&event=pull_request&per_page=50"); then
            echo "Could not read the previous run: running the full suite."
            exit 0
          fi
          last=$(printf '%s' "$runs" | jq -r --arg wf "$WORKFLOW" \
            '[.workflow_runs[] | select(.name == $wf)] | sort_by(.created_at) | last // empty
             | "\(.conclusion) \(.html_url)"')
          conclusion=${last%% *}
          url=${last#* }
          echo "Previous run on $PREV: ${last:-none}"
          if [ "$conclusion" != success ]; then
            echo "The previous run did not pass: running the full suite."
            exit 0
          fi
          echo "code=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Code unchanged since a green run"
            echo "The PR's code patch is identical to $PREV, whose run passed: $url"
            echo "Heavy jobs are skipped; 📚 Docs checks runs in their place."
          } >> "$GITHUB_STEP_SUMMARY"

      # Phase 2: which heavy jobs this queued change needs — Playwright when
      # turbo's affected set reaches web or web-e2e, 🐘 Supabase DB for SQL,
      # only the mutation guards whose file or test changed, and everything
      # on a root-config change (rule and table test: scripts/ci/scope-heavy.sh).
      # Report-only unless vars.CI_SCOPE_HEAVY is `true`. continue-on-error:
      # a failure here leaves every scope output blank, which runs everything.
      - name: Scope the heavy jobs
        id: scope
        if: ${{ github.event_name == 'merge_group' && steps.classify.outputs.code == 'true' }}
        continue-on-error: true
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          SCOPE_ENFORCE: ${{ vars.CI_SCOPE_HEAVY }}
        run: |
          out=$(bash scripts/ci/scope-heavy.sh "$BASE" HEAD)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | bash scripts/ci/scope-heavy.sh --summary >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

  typescript:
    name: ʦ TypeScript
    # 20, not 10: a change to shared lint/tsconfig or to most packages
    # (FILM-1902's model boundary, #567) makes turbo typecheck and lint every
    # package from a cold cache, which takes about 15 minutes; at 10 the job
    # was cancelled with no error, twice, on a correct change.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_WEBHOOK_SECRET: ${{ secrets.SUPABASE_DB_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      DO_NOT_TRACK: 1
      NODE_OPTIONS: '--max-old-space-size=4096'
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  format:
    name: 💅 Format
    # Its own job: inside ʦ TypeScript it pushed that job past its 10-minute
    # limit. Check only. Formatting drifted while nothing checked it:
    # Tailwind class order depended on which file a Prettier run started
    # with, seven packages had no format script at all, and the import
    # sorter added a duplicate header comment on every run. `pnpm
    # format:fix` repairs a failure here. Skipped on the docs-only path:
    # .prettierignore already excludes *.md and specs/**/*.yaml.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # --force: turbo would otherwise replay a cached result without
      # running Prettier at all, which is how a local check once reported
      # a settled tree that was not.
      - name: Format
        run: pnpm turbo format --force --continue -- --ignore-path=../../.gitignore --ignore-path=../../.prettierignore

  clickhouse-sql:
    name: 🗄️ ClickHouse SQL
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      DO_NOT_TRACK: 1
      CLICKHOUSE_ENABLED: 'true'
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: verify
      CLICKHOUSE_DB: default

    # The unit suite mocks the ClickHouse client and never executes SQL, so
    # a query the server rejects outright passes it. That is not
    # theoretical: an alias shadowing a filter column reached main behind
    # 120 green tests and broke every deep-dive query. This job runs the
    # real migrations and the real queries against a real ClickHouse.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        # Both must be set on the *container*: its entrypoint disables
        # network access for `default` when they are absent, so the health
        # check never passes and the job fails before running anything.
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: verify
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        # No container health check: the alpine image ships neither wget nor
        # curl, so any HTTP probe inside it fails and the container is
        # reported unhealthy before it has done anything wrong. The runner
        # has curl, so readiness is waited for from a step instead.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Wait for ClickHouse
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf "http://localhost:8123/ping" > /dev/null; then
              echo "ClickHouse ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse did not become ready in 120s"
          exit 1

      - name: Apply ClickHouse migrations
        run: pnpm --filter @kit/clickhouse migrate

      - name: Execute every query and insert
        run: pnpm --filter @kit/clickhouse verify

  supabase-db:
    name: 🐘 Supabase DB
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.skip_supabase != 'true' }}
    env:
      DO_NOT_TRACK: 1

    # The pagination helpers are unit-tested against a fake pager, which
    # proves the loop terminates but not the thing that motivated them:
    # PostgREST truncates every response at db-max-rows with HTTP 200 and a
    # null error, service-role included. That is a property of the server,
    # so only a real one can show it — and show that the fix clears it.
    #
    # This also runs the migrations from scratch, so schema drift and SQL
    # that only fails on a real Postgres surface here rather than on deploy.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      # Pinned, not `latest`. `version: latest` makes the action resolve the
      # release through the GitHub API unauthenticated, and that fails outright
      # when the runner is rate limited:
      #
      #   ##[error]Failed to resolve latest Supabase CLI release: rate limit exceeded
      #
      # Every later step then *skips*, so the job reports red for a reason that
      # has nothing to do with the commit. A fixed version is resolved from npm
      # instead, which removes the API call — and stops the CLI under CI
      # drifting between runs of the same code.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: pnpm install

      # Cheap, and needs no production access: the types file is a
      # fingerprint of whichever database it was last generated against, so a
      # table it declares that no migration creates means those two have
      # diverged. That is exactly how manual_tasks, compilations and
      # compilation_segments sat in production for six weeks with no
      # migration on main — see #240.
      - name: Check for schema drift
        working-directory: apps/web
        run: pnpm run check:schema-drift

      - name: Test the Supabase start script
        run: bash scripts/ci/supabase-start.test.sh

      - name: Start Supabase (applies every migration)
        working-directory: apps/web
        # Pulls from public.ecr.aws first and retries with backoff: see the script.
        run: ../../scripts/ci/supabase-start.sh

      # `CLAUDE.md` has told people to run typegen after a migration since
      # this repo began, and nothing checked. FILM-1608 shipped a
      # `database.types.ts` that had been hand-spliced rather than generated,
      # because the documented command produced a *worse* file than CI's
      # toolchain — the devDependency was 2.40.7 while this job pins 2.117.0,
      # so `pnpm supabase:web:typegen` silently deleted the `SetofOptions`
      # blocks that type an `.rpc()` result as a row rather than an array.
      #
      # Scoped to the `public` schema, and that is not a softening. The first
      # version of this step diffed the whole generated file and failed on one
      # column — `storage.buckets.versioning_status` — because CI pulled its
      # service images from ghcr.io (see SUPABASE_INTERNAL_IMAGE_REGISTRY)
      # while a developer's machine pulls them from public.ecr.aws, and the
      # two registries ship different storage-api builds. CI now tries
      # public.ecr.aws first too (scripts/ci/supabase-start.sh), but can
      # still fall back to ghcr.io, so the point stands. Gating on the whole
      # file gates on Supabase's release schedule; gating on `public` gates on
      # what our own migrations control. The script explains the rest.
      - name: Types are generated, not hand-written
        working-directory: apps/web
        run: pnpm run check:types-current

      - name: Verify pagination and RLS against a real PostgREST
        working-directory: apps/web
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @kit/supabase verify

      # FILM-1110: the canon memory builder read two columns that do not
      # exist, and its unit tests (a fake client) could not see it —
      # PostgREST's 400 was swallowed into empty sections. This builds a
      # context per content type against the real server.
      - name: Verify the canon memory builder against a real PostgREST
        working-directory: apps/web
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export E2E_SUPABASE_URL="$API_URL"
          export E2E_SUPABASE_ANON_KEY="$ANON_KEY"
          export E2E_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @kit/episodes verify

      # The database half of tooling/mutation-guards: each entry weakens a
      # policy, trigger or constraint inside a pgTAP file's own rolled-back
      # transaction and requires that file to fail. See the unit step.
      - name: Mutation guards - database
        run: python3 tooling/mutation-guards/run.py --kind pgtap

      - name: Stop Supabase
        # Cleanup, and it cannot succeed when the CLI failed to install — which
        # is exactly when it reported a second failure and buried the first.
        if: always()
        continue-on-error: true
        working-directory: apps/web
        run: supabase stop

  unit-test:
    name: 🧪 Unit Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Here as well as in 📚 Docs checks: a change to the classifier is
      # code, so this is the only job its table test runs in for that change.
      - name: Docs-only classifier - table test
        run: bash scripts/ci/docs-only.test.sh

      - name: Unchanged-code classifier - table test
        run: bash scripts/ci/code-patch-unchanged.test.sh

      - name: Local CI stop.sh - process tree test
        run: bash scripts/ci/local-ci-stop.test.sh

      - name: CI result verdict - table test
        run: bash scripts/ci/ci-result.test.sh

      - name: Runner-minutes report - table test
        run: bash scripts/ci/minutes.test.sh

      - name: Heavy-job scope classifier - table test
        run: bash scripts/ci/scope-heavy.test.sh

      # One list, shared with both deploy workflows: scripts/test-units.sh.
      - name: Run Unit Tests
        run: bash scripts/test-units.sh

      # A test that passed once can stop guarding after a later change:
      # FILM-1610's double-click test kept passing after the thing it guarded
      # was removed, and only re-running it with the fix taken out showed it.
      # Each entry in tooling/mutation-guards/*.json breaks the code on
      # purpose and requires its test to fail. The self-test proves the
      # runner reports a mutation that changes nothing as uncaught, so a
      # broken command cannot pass for a guard doing its job. The guards
      # themselves run in 🧪 Unit guards below (KB-75).
      - name: Mutation guards - self-test
        run: python3 tooling/mutation-guards/run.py --self-test

      - name: Generate Coverage Report
        run: pnpm --filter web test:coverage
        continue-on-error: true

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  unit-guards:
    name: 🧪 Unit guards (${{ matrix.shard }})
    # The unit mutation guards, sharded (KB-75). In one job they took ~11 of
    # 🧪 Unit Tests' 15 minutes by 2026-09-23 (256 entries) and the job was
    # cancelled mid-run, so the guards after the cutoff never ran. Each shard
    # runs every 4th entry, ~1/4 of them, in parallel. When they grow, add a
    # shard, not minutes.
    #
    # Under an enforced scope (Phase 2) only the guards whose file or test
    # changed run (`run.py --changed`), on as many shards as they fill, up
    # to six; with none, the job is skipped. Otherwise all six run all.
    #
    # Six since 2026-10-02: ~980 entries took 12-15 minutes a shard on four,
    # and #522's queue run lost shard 4 to the 15-minute limit with every
    # guard already red.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.skip_unit_guards != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards || '[1, 2, 3, 4, 5, 6]') }}
    env:
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history: `run.py --changed` diffs from the merge base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Mutation guards - unit (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          SCOPED: ${{ needs.changes.outputs.scope_enforced }}
          BASE: ${{ github.event.merge_group.base_sha }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if [ "$SCOPED" = true ]; then
            set -- --changed "$BASE...HEAD"
          fi
          python3 tooling/mutation-guards/run.py --kind unit --shard "$SHARD" "$@"

  unit-guards-result:
    name: 🧪 Unit guards
    # One name for the shards, whatever their count. always(): a failed or
    # cancelled shard must fail this, not skip it. ✅ CI result, the required
    # check, needs it.
    #
    # It passes only when the shards passed; when the change was classified
    # docs-only, the shards were skipped and 📚 Docs checks passed in their
    # place; or on a pull request (heavy=false), where the shards are left to
    # the merge queue; or when an enforced scope found no guard whose file
    # or test changed. Anything else fails, including a failed 🔎 Changes.
    needs: [changes, unit-guards, docs-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every unit guard shard passed, or the shards were skipped by design
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          SCOPED_OUT: ${{ needs.changes.outputs.skip_unit_guards }}
          SHARDS: ${{ needs.unit-guards.result }}
          DOCS: ${{ needs.docs-checks.result }}
        run: |
          echo "Changes: $CHANGES (code=$CODE, heavy=$HEAVY); unit guard shards: $SHARDS; docs checks: $DOCS"
          if [ "$SHARDS" = success ]; then
            exit 0
          fi
          if [ "$CHANGES" = success ] && [ "$CODE" = false ] \
            && [ "$SHARDS" = skipped ] && [ "$DOCS" = success ]; then
            echo "Docs-only change: the shards were skipped by design."
            exit 0
          fi
          if [ "$CHANGES" = success ] && [ "$CODE" != false ] \
            && [ "$HEAVY" = false ] && [ "$SHARDS" = skipped ]; then
            echo "Pull request fast lane: the shards run in the merge queue."
            exit 0
          fi
          if [ "$CHANGES" = success ] && [ "$CODE" != false ] \
            && [ "$SCOPED_OUT" = true ] && [ "$SHARDS" = skipped ]; then
            echo "Scoped merge-queue run: no unit guard's file or test changed."
            exit 0
          fi
          exit 1

  docs-checks:
    name: 📚 Docs checks
    # Runs only on the docs-only path, in place of the heavy jobs. The whole
    # unit suite, not only KB-80's records guard: on 2026-09-23 at least
    # eight unit suites read docs/ or specs/ at run time (vendor API
    # versions, analytics scopes, the capability reference bindings, data
    # provenance, FILM-1701's spec), and a hand-kept list would miss the
    # next one. Then every unit mutation guard whose target is under specs/
    # or docs/. 🧪 Unit guards requires this job on that path, so a failure
    # here blocks the merge (✅ CI result requires it too).
    needs: changes
    if: ${{ needs.changes.outputs.code == 'false' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Docs-only classifier - table test
        run: bash scripts/ci/docs-only.test.sh

      - name: Unchanged-code classifier - table test
        run: bash scripts/ci/code-patch-unchanged.test.sh

      - name: Spec records guard (KB-80)
        run: pnpm --filter @kit/shared exec vitest run __tests__/spec-closed-by-drift.test.ts

      - name: Run Unit Tests
        run: bash scripts/test-units.sh

      - name: Mutation guards - self-test
        run: python3 tooling/mutation-guards/run.py --self-test

      - name: Mutation guards - those targeting specs/ and docs/
        run: python3 tooling/mutation-guards/run.py --kind unit --file-prefix specs/ --file-prefix docs/

  e2e-guards:
    name: 🧬 E2E guards
    # The E2E mutation guards, and only those. They need a *dev* server: a
    # guard rewrites a source file and requires the running server to pick
    # the change up, which a production build cannot do. The evidence specs
    # mutate nothing, so they run against a production build in
    # 🧬 E2E evidence below — see that job for why.
    #
    # Sharded: each guard runs its spec twice (real code, then mutated), with
    # retries, and one job over all of them outgrew 45 minutes.
    #
    # Five shards, not three. The 🧬 runner hosts Supabase's containers,
    # ClickHouse, Turbopack and Chromium on two shared cores, and stalls
    # under that load: in one measured run a `has_account_access` RPC that
    # normally takes 12ms took 35s, and a Video Log read that normally takes
    # under a second took 65s. The stalls are sporadic rather than
    # cumulative — the median request time is flat across a job's life — so
    # what decides whether a shard survives is how many assertions it runs
    # on that runner. Shorter shards, fewer chances to land on one.
    #
    # Under an enforced scope (Phase 2) only the guards whose file or spec
    # changed run (`run.py --changed`), on up to five shards; with none, the
    # job is skipped. A changed guard JSON selects all of its entries.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards || '[1, 2, 3, 4, 5]') }}
    # 60, not 45: with #518's per-guard limits a healthy shard 1 now runs
    # 43-47 minutes, and two queue runs (#519, #504) were cancelled at 45 with
    # every guard so far RED. Billing is per minute used, so headroom is free.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # CI minutes are rationed: the E2E mutation guards run with the other
    # heavy jobs, in the merge queue (or on a dispatch), not on PR pushes.
    needs: changes
    # Nightly and on dispatch only, not in the merge queue (owner, 2026-10-02):
    # in the queue this job was 11,400 of ~27,900 runner-minutes a day and the
    # main cause of ejected PRs. The nightly full run on main still runs every
    # guard; ✅ CI result never required this job (see scripts/ci/ci-result.sh).
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' && vars.ENABLE_E2E_JOB == 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.skip_e2e_guards != 'true' }}
    env:
      DO_NOT_TRACK: 1
      # The server reads ClickHouse, unlike ⚫️ Test: the evidence specs seed
      # rows and read the resulting figures off the page.
      CLICKHOUSE_ENABLED: 'true'
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: verify
      CLICKHOUSE_DB: default
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      # The server's own address: redirects built from it (a failed platform
      # connect, KB-19) otherwise go to apps/web/.env's localhost:3000, where
      # nothing listens in this job (E2 and E3 of KB-99).
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # A throwaway key, the same for the server and the specs: without one
      # the specs that save an encrypted key skip, and a skipped guard can
      # never go red (K11 of KB-84). Base64 of a 32-byte ASCII string.
      ENCRYPTION_KEY: Y2ktZTJlLWd1YXJkcy10aHJvd2F3YXkta2V5LTAwMDE=
      # A dev server compiles each route on its first visit; 15s was not
      # enough for three of them.
      PLAYWRIGHT_NAVIGATION_TIMEOUT: '60000'
      CAPTURE_EVIDENCE: '1'
      CLICKHOUSE_EVIDENCE: '1'
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
      ENABLE_BILLING_TESTS: 'false'

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        # See 🗄️ ClickHouse SQL: both must be set on the container, and the
        # alpine image has no HTTP client for a health check.
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: verify
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123

    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history: `run.py --changed` diffs from the merge base.
          fetch-depth: 0

      # Same reason as ⚫️ Test: Supabase images, browsers and the monorepo
      # install do not fit a runner's spare disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web-e2e | grep @playwright | sed 's/.*@//')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec ./apps/e2e/node_modules/.bin/playwright install --with-deps

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Same exclusions as ⚫️ Test, for the same reasons.
      - name: Supabase Server
        working-directory: apps/web
        # Pulls from public.ecr.aws first and retries with backoff: see the script.
        run: ../../scripts/ci/supabase-start.sh -x studio,imgproxy,logflare,vector

      - name: Wait for ClickHouse
        run: |
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:8123/ping" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "ClickHouse did not become ready in 120s"
          exit 1

      - name: Apply ClickHouse migrations
        run: pnpm --filter @kit/clickhouse migrate

      # A dev server, on purpose (see the job comment). apps/web/.env.development
      # points it at the local Supabase; the ClickHouse settings come from
      # this job's env. Started through next-dev-server.sh so the guards can
      # restart it between guards: it keeps ~32MB per spec run it never
      # gives back (KB-165), and a shard's last guards stalled on a runner
      # out of memory. `start` returns once /healthcheck answers.
      - name: Run Next.js dev server
        run: scripts/ci/next-dev-server.sh start

      # Each E2E guard breaks the code, lets the dev server recompile, and
      # requires its spec to fail; the unit and database guards run in their
      # own jobs.
      - name: Mutation guards - e2e
        env:
          SCOPED: ${{ needs.changes.outputs.scope_enforced }}
          BASE: ${{ github.event.merge_group.base_sha }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # Read before each guard; over the limit, the server is restarted
          # there, never inside a guard (KB-165). The default and why: run.py.
          E2E_DEV_SERVER_CTL: scripts/ci/next-dev-server.sh
        run: |
          if [ "$SCOPED" = true ]; then
            set -- --changed "$BASE...HEAD"
          fi
          python3 tooling/mutation-guards/run.py --kind e2e --shard "$SHARD" "$@"

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-guards-next-dev-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/next-dev.log
          retention-days: 7

      - name: Stop Supabase
        if: always()
        continue-on-error: true
        working-directory: apps/web
        run: supabase stop

  e2e-evidence:
    name: 🧬 E2E evidence
    # The happy flows, with real figures: every *-evidence spec, gated on
    # CAPTURE_EVIDENCE (and CLICKHOUSE_EVIDENCE where they seed ClickHouse),
    # which ⚫️ Test does not set. They assert what they capture — measured
    # values, reset forms, saved rows — so a regression fails the build, and
    # the screenshots are uploaded for review.
    #
    # A production build, not the dev server these used to share with
    # 🧬 E2E guards. Measured on the same machine against the same local
    # Supabase and ClickHouse: 22 specs in 1.5 minutes with nothing flaky,
    # against 10.7 minutes and two flaky on the dev server. A dev server
    # compiles each route on its first visit — which is what
    # PLAYWRIGHT_NAVIGATION_TIMEOUT=60000 exists for over there — and does
    # it while sharing two cores with Supabase, ClickHouse and Chromium.
    #
    # Splitting them also makes the guard shards symmetric. The evidence
    # step used to run on shard 1 only, so that shard did ~11 minutes of
    # extra work before its guards began, and it is the shard that kept
    # failing.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: changes
    # Nightly and on dispatch only, like 🧬 E2E guards (owner, 2026-10-02):
    # scoping runs it for any change to apps/e2e, so test-only PRs paid for it.
    # ✅ CI result never required it; the nightly full run on main runs it.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' && vars.ENABLE_E2E_JOB == 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.skip_test != 'true' }}
    env:
      DO_NOT_TRACK: 1
      # The server reads ClickHouse, unlike ⚫️ Test: the evidence specs seed
      # rows and read the resulting figures off the page.
      CLICKHOUSE_ENABLED: 'true'
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: verify
      CLICKHOUSE_DB: default
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CAPTURE_EVIDENCE: '1'
      CLICKHOUSE_EVIDENCE: '1'
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
      ENABLE_BILLING_TESTS: 'false'

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        # See 🗄️ ClickHouse SQL: both must be set on the container, and the
        # alpine image has no HTTP client for a health check.
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: verify
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123

    steps:
      - uses: actions/checkout@v4

      # Same reason as ⚫️ Test: Supabase images, browsers and the monorepo
      # install do not fit a runner's spare disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web-e2e | grep @playwright | sed 's/.*@//')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec ./apps/e2e/node_modules/.bin/playwright install --with-deps

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Same exclusions as ⚫️ Test, for the same reasons.
      - name: Supabase Server
        working-directory: apps/web
        # Pulls from public.ecr.aws first and retries with backoff: see the script.
        run: ../../scripts/ci/supabase-start.sh -x studio,imgproxy,logflare,vector

      - name: Wait for ClickHouse
        run: |
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:8123/ping" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "ClickHouse did not become ready in 120s"
          exit 1

      - name: Apply ClickHouse migrations
        run: pnpm --filter @kit/clickhouse migrate

      # See ⚫️ Test for why the heap ceiling is 4096 and not larger.
      - name: Run Next.js Production Build (test env)
        run: pnpm --filter web build:test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # KB-58: the build decides what is a server action. Every action it
      # registered must be an enhanceAction export, and no function that
      # returns a secret may be registered at all.
      - name: Server actions are all wrapped (KB-58)
        working-directory: packages/next
        run: npx vitest run __tests__/action-manifest.guard.test.ts
        env:
          ACTION_MANIFEST: ${{ github.workspace }}/apps/web/.next/server/server-reference-manifest.json

      # NODE_ENV=test, via the script, so .env.test is what the server reads.
      # Starting it with a bare `next start` after a `build:test` loads
      # .env.production instead, which has no EMAIL_TLS and no CRON_SECRET —
      # the mailer then tries TLS against a plaintext Mailpit and the cron
      # routes answer "Server configuration error".
      - name: Run Next.js Server
        run: pnpm --filter web start:test &

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthcheck > /dev/null; then
              echo "server ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Next.js did not become ready in 120s"
          exit 1

      - name: Happy-flow evidence specs
        working-directory: apps/e2e
        run: npx playwright test evidence --project=chromium --workers=1 --retries=2

      - name: Upload evidence screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-screenshots
          path: evidence/
          retention-days: 14

      - name: Stop Supabase
        if: always()
        continue-on-error: true
        working-directory: apps/web
        run: supabase stop

  test:
    name: ⚫️ Test
    # Getting to the first spec costs most of a 20-minute budget on its own:
    # a pnpm install of the monorepo, Playwright's browsers, Supabase's
    # images and a Next production build. The suite itself then runs on one
    # worker with up to three retries. 20 minutes cancelled Playwright
    # mid-run after every earlier step had passed.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: changes
    # Nightly and on dispatch only, like the two 🧬 E2E jobs (owner, 2026-10-02):
    # every Playwright suite runs in the nightly full run on main; the queue
    # keeps typecheck, unit tests, unit guards, Supabase DB and ClickHouse SQL.
    # ✅ CI result never required this job (it depends on vars.ENABLE_E2E_JOB).
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' && vars.ENABLE_E2E_JOB == 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.skip_test != 'true' }}
    env:
      # No Stripe. The billing specs are skipped (see ENABLE_BILLING_TESTS
      # below), so the repo needs no payment credentials to run this job.
      #
      # These are set explicitly rather than read from apps/e2e/.env, which
      # playwright.config.ts does not load — it reads .env.local.
      ENABLE_BILLING_TESTS: 'false'
      ENABLE_TEAM_ACCOUNT_TESTS: 'true'
      DO_NOT_TRACK: 1
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # This job needs more disk than a runner has spare: Supabase's images,
      # Playwright's browsers, a pnpm install of the whole monorepo and a
      # Next production build. Without this the runner fills its volume
      # mid-build and dies — "No space left on device" from the runner
      # process itself, which means no step conclusion and no uploaded logs,
      # so the failure is invisible in the UI. Dropping toolchains this job
      # never uses buys back over 20GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web-e2e | grep @playwright | sed 's/.*@//')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec ./apps/e2e/node_modules/.bin/playwright install --with-deps

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        # Pinned for the same reason as the Supabase DB job above. Omitting
        # `version` would make the action read the root lockfile, which pins
        # 2.40.7 — a version CI has never run, so not something to switch to
        # as a side effect of fixing a rate limit.
        with:
          version: 2.117.0

      # `migra`, `deno-relay` and `pgadmin-schema-diff` were valid service
      # names for CLI 2.40.7 and do not exist in 2.117.0, which rejects the
      # whole flag rather than ignoring the unknown ones. Its accepted list is
      # gotrue, realtime, storage-api, imgproxy, kong, mailpit, postgrest,
      # postgres-meta, studio, edge-runtime, logflare, vector, supavisor.
      #
      # `vector` is excluded alongside `logflare` deliberately: vector ships
      # its logs to logflare, so excluding one without the other leaves the
      # container unhealthy and `supabase start` times out waiting on it.
      # Called directly rather than through `pnpm run ... -- -x ...`. pnpm
      # forwards the `--` into the command, and 2.117.0 reads everything after
      # it as positional: `Unexpected positional arguments: "-x", "..."`.
      # 2.40.7 tolerated the same line. The Supabase DB job above already
      # invokes the CLI this way, and PATH here resolves to the version
      # `supabase/setup-cli` installed, which is the one pinned above.
      - name: Supabase Server
        working-directory: apps/web
        # Pulls from public.ecr.aws first and retries with backoff: see the script.
        run: ../../scripts/ci/supabase-start.sh -x studio,imgproxy,logflare,vector

      # No credential export step. apps/web/.env.test already carries the
      # local URL and the CLI's fixed public development keys — the same
      # values `supabase status` prints — and Next loads it for both the
      # build and the server. An earlier version of this job piped
      # `supabase status -o env` into $GITHUB_ENV, which resolved to empty
      # strings and then *overrode* .env.test with them. Reading .env.test
      # directly also means CI and a local run use the identical mechanism.

      # next build peaks over Node's default heap on a GitHub runner and
      # dies with "Ineffective mark-compacts near heap limit" at ~2GB.
      #
      # 4096 rather than something larger: NODE_OPTIONS is inherited by
      # every worker next build forks (one per CPU), so the ceiling is
      # per-process, not for the build as a whole. An earlier attempt at
      # 8192 took the whole runner down — the job died mid-step with no
      # conclusion and never uploaded its logs, which is what a kernel
      # OOM-kill of the runner looks like.
      - name: Run Next.js Production Build (test env)
        run: |
          pnpm --filter web build:test
          df -h /
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run Next.js Server
        run: pnpm --filter web start:test &

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthcheck > /dev/null; then
              echo "server ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Next.js did not become ready in 120s"
          exit 1

      # Before Playwright, not after: the pgTAP suite asserts against the
      # seeded database, and the e2e specs sign up users and create teams in
      # it. Running them in this order keeps pgTAP's fixtures the only thing
      # it has to reason about.
      - name: Run Supabase tests
        run: pnpm --filter web supabase:test

      # Only the e2e package. `pnpm run test` is `turbo test`, which runs
      # every package's suite — the Unit Tests job already does that, and
      # re-running it here makes this job fail for reasons unrelated to e2e.
      - name: Run Playwright tests
        run: pnpm --filter web-e2e test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      # Machine-readable, so "did that change help?" can be answered by
      # diffing two runs instead of opening the HTML report and counting.
      # A flaky test passes on retry and is invisible in the job's exit
      # status; this file is where it is recorded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-json
          path: apps/e2e/test-results/results.json
          retention-days: 7

  ci-result:
    name: ✅ CI result
    # The one required check, for pull requests and the merge queue alike.
    # always(): it must report whatever happened above, so a failed or
    # cancelled job fails it rather than skipping it, and a merge-queue run
    # that was cancelled never merges. A job skipped by design (the fast
    # lane's heavy jobs, the E2E switch, the docs-only path) does not block;
    # a job the run required that did not run does. The rule, with a table
    # test, is scripts/ci/ci-result.sh.
    needs:
      - changes
      - typescript
      - format
      - clickhouse-sql
      - supabase-db
      - unit-test
      - unit-guards
      - unit-guards-result
      - docs-checks
      - e2e-guards
      - e2e-evidence
      - test
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 2's shadow week: in a report-only queue run, a job the scope
      # would have skipped that failed anyway is the case that must not occur
      # before CI_SCOPE_HEAVY is set to `true`. Reported, never a verdict.
      - name: Scope shadow check
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          out=$(printf '%s' "$NEEDS" | bash scripts/ci/scope-heavy.sh --shadow)
          printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$out" | grep -q 'WOULD HAVE MISSED'; then
            echo "::warning title=Scope shadow check::$(printf '%s\n' "$out" | grep 'WOULD HAVE MISSED')"
          fi

      - name: Every job this run required passed, and none failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | bash scripts/ci/ci-result.sh