name: Workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  typescript:
    name: ʦ TypeScript
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_WEBHOOK_SECRET: ${{ secrets.SUPABASE_DB_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      DO_NOT_TRACK: 1
      NODE_OPTIONS: '--max-old-space-size=4096'
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  clickhouse-sql:
    name: 🗄️ ClickHouse SQL
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1
      CLICKHOUSE_ENABLED: 'true'
      CLICKHOUSE_HOST: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: verify
      CLICKHOUSE_DB: default

    # The unit suite mocks the ClickHouse client and never executes SQL, so
    # a query the server rejects outright passes it. That is not
    # theoretical: an alias shadowing a filter column reached main behind
    # 120 green tests and broke every deep-dive query. This job runs the
    # real migrations and the real queries against a real ClickHouse.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        # Both must be set on the *container*: its entrypoint disables
        # network access for `default` when they are absent, so the health
        # check never passes and the job fails before running anything.
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: verify
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        # No container health check: the alpine image ships neither wget nor
        # curl, so any HTTP probe inside it fails and the container is
        # reported unhealthy before it has done anything wrong. The runner
        # has curl, so readiness is waited for from a step instead.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Wait for ClickHouse
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf "http://localhost:8123/ping" > /dev/null; then
              echo "ClickHouse ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse did not become ready in 120s"
          exit 1

      - name: Apply ClickHouse migrations
        run: pnpm --filter @kit/clickhouse migrate

      - name: Execute every query and insert
        run: pnpm --filter @kit/clickhouse verify

  supabase-db:
    name: 🐘 Supabase DB
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    # The pagination helpers are unit-tested against a fake pager, which
    # proves the loop terminates but not the thing that motivated them:
    # PostgREST truncates every response at db-max-rows with HTTP 200 and a
    # null error, service-role included. That is a property of the server,
    # so only a real one can show it — and show that the fix clears it.
    #
    # This also runs the migrations from scratch, so schema drift and SQL
    # that only fails on a real Postgres surface here rather than on deploy.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      # Pinned, not `latest`. `version: latest` makes the action resolve the
      # release through the GitHub API unauthenticated, and that fails outright
      # when the runner is rate limited:
      #
      #   ##[error]Failed to resolve latest Supabase CLI release: rate limit exceeded
      #
      # Every later step then *skips*, so the job reports red for a reason that
      # has nothing to do with the commit. A fixed version is resolved from npm
      # instead, which removes the API call — and stops the CLI under CI
      # drifting between runs of the same code.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: pnpm install

      # Cheap, and needs no production access: the types file is a
      # fingerprint of whichever database it was last generated against, so a
      # table it declares that no migration creates means those two have
      # diverged. That is exactly how manual_tasks, compilations and
      # compilation_segments sat in production for six weeks with no
      # migration on main — see #240.
      - name: Check for schema drift
        working-directory: apps/web
        run: pnpm run check:schema-drift

      - name: Start Supabase (applies every migration)
        working-directory: apps/web
        run: supabase start

      # `CLAUDE.md` has told people to run typegen after a migration since
      # this repo began, and nothing checked. FILM-1608 shipped a
      # `database.types.ts` that had been hand-spliced rather than generated,
      # because the documented command produced a *worse* file than CI's
      # toolchain — the devDependency was 2.40.7 while this job pins 2.117.0,
      # so `pnpm supabase:web:typegen` silently deleted the `SetofOptions`
      # blocks that type an `.rpc()` result as a row rather than an array.
      #
      # Scoped to the `public` schema, and that is not a softening. The first
      # version of this step diffed the whole generated file and failed on one
      # column — `storage.buckets.versioning_status` — because CI pulls its
      # service images from ghcr.io (see SUPABASE_INTERNAL_IMAGE_REGISTRY)
      # while a developer's machine pulls them from public.ecr.aws, and the
      # two registries ship different storage-api builds. Gating on the whole
      # file gates on Supabase's release schedule; gating on `public` gates on
      # what our own migrations control. The script explains the rest.
      - name: Types are generated, not hand-written
        working-directory: apps/web
        run: pnpm run check:types-current

      - name: Verify pagination and RLS against a real PostgREST
        working-directory: apps/web
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @kit/supabase verify

      # The database half of tooling/mutation-guards: each entry weakens a
      # policy, trigger or constraint inside a pgTAP file's own rolled-back
      # transaction and requires that file to fail. See the unit step.
      - name: Mutation guards - database
        run: python3 tooling/mutation-guards/run.py --kind pgtap

      - name: Stop Supabase
        # Cleanup, and it cannot succeed when the CLI failed to install — which
        # is exactly when it reported a second failure and buried the first.
        if: always()
        continue-on-error: true
        working-directory: apps/web
        run: supabase stop

  unit-test:
    name: 🧪 Unit Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run Unit Tests - Web
        run: pnpm --filter web test

      - name: Run Unit Tests - Packages
        run: |
          pnpm --filter @kit/cache test
          pnpm --filter @kit/branding test
          pnpm --filter @kit/next test
          pnpm --filter @kit/llm test
          pnpm --filter @kit/stripe test
          pnpm --filter @kit/billing-gateway test
          pnpm --filter @kit/lemon-squeezy test
          pnpm --filter @kit/prompt-engine test
          pnpm --filter @kit/projects test
          pnpm --filter @kit/team-accounts test
          pnpm --filter @kit/admin test
          pnpm --filter @kit/audit-logs test
          pnpm --filter @kit/shared test
          pnpm --filter @kit/monitoring-core test
          pnpm --filter @kit/accounts test
          pnpm --filter @kit/auth test
          pnpm --filter @kit/i18n test
          pnpm --filter @kit/mailers-shared test
          pnpm --filter @kit/mailers-core test
          pnpm --filter @kit/otp test
          pnpm --filter @kit/supabase test
          pnpm --filter @kit/notifications test
          pnpm --filter @kit/episodes test
          pnpm --filter @kit/ui test
          pnpm --filter @kit/database-webhooks test
          pnpm --filter @kit/email-templates test
          pnpm --filter @kit/analytics test
          pnpm --filter @kit/clickhouse test
          pnpm --filter @kit/content-analytics test
          pnpm --filter @kit/publishing test

      # A test that passed once can stop guarding after a later change:
      # FILM-1610's double-click test kept passing after the thing it guarded
      # was removed, and only re-running it with the fix taken out showed it.
      # Each entry in tooling/mutation-guards/*.json breaks the code on
      # purpose and requires its test to fail. The self-test proves the
      # runner reports a mutation that changes nothing as uncaught, so a
      # broken command cannot pass for a guard doing its job.
      - name: Mutation guards - unit
        run: |
          python3 tooling/mutation-guards/run.py --self-test
          python3 tooling/mutation-guards/run.py --kind unit

      - name: Generate Coverage Report
        run: pnpm --filter web test:coverage
        continue-on-error: true

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  test:
    name: ⚫️ Test
    # Getting to the first spec costs most of a 20-minute budget on its own:
    # a pnpm install of the monorepo, Playwright's browsers, Supabase's
    # images and a Next production build. The suite itself then runs on one
    # worker with up to three retries. 20 minutes cancelled Playwright
    # mid-run after every earlier step had passed.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_E2E_JOB == 'true' }}
    env:
      # No Stripe. The billing specs are skipped (see ENABLE_BILLING_TESTS
      # below), so the repo needs no payment credentials to run this job.
      #
      # These are set explicitly rather than read from apps/e2e/.env, which
      # playwright.config.ts does not load — it reads .env.local.
      ENABLE_BILLING_TESTS: 'false'
      ENABLE_TEAM_ACCOUNT_TESTS: 'true'
      DO_NOT_TRACK: 1
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # This job needs more disk than a runner has spare: Supabase's images,
      # Playwright's browsers, a pnpm install of the whole monorepo and a
      # Next production build. Without this the runner fills its volume
      # mid-build and dies — "No space left on device" from the runner
      # process itself, which means no step conclusion and no uploaded logs,
      # so the failure is invisible in the UI. Dropping toolchains this job
      # never uses buys back over 20GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web-e2e | grep @playwright | sed 's/.*@//')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec ./apps/e2e/node_modules/.bin/playwright install --with-deps

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        # Pinned for the same reason as the Supabase DB job above. Omitting
        # `version` would make the action read the root lockfile, which pins
        # 2.40.7 — a version CI has never run, so not something to switch to
        # as a side effect of fixing a rate limit.
        with:
          version: 2.117.0

      # `migra`, `deno-relay` and `pgadmin-schema-diff` were valid service
      # names for CLI 2.40.7 and do not exist in 2.117.0, which rejects the
      # whole flag rather than ignoring the unknown ones. Its accepted list is
      # gotrue, realtime, storage-api, imgproxy, kong, mailpit, postgrest,
      # postgres-meta, studio, edge-runtime, logflare, vector, supavisor.
      #
      # `vector` is excluded alongside `logflare` deliberately: vector ships
      # its logs to logflare, so excluding one without the other leaves the
      # container unhealthy and `supabase start` times out waiting on it.
      # Called directly rather than through `pnpm run ... -- -x ...`. pnpm
      # forwards the `--` into the command, and 2.117.0 reads everything after
      # it as positional: `Unexpected positional arguments: "-x", "..."`.
      # 2.40.7 tolerated the same line. The Supabase DB job above already
      # invokes the CLI this way, and PATH here resolves to the version
      # `supabase/setup-cli` installed, which is the one pinned above.
      - name: Supabase Server
        working-directory: apps/web
        run: supabase start -x studio,imgproxy,logflare,vector

      # No credential export step. apps/web/.env.test already carries the
      # local URL and the CLI's fixed public development keys — the same
      # values `supabase status` prints — and Next loads it for both the
      # build and the server. An earlier version of this job piped
      # `supabase status -o env` into $GITHUB_ENV, which resolved to empty
      # strings and then *overrode* .env.test with them. Reading .env.test
      # directly also means CI and a local run use the identical mechanism.

      # next build peaks over Node's default heap on a GitHub runner and
      # dies with "Ineffective mark-compacts near heap limit" at ~2GB.
      #
      # 4096 rather than something larger: NODE_OPTIONS is inherited by
      # every worker next build forks (one per CPU), so the ceiling is
      # per-process, not for the build as a whole. An earlier attempt at
      # 8192 took the whole runner down — the job died mid-step with no
      # conclusion and never uploaded its logs, which is what a kernel
      # OOM-kill of the runner looks like.
      - name: Run Next.js Production Build (test env)
        run: |
          pnpm --filter web build:test
          df -h /
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run Next.js Server
        run: pnpm --filter web start:test &

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthcheck > /dev/null; then
              echo "server ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Next.js did not become ready in 120s"
          exit 1

      # Before Playwright, not after: the pgTAP suite asserts against the
      # seeded database, and the e2e specs sign up users and create teams in
      # it. Running them in this order keeps pgTAP's fixtures the only thing
      # it has to reason about.
      - name: Run Supabase tests
        run: pnpm --filter web supabase:test

      # Only the e2e package. `pnpm run test` is `turbo test`, which runs
      # every package's suite — the Unit Tests job already does that, and
      # re-running it here makes this job fail for reasons unrelated to e2e.
      - name: Run Playwright tests
        run: pnpm --filter web-e2e test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      # Machine-readable, so "did that change help?" can be answered by
      # diffing two runs instead of opening the HTML report and counting.
      # A flaky test passes on retry and is invisible in the job's exit
      # status; this file is where it is recorded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-json
          path: apps/e2e/test-results/results.json
          retention-days: 7