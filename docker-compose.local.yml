# Docker Compose for Local Development
# Use: docker compose -f docker-compose.local.yml up -d

services:
  redis:
    image: redis:alpine
    container_name: storybook-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    driver: local
